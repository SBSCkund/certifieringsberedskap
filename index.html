         help:"SSF 1044 §4.2.9: installationsrutinen ska ge instruktioner för planering, installation, driftsättning och dokumentation. Checklistor per fas är ett effektivt sätt att säkra att inget missas. Rutinen ska vara känd av alla tekniker — inte bara dokumenterad för ledningens skull.",action:"Ta fram installationsrutin med checklistor för: förberedelse, installation, driftsättning och dokumentation/överlämning.",actionPartial:"Kontrollera att rutinen är känd av alla tekniker och faktiskt används i vardagen — fråga en tekniker om de använder checklist."},
        {id:"s44_n9",swqNiva:"n1",text:"Rutiner för överlämnande och kundutbildning finns — utbildningen dokumenteras med innehåll, deltagare och vem som genomfört den.",
         help:"SSF 1044 §4.2.10: vid överlämning ska kunden utbildas och utbildningen dokumenteras med: vad som ingick, vilka som deltog och vem som genomförde den. Dokumentationen ska arkiveras. En vanlig brist är att utbildning ges muntligt men inte dokumenteras — revisorer kontrollerar specifikt om detta.",action:"Ta fram överlämnanderutin och ett dokumentationsformulär för kundutbildning. Låt kunden bekräfta med signatur.",actionPartial:"Kontrollera att utbildningsdokumentationen genomförs konsekvent vid varje överlämning — inte bara vid begäran."},
        {id:"s44_n10",swqNiva:"n1",text:"Vid varje överlämning lämnas minst: anläggarintyg, orienteringsritning, skötselinstruktion, larmåtgärdsanvisning och kontrolljournal.",
         help:"SSF 1044 §4.2.10: vid varje överlämning krävs minst: (1) anläggarintyg (SSF 1058), (2) orienteringsritning, (3) skötselinstruktion, (4) larmåtgärdsanvisning, (5) kontrolljournal. Alla fem dokumenten krävs — ett saknat dokument är en brist. Revisorer kontrollerar dokumentationens fullständighet per anläggning.",action:"Skapa en överlämningschecklista med alla fem obligatoriska dokumenten och en signaturrad för att bekräfta att allt överlämnas.",actionPartial:"Kontrollera att checklistan används konsekvent och att alla fem dokumenten faktiskt medföljer vid varje överlämning."},
        {id:"s44_n11",swqNiva:"n1",text:"Rutiner finns för serviceavtal, revisionsbesiktningar, teknisk support och akutservice.",
         help:"SSF 1044 §4.2.11: rutiner ska finnas för alla serviceformer: serviceavtal (regelbunden tillsyn), revisionsbesiktningar (SSF 130 §8.11), teknisk support (fjärrstöd) och akutservice (felanmälan). Varje form ska ha definierat ansvar, vad som ingår och hur det dokumenteras.",action:"Dokumentera rutiner för alla serviceformer ni erbjuder. Definiera vad som ingår i varje form och hur det dokumenteras.",actionPartial:"Kontrollera att rutinerna täcker alla serviceformer — och att det finns rutiner för de servicetyper ni faktiskt utför i praktiken."},
      ]},
      {id:"s1044_n2",name:"SWE Q Nivå 2 — Ledning",questions:[
        {id:"s44_m1",swqNiva:"n2",text:"Kvalitetsansvarig och en namngiven ställföreträdare är utsedda med befogenhet att säkra att ledningssystemet uppfyller ställda krav.",
         help:"SSF 1044 §4.3.1: Nivå 2 kräver både en kvalitetsansvarig och en namngiven ställföreträdare — båda med dokumenterade befogenheter. Ställföreträdaren ska kunna ta över vid frånvaro. En vanlig brist är att ställföreträdaren utsetts men inte har samma dokumenterade befogenheter som den ordinarie.",action:"Utse och dokumentera kvalitetsansvarig och ställföreträdare. Säkerställ att båda har samma dokumenterade befogenheter.",actionPartial:"Kontrollera att ställföreträdaren är namngiven, känd i organisationen och har lika väl dokumenterade befogenheter som den ordinarie."},
        {id:"s44_m2",swqNiva:"n2",text:"En kvalitetsmanual finns som kortfattat beskriver ledningssystemet — underhålls och uppdateras löpande.",
         help:"SSF 1044 §4.3.2: en kvalitetsmanual ska kortfattat beskriva ledningssystemets struktur — hur processer hänger samman, var rutiner finns och vem som ansvarar. Den behöver inte vara ett tjockt dokument men ska vara aktuell och underhållas. En obsolet manual är sämre än ingen manual.",action:"Upprätta en kvalitetsmanual som i kort form beskriver er ledningssystemsstruktur, processer och var rutiner hittas.",actionPartial:"Kontrollera att manualen är aktuell — stämmer den med hur verksamheten faktiskt ser ut idag? Uppdatera vid förändringar."},
        {id:"s44_m3",swqNiva:"n2",text:"Det finns dokumenterade bevis på ledningens åtagande: informerar om externa krav, policy och mål är upprättade, ledningens genomgång genomförs, resurser tillsäkras.",
         help:"SSF 1044 §4.3.3: ledningens åtagande ska bevisas med dokumentation som täcker fyra delar: (1) informerar om externa krav, (2) policy och mål är upprättade, (3) ledningens genomgång genomförs, (4) resurser tillsäkras. Det räcker inte att dessa sker — de ska vara dokumenterade.",action:"Gå igenom de fyra delarna i §4.3.3 och säkerställ att alla är dokumenterade. Skapa en checklista och arkivera bevisen.",actionPartial:"Kontrollera att alla fyra delarna är dokumenterade — det är vanligt att resurstillsäkringen saknar dokumentation."},
        {id:"s44_m4",swqNiva:"n2",text:"Mätbara kvalitetsmål är upprättade, följs upp regelbundet och är förenliga med kvalitetspolicyn.",
         help:"SSF 1044 §4.3.4: mätbara kvalitetsmål ska vara upprättade, regelbundet följas upp och vara förenliga med kvalitetspolicyn. 'Mätbara' är nyckelordet — vaga mål som 'god kvalitet' räknas inte. Vanliga bra mål: reklamationsfrekvens, andel intyg utfärdade i tid, kundnöjdhetspoäng.",action:"Fastställ 2–4 konkreta och mätbara kvalitetsmål med definierade mätvärden, ansvarig och uppföljningsfrekvens.",actionPartial:"Kontrollera att målen verkligen är mätbara och faktiskt mäts med definierat intervall — och att utfallet används."},
        {id:"s44_m5",swqNiva:"n2",text:"Ansvar och befogenheter är definierade för alla befattningar och kända av berörd personal.",
         help:"SSF 1044 §4.3.5: ansvar och befogenheter ska vara definierade för alla befattningar och kända av berörd personal. Befattningsbeskrivningar per roll är ett vanligt sätt att uppfylla kravet. Revisorerna kontrollerar att personalen faktiskt känner till sin roll och sina befogenheter.",action:"Upprätta befattningsbeskrivningar för alla roller med: roll, ansvar, befogenheter och rapporteringsväg.",actionPartial:"Kontrollera att befintliga beskrivningar är aktuella och faktiskt kända av berörda medarbetare — fråga personalen."},
        {id:"s44_m6",swqNiva:"n2",text:"Processer för intern kommunikation finns som säkerställer informationsflöde och möjliggör feedback från personalen.",
         help:"SSF 1044 §4.3.6: processer för intern kommunikation ska säkra att relevant information flödar i organisationen och att personalen kan ge feedback uppåt. Vanliga brister: information flödar bara från ledning till medarbetare utan möjlighet till feedback, eller möten hålls men protokolleras inte.",action:"Dokumentera hur intern kommunikation sker — vilka kanaler, hur ofta och hur medarbetarfeedback fångas upp.",actionPartial:"Kontrollera att kommunikationsprocesserna faktiskt fungerar och att det finns en kanal för medarbetare att lyfta frågor uppåt."},
        {id:"s44_m7",swqNiva:"n2",text:"Det finns en rutin för ledningens genomgång med planerade intervaller — underlag inkluderar kundreklamationer och interna felrapporter, beslut dokumenteras.",
         help:"SSF 1044 §4.3.7: ledningens genomgång ska genomföras med planerade intervaller (minst en gång per år) och underlag ska inkludera kundreklamationer och interna felrapporter. Beslut ska dokumenteras. Vanlig brist: genomgången sker men protokollet är för knapphändigt eller åtgärder följs inte upp.",action:"Schemalägg ledningens genomgång och fastställ fast agenda som alltid inkluderar kundreklamationer, felrapporter och status för föregående beslut.",actionPartial:"Kontrollera att protokollet täcker alla krav i §4.3.7 och att beslutade åtgärder faktiskt dokumenteras och följs upp."},
      ]},
    ]
  },

  fr2000:{
    id:"fr2000",name:"FR 2000",reg:"FR 2000:2022",
    desc:"Integrerat ledningssystem för kvalitet, miljö och arbetsmiljö",
    sections:[
      {id:"sfr_led1",name:"Ledning — Strategi & system",questions:[
        {id:"fr1",text:"Affärsidén är dokumenterad, känd av alla medarbetare och hålls aktuell — granskas minst en gång per år.",
         help:"FR 2000 §1.1: affärsidén ska vara dokumenterad, känd av alla medarbetare och granskas minst en gång per år. En affärsidé som senast dokumenterades vid bolagsstart och aldrig följts upp uppfyller inte kravet. Revisorerna kan fråga medarbetare om vad affärsidén innebär.",action:"Dokumentera affärsidén kortfattat (½–1 sida) och presentera den vid ett personalmöte. Dokumentera att kommunikationen skett.",actionPartial:"Kontrollera att affärsidén är aktuell och faktiskt känd av medarbetarna — fråga en slumpmässig medarbetare om innehållet."},
        {id:"fr2",text:"Policy finns för kvalitet, miljö och arbetsmiljö — innehåller åtaganden om kundnöjdhet, kompetensutveckling, minskad miljöpåverkan, säkra arbetsplatser och motverkande av diskriminering.",
         help:"FR 2000 §1.2: policyn ska täcka kvalitet, miljö och arbetsmiljö och innehålla konkreta åtaganden om: kundnöjdhet, kompetensutveckling, minskad miljöpåverkan, säkra arbetsplatser och motverkande av diskriminering. Alla fem åtagandena krävs — en separat policys per område uppfyller kravet om de täcker allt.",action:"Upprätta en policy som täcker alla tre områden och alla fem åtagandena. Publicera externt på hemsidan.",actionPartial:"Kontrollera att policyn uppfyller alla delar i §1.2 — alla fem åtagandena ska vara tydliga. Kontrollera att den är externt tillgänglig."},
        {id:"fr3",text:"Policy är känd och tillämpad i verksamheten, granskas minst en gång per år och är externt tillgänglig.",
         help:"FR 2000 §1.2: policyn ska vara känd och tillämpad i verksamheten — inte bara ett dokument. Granskning minst en gång per år innebär att ledningen aktivt bedömer om policyn fortfarande är relevant. 'Externt tillgänglig' innebär ofta publicering på hemsidan.",action:"Kommunicera policyn till all personal och publicera på hemsidan. Dokumentera att kommunikation och publicering skett.",actionPartial:"Kontrollera att policyn faktiskt är känd av personalen och att den senaste granskningen är dokumenterad."},
        {id:"fr4",text:"Mätbara mål finns för vart och ett av områdena kvalitet, miljö och arbetsmiljö — med handlingsplaner med ansvarig och tidplan.",
         help:"FR 2000 §1.3: mätbara mål krävs för alla tre områden — kvalitet, miljö och arbetsmiljö. Varje mål ska ha en handlingsplan med definierad ansvarig och tidplan. SMARTA-mål (Specifika, Mätbara, Accepterade, Realistiska, Tidssatta, Uppföljningsbara) är ett bra ramverk. Vaga mål utan mätvärden uppfyller inte kravet.",action:"Fastställ minst ett mätbart mål per område (kvalitet, miljö, arbetsmiljö) med handlingsplaner som anger ansvarig och tidplan.",actionPartial:"Kontrollera att mål finns för alla tre områden och att handlingsplanerna är kompletta med ansvarig och tidplan."},
        {id:"fr5",text:"Ledningssystemet är dokumenterat och verksamheten beskriven som processer med identifierad ordningsföljd och gränssnitt.",
         help:"FR 2000 §1.4: verksamheten ska beskrivas som processer med identifierad ordningsföljd och gränssnitt. Typiska processer för ett installationsföretag: försäljning, projektering, installation, service och ledning. En enkel processkarta räcker — det behöver inte vara komplicerat.",action:"Kartlägg era verksamhetsprocesser och dokumentera hur de hänger samman i en enkel processkarta.",actionPartial:"Kontrollera att processbeskrivningarna är aktuella och kända av medarbetarna — har verksamheten förändrats sedan sist?"},
        {id:"fr6",text:"Risker och möjligheter inventeras, analyseras och värderas — åtgärder beslutas och dokumenteras.",
         help:"FR 2000 §1.5: risker och möjligheter ska inventeras, analyseras och värderas för hela verksamheten — inte bara arbetsmiljörisker. Analysen ska täcka alla tre områden: kvalitet (kundreklamationer, leveransfel), miljö (spill, avfall) och arbetsmiljö (fallrisker, tunga lyft). Åtgärder ska besluts och dokumenteras.",action:"Genomför en riskanalys för hela verksamheten. Täck kvalitet, miljö och arbetsmiljö. Dokumentera risker, sannolikhet, konsekvens och beslutade åtgärder.",actionPartial:"Kontrollera att analysen täcker alla tre områden och är aktuell — uppdatera vid verksamhetsförändringar eller vid nya risker."},
        {id:"fr7",text:"Tillämpliga lagar och krav är dokumenterade i förteckning(ar) — uppdateras minst en gång per år med information om hur kraven hanteras.",
         help:"FR 2000 §1.6: en förteckning över tillämpliga lagar och krav ska uppdateras minst en gång per år och visa hur kraven hanteras. Typiska krav för ett installationsföretag: AML, MB, Kamerabevakningslagen, Ellagen, PBL, GDPR. En lag som finns på listan men inte har koppling till rutin uppfyller inte kravet.",action:"Upprätta en laglista med: lagstiftning, hur ni berörs, ansvarig för efterlevnad och hur kravet hanteras i praktiken.",actionPartial:"Kontrollera att laglistan är aktuell och att varje krav är kopplat till en rutin eller person ansvarig för efterlevnad."},
        {id:"fr8",text:"Rutiner finns för årlig utvärdering av att lagkrav och andra krav efterlevs — resultatet dokumenteras.",
         help:"FR 2000 §1.6: en gång per år ska ni aktivt utvärdera att ni faktiskt efterlever de lagar ni identifierat. Resultatet ska dokumenteras. Vanlig brist: laglistan finns men ingen kontrollerar om kraven faktiskt efterlevs — det är just den kontrollen §1.6 kräver.",action:"Inför en årsrutin för lagefterlevnadskontroll. Gå igenom laglistan systematiskt och dokumentera bedömning per lag.",actionPartial:"Kontrollera att utvärderingen faktiskt genomförs och att resultaten rapporteras vid ledningens genomgång."},
      ]},
      {id:"sfr_led2",name:"Ledning — Organisation & kompetens",questions:[
        {id:"fr9",text:"Ansvar, arbetsuppgifter och befogenheter för alla medarbetare är klargjorda och dokumenterade — inkl. ansvar för arbetsmiljö och brandskydd.",
         help:"FR 2000 §1.7: ansvar, arbetsuppgifter och befogenheter för alla medarbetare ska vara klargjorda och dokumenterade — inkl. explicit ansvar för arbetsmiljö och brandskydd. Dessa ansvar missas ofta — det räcker inte med en allmän rollbeskrivning, ansvaret måste vara specificerat.",action:"Upprätta befattningsbeskrivningar för alla roller med explicit angivelse av ansvar för arbetsmiljö och brandskydd.",actionPartial:"Kontrollera att befintliga befattningsbeskrivningar explicit anger ansvar för arbetsmiljö och brandskydd — inte bara allmänt yrkesansvar."},
        {id:"fr10",text:"Årlig kompetensanalys genomförs och utbildningsplan upprättas för att säkerställa kompetensen.",
         help:"FR 2000 §1.8: en annual kompetensanalys ska identifiera kompetensgap och leda till en utbildningsplan. Analysen ska täcka alla medarbetare — inte bara teknikerna. Utbildningsplanen ska vara realistisk och genomförbar, inte bara ett önskelista.",action:"Genomför en kompetensanalys för alla medarbetare och upprätta en utbildningsplan för det kommande året med konkreta aktiviteter.",actionPartial:"Kontrollera att analysen faktiskt genomförs och att utbildningsplanen är realistisk med fastlagda datum och ansvarig."},
        {id:"fr11",text:"Rutiner finns för utvärdering av genomförd kompetensutveckling — dokumenteras och utbildningsbevis bevaras.",
         help:"FR 2000 §1.8: det räcker inte att utbildning genomförs — effekten ska utvärderas och utbildningsbevis bevaras. Utvärdering kan vara enkel: fråga deltagarna vad de tar med sig. Intyg från externa utbildningar ska arkiveras och vara åtkomliga vid revision.",action:"Inför en rutin för utvärdering av genomförd utbildning och arkivering av utbildningsintyg. Skapa en enkel utvärderingsblankett.",actionPartial:"Kontrollera att utvärderingen faktiskt sker efter genomförda utbildningar och att intyg arkiveras tillgängligt."},
        {id:"fr12",text:"Informations-, kommunikations- och rapportvägar är tydliggjorda och dokumenterade — internt och externt.",
         help:"FR 2000 §1.9: informations-, kommunikations- och rapportvägar ska vara tydliggjorda för alla relevanta situationer — intern och extern kommunikation, nödläge och avvikelserapportering. Vanlig brist: man förutsätter att alla vet hur information flödar utan att ha dokumenterat det.",action:"Dokumentera informationsflödena: vem informerar vem, via vilken kanal och för vilken typ av information (order, avvikelse, nödläge).",actionPartial:"Kontrollera att kommunikationsvägarna är kända av medarbetarna — fråga hur de vet vart de ska vända sig vid en avvikelse."},
      ]},
      {id:"sfr_led3",name:"Ledning — Miljö, Arbetsmiljö & Säkerhet",questions:[
        {id:"fr13",text:"Rutiner finns för systematiskt arbetsmiljöarbete — risker bedöms, betydande risker hanteras enligt åtgärdstrappan och handlingsplaner upprättas.",
         help:"FR 2000 §1.10: systematiskt arbetsmiljöarbete (SAM) innebär att risker bedöms, betydande risker hanteras enligt åtgärdstrappan (eliminera, reducera, skydda) och att handlingsplaner upprättas. SAM är ett lagkrav (AFS 2001:1) utöver FR 2000-kravet — dvs. ni måste ha det oavsett.",action:"Implementera SAM: gör en riskbedömning per arbetsmoment, identifiera de tre viktigaste riskerna och upprätta en handlingsplan per risk.",actionPartial:"Kontrollera att riskbedömningen täcker alla arbetsmoment (inkl. arbete på tak, i elskåp, tunga lyft) och att åtgärdstrappan faktiskt tillämpas."},
        {id:"fr14",text:"Miljöaspekter är inventerade och dokumenterade ur ett livscykelperspektiv — betydande aspekter identifierade och miljöaspektsförteckning hålls aktuell.",
         help:"FR 2000 §1.11: miljöaspekter ska inventeras ur ett livscykelperspektiv — från inköp av material till installation och avfallshantering. Betydande aspekter (de med störst miljöpåverkan) ska identifieras och hanteras. Typiska aspekter för ett installationsföretag: kabelavfall, elförbrukning, bilresor och kemikalier.",action:"Gör en miljöaspektsinventering ur livscykelperspektiv. Identifiera era tre mest betydande aspekter och sätt mål och åtgärder för dem.",actionPartial:"Kontrollera att förteckningen är uppdaterad och att det finns dokumenterade mål för de identifierade betydande aspekterna."},
        {id:"fr15",text:"Dokumenterade rutiner finns för brandskydd — täcker förebyggande åtgärder, ansvarsfördelning och nödlägesplanering.",
         help:"FR 2000 §1.12: brandskyddsrutinerna ska täcka förebyggande åtgärder (kontroll av brandsläckare, utrymningsvägar), ansvarsfördelning (vem är brandskyddsansvarig?) och nödlägesplanering (utrymningsplan, återsamlingsplats). Brandskyddsansvar är ett krav i Lag om skydd mot olyckor.",action:"Upprätta brandskyddsdokumentation: förebyggande åtgärder, namngiven brandskyddsansvarig och dokumenterad utrymningsplan.",actionPartial:"Kontrollera att brandskyddsdokumentationen är aktuell och att brandskyddsansvarig är namngiven och känd av personalen."},
        {id:"fr16",text:"Dokumenterade rutiner finns för beredskap vid nödläge — inkl. kemikalieförteckning med säkerhetsdatablad samt rutiner för första hjälpen.",
         help:"FR 2000 §1.13: beredskapsrutinerna ska täcka: nödlägesscenarier (vad händer vid brand, spill, olycka?), kemikalieförteckning med säkerhetsdatablad (SDS) för alla kemikalier ni hanterar, och rutiner för första hjälpen (hjärtstartare, förstahjälpen-utrustning, utbildad personal).",action:"Upprätta nödlägesprocedurer för era vanligaste scenarion, kemikalieförteckning med SDS och dokumentera var förstahjälpen-utrustning finns.",actionPartial:"Kontrollera att rutinerna är kända av personalen — genomför en enkel övning och dokumentera att den gjorts."},
        {id:"fr17",text:"Dokumenterade rutiner finns för att skydda verksamheten och information mot förlust, skada och obehörig åtkomst.",
         help:"FR 2000 §1.14: verksamhetens information och resurser ska skyddas mot förlust, skada och obehörig åtkomst. Typiska åtgärder: IT-säkerhetsrutin (lösenord, uppdateringar), backup-rutin med test, skalskydd för lokaler och behörighetshantering. Alla aspekter krävs — det räcker inte med enbart IT-säkerhet.",action:"Upprätta säkerhetsrutiner som täcker: IT-säkerhet (lösenord, uppdateringar), backup med test, skalskydd och behörighetshantering.",actionPartial:"Kontrollera att säkerhetsrutinerna täcker alla fyra aspekter i §1.14 — IT, backup, skalskydd och behörighet."},
      ]},
      {id:"sfr_led4",name:"Ledning — Förbättring & uppföljning",questions:[
        {id:"fr18",text:"Dokumenterade rutiner finns för avvikelsehantering på alla nivåer — grundorsak utreds och korrigerande åtgärder vidtas.",
         help:"FR 2000 §1.15: avvikelsehanteringen ska täcka alla nivåer — kundreklamationer, interna fel, leverantörsavvikelser och tillbud i arbetsmiljön. Grundorsakutredning är ett krav — det räcker inte att lappa utan att förstå varför. Rutinen ska faktiskt användas, inte bara finnas.",action:"Inför ett avvikelseregister med process: vad hände, grundorsak, korrigerande åtgärd, ansvarig och uppföljning. Säkerställ att rutinen täcker alla typer av avvikelser.",actionPartial:"Kontrollera att rutinen faktiskt används för alla avvikelsetyper och att grundorsaksutredning genomförs — inte bara symptombehandling."},
        {id:"fr19",text:"Dokumenterade rutiner finns för internrevision — genomförs minst en gång per år och alla processer ingår i programmet.",
         help:"FR 2000 §1.16: interna revisioner ska genomföras minst en gång per år och täcka alla processer. Revisionen ska vara systematisk — inte en informell genomgång. Resultat ska dokumenteras och rapporteras till ledningen. Revisorn ska inte revidera sitt eget arbete.",action:"Upprätta ett revisionsprogram med: vilka processer som ingår, planerat datum, vem som genomför och hur resultat rapporteras.",actionPartial:"Kontrollera att revisionen täcker alla processer och att resultaten faktiskt rapporteras till ledningen med beslutade åtgärder."},
        {id:"fr20",text:"Ledningens genomgång genomförs minst en gång per år och täcker: åtgärdsstatus, lagefterlevnad, mål, avvikelser, revisionsresultat, kundnöjdhet, policy och resurser.",
         help:"FR 2000 §1.17: ledningens genomgång ska genomföras minst en gång per år och täcka: status på föregående åtgärder, lagefterlevnad, måluppfyllelse, avvikelser, revisionsresultat, kundnöjdhet, policy och resursbehov. Alla dessa punkter krävs i protokollet. En informell diskussion utan protokoll uppfyller inte kravet.",action:"Schemalägg ledningens genomgång och sätt en fast agenda som täcker alla §1.17-punkter. Protokollför alltid med beslutade åtgärder.",actionPartial:"Gå igenom senaste protokollet mot §1.17-listan — täcker det alla punkter? Är beslutade åtgärder följda?"},
      ]},
      {id:"sfr_mark",name:"Marknadsföring & försäljning",questions:[
        {id:"fr21",text:"Marknadsaktiviteter beskrivs i en dokumenterad marknadsplan baserad på affärsidé och policy.",
         help:"FR 2000 §2.1: marknadsaktiviteter ska beskrivas i en dokumenterad plan baserad på affärsidé och policy. Planen behöver inte vara avancerad — en enkel lista med planerade aktiviteter för året räcker. Det viktiga är att den finns, är dokumenterad och faktiskt förankrad i affärsidén.",action:"Upprätta en enkel marknadsplan med planerade aktiviteter, ansvarig och tidsram för det kommande året.",actionPartial:"Kontrollera att marknadsplanen är aktuell och att det finns en tydlig koppling till affärsidé och policy."},
        {id:"fr22",text:"Alla kundkrav och legala krav identifieras på inkommande förfrågningar och besvaras i rätt tid.",
         help:"FR 2000 §2.2: vid inkommande förfrågningar ska ni identifiera och dokumentera alla kundkrav och legala krav. 'Legala krav' inkluderar t.ex. Kamerabevakningslagen, Elsäkerhetslagen och branschstandarder. Svaret ska ges i rätt tid. Vanlig brist: muntliga förfrågningar hanteras utan dokumentation.",action:"Inför en rutin för kravidentifiering vid förfrågningar med en checklista som täcker kundkrav och legala krav.",actionPartial:"Kontrollera att rutinen tillämpas konsekvent — även vid muntliga förfrågningar. Och att legala krav specifikt identifieras."},
        {id:"fr23",text:"Rutiner finns för orderhantering — order tas emot, registreras, granskas och ordererkännande ges kunden.",
         help:"FR 2000 §2.3: rutiner för orderhantering ska täcka att order tas emot, registreras, granskas och att kunden får ett ordererkännande. Ordererkännandet är avgörande — det dokumenterar vad ni åtagit er. Även muntliga order ska registreras och bekräftas skriftligen.",action:"Dokumentera orderprocessen med tydliga steg: mottagning, registrering, granskning och ordererkännande till kund.",actionPartial:"Kontrollera att ordererkännande alltid ges kunden — även vid muntliga order. Skapa en mall för ordererkännande."},
        {id:"fr24",text:"Metoder finns för att inhämta och analysera information om kundtillfredsställelse — dokumenteras och bevaras.",
         help:"FR 2000 §2.4: ni ska ha en definierad metod för att inhämta och analysera information om kundtillfredsställelse — och resultaten ska dokumenteras och bevaras. En enkel enkät efter avslutat uppdrag räcker. Det viktiga är att det sker systematiskt och att resultaten analyseras och används.",action:"Inför en enkel kundmätningsmetod — t.ex. en kort enkät efter varje avslutat uppdrag. Definiera hur resultaten analyseras.",actionPartial:"Kontrollera att kundmätningen faktiskt genomförs systematiskt och att resultaten analyseras och används för förbättring."},
      ]},
      {id:"sfr_utv",name:"Produktutveckling",questions:[
        {id:"fr25",text:"Krav för utveckling av varor/tjänster identifieras och dokumenteras — inkl. kundkrav, myndighetskrav och livscykelperspektiv. (Ej tillämpligt om ni ej utvecklar egna produkter/tjänster.)",
         help:"FR 2000 §3.1: kravet gäller företag som utvecklar egna varor eller tjänster. Installationsföretag som enbart monterar andras produkter kan betrakta detta som ej tillämpligt — men undantaget måste dokumenteras i ledningssystemet med motivering. Om ni exkluderar §3 ska SBSC informeras.",action:"Bedöm om produktutvecklingskraven är tillämpliga. Om ej tillämpligt — dokumentera undantaget i ledningssystemet med motivering.",actionPartial:"Kontrollera att undantagets dokumentering finns med tydlig motivering, eller att kraven faktiskt uppfylls om ni har produktutveckling."},
        {id:"fr26",text:"Styrning av utvecklingsarbetet är beskrivet — genomgångar, utprovningar och ändringar dokumenteras. (Ej tillämpligt om ni ej utvecklar egna produkter/tjänster.)",
         help:"FR 2000 §3.2: ej tillämpligt om ni enbart installerar och servicar andras produkter utan produktutveckling. Om det är tillämpligt ska styrningen av utvecklingsarbetet beskrivas med genomgångar, utprovningar och dokumentation av ändringar. Dokumentera undantaget om ni exkluderar §3.2.",action:"Om tillämpligt — dokumentera er utvecklingsprocess med tydliga steg och beslutspunkter. Om ej tillämpligt — dokumentera undantaget.",actionPartial:"Kontrollera att alla steg i §3.2 är täckta i er dokumentation, eller att undantaget är korrekt dokumenterat."},
      ]},
      {id:"sfr_inkop",name:"Inköp",questions:[
        {id:"fr27",text:"Dokumenterade rutiner finns för styrning och kontroll av inköp av varor och tjänster.",
         help:"FR 2000 §4.1: rutiner för inköp ska täcka alla typer av inköp — material, tjänster och utlagda processer (t.ex. underleverantörer). Rutinerna ska definiera krav på kvalitet, miljö och leveranssäkerhet. En underleverantör som ni kontrollerar dåligt kan vara er brist vid en revision.",action:"Upprätta inköpsrutiner med krav på kvalitet, miljö och leveranssäkerhet som täcker alla typer av inköp inklusive underleverantörer.",actionPartial:"Kontrollera att rutinerna täcker alla typer av inköp — även utlagda processer och tjänsteinköp."},
        {id:"fr28",text:"Leverantörer bedöms och väljs baserat på dokumenterade kriterier — godkänd leverantörsförteckning upprättas och hålls aktuell.",
         help:"FR 2000 §4.2: leverantörer ska väljas baserat på dokumenterade kriterier — inte bara pris och leveranstid. Kriterierna ska inkludera kvalitet och miljö. En godkänd leverantörsförteckning ska finnas och hållas aktuell. Leverantörer som inte uppfyller kraven ska inte vara 'godkända'.",action:"Upprätta en leverantörslista med dokumenterade urvalskriterier som täcker kvalitet, miljö och leveranssäkerhet.",actionPartial:"Kontrollera att leverantörslistan är aktuell och att urvalskriterierna inkluderar miljö- och kvalitetskrav."},
        {id:"fr29",text:"Leverantörers förmåga utvärderas minst en gång per år — rapporteras vid ledningens genomgång.",
         help:"FR 2000 §4.2: leverantörers förmåga ska utvärderas minst en gång per år och rapporteras vid ledningens genomgång. Utvärderingen kan vara enkel — leveransprecision, kvalitetsavvikelser och kommunikation — men ska vara dokumenterad. Leverantörer som underpresterar ska hanteras.",action:"Inför en annual leverantörsutvärdering med definierade kriterier. Koppla resultaten till ledningens genomgång.",actionPartial:"Kontrollera att leverantörsutvärderingen faktiskt genomförs, dokumenteras och rapporteras vid ledningens genomgång."},
        {id:"fr30",text:"Mottagningskontroll av inköpta varor och tjänster genomförs och dokumenteras.",
         help:"FR 2000 §4.3: mottagningskontroll av inköpta varor och tjänster ska genomföras och dokumenteras. Kontrollen ska verka att det som levereras är det ni beställt och uppfyller era krav. Även tjänster kan kontrolleras — t.ex. underleverantörers utfört arbete.",action:"Definiera hur mottagningskontroll genomförs för material (kvantitet, skick) och tjänster (utfört arbete). Skapa ett enkelt dokumentationsformulär.",actionPartial:"Kontrollera att mottagningskontrollen tillämpas konsekvent — även vid brådska och vid tjänsteinköp."},
      ]},
      {id:"sfr_prod",name:"Produktion, leverans & extern plats",questions:[
        {id:"fr31",text:"Dokumenterade rutiner finns för produktion och leverans — täcker produktionsstyrning, kontroll, underhåll av utrustning och leverans.",
         help:"FR 2000 §5: rutiner för produktion och leverans ska täcka produktionsstyrning (hur arbetet planeras och styrs), kontroll (hur ni verifierar att arbetet uppfyller krav), underhåll av utrustning och leverans till kund. För ett installationsföretag: projektplanering, installationskontroll och överlämning.",action:"Dokumentera produktions- och leveransprocessen med checklistor för: planering, installation, kvalitetskontroll och kundöverlämning.",actionPartial:"Kontrollera att rutinerna täcker alla delar i §5 — kontrollera specifikt om underhåll av mät- och testutrustning finns med."},
        {id:"fr32",text:"Rutiner finns för planering och arbete på extern plats — täcker kompetens/behörigheter, säkerhet/miljö/brand, planering och slutkontroll.",
         help:"FR 2000 §6: arbete på extern plats — d.v.s. hos kund — ska planeras med avseende på: rätt kompetens och behörigheter för uppdraget, säkerhet/miljö/brand på plats, planering av arbetsmoment och slutkontroll. Slutkontrollen ska dokumenteras och anläggningsdokumentation bevaras.",action:"Upprätta rutiner för arbete på extern plats som täcker kompetens/behörigheter, säkerhet/miljö, planering och dokumenterad slutkontroll.",actionPartial:"Kontrollera att slutkontroll faktiskt dokumenteras vid varje uppdrag och att anläggningsdokumentation arkiveras och bevaras."},
      ]},
    ]
  },

  iso9001:{
    id:"iso9001",name:"ISO 9001",reg:"SS-EN ISO 9001:2015",
    desc:"Kvalitetsledningssystem för anläggarfirmor inom brand och säkerhet",
    sections:[
      {id:"iso_kontext",name:"Organisationens kontext",questions:[
        {id:"iso_k_1",text:"Har ni kartlagt externa och interna faktorer som påverkar er förmåga att leverera med rätt kvalitet?",
         help:"ISO 9001:2015 §4.1: ni ska förstå er organisations kontext — externa faktorer (marknad, konkurrenter, lagar, teknikutveckling) och interna faktorer (kultur, resurser, kompetens). Analysen ska vara dokumenterad och uppdateras minst en gång per år. SWOT-analys är ett vanligt verktyg.",action:"Dokumentera de viktigaste externa och interna faktorerna i en SWOT- eller kontextanalys. Uppdatera minst en gång per år.",actionPartial:"Gå igenom om er nuvarande analys är aktuell och täcker båda dimensionerna."},
        {id:"iso_k_2",text:"Har ni identifierat vilka intressenter som ställer krav på er verksamhet och vad dessa krav innebär?",
         help:"ISO 9001:2015 §4.2: ni ska identifiera relevanta intressenter och förstå deras krav. Relevanta intressenter för ett installationsföretag: kunder, certifieringsorgan (SBSC), myndigheter (Elsäkerhetsverket, IMY), anställda, leverantörer. Kraven från respektive intressent ska identifieras och kopplas till rutiner.",action:"Ta fram en intressentlista med: intressent, vad de kräver av er, och hur ni hanterar kravet i era rutiner.",actionPartial:"Gå igenom om listan är komplett och aktuell."},
        {id:"iso_k_3",text:"Är kvalitetsledningssystemets omfattning definierad och dokumenterad?",
         help:"ISO 9001:2015 §4.3: systemets omfattning ska definiera vilka produkter och tjänster och vilka enheter/platser som ingår i ledningssystemet. Om ni exkluderar något av ISO 9001:s krav ska det motiveras. Revisorerna granskar att revisionen täcker den definierade omfattningen.",action:"Skriv en dokumenterad systemomfattning som anger: vilka verksamheter och platser som ingår, och eventuella exkluderingar med motivering.",actionPartial:"Kontrollera att avgränsningen stämmer med er faktiska verksamhet."},
      ]},
      {id:"iso_ledarskap",name:"Ledarskap, policy & mål",questions:[
        {id:"iso_l_1",text:"Finns en kvalitetspolicy med förbättringsåtagande som är kommunicerad och känd av personalen?",
         help:"ISO 9001:2015 §5.2: kvalitetspolicyn ska: (1) vara lämplig för organisationens syfte, (2) inkludera ett förbättringsåtagande, (3) utgöra ram för kvalitetsmål, (4) kommuniceras och vara känd. Policyn ska finnas tillgänglig för intressenter. Revisorerna frågar medarbetare om policyn — den ska vara praktiskt känd, inte bara dokumenterad.",action:"Skriv en kvalitetspolicy som uppfyller §5.2:s fyra krav och kommunicera den till all personal med dokumenterad bekräftelse.",actionPartial:"Kontrollera att policyn uppfyller §5.2:s fyra krav och faktiskt är känd av personalen."},
        {id:"iso_l_2",text:"Är ansvar och befogenheter för kvalitetsrelaterade roller tydligt fördelade, dokumenterade och kommunicerade?",
         help:"ISO 9001:2015 §5.3: ledningen ska fördela ansvar och befogenhet för att: (1) säkra att systemet uppfyller kraven, (2) säkra att processerna ger avsedda utfall, (3) rapportera systemets prestanda till ledningen, (4) stödja kundfokus. En utsedd kvalitetsansvarig (eller ledningssystemsrepresentant) är vanligaste sättet.",action:"Ta fram en ansvarsmatris eller befattningsbeskrivningar som täcker de fyra rollerna i §5.3. Utse en namngiven kvalitetsansvarig.",actionPartial:"Gå igenom om befintlig ansvarsfördelning täcker alla §5.3-krav."},
        {id:"iso_l_3",text:"Finns dokumenterade, mätbara kvalitetsmål med plan för hur de ska uppnås?",
         help:"ISO 9001:2015 §6.2: kvalitetsmål ska uppfylla sju krav: vara relevanta för kvalitetspolicyn, mätbara, beakta tillämpliga krav, relevanta för produkt-/tjänstkvalitet, övervakade, kommunicerade och uppdaterade. Vanliga bra mål för installationsföretag: reklamationsfrekvens (%), leveransprecision (%), andel certifierade tekniker.",action:"Sätt 3–5 konkreta och mätbara kvalitetsmål med mätvärde, mätfrekvens, ansvarig och uppföljningsdatum.",actionPartial:"Gå igenom befintliga mål mot §6.2:s krav."},
      ]},
      {id:"iso_planering",name:"Riskbaserat tänkande",questions:[
        {id:"iso_p_1",text:"Har ni identifierat risker och möjligheter och planerat åtgärder för att hantera dem?",
         help:"ISO 9001:2015 §6.1: riskbaserat tänkande innebär att ni identifierar risker och möjligheter som kan påverka förmågan att uppnå avsedda utfall. Åtgärder ska planeras för identifierade risker. ISO 9001 kräver ingen formell riskhanteringsmetodik — en enkel tabell med risker och åtgärder uppfyller kravet.",action:"Gör en riskanalys i tabellform: risk, sannolikhet, konsekvens, åtgärd, ansvarig och status. Täck de 5–10 viktigaste riskerna.",actionPartial:"Kontrollera att analysen är kopplad till konkreta åtgärder och uppdateras vid förändringar."},
        {id:"iso_p_2",text:"Finns rutiner för att planera förändringar av kvalitetsledningssystemet på ett kontrollerat sätt?",
         help:"ISO 9001:2015 §6.3: förändringar av ledningssystemet ska planeras kontrollerat. Det innebär att ni innan en förändring bedömer: syftet med förändringen, konsekvenser för systemets integritet, resurstillgänglighet och ansvarsfördelning. En enkel checklista för förändringsplanering räcker.",action:"Ta fram en enkel rutin för förändringsplanering som täcker de fyra punkterna i §6.3. Skapa en checklista att gå igenom vid förändringar.",actionPartial:"Kontrollera att systemförändringar faktiskt planeras och inte sker ad hoc."},
      ]},
      {id:"iso_stod",name:"Kompetens & dokumentation",questions:[
        {id:"iso_s_1",text:"Har ni bestämt nödvändig kompetens per roll, säkerställt att personalen har den och bevarat bevis?",
         help:"ISO 9001:2015 §7.2: ni ska bestämma nödvändig kompetens för varje roll som påverkar kvalitet, säkra att personalen har den kompetensen och bevara dokumenterade bevis. 'Bevis' inkluderar utbildningsintyg, certifikat och bedömningsdokument. En kompetensmatris är ett effektivt verktyg.",action:"Skapa en kompetensmatris med: roll, nödvändig kompetens, befintlig kompetens med bevis och åtgärdsplan för identifierade luckor.",actionPartial:"Uppdatera matrisen med delar som saknas och lägg till förnyelsedatum för tidsbegränsade certifikat."},
        {id:"iso_s_2",text:"Finns rutiner för att skapa, uppdatera och styra dokumenterad information — inkl. versionshantering och skydd?",
         help:"ISO 9001:2015 §7.5: dokumenterad information ska styras — skapas, uppdateras och styras för att vara tillgänglig, lämplig och skyddad. Krav: versionshantering (versionsnummer och datum), kontroll av distribution (gamla versioner ska inte vara i bruk), och skydd mot obehörig ändring.",action:"Inför dokumentstyrning med: versionsnummer, godkännandeprocess, central lagringsplats och rutin för att dra tillbaka gamla versioner.",actionPartial:"Gå igenom om versionshanteringen fungerar i praktiken."},
        {id:"iso_s_3",text:"Finns rutiner för att bevara och överföra kritisk verksamhetskunskap vid personalomsättning?",
         help:"ISO 9001:2015 §7.1.6: ni ska bestämma den kunskap som krävs för att driva era processer och uppnå produktkvalitet. Denna kunskap ska bevaras och göras tillgänglig. Kritisk kunskap är det som försvinner om nyckelpersoner slutar. Dokumenterade rutiner, systemdokumentation och kundmappar är sätt att bevara den.",action:"Identifiera vilken kunskap som är kritisk och finns bara hos enstaka personer. Dokumentera den i rutiner, kundmappar och systemdokumentation.",actionPartial:"Gå igenom vilken kritisk kunskap som fortfarande är odokumenterad."},
      ]},
      {id:"iso_verksamhet",name:"Verksamhet & leveranskvalitet",questions:[
        {id:"iso_v_1",text:"Fångar ni upp, granskar och dokumenterar kundkrav innan ett uppdrag accepteras — inkl. tillämpliga regelverk?",
         help:"ISO 9001:2015 §8.2.2–8.2.3: ni ska fånga upp kundkrav (inkl. legala krav ni identifierat) och granska dem innan order accepteras. Granskningen ska säkra att ni kan uppfylla kraven och att avvikelser från anbud identifieras. Resultatet ska dokumenteras.",action:"Inför en rutin för uppdragsgranskning med checklista som täcker kundkrav, lagkrav och krav ni måste uppfylla. Dokumentera granskningen per order.",actionPartial:"Kontrollera att rutinen används konsekvent och täcker alla §8.2.3-punkter."},
        {id:"iso_v_2a",text:"Finns rutiner för att verifiera att arbetet uppfyller kraven — t.ex. via slutkontrollchecklista — innan överlämning?",
         help:"ISO 9001:2015 §8.6: ni ska verifiera att varor och tjänster uppfyller krav innan leverans till kund. 'Verifiering' ska vara planerad och systematisk — inte bara en informell koll. Dokumentation ska bevara bevis på godkänd kontroll och spårbarhet till vem som godkände.",action:"Ta fram en slutkontrollchecklista anpassad till era tjänster. Definiera vad som kontrolleras och av vem.",actionPartial:"Kontrollera att checklistan används konsekvent vid alla uppdragstyper."},
        {id:"iso_v_2b",text:"Dokumenteras godkännandeprocessen med spårbarhet till vem som godkänt leveransen och när?",
         help:"ISO 9001:2015 §8.6: godkännandeprocessen ska dokumenteras med spårbarhet — vem godkände leveransen och när. Om produkten eller tjänsten inte uppfyller krav ska det framgå av dokumentationen. Spårbarhetskravet innebär att ni i efterhand ska kunna visa vem som godkände varje leverans.",action:"Definiera vem som har befogenhet att godkänna leverans. Dokumentera godkännandet med namn, datum och hänvisning till uppdrag.",actionPartial:"Kontrollera att godkännandet faktiskt dokumenteras med spårbarhet per uppdrag."},
        {id:"iso_v_3",text:"Finns rutiner för att säkerställa att externt tillhandahållna produkter och tjänster uppfyller era krav?",
         help:"ISO 9001:2015 §8.4: externt tillhandahållna processer, produkter och tjänster ska styras. Ni ska bedöma och välja leverantörer baserat på deras förmåga att leverera i enlighet med era krav. Kriterier ska dokumenteras. Leverantörer ska utvärderas och uppföljning ska ske.",action:"Upprätta en lista på godkända leverantörer med dokumenterade urvalskriterier. Definiera hur leverantörer utvärderas och hur ofta.",actionPartial:"Gå igenom befintlig leverantörslista — finns dokumenterade urvalskriterier? Sker löpande uppföljning?"},
        {id:"iso_v_4",text:"Finns rutiner för att identifiera, styra och dokumentera avvikande processresultat?",
         help:"ISO 9001:2015 §8.7: avvikande processresultat — produkter eller tjänster som inte uppfyller krav — ska identifieras, styras och hanteras. Hantering kan innebära: korrigering, segregering, returer, informera kunden, dispensansökan. Spårbarhet till beslutsfattare krävs. Hantering efter leverans inkluderas.",action:"Inför ett avvikelsesystem som täcker: identifiering, styrning, hanteringsbeslut och spårbarhet till beslutsfattare. Inkludera hantering av avvikelser som uppstår efter leverans.",actionPartial:"Kontrollera att rutinerna täcker §8.7:s krav — spårbarhet till beslutsfattare."},
      ]},
      {id:"iso_uppfoljning",name:"Utvärdering & förbättring",questions:[
        {id:"iso_u_1a",text:"Mäts kundtillfredsställelse systematiskt — med en definierad metod?",
         help:"ISO 9001:2015 §9.1.2: ni ska övervaka kundernas upplevelse och tillfredshällelse med en definierad metod. Metoden och frekvensen ska bestämmas i förväg. En enkel enkät efter avslutat uppdrag, muntlig feedback i ett strukturerat format eller NPS-fråga räcker — det viktiga är att det sker systematiskt.",action:"Inför en enkel kundmätningsrutin: definiera metod (enkät, samtal), när den genomförs och hur resultaten dokumenteras.",actionPartial:"Kontrollera att mätmetoden faktiskt används konsekvent."},
        {id:"iso_u_1b",text:"Används kundmätningens resultat som underlag vid ledningens genomgång och för konkreta förbättringsåtgärder?",
         help:"ISO 9001:2015 §9.1.2 och §9.3.2: resultaten från kundmätningen ska användas som underlag vid ledningens genomgång. De ska leda till konkreta förbättringsåtgärder. En mätning som ingen agerar på uppfyller inte syftet med kravet — revisorerna kontrollerar att resultaten faktiskt används.",action:"Säkerställ att kundnöjdhetsresultat ingår som fast punkt vid ledningens genomgång och att resultaten faktiskt leder till konkreta åtgärder.",actionPartial:"Kontrollera att resultaten faktiskt leder till konkreta förbättringsåtgärder."},
        {id:"iso_u_2",text:"Analyseras verksamhetsdata regelbundet för att utvärdera processprestanda, måluppfyllelse och riskåtgärder?",
         help:"ISO 9001:2015 §9.1.3: ni ska analysera och utvärdera data och information från kundnöjdhet, produkt/tjänstkvalitet, processprestanda, leverantörsprestanda och riskbedömningar. Analysen ska användas som underlag för att bedöma systemets lämplighet, tillräcklighet och effektivitet.",action:"Inför en regelbunden dataanalys (kvartalsvis) som täcker: reklamationer, kundnöjdhet, måluppfyllelse och leverantörsprestanda. Dokumentera analysen.",actionPartial:"Kontrollera att analysen täcker alla §9.1.3-punkter."},
        {id:"iso_u_3",text:"Genomförs interna revisioner med planerade intervall — med dokumenterat revisionsprogram och uppföljning?",
         help:"ISO 9001:2015 §9.2: interna revisioner ska genomföras med planerade intervall och täcka alla processer. Revisorerna ska vara oberoende — dvs. inte revidera sin egen verksamhet. Revisionen ska bedöma om systemet uppfyller kraven och är effektivt implementerat. Resultat och korrigerande åtgärder ska dokumenteras.",action:"Upprätta ett revisionsprogram med: vilka processer som ingår, datum, vem som reviderar och hur resultat rapporteras. Säkra revisorns oberoende.",actionPartial:"Kontrollera att programmet täcker alla processer och att korrigerande åtgärder verkligen genomförs."},
        {id:"iso_u_4",text:"Genomför ledningen regelbundna genomgångar med §9.3:s underlag och dokumenterar beslut om resurser och förbättringar?",
         help:"ISO 9001:2015 §9.3: ledningens genomgång ska täcka: status på föregående åtgärder, förändringar i kontext och intressenter, kvalitetsmålsuppfyllelse, processprestanda, avvikelser, reklamationer, revisionsresultat, leverantörsprestanda och förbättringsmöjligheter. Beslut om resurser och förbättringar ska dokumenteras.",action:"Schemalägg ledningens genomgång och förbered en fast agenda som täcker alla §9.3.2-punkter. Protokollför alltid med beslut om åtgärder.",actionPartial:"Gå igenom senaste protokollet mot §9.3.2-listan."},
        {id:"iso_u_5",text:"Finns ett system för avvikelse och korrigerande åtgärd med rotorsaksanalys och verifikation att åtgärderna fungerat?",
         help:"ISO 9001:2015 §10.2: avvikelser och korrigerande åtgärder ska hanteras systematiskt: (1) reagera på avvikelsen, (2) utvärdera grundorsaken, (3) implementera korrigerande åtgärd, (4) granska effektiviteten. Dokumentation ska bevaras som bevis. En revisor letar efter bevis på rotorsaksanalys — inte bara att ni fixat problemet.",action:"Inför ett avvikelsesystem med kolumnerna: avvikelse, omedelbar åtgärd, rotorsak, korrigerande åtgärd, ansvarig, verifikation och status.",actionPartial:"Kontrollera att rotorsaksanalys faktiskt genomförs och att åtgärdernas verkan verifieras."},
      ]},
    ]
  },

  iso27001:{
    id:"iso27001",name:"ISO 27001",reg:"SS-ISO/IEC 27001:2022",
    desc:"Ledningssystem för informationssäkerhet",
    sections:[
      {id:"i27_kontext",name:"Kontext & systemomfattning",questions:[
        {id:"i27_k_1",text:"Har ni kartlagt externa och interna faktorer som påverkar er informationssäkerhet och identifierat relevanta intressenters krav?",
         help:"ISO 27001:2022 §4.1–4.2: ni ska förstå er informationssäkerhetskontext — externa faktorer (lagar som GDPR och NIS2, cyberhot, kundkrav) och interna faktorer (IT-miljö, personal, processer). Kontextanalysen ska vara IS-specifik — en generell verksamhetsanalys täcker inte kravet. Intressenters krav på informationssäkerhet ska specifikt identifieras.",action:"Dokumentera IS-kontext med externa faktorer (GDPR, NIS2, cyberhot) och interna faktorer (IT-miljö, personal). Identifiera intressenters IS-krav.",actionPartial:"Kontrollera att kontextanalysen är IS-specifik — det räcker inte med en generell verksamhetsanalys."},
        {id:"i27_k_2",text:"Är ISMS:ets omfattning definierad — inkl. informationstillgångar, system, lokaler och externa beroendeförhållanden?",
         help:"ISO 27001:2022 §4.3: ISMS:ets omfattning ska klart definiera vilka informationstillgångar, system, lokaler och externa beroendeförhållanden som ingår. Gränssnitt mot molntjänster och underleverantörer är särskilt viktiga att inkludera — dessa är vanliga revisionsanmärkningar. Exkluderingar ska motiveras.",action:"Skriv en dokumenterad ISMS-omfattning med alla ingående system, lokaler och externa parter. Inkludera gränssnitt mot molntjänster.",actionPartial:"Kontrollera att avgränsningen täcker gränssnitt mot molntjänster och underleverantörer — dessa är vanliga brister vid revision."},
      ]},
      {id:"i27_ledarskap",name:"Ledarskap & policy",questions:[
        {id:"i27_l_1",text:"Finns en informationssäkerhetspolicy med syfte, mål-ramverk, kravåtagande och förbättringsåtagande — kommunicerad till personalen?",
         help:"ISO 27001:2022 §5.2: IS-policyn ska vara specifik för informationssäkerhet och uppfylla fyra krav: (1) lämplig för organisationens syfte, (2) inkludera IS-mål eller ram för att fastställa dem, (3) innehålla åtagande om efterlevnad av tillämpliga krav, (4) innehålla åtagande om kontinuerlig förbättring. En generell IT-policy uppfyller vanligtvis inte kravet.",action:"Skriv en IS-policy som uppfyller de fyra §5.2-kraven. Kommunicera den till all personal och gör den tillgänglig för intressenter.",actionPartial:"Kontrollera att policyn uppfyller alla fyra §5.2-krav och faktiskt är känd av personalen — fråga medarbetarna."},
        {id:"i27_l_2",text:"Finns definierade roller och ansvar för informationssäkerhet — inkl. en utsedd person med ansvar för ISMS?",
         help:"ISO 27001:2022 §5.3: roller och ansvar för informationssäkerhet ska definieras och kommuniceras. En utsedd IS-ansvarig (Information Security Officer) med rapporteringsväg till ledningen är vanligaste lösningen. IS-ansvarige ska ha befogenhet att kräva åtgärder — ett nominellt ansvar utan reellt mandat uppfyller inte kravet.",action:"Utse en namngiven IS-ansvarig med tydliga befogenheter och rapporteringsväg till ledningen. Dokumentera rollen.",actionPartial:"Kontrollera att IS-ansvarige har tillräckliga resurser och reellt mandat — inte bara ett nominellt ansvar."},
        {id:"i27_l_3",text:"Finns dokumenterade och mätbara informationssäkerhetsmål med plan — kopplat till riskbedömningsresultat?",
         help:"ISO 27001:2022 §6.2: IS-mål ska vara mätbara, kopplade till IS-policyn och riskbedömningsresultat. Mål ska inkludera: vad som ska uppnås, mätvärde, vem som ansvarar, hur det genomförs och när det ska utvärderas. Typiska IS-mål: andel utbildad personal, tid för att stänga IS-incidenter, andel patchade system.",action:"Sätt 3–5 mätbara IS-mål kopplade till era identifierade risker. Definiera mätvärde, ansvarig, metod och uppföljningsdatum.",actionPartial:"Kontrollera att målen är mätbara och kopplade till specifika IS-risker — vaga mål som 'ökad säkerhet' uppfyller inte kravet."},
      ]},
      {id:"i27_risk",name:"Riskbedömning & riskbehandling",questions:[
        {id:"i27_r_1",text:"Finns en dokumenterad process för riskbedömning med riskacceptanskriterier, riskägare och bedömning av konfidentialitet/riktighet/tillgänglighet?",
         help:"ISO 27001:2022 §6.1.2: riskbedömningsprocessen ska definiera riskacceptanskriterier och metodiken för hur risker identifieras, analyseras och utvärderas. Riskerna ska beakta konfidentialitet, riktighet och tillgänglighet (CIA). Varje risk ska ha en utsedd riskägare. Riskbedömningsprocessen ska ge jämförbara och reproducerbara resultat.",action:"Ta fram en riskbedömningsmetodik med: riskacceptansnivå, skalor för sannolikhet och konsekvens, och process för att utse riskägare. Täck CIA-dimensionerna.",actionPartial:"Kontrollera att riskbedömningen täcker alla tre IS-dimensioner (konfidentialitet, riktighet, tillgänglighet) och att riskägare är utsedda."},
        {id:"i27_r_2",text:"Finns en dokumenterad riskbehandlingsplan med valda behandlingsalternativ och riskägarnas formella godkännande?",
         help:"ISO 27001:2022 §6.1.3: riskbehandlingsplanen ska definiera valda behandlingsalternativ (acceptera, reducera, undvika, överföra) och koppla dem till Annex A-kontrollen som implementeras. Riskägarnas formella godkännande av behandlingsplanen och kvarstående risker är ett dokumenterat krav.",action:"Ta fram en riskbehandlingsplan med: risk, valt behandlingsalternativ, kopplad Annex A-kontroll, ansvarig och tidplan. Inhämta riskägarnas godkännande.",actionPartial:"Kontrollera att planen är kopplad till Annex A-kontrollerna och att riskägarnas godkännande av kvarstående risker finns dokumenterat."},
        {id:"i27_r_3",text:"Finns ett Uttalande om tillämplighet (SoA) med Annex A-kontrollernas tillämplighet, motiveringar och implementeringsstatus?",
         help:"ISO 27001:2022 §6.1.3d: Uttalandet om tillämplighet (SoA) är ett av ISO 27001:s mest formella krav. Det ska för varje av Annex A:s 93 kontroller ange: om kontrollen är tillämplig, motivering (varje exkludering ska motiveras) och implementeringsstatus. SoA är ett levande dokument som ska hållas aktuellt.",action:"Skapa ett SoA-dokument i tabellform med Annex A:s 93 kontroller. Ange: tillämplig/ej tillämplig, motivering och implementeringsstatus.",actionPartial:"Kontrollera att SoA speglar faktisk implementeringsstatus — inte bara planer — och är konsistent med riskbehandlingsplanen."},
        {id:"i27_r_4a",text:"Genomförs riskbedömningar minst en gång per år — med dokumenterade resultat?",
         help:"ISO 27001:2022 §8.2: riskbedömningar ska genomföras med planerade intervall — minst en gång per år. Resultaten av riskbedömningen ska dokumenteras. Revisorerna kontrollerar att en aktuell riskbedömning finns och att den följer er dokumenterade metodik från §6.1.2.",action:"Inför en fast årsrutin för riskbedömning. Dokumentera resultat, riskägares godkännande och beslutade åtgärder.",actionPartial:"Kontrollera att en aktuell riskbedömning finns och att den är genomförd enligt er metodik från §6.1.2."},
        {id:"i27_r_4b",text:"Genomförs riskbedömningar även när betydande förändringar sker — ny IT-lösning, ny leverantör?",
         help:"ISO 27001:2022 §8.2: riskbedömningar ska också genomföras när betydande förändringar sker — ny IT-lösning, ny leverantör, ny lokal, ny tjänst. Ni ska definiera vad som räknas som 'betydande förändring' och säkra att en IS-riskcheck ingår i er förändringsprocess.",action:"Definiera vad som räknas som 'betydande förändring'. Lägg in en IS-riskcheck-punkt i er förändringsplaneringsrutin.",actionPartial:"Kontrollera att förändringsrutinen explicit innehåller en IS-riskcheck och att detta faktiskt tillämpas vid förändringar."},
      ]},
      {id:"i27_atgarder",name:"Säkerhetsåtgärder — Annex A",questions:[
        {id:"i27_a_1",text:"Finns en förteckning över informationstillgångar med utsedda ägare och klassificering?",
         help:"ISO 27001:2022 Annex A 5.9 och 5.12: en förteckning över informationstillgångar med utsedda ägare och klassificering är grunden för ISMS:et. Klassificeringen definierar skyddsnivå. Typiska tillgångar: kundregister, anläggningsdokumentation, lösenordsdatabaser, IT-system, e-post. Förteckningen ska hållas aktuell.",action:"Upprätta en informationstillgångsförteckning: tillgång, ägare, klassificering (konfidentialitetsnivå) och plats. Täck alla kritiska informationstillgångar.",actionPartial:"Kontrollera att förteckningen är komplett — saknas molntjänster, leverantörssystem eller personnuppgiftsbehandlingar? Och att den är aktuell."},
        {id:"i27_a_2a",text:"Finns dokumenterade regler för åtkomstkontroll baserat på least privilege — och en lösenordspolicy?",
         help:"ISO 27001:2022 Annex A 5.15 och 5.17: åtkomstkontroll ska baseras på least privilege — användare ska bara ha åtkomst till vad de behöver för sin roll. Lösenordspolicyn ska täcka: minimilängd, komplexitet och hantering (inga delade lösenord, lösenordshanterare rekommenderas). Teknisk implementation krävs — en dokumenterad policy utan teknisk åtgärd uppfyller inte kontrollen.",action:"Upprätta en åtkomstkontrollpolicy med rollbaserad behörighetsstruktur. Implementera lösenordspolicyn tekniskt. Dokumentera båda.",actionPartial:"Kontrollera att policyn är tekniskt implementerad — att behörighetsbegränsningar faktiskt tillämpas i IT-systemen."},
        {id:"i27_a_2b",text:"Granskas åtkomsträttigheter regelbundet — och finns rutin för att omedelbart ta bort åtkomst vid avslutad anställning?",
         help:"ISO 27001:2022 Annex A 5.18: åtkomsträttigheter ska granskas regelbundet och omedelbart dras tillbaka vid avslutad anställning eller förändrat behov. Revisorer kontrollerar specifikt: finns gamla konton kvar? Finns konsulter med åtkomst som inte längre är aktiva? En kvartalsgranskning av aktiva konton är effektivt.",action:"Inför en offboarding-checklista som säkrar att åtkomst tas bort vid avslut. Inför kvartalsgranskning av alla aktiva användarkonton.",actionPartial:"Kontrollera omedelbart om f.d. anställda eller inaktiva konsulter fortfarande har aktiv åtkomst — åtgärda innan revisionen."},
        {id:"i27_a_3",text:"Finns rutiner för informationssäkerhet i leverantörsrelationer — IS-krav i avtal och löpande uppföljning?",
         help:"ISO 27001:2022 Annex A 5.19 och 5.20: IS-krav i leverantörsrelationer ska definieras och avtalas. Leverantörer som hanterar er information — molntjänster, IT-support, underleverantörer — ska ha IS-krav i avtalet. Löpande uppföljning av leverantörernas IS-prestanda ska ske. DPA (GDPR) är ett specifikt krav vid personuppgiftsbehandling.",action:"Inventera leverantörer som hanterar er information. Lägg till IS-krav i nya och befintliga avtal. Inför annual uppföljning av leverantörernas IS.",actionPartial:"Kontrollera att befintliga avtal med informationshanterande leverantörer innehåller IS-krav — molntjänster och IT-support är vanliga brister."},
        {id:"i27_a_4",text:"Finns ett incidenthanteringssystem med process för IS-incidenter — inkl. GDPR:s krav på anmälan till IMY inom 72 timmar?",
         help:"ISO 27001:2022 Annex A 5.24–5.27: IS-incidenthanteringen ska täcka: (1) hur personal rapporterar misstänkta incidenter, (2) klassificering och eskalering, (3) hantering och återhämtning, (4) lärdom och förbättring. GDPR kräver anmälan till IMY inom 72 timmar vid personuppgiftsincidenter. Personalen måste veta vem de kontaktar vid en incident.",action:"Ta fram en IS-incidenthanteringsrutin med: rapporteringskanal för personal, eskalering, GDPR 72-timmarsrutin och rutin för lärdom.",actionPartial:"Kontrollera att all personal vet hur de rapporterar en IS-incident — fråga en slumpmässig medarbetare. Och att IMY-anmälningsrutinen är dokumenterad."},
        {id:"i27_a_5",text:"Finns tekniska skyddsåtgärder — antivirusskydd, regelbunden säkerhetskopiering med återställningstest och patchhantering?",
         help:"ISO 27001:2022 Annex A 8.7, 8.8 och 8.13: tre tekniska grundkontroller som revisorerna alltid granskar: (1) antivirusskydd på alla enheter inklusive mobiler och laptops, (2) backup-rutin med dokumenterat återställningstest — en backup utan testad återställning räknas inte, (3) patchhantering med definierad patchcykel. Alla tre krävs.",action:"Genomför en statuscheck: antivirusskydd på alla enheter, backup-rutin med schemalagt återställningstest och patchhanteringsrutin med definierad cykel.",actionPartial:"Kontrollera specifikt att backup faktiskt testas med återställning (inte bara görs) och att patchning sker systematiskt med dokumentation."},
      ]},
      {id:"i27_stod",name:"Kompetens & dokumentation",questions:[
        {id:"i27_s_1a",text:"Har de som arbetar med IS dokumenterad kompetens — utbildning, certifiering eller erfarenhet — och bevaras bevisen?",
         help:"ISO 27001:2022 §7.2: de som arbetar med IS — IS-ansvarig, IT-administratörer, systemägare — ska ha dokumenterad kompetens: formell utbildning, certifieringar (t.ex. ISO 27001 Lead Implementer) eller erfarenhet. Bevis ska bevaras. En bred personal med grundläggande IS-utbildning och en specialiserad IS-ansvarig är en vanlig och bra lösning.",action:"Identifiera IS-roller och dokumentera nödvändig kompetens per roll. Säkerställ att kompetensbevis finns och bevaras tillgängligt.",actionPartial:"Kontrollera att kompetensbevis finns dokumenterade och bevarade — utbildningsintyg och certifikat ska vara arkiverade."},
        {id:"i27_s_1b",text:"Genomgår all personal grundläggande IS-utbildning vid anställning och regelbundna uppdateringar?",
         help:"ISO 27001:2022 §7.3 och Annex A 6.3: all personal ska ha IS-medvetenhet anpassad till sin roll. Grundutbildning vid anställningsstart och regelbundna uppdateringar (minst annual) krävs. Vanliga ämnen: lösenordssäkerhet, phishing, incidentrapportering och GDPR-grunderna. Utbildningen ska dokumenteras med deltagarlista.",action:"Inför ett IS-utbildningsprogram med grundutbildning vid onboarding och annual uppdatering. Dokumentera varje tillfälle med deltagarlista.",actionPartial:"Kontrollera att utbildningen faktiskt genomförs och dokumenteras — att alla medarbetare fått grundutbildning och uppdateringar."},
        {id:"i27_s_2",text:"Finns rutiner för att styra ISMS-dokumentationen — versionshantering, behörighetsbegränsning och skydd av känsliga dokument?",
         help:"ISO 27001:2022 §7.5: ISMS-dokumentationen ska styras med versionshantering, begränsad åtkomst och skydd mot obehörig ändring. Känsliga dokument — riskbedömning, SoA, incidentrapporter — ska ha stricter behörighetskontroll. Tillgängligheten ska säkras (backup av dokumentationen).",action:"Inför dokumentstyrning för ISMS: versionshantering, vem som kan läsa/redigera känsliga dokument och hur dokumentationen backas upp.",actionPartial:"Kontrollera specifikt att riskbedömningen och SoA lagras med rätt behörighetskontroll och är versionshanterade."},
        {id:"i27_a_ropa",text:"Finns ett register över personuppgiftsbehandlingar (ROPA) enligt GDPR Artikel 30?",
         help:"ISO 27001:2022 Annex A 5.34 och GDPR Art. 30: ett register över personuppgiftsbehandlingar (ROPA) är ett lagkrav under GDPR för de flesta organisationer. ROPA ska innehålla: behandlingens syfte, kategorier av registrerade och uppgifter, mottagare, överföringar till tredjeland och tekniska/organisatoriska säkerhetsåtgärder. IMY har en mall.",action:"Upprätta ett ROPA via IMY:s mall (imy.se). Täck alla behandlingar: kundregister, personaluppgifter, molntjänster och externa mottagare.",actionPartial:"Kontrollera att ROPA täcker alla behandlingar — molntjänster och leverantörssystem missas ofta. Och att det är aktuellt."},
        {id:"i27_a_dpa",text:"Finns personuppgiftsbiträdesavtal (DPA) med alla leverantörer som behandlar personuppgifter för er räkning?",
         help:"ISO 27001:2022 Annex A 5.34 och GDPR Art. 28: om en leverantör behandlar personuppgifter för er räkning (molnlagring, IT-support med systemåtkomst, e-postleverantör) är ni personuppgiftsansvarig och ett DPA är lagkrav. De flesta stora leverantörer (Microsoft, Google, etc.) har standardiserade DPA i sina kundportaler.",action:"Inventera leverantörer som behandlar personuppgifter för er räkning. Teckna DPA — börja med Microsoft/Google-portaler för standardavtal.",actionPartial:"Identifiera vilka DPA som saknas. Prioritera leverantörer med mest känsliga uppgifter och de med faktisk systemåtkomst."},
      ]},
      {id:"i27_uppfoljning",name:"Utvärdering & förbättring",questions:[
        {id:"i27_u_1",text:"Finns ett system för att övervaka och mäta ISMS:ets prestanda — med specificerat vad som mäts och när?",
         help:"ISO 27001:2022 §9.1: ni ska övervaka och mäta ISMS:ets prestanda och effektivitet. Vad som ska mätas, metod och när ska definieras i förväg. Typiska mätpunkter: antal IS-incidenter per kvartal, andel utbildad personal, tid för patchning, backup-testresultat och antal öppna riskbehandlingsåtgärder.",action:"Definiera mätpunkter för ISMS-prestanda: vad, hur och när. Täck minst: incidenter, utbildning och backup-status. Dokumentera resultaten.",actionPartial:"Kontrollera att mätpunkterna faktiskt ger information om ISMS:ets verkliga verkan — inte bara aktiviteter utan utfall."},
        {id:"i27_u_2",text:"Genomförs interna revisioner av ISMS:et med planerade intervall — med dokumenterat program och säkerställd objektivitet?",
         help:"ISO 27001:2022 §9.2: interna revisioner av ISMS:et ska genomföras med planerade intervall och bedöma om ISMS uppfyller organisationens och ISO 27001:s krav samt är effektivt implementerat. Revisorn ska vara objektiv och opartisk — inte revidera sin egna arbete. Revisionsprotokoll ska bevaras.",action:"Upprätta ett IS-revisionsprogram med: täckning av alla ISMS-processer, planerade datum, revisors oberoende och hur resultat rapporteras och bevaras.",actionPartial:"Kontrollera att objektiviteten är säkerställd och att revisionsprotokollen bevaras och innehåller konkreta fynd och åtgärder."},
        {id:"i27_u_3",text:"Genomför ledningen regelbundna genomgångar av ISMS:et med §9.3.2:s underlag — inkl. riskbedömningsstatus?",
         help:"ISO 27001:2022 §9.3.2: ledningens genomgång av ISMS ska täcka: status på föregående åtgärder, förändringar i kontext och intressenters krav, riskbedömningsstatus och behandlingsplan, IS-mål, revisionsresultat, incidenter, leverantörsprestanda och förbättringsmöjligheter. Beslut och resurstilldelning ska dokumenteras.",action:"Schemalägg IS-ledningens genomgång med en fast agenda som täcker alla §9.3.2-punkter. Protokollför alltid med beslut om resurser och åtgärder.",actionPartial:"Kontrollera att protokollet täcker alla §9.3.2-punkter — riskbedömningsstatus och intressentförändringar missas ofta."},
        {id:"i27_u_4a",text:"Finns ett system för avvikelse och korrigerande åtgärd med rotorsaksanalys — och dokumenteras åtgärder och resultat?",
         help:"ISO 27001:2022 §10.2: avvikelser och korrigerande åtgärder i ISMS:et ska hanteras systematiskt: reagera, utvärdera grundorsaken, implementera åtgärd och granska effektiviteten. IS-avvikelser kan vara: konstaterade brister i revision, incidenter som avslöjar systemfel eller gap i kontroller. Bevis för hela processen ska bevaras.",action:"Inför ett IS-avvikelsesystem: avvikelse, rotorsak, korrigerande åtgärd, ansvarig, verifikation och bevarat bevis. Täck revisionsresultat och incidenter.",actionPartial:"Kontrollera att rotorsaksanalys faktiskt genomförs — inte bara att problemet löstes — och att bevis för hela processen bevaras."},
        {id:"i27_u_4b",text:"Uppdateras ISMS:et och riskbedömningen när avvikelsemönster identifieras?",
         help:"ISO 27001:2022 §10.2e: ISMS:et ska kontinuerligt förbättras. När avvikelsemönster identifieras — t.ex. upprepade liknande incidenter eller återkommande brister — ska riskbedömningen och ISMS:et uppdateras för att adressera grundorsaken. Kopplingen mellan avvikelsesystem och riskbedömning är ett specifikt krav som revisorerna kontrollerar.",action:"Definiera en rutin för när och hur avvikelsemönster triggar en uppdatering av riskbedömningen. Dokumentera kopplingen formellt.",actionPartial:"Kontrollera att det finns en dokumenterad koppling mellan avvikelsesystemet och riskbedömningsprocessen — inte bara i teorin."},
      ]},
    ]
  },
};

  {key:"pa_plats",label:"Uppfyllt",   score:1.0,cls:"ans-green"},
  {key:"delvis",  label:"Delvis",     score:0.5,cls:"ans-amber"},
  {key:"ej",      label:"Ej påbörjat",score:0.0,cls:"ans-red"},
  {key:"vet_ej",  label:"Vet ej",     score:null,cls:"ans-blue"},
];

const LMS_WARNING={
  inbrottslarm:"Ledningssystemet är den vanligaste bromsen för anläggarfirmor inom inbrottslarm. Erfarenhetsmässigt underskattar de flesta hur mycket ett implementerat system kräver i praktiken. Vi rekommenderar att du också gör självdeklarationen för SSF 1044 eller FR 2000 — lägg till dem i ditt val på startsidan.",
  kamerabevakning:"Ledningssystemet är den vanligaste bromsen för anläggarfirmor inom kamerabevakning. SSF 1061:3 kräver SSF 1044 SWE Q Nivå 2 som minimum. Vi rekommenderar att du också gör självdeklarationen för SSF 1044 eller FR 2000 — lägg till dem i ditt val på startsidan.",
  brandlarm:"Kvalitetssystemet är ett krav även för brandlarmscertifiering — och ett område många anläggarfirmor underskattar. Överväg att också göra självdeklarationen för SSF 1044 eller FR 2000 för att få en fullständig bild.",
};

const LARMKLASSER=[
  {id:"lk1",label:"Larmklass 1",short:"LK1",desc:"Grundläggande inbrottslarm — lägsta skyddsnivå. Kräver SWE Q Nivå 1 (alternativt FR 2000 eller ISO 9001)."},
  {id:"lk2",label:"Larmklass 2",short:"LK2",desc:"Förhöjt skydd — snabbare service, tätare kontroller och utökat kvalitetssystem (SWE Q Nivå 2)."},
  {id:"lk34",label:"Larmklass 3–4",short:"LK3/4",desc:"Högsta skyddsnivå — kräver full ISO 9001-certifiering. Gör vår ISO 9001-självdeklaration."},
];

const SWQ_NIVAER=[
  {id:"n1",label:"Larmklass 1 → SWE Q Nivå 1",short:"Nivå 1",desc:"Krav: Grund + Nivå 1. Lägsta nivå för certifierade anläggarfirmor inom LK1."},
  {id:"n2",label:"Larmklass 2 → SWE Q Nivå 2",short:"Nivå 2",desc:"Krav: Grund + Nivå 1 + Nivå 2. Krävs för LK2 och kamerabevakning (SSF 1061:3)."},
  {id:"alla",label:"Vet ej / Visa alla krav",short:"Alla nivåer",desc:"Visar samtliga krav — Grund, Nivå 1 och Nivå 2. Bra om ni vill kartlägga fullt ut."},
  {id:"lk34",label:"Larmklass 3–4 (ISO 9001)",short:"LK3/4",desc:"Larmklass 3 och 4 kräver ISO 9001 — inte SSF 1044. Gör vår ISO 9001-självdeklaration."},
];

const getVisibleQuestions=(sec,larmklass,swqNiva)=>{
  // Inbrottslarm: filtrera på lkOnly
  if(larmklass){
    return sec.questions.filter(q=>{
      if(q.lkOnly&&q.lkOnly!==larmklass)return false;
      return true;
    });
  }
  // SSF 1044: kumulativ filtrering baserat på vald nivå
  if(swqNiva&&swqNiva!=="alla"&&swqNiva!=="lk34"){
    return sec.questions.filter(q=>{
      if(!q.swqNiva)return true; // inga nivåtaggar = alltid visa
      if(swqNiva==="n1")return q.swqNiva==="grund"||q.swqNiva==="n1";
      if(swqNiva==="n2")return true; // n2 = visa allt (kumulativt)
      return true;
    });
  }
  return sec.questions;
};

const getQText=(q,larmklass)=>{
  if(q.lkText&&larmklass&&q.lkText[larmklass])return q.lkText[larmklass];
  return q.text;
};

const secPct=(sec,ans)=>{
  let s=0,t=0;
  sec.questions.forEach(q=>{
    const a=ans[q.id];if(!a||a==="vet_ej")return;
    const d=ANSWERS.find(x=>x.key===a);if(d&&d.score!==null){s+=d.score;t++;}
  });
  return{pct:t>0?Math.round(s/t*100):null,done:sec.questions.filter(q=>ans[q.id]).length,total:sec.questions.length};
};

const stdPct=(std,ans)=>{
  let s=0,t=0,done=0,total=0;
  std.sections.forEach(sec=>sec.questions.forEach(q=>{
    total++;const a=ans[q.id];if(a)done++;
    if(a&&a!=="vet_ej"){const d=ANSWERS.find(x=>x.key===a);if(d&&d.score!==null){s+=d.score;t++;}}
  }));
  return{pct:t?Math.round(s/t*100):null,done,total};
};

const barColor=p=>p===null?"#E8E9EC":p>=80?"#1B6B3F":p>=50?"#FFA300":"#C03535";
const timeUntil=p=>{
  if(p===null)return"Otillräckligt underlag";
  if(p>=85)return"0–3 månader";if(p>=65)return"3–6 månader";
  if(p>=40)return"6–12 månader";return"12+ månader";
};
const readiness=p=>{
  if(p===null)return"Otillräckligt underlag";
  if(p>=85)return"Mycket god beredskap";if(p>=65)return"God beredskap — luckor finns";
  if(p>=40)return"Delvis förberedd";return"Grundarbete återstår";
};
const today=()=>new Date().toLocaleDateString("sv-SE",{day:"numeric",month:"long",year:"numeric"});

function generateSummary(active,answers,company,overall){
  const name=company||"Er organisation";
  const totalHi=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="ej").length,0),0);
  const totalMi=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="delvis").length,0),0);
  const multi=active.length>1;
  let intro="";
  if(overall===null)intro=`Självskattningen för ${name} ger en övergripande bild av er beredskap inför ${multi?"certifieringarna":"certifieringen"}.`;
  else if(overall>=85)intro=`${name} befinner sig i ett mycket gott läge inför ${multi?"certifieringarna":"certifieringen"} med ${overall}% samlad beredskap.`;
  else if(overall>=65)intro=`${name} har byggt upp en god grund med ${overall}% samlad beredskap. Arbetet är till stor del påbörjat, men ett antal viktiga pusselbitar behöver falla på plats.`;
  else if(overall>=40)intro=`${name} är på väg i rätt riktning med ${overall}% samlad beredskap, men det kvarstår ett mer strukturerat arbete inom flera områden.`;
  else intro=`Självskattningen visar att ${name} befinner sig i ett tidigt skede med ${overall}% samlad beredskap.`;
  let gaps="";
  if(totalHi>0)gaps=`Kartläggningen identifierar ${totalHi} krav som ännu inte påbörjats och ${totalMi} som delvis är på plats. Prioritera de opåbörjade kraven för att komma vidare mot revision.`;
  else if(totalMi>0)gaps=`Det finns inga krav som helt saknas, men ${totalMi} krav behöver slutföras.`;
  let closing=overall>=80?"Nästa naturliga steg är att stämma av detaljerna och boka ett inledande samtal med SBSC.":overall>=60?`Med fokuserat arbete bör certifiering vara möjlig inom ${timeUntil(overall).toLowerCase()}. Kontakta SBSC tidigt för att stämma av er plan.`:`Rekommendationen är att börja med de högt prioriterade kraven. Räkna med ${timeUntil(overall).toLowerCase()} innan revision är aktuellt.`;
  return[intro,gaps,closing].filter(Boolean).join(" ");
}

function Spider({sections,answers,size=220}){
  const [tip,setTip]=useState(null);
  const cx=size/2,cy=size/2,R=size*0.30,n=sections.length;
  if(n<3)return null;
  const ang=i=>(i*2*Math.PI/n)-Math.PI/2;
  const pt=(i,r)=>({x:cx+r*Math.cos(ang(i)),y:cy+r*Math.sin(ang(i))});
  const vals=sections.map((s,i)=>{const{pct}=secPct(s,answers);return{name:s.name,v:pct!=null?pct/100:0,i,pct};});
  const dpts=vals.map(({v,i})=>{const p=pt(i,v*R);return`${p.x},${p.y}`;}).join(" ");
  const lR=R*1.36;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{overflow:"visible"}}>
      {[.25,.5,.75,1].map((lv,j)=>{const ps=sections.map((_,i)=>{const p=pt(i,lv*R);return`${p.x},${p.y}`;}).join(" ");return<polygon key={j} points={ps} fill="none" stroke="#E8E9EC" strokeWidth={j===3?1.5:1}/>;} )}
      {vals.map(({i})=>{const e=pt(i,R);return<line key={i} x1={cx} y1={cy} x2={e.x} y2={e.y} stroke="#E8E9EC" strokeWidth="1"/>;})}
      <polygon points={dpts} fill="#FFA300" fillOpacity=".16" stroke="#FFA300" strokeWidth="2" strokeLinejoin="round"/>
      {vals.map(({v,i,name,pct})=>{const p=pt(i,v*R);return(<g key={i} onMouseEnter={()=>setTip({x:p.x,y:p.y,name,pct})} onMouseLeave={()=>setTip(null)} style={{cursor:"pointer"}}><circle cx={p.x} cy={p.y} r="12" fill="transparent"/><circle cx={p.x} cy={p.y} r="4.5" fill="#FFA300" stroke="#fff" strokeWidth="2"/></g>);})}
      {vals.map(({name,i})=>{const lp=pt(i,lR),cv=Math.cos(ang(i));const anchor=cv>.15?"start":cv<-.15?"end":"middle";return<text key={i} x={lp.x} y={lp.y} textAnchor={anchor} dominantBaseline="middle" fontSize="9.5" fontWeight="700" fill="#4A4B52" fontFamily="Open Sans,sans-serif">{name.length>22?name.slice(0,20)+"…":name}</text>;})}
      {tip&&(<g><rect x={tip.x-58} y={tip.y-38} width="116" height="32" rx="4" fill="#101820" opacity=".93"/><text x={tip.x} y={tip.y-26} textAnchor="middle" fontSize="10" fontWeight="700" fill="white" fontFamily="Open Sans,sans-serif">{tip.name.length>18?tip.name.slice(0,16)+"…":tip.name}</text><text x={tip.x} y={tip.y-13} textAnchor="middle" fontSize="11" fontWeight="800" fill="#FFA300" fontFamily="Open Sans,sans-serif">{tip.pct!==null?`${tip.pct}%`:"Vet ej"}</text></g>)}
    </svg>
  );
}

function TocBlock({active,answers}){
  if(active.length<2)return null;
  return(
    <div className="toc-block">
      <div className="toc-title">Innehåll — certifieringar i denna rapport</div>
      {active.map(std=>{
        const sc=stdPct(std,answers);
        const clr=sc.pct===null?"var(--muted)":sc.pct>=80?"#1B6B3F":sc.pct>=50?"#FFA300":"#C03535";
        return(<div className="toc-item" key={std.id}>
          <span className="toc-item-name">{std.name}<span style={{fontSize:11,color:"var(--muted)",fontWeight:400,marginLeft:6}}>{std.reg}</span></span>
          <span className="toc-dots"/>
          <span className="toc-item-pct" style={{color:clr}}>{sc.pct!==null?`${sc.pct}%`:"—"}</span>
        </div>);
      })}
    </div>
  );
}

  const val=answers[q.id];
  const qText=getQText(q,larmklass);
  return(
    <div className="q-card">
      <div className="q-text">{i+1}. {qText}</div>
      {q.help&&<div className="q-help-inline">{q.help}</div>}
      <div className="ans-grid">
        {ANSWERS.map(a=>(
          <button key={a.key} className={`ans-btn${val===a.key?" "+a.cls:""}`} onClick={()=>answer(q.id,a.key)}>{a.label}</button>
        ))}
      </div>
      {showLmsWarning&&val==="ej"&&(
        <div className="lms-warning">
          <span className="lms-warning-icon">⚠️</span>
          <div>
            <strong>Vanligaste bromsen — ledningssystemet</strong>
            {LMS_WARNING[showLmsWarning]}
          </div>
        </div>
      )}

  );
}
