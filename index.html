function CertSection({std,answers,larmklass,swqNiva}){
  const sc=stdPct(std,answers);
  const gaps=[];
  std.sections.forEach(sec=>{
    const qs=larmklass&&std.id==="inbrottslarm"?getVisibleQuestions(sec,larmklass,null):swqNiva&&std.id==="ssf1044"?getVisibleQuestions(sec,null,swqNiva):sec.questions;
    qs.forEach(q=>{
      const a=answers[q.id];
      const qText=getQText(q,larmklass&&std.id==="inbrottslarm"?larmklass:null);
      if(a==="ej")gaps.push({pri:"hi",lbl:"Prioritera",cls:"badge-hi",sec:sec.name,q:qText,albl:"Så här börjar ni",act:q.action||null});
      else if(a==="delvis")gaps.push({pri:"mi",lbl:"Slutför",cls:"badge-mi",sec:sec.name,q:qText,albl:"Så här kompletterar ni",act:q.actionPartial||q.action||null});
      else if(a==="vet_ej")gaps.push({pri:"uk",lbl:"Kontrollera",cls:"badge-uk",sec:sec.name,q:qText,act:null});
    });
  });
  gaps.sort((a,b)=>({hi:0,mi:1,uk:2}[a.pri]-{hi:0,mi:1,uk:2}[b.pri]));
  const lkObj=larmklass&&std.id==="inbrottslarm"?LARMKLASSER.find(l=>l.id===larmklass):null;
  return(
    <div className="cert-section">
      <div className="cert-head">
        <div>
          <h3>{std.name}</h3>
          <div className="cert-head-reg">{std.reg}{lkObj?` · ${lkObj.label}`:""}</div>
        </div>
        <div className="cert-head-score">{sc.pct!=null?`${sc.pct}%`:"—"}</div>
      </div>
      <div className="cert-body">
        <div className="spider-wrap"><Spider sections={std.sections} answers={answers}/></div>
        <div className="bar-section">
          {std.sections.map(s=>{const{pct}=secPct(s,answers);return(
            <div className="bar-row" key={s.id}>
              <div className="bar-label">{s.name}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${pct||0}%`,background:barColor(pct)}}/></div>
              <div className="bar-pct">{pct!=null?`${pct}%`:"—"}</div>
            </div>);})}
        </div>
        <div className="gap-section">
          {gaps.length>0?(
            <>
              <h4>Prioriterade åtgärder — {std.name}</h4>
              {gaps.map((g,idx)=>(
                <div className="gap-row" key={idx}>
                  <span className={`gap-badge ${g.cls}`}>{g.lbl}</span>
                  <div className="gap-body">
                    <div className="gap-title">{g.q}</div>
                    <div className="gap-meta">{std.name} · {g.sec}</div>
                    {g.act&&(<><div className="gap-action-label">{g.albl}</div><div className="gap-action">{g.act}</div></>)}
                  </div>
                </div>
              ))}
            </>
          ):(
            <div className="gap-none">✓ Inga identifierade gap för {std.name}</div>
          )}
        </div>
      </div>
    </div>
  );
}

            <div className="lk-warn-box">
              <h4>Larmklass 3–4 kräver ISO 9001</h4>
              <p>SSF 1015:3 larmklass 3 och 4 kräver ett fullständigt kvalitetsledningssystem enligt ISO 9001. Gör vår <strong>ISO 9001-självdeklaration</strong> för att kartlägga er beredskap — lägg till den i ditt val på startsidan. Nedan visas de grundläggande organisationskraven som gäller för alla larmklasser.</p>
            </div>
          )}
          {larmklass&&larmklass!=="lk34"&&(
            <div className={`lk-banner lk-banner-${larmklass==="lk1"?"1":"2"}`}>
              <span>📋</span>
              <span>Frågorna nedan är anpassade för <strong>{LARMKLASSER.find(l=>l.id===larmklass)?.label}</strong></span>
            </div>
          )}
        </>
      )}
      {!showLkPicker&&larmklass&&curStd.id==="inbrottslarm"&&(
        <div className={`lk-banner lk-banner-${larmklass==="lk1"?"1":"2"} no-print`}>
          <span>📋</span><span>Anpassat för <strong>{LARMKLASSER.find(l=>l.id===larmklass)?.label}</strong></span>
        </div>
      )}
      {showSwqPicker&&(
        <>
          <SWEQValjare selected={swqNiva} onSelect={setSwqNiva}/>
          {swqNiva==="lk34"&&(
            <div className="lk-warn-box">
              <h4>Larmklass 3–4 kräver ISO 9001</h4>
              <p>SSF 1015:3 larmklass 3 och 4 kräver fullt kvalitetsledningssystem enligt ISO 9001 — inte SSF 1044. Lägg till <strong>ISO 9001</strong> i ditt val på startsidan och gör den självdeklarationen istället. Nedan visas Grund-kraven som gäller oavsett larmklass.</p>
            </div>
          )}
          {swqNiva&&swqNiva!=="lk34"&&(
            <div className="lk-banner lk-banner-2">
              <span>📋</span>
              <span>Visar krav för <strong>{SWQ_NIVAER.find(n=>n.id===swqNiva)?.short}</strong>{swqNiva!=="alla"&&<span style={{fontSize:11,fontWeight:400}}> — kumulativt (inkl. lägre nivåer)</span>}</span>
            </div>
          )}
        </>
      )}
      {!showSwqPicker&&swqNiva&&curStd.id==="ssf1044"&&swqNiva!=="lk34"&&(
        <div className="lk-banner lk-banner-2 no-print">
          <span>📋</span><span>Anpassat för <strong>{SWQ_NIVAER.find(n=>n.id===swqNiva)?.short}</strong></span>
        </div>
      )}
      {visibleQs.map((q,i)=>(
        <QCard key={q.id} q={q} i={i} answers={answers} answer={answer}
          larmklass={curStd.id==="inbrottslarm"?larmklass:null}
          showLmsWarning={curSec.lmsWarning}/>
      ))}
      <div className="btn-row no-print">
        <button className="btn-ghost" onClick={goPrev} disabled={isFirst}>← Föregående</button>
        <button className="btn btn-primary" onClick={goNext} disabled={!secDone}>{isLast?"Visa rapport →":"Nästa →"}</button>
      </div>
      {!secDone&&<div style={{textAlign:"right",fontSize:11,color:"var(--muted)",marginTop:8}}>Besvara alla frågor för att gå vidare.</div>}
    </>
  );
}

function ReportPage({active,answers,company,larmklass,swqNiva,restart,back}){
  let s=0,t=0;
  active.forEach(std=>std.sections.forEach(sec=>sec.questions.forEach(q=>{
    const a=answers[q.id];if(a&&a!=="vet_ej"){const d=ANSWERS.find(x=>x.key===a);if(d&&d.score!==null){s+=d.score;t++;}}
  })));
  const overall=t?Math.round(s/t*100):null;
  const hiG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="ej").length,0),0);
  const miG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="delvis").length,0),0);
  const vetEjG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="vet_ej").length,0),0);
  const ds=today();
  const lkObj=larmklass?LARMKLASSER.find(l=>l.id===larmklass):null;
  return(
    <>
      <div className="print-header">
        <img src={LOGO} alt="SBSC" className="print-header-logo"/>
        <div className="print-header-right">
          <span className="print-header-title">Certifieringsberedskapsanalys</span>
          <span className="print-header-sub">{ds} · SBSC ackrediterat av SWEDAC (nr 1631)</span>
        </div>
      </div>
      <TocBlock active={active} answers={answers}/>
      <div className="report-banner">
        <div>
          <div className="banner-label">Certifieringsberedskapsanalys · SBSC</div>
          <div className="banner-company">{company||"Ert företag"}</div>
          <div className="banner-meta">
            <span>{ds}</span>
            <span>{active.map(s=>s.name).join(" · ")}</span>
            {lkObj&&<span>{lkObj.label}</span>}
          </div>
        </div>
        <div>
          <div className="banner-score-label">Samlad beredskap</div>
          <div className="banner-score">{overall!=null?<>{overall}<em>%</em></>:"—"}</div>
        </div>
      </div>
      <div className="kpi-row">
        <div className="kpi-cell"><div className="kpi-label">Bedömning</div><div className="kpi-value">{readiness(overall)}</div></div>
        <div className="kpi-cell"><div className="kpi-label">Tid innan redo för revision</div><div className="kpi-value kpi-amber">{timeUntil(overall)}</div></div>
        <div className="kpi-cell"><div className="kpi-label">Identifierade åtgärder</div><div className="kpi-value">{hiG} att prioritera · {miG} att slutföra</div></div>
      </div>
      {vetEjG>=5&&(
        <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"12px 16px",marginBottom:14,background:"#FEF9EC",border:"1.5px solid #FFD580",borderRadius:6,fontSize:13}}>
          <span>⚠</span>
          <div><strong style={{display:"block",marginBottom:3,color:"#7A4800"}}>{vetEjG} frågor besvarades med "Vet ej"</strong><span style={{color:"#8A5500"}}>Dessa behöver kontrolleras internt — resultatet kan vara missvisande.</span></div>
        </div>
      )}
      <div className="summary-box">
        <div className="summary-box-label">Var befinner ni er på certifieringsresan?</div>
        <div className="summary-box-text">{generateSummary(active,answers,company,overall)}</div>
      </div>
      {active.map(std=><CertSection key={std.id} std={std} answers={answers} larmklass={std.id==="inbrottslarm"?larmklass:null} swqNiva={std.id==="ssf1044"?swqNiva:null}/>)}
      <div className="disclaimer">
        <strong>Viktig information om denna rapport</strong>
        Denna rapport är en självskattning och ger en indikativ bild av er beredskap. Verktyget är ett förenklat stöd och garanterar inte att samtliga krav berörs. Resultaten speglar hur ni tolkar och besvarar frågorna och kan avvika från en faktisk revision. En hög beredskapsgrad innebär inte att certifiering kan utfärdas utan föregående revision. SBSC är ackrediterat av SWEDAC (ackrediteringsnummer 1631).
      </div>
      <div className="cta-block">
        <div><h3>Redo att ta nästa steg?</h3><p>Kontakta oss så berättar vi mer om certifieringsprocessen.</p></div>
        <a className="cta-link" href={`mailto:kund@sbsc.se?subject=${encodeURIComponent("Certifieringsberedskap — "+company)}&body=${encodeURIComponent("Hej SBSC,\n\nVi har genomfört er självskattning.\n\nFöretag: "+company+"\nCertifieringar: "+active.map(s=>s.name).join(", ")+"\nSamlad beredskap: "+(overall!==null?overall+"%":"—")+"\n\nVi är intresserade av att höra mer.\n\nMed vänliga hälsningar,")}`}>Ta kontakt med SBSC →</a>
      </div>
      <div className="btn-row no-print" style={{marginTop:20}}>
        <button className="btn-ghost" onClick={back}>← Tillbaka</button>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-secondary" onClick={()=>window.print()}>🖨 Skriv ut / PDF</button>
          <button className="btn btn-secondary" onClick={restart}>Börja om</button>
        </div>
      </div>
    </>
  );
}

function StartPage({picked,toggle,company,setCompany,agreed,setAgreed,attempted,goStart}){
  const missingName=!company.trim(),missingCert=!picked.length,missingAgreed=!agreed;
  const hasError=attempted&&(missingName||missingCert||missingAgreed);
  return(
    <>
      <div className="page-intro">
        <div className="chip">Kostnadsfri självutvärdering</div>
        <h1>Är er firma redo för SBSC-certifiering?</h1>
        <p>Kartlägg er beredskap, se gap med vägledning och få ett tydligt svar på hur lång tid det tar.</p>
      </div>
      <div className="card">
        <div className="field-label">Företagets namn<span className="req-star">*</span></div>
        <input className={`text-input${attempted&&missingName?" invalid":""}`} type="text" placeholder="T.ex. Andersson Larm & Säkerhet AB" value={company} onChange={e=>setCompany(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")goStart();}}/>
        {attempted&&missingName&&<div className="field-error">Ange företagets namn för att fortsätta.</div>}
        <div className="privacy-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <p>Ingen data sparas. Alla svar stannar i din webbläsare och raderas när du stänger sidan.</p>
        </div>
      </div>
      <div className="card">
        <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>Välj certifiering</div>
        <p style={{fontSize:13,color:"var(--muted)",marginBottom:16}}>Välj en eller flera. Ledningssystemet (SSF 1044 / FR 2000 / ISO 9001) krävs för inbrottslarm och kamerabevakning.</p>
        {CERT_GROUPS.map(group=>(
          <div key={group.label}>
            <div className="cert-group-label">{group.label}</div>
            {group.note&&<div style={{fontSize:12,color:"var(--blue)",background:"#EEF4FB",border:"1px solid #C8DCF0",borderRadius:6,padding:"8px 12px",marginBottom:10,lineHeight:1.6}}>💡 {group.note}</div>}
            <div className="cert-list">
              {group.ids.map(id=>{const s=STANDARDS[id];return(
                <div key={id} className={`cert-row${picked.includes(id)?" active":""}`} onClick={()=>toggle(id)} role="checkbox" aria-checked={picked.includes(id)} tabIndex={0} onKeyDown={e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(id);}}}>
                  <div className="cert-check">{picked.includes(id)?"✓":""}</div>
                  <div><div className="cert-name">{s.name}<span className="cert-badge">{s.reg}</span></div><div className="cert-desc">{s.desc}</div></div>
                </div>
              );})}
            </div>
          </div>
        ))}
        <div className="disc-check-wrap" onClick={()=>setAgreed(a=>!a)}>
          <div className={`disc-checkbox${agreed?" disc-checked":""}`}>{agreed?"✓":""}</div>
          <div className="disc-check-text">
            <strong>Jag förstår hur rapporten ska användas</strong>
            Verktyget är ett förenklat stöd — inte ett certifieringsbesked. En hög beredskapsgrad innebär inte att certifiering utfärdas utan föregående revision. SBSC är ackrediterat av SWEDAC (nr 1631).
          </div>
        </div>
        {hasError&&(
          <div className="validation-box" style={{marginTop:14}}>
            <div className="validation-title">Följande måste fyllas i:</div>
            {missingName&&<div className="validation-item"><span className="v-num">1</span>Ange företagets namn</div>}
            {missingCert&&<div className="validation-item"><span className="v-num">{missingName?2:1}</span>Välj minst en certifiering</div>}
            {missingAgreed&&<div className="validation-item"><span className="v-num">{[missingName,missingCert].filter(Boolean).length+1}</span>Bekräfta att du förstår hur rapporten ska användas</div>}
          </div>
        )}
        <div className="stat-row">
          <div className="stat"><div className="stat-n">{picked.length>0?picked.reduce((n,id)=>n+STANDARDS[id].sections.reduce((m,s)=>m+s.questions.length,0),0):"—"}</div><div className="stat-l">frågor valda</div></div>
          <div className="stat"><div className="stat-n">0%</div><div className="stat-l">data lagras</div></div>
          <div className="stat"><div className="stat-n">PDF</div><div className="stat-l">utskriftsvänlig</div></div>
        </div>
        <div className="btn-row">
          <span style={{fontSize:12,color:"var(--muted)"}}>Ger en indikation — inte ett certifieringsbesked.</span>
          <button className="btn btn-primary" onClick={goStart}>Starta utvärdering →</button>
        </div>
      </div>
    </>
  );
}

function App(){
  const [gateCleared,setGateCleared]=useState(false);
  const [view,setView]=useState("start");
  const [picked,setPicked]=useState([]);
  const [answers,setAnswers]=useState({});
  const [stdIdx,setStdIdx]=useState(0);
  const [secIdx,setSecIdx]=useState(0);
  const [company,setCompany]=useState("");
  const [attempted,setAttempted]=useState(false);
  const [agreed,setAgreed]=useState(false);
  const [showRestart,setShowRestart]=useState(false);
  const [larmklass,setLarmklass]=useState("lk1");
  const [swqNiva,setSwqNiva]=useState("n1");

  const active=picked.map(id=>STANDARDS[id]);
  const curStd=active[stdIdx];
  const curSec=curStd?curStd.sections[secIdx]:null;
  const toggle=id=>setPicked(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const answer=(qid,val)=>setAnswers(p=>({...p,[qid]:val}));
  const totalQ=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.length,0),0);
  const doneQ=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]).length,0),0);
  const prog=totalQ?Math.round(doneQ/totalQ*100):0;
  const isFirst=stdIdx===0&&secIdx===0;
  const isLast=curStd&&stdIdx===active.length-1&&secIdx===curStd.sections.length-1;
  const visibleQsInSec=curSec?getVisibleQuestions(curSec,curStd?.id==="inbrottslarm"?larmklass:null,curStd?.id==="ssf1044"?swqNiva:null):[];
  const secDone=visibleQsInSec.every(q=>answers[q.id]);

  const goNext=()=>{
    if(secIdx<curStd.sections.length-1)setSecIdx(secIdx+1);
    else if(stdIdx<active.length-1){setStdIdx(stdIdx+1);setSecIdx(0);}
    else setView("results");
    window.scrollTo(0,0);
  };
  const goPrev=()=>{
    if(secIdx>0)setSecIdx(secIdx-1);
    else if(stdIdx>0){setStdIdx(stdIdx-1);setSecIdx(active[stdIdx-1].sections.length-1);}
    window.scrollTo(0,0);
  };
  const goStart=()=>{
    setAttempted(true);
    if(!company.trim()||!picked.length||!agreed)return;
    setStdIdx(0);setSecIdx(0);setView("questions");window.scrollTo(0,0);
  };
  const confirmRestart=()=>{
    setAnswers({});setPicked([]);setStdIdx(0);setSecIdx(0);
    setCompany("");setAgreed(false);setAttempted(false);setLarmklass("lk1");setSwqNiva("n1");
    setShowRestart(false);setView("start");window.scrollTo(0,0);
  };

  if(!gateCleared)return<GatePage onSuccess={(co)=>{setCompany(co);setGateCleared(true);window.scrollTo(0,0);}}/>;

  return(
    <>
      <a href="#main-content" className="skip-link">Hoppa till innehåll</a>
      <header className="site-header no-print">
        <div className="hdr-inner">
          <img src={LOGO} alt="SBSC" className="hdr-logo"/>
          <span className="hdr-label">Certifieringsberedskap</span>
        </div>
      </header>
      <main className="shell" id="main-content">
        {view==="start"&&<StartPage picked={picked} toggle={toggle} company={company} setCompany={setCompany} agreed={agreed} setAgreed={setAgreed} attempted={attempted} goStart={goStart}/>}
        {view==="questions"&&curStd&&curSec&&(
          <QPage active={active} curStd={curStd} curSec={curSec} stdIdx={stdIdx} secIdx={secIdx}
            answers={answers} answer={answer} prog={prog} doneQ={doneQ} totalQ={totalQ}
            goNext={goNext} goPrev={goPrev} isFirst={isFirst} isLast={isLast} secDone={secDone}
            larmklass={larmklass} setLarmklass={setLarmklass} swqNiva={swqNiva} setSwqNiva={setSwqNiva}
            jump={(si,qi)=>{setStdIdx(si);setSecIdx(qi);window.scrollTo(0,0);}}/>
        )}
        {view==="results"&&<ReportPage active={active} answers={answers} company={company} larmklass={larmklass} swqNiva={swqNiva} restart={()=>setShowRestart(true)} back={()=>{setView("questions");window.scrollTo(0,0);}}/>}
        {showRestart&&(
          <div className="modal-overlay" onClick={()=>setShowRestart(false)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <h3>Börja om från början?</h3>
              <p>Alla svar och val raderas permanent.</p>
              <div className="modal-btns">
                <button className="btn btn-secondary" onClick={()=>setShowRestart(false)}>Avbryt</button>
                <button className="btn btn-primary" onClick={confirmRestart}>Ja, börja om</button>
              </div>
            </div>
          </div>
        )}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
