<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kartlägg er beredskap inför SBSC-certifiering inom brandlarm, inbrottslarm, kamerabevakning, ledningssystem och ISO.">
<title>SBSC — Certifieringsberedskap</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--amber:#FFA300;--black:#101820;--white:#fff;--page:#F8F9FA;--border:#E8E9EC;--muted:#6B6C74;--faint:#F2F3F5;--green:#1B6B3F;--red:#C03535;--blue:#2A5A8C;--shadow-sm:0 1px 3px rgba(0,0,0,.07);--r:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:"Open Sans",system-ui,sans-serif;background:var(--page);color:var(--black);line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
button:disabled{opacity:.38;cursor:not-allowed;}
.site-header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.site-header::after{content:"";display:block;height:3px;background:var(--amber);}
.hdr-inner{max-width:960px;margin:0 auto;padding:0 32px;height:96px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{height:80px;width:auto;}
.hdr-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}
.shell{max-width:860px;margin:0 auto;padding:48px 24px 80px;}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);padding:28px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.page-intro{text-align:center;padding:0 0 40px;}
.chip{display:inline-block;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 14px;border-radius:2px;margin-bottom:20px;}
.page-intro h1{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.5px;margin-bottom:12px;}
.page-intro p{font-size:16px;color:var(--muted);max-width:480px;margin:0 auto;}
.field-label{font-size:13px;font-weight:700;color:var(--black);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.req-star{color:var(--red);font-size:16px;line-height:1;}
.text-input{width:100%;padding:13px 16px;font-size:15px;font-weight:600;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.text-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.field-error{font-size:12px;color:var(--red);font-weight:600;margin-top:6px;}
.privacy-note{display:flex;align-items:flex-start;gap:10px;background:#EEF4FB;border:1px solid #C8DCF0;border-radius:6px;padding:12px 14px;margin-top:14px;}
.privacy-note p{font-size:12px;color:var(--blue);font-weight:500;line-height:1.55;}
.cert-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.cert-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .12s,background .12s;}
.cert-row:hover{border-color:var(--amber);}
.cert-row.active{border-color:var(--amber);background:#FFFBF0;}
.cert-check{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .12s;}
.cert-row.active .cert-check{background:var(--amber);border-color:var(--amber);color:var(--black);}
.cert-name{font-weight:700;font-size:14px;margin-bottom:2px;}
.cert-badge{font-size:10px;font-weight:700;background:var(--faint);color:var(--muted);padding:2px 7px;border-radius:2px;margin-left:6px;}
.cert-row.active .cert-badge{background:var(--amber);color:var(--black);}
.cert-desc{font-size:12px;color:var(--muted);}
.cert-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:10px 0 4px;}
.disc-check-wrap{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--faint);border:1.5px solid var(--border);border-radius:6px;margin-top:14px;cursor:pointer;transition:border-color .12s,background .12s;}
.disc-check-wrap:hover{border-color:var(--amber);}
.disc-checkbox{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .12s;background:var(--white);}
.disc-checked{background:var(--amber)!important;border-color:var(--amber)!important;color:var(--black)!important;}
.disc-check-text{font-size:12px;color:var(--black);line-height:1.6;}
.disc-check-text strong{display:block;font-size:13px;font-weight:800;margin-bottom:4px;}
.validation-box{margin-top:14px;padding:14px 16px;background:#FEF3E2;border:1px solid #FFD580;border-radius:6px;}
.validation-title{font-size:13px;font-weight:800;margin-bottom:8px;}
.validation-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#7A4800;margin-bottom:4px;}
.v-num{width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-row{display:flex;gap:10px;margin-top:18px;}
.stat{flex:1;background:var(--faint);border-radius:6px;padding:12px 14px;text-align:center;}
.stat-n{font-size:18px;font-weight:800;}
.stat-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.btn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;}
.btn{padding:11px 24px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;font-family:inherit;transition:all .12s;border:2px solid transparent;}
.btn-primary{background:var(--amber);color:var(--black);border-color:var(--amber);}
.btn-primary:hover:not(:disabled){background:#E89300;border-color:#E89300;}
.btn-secondary{background:var(--white);color:var(--black);border-color:var(--black);}
.btn-ghost{font-size:13px;font-weight:600;color:var(--muted);}
.btn-ghost:hover:not(:disabled){color:var(--black);}
.progress-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;margin-bottom:18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.progress-label{font-weight:700;}
.progress-count{color:var(--muted);}
.progress-track{height:4px;background:var(--faint);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .3s ease;}
.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.section-tab{padding:5px 12px;background:var(--white);border:1.5px solid var(--border);border-radius:20px;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;transition:all .1s;}
.section-tab.active{background:var(--black);color:var(--white);border-color:var(--black);}
.section-tab.done{border-color:var(--green);color:var(--green);}
.tab-dot{width:5px;height:5px;border-radius:50%;background:var(--border);}
.section-tab.active .tab-dot{background:var(--amber);}
.section-tab.done .tab-dot{background:var(--green);}
.q-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:10px;}
.q-text{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:10px;}
.q-help-inline{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.q-ref{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:12px;margin-top:-10px;}
.ans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ans-btn{padding:9px 4px;border:1.5px solid var(--border);border-radius:4px;font-size:11px;font-weight:700;text-align:center;background:var(--white);color:var(--muted);cursor:pointer;transition:all .1s;line-height:1.3;font-family:inherit;}
.ans-btn:hover{border-color:var(--black);color:var(--black);}
.ans-green{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important;}
.ans-amber{background:var(--amber)!important;color:var(--black)!important;border-color:var(--amber)!important;}
.ans-red{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important;}
.ans-blue{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important;}
.lms-warning{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;margin:12px 0 4px;background:#FEF9EC;border:1.5px solid #FFD580;border-radius:6px;font-size:12px;color:#7A4800;line-height:1.6;}
.lms-warning-icon{flex-shrink:0;font-size:16px;margin-top:1px;}
.lms-warning strong{display:block;font-size:12px;font-weight:800;color:#5A3200;margin-bottom:3px;}
.cert-switcher{display:flex;gap:0;margin-bottom:16px;background:var(--faint);border:1px solid var(--border);border-radius:6px;padding:3px;}
.cert-switch-btn{flex:1;padding:7px 12px;font-size:12px;font-weight:700;border-radius:4px;cursor:pointer;font-family:inherit;background:none;border:none;color:var(--muted);transition:all .15s;text-align:center;}
.cert-switch-btn.active{background:var(--white);color:var(--black);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.cert-switch-btn.done{color:var(--green);}
.report-banner{border-radius:var(--r);padding:26px 30px;margin-bottom:14px;background:var(--black);color:var(--white);border-left:5px solid var(--amber);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.banner-label{font-size:10px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.banner-company{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.banner-meta{font-size:12px;color:#8A8B91;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:6px;}
.banner-score-label{font-size:10px;color:#8A8B91;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;text-align:right;}
.banner-score{font-size:54px;font-weight:800;line-height:1;letter-spacing:-2px;}
.banner-score em{color:var(--amber);font-style:normal;}
.kpi-row{display:flex;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}
.kpi-cell{flex:1;padding:16px 20px;border-right:1px solid var(--faint);}
.kpi-cell:last-child{border-right:none;}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.kpi-value{font-size:15px;font-weight:700;line-height:1.3;}
.kpi-amber{color:var(--amber);}
.summary-box{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;border-left:4px solid var(--amber);}
.summary-box-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--amber);margin-bottom:8px;}
.summary-box-text{font-size:14px;line-height:1.75;color:var(--black);}
.cert-section{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:18px;overflow:hidden;}
.cert-head{padding:15px 22px;display:flex;align-items:center;justify-content:space-between;border-left:4px solid var(--amber);background:#FFFBF0;}
.cert-head h3{font-size:16px;font-weight:800;margin-bottom:2px;}
.cert-head-reg{font-size:11px;color:var(--muted);}
.cert-head-score{font-size:30px;font-weight:800;letter-spacing:-1px;}
.cert-body{padding:22px;}
.spider-wrap{display:flex;justify-content:center;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--faint);}
.bar-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--faint);}
.bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
.bar-label{width:185px;font-size:12px;font-weight:600;flex-shrink:0;}
.bar-track{flex:1;height:7px;background:var(--faint);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-pct{width:38px;text-align:right;font-size:12px;font-weight:700;}
.gap-section h4{font-size:13px;font-weight:800;margin-bottom:12px;}
.gap-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--faint);}
.gap-row:first-of-type{border-top:none;padding-top:0;}
.gap-badge{flex-shrink:0;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:2px;margin-top:2px;}
.badge-hi{background:#FAEAEA;color:var(--red);}
.badge-mi{background:#FFF3DC;color:#7A4800;}
.badge-uk{background:#EEF4FB;color:var(--blue);}
.gap-body{flex:1;}
.gap-title{font-weight:700;font-size:13px;margin-bottom:2px;}
.gap-meta{font-size:11px;color:var(--muted);margin-bottom:6px;}
.gap-action-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:3px;}
.gap-action{font-size:12px;color:var(--muted);line-height:1.6;padding:8px 12px;background:var(--faint);border-radius:4px;border-left:3px solid var(--amber);}
.gap-none{text-align:center;padding:12px;font-size:13px;font-weight:700;color:var(--green);}
.disclaimer{font-size:11px;color:var(--muted);line-height:1.7;margin-top:20px;padding:16px 18px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);border-left:3px solid var(--amber);}
.disclaimer strong{display:block;font-size:10px;color:var(--black);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:6px;}
.cta-block{margin-top:20px;padding:26px 30px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.cta-block h3{font-size:18px;font-weight:800;margin-bottom:4px;}
.cta-block p{font-size:13px;color:var(--muted);}
.cta-link{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:var(--black);padding:13px 26px;font-size:13px;font-weight:800;border-radius:4px;white-space:nowrap;border:2px solid var(--amber);font-family:inherit;transition:all .12s;text-decoration:none;}
.cta-link:hover{background:#E89300;border-color:#E89300;}
.toc-block{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;}
.toc-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px;}
.toc-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--faint);font-size:13px;}
.toc-item:last-child{border-bottom:none;}
.toc-item-name{font-weight:600;}
.toc-item-pct{font-weight:800;font-size:13px;min-width:42px;text-align:right;}
.toc-dots{flex:1;border-bottom:1.5px dotted var(--border);margin:0 10px;margin-bottom:2px;}
.gate-wrap{min-height:100vh;background:var(--page);display:flex;align-items:center;justify-content:center;padding:32px 16px;}
.gate-box{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px 36px;max-width:480px;width:100%;}
.gate-logo{height:52px;width:auto;margin-bottom:28px;}
.gate-title{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;}
.gate-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.gate-form{display:flex;flex-direction:column;gap:14px;}
.gate-field{display:flex;flex-direction:column;gap:6px;}
.gate-label{font-size:13px;font-weight:700;color:var(--black);}
.gate-input{padding:11px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.gate-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.gate-btn{background:var(--amber);color:var(--black);border:none;border-radius:4px;padding:13px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:4px;transition:background .12s;}
.gate-btn:hover{background:#E89300;}
.gate-btn:disabled{opacity:.5;cursor:not-allowed;}
.gate-privacy{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px;padding-top:14px;border-top:1px solid var(--faint);}
.gate-facts{display:flex;gap:8px;margin-bottom:24px;}
.gate-fact{flex:1;background:var(--faint);border-radius:6px;padding:10px 12px;text-align:center;}
.gate-fact-n{font-size:16px;font-weight:800;}
.gate-fact-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.gate-success{text-align:center;padding:32px 0;}
.gate-success-icon{width:56px;height:56px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;}
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,32,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;}
.modal-box{background:var(--white);border-radius:var(--r);padding:32px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.modal-box h3{font-size:18px;font-weight:800;margin-bottom:8px;}
.modal-box p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}
.print-header{display:none;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:3px solid var(--black);}
.print-header-logo{height:72px;width:auto;display:block;}
.print-header-right{text-align:right;}
.print-header-title{font-size:15px;font-weight:800;color:var(--black);display:block;margin-bottom:3px;}
.print-header-sub{font-size:11px;color:var(--muted);}
.skip-link{position:absolute;top:-100px;left:16px;background:var(--black);color:var(--white);padding:8px 16px;border-radius:4px;font-size:13px;font-weight:700;z-index:9999;transition:top .15s;}
.skip-link:focus{top:16px;}
@page{size:A4 portrait;margin:14mm 18mm;}
@media print{
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;box-sizing:border-box!important;}
.no-print{display:none!important;}
html{width:210mm!important;}
body{background:#fff!important;width:100%!important;margin:0!important;padding:0!important;font-size:11px!important;}
.site-header{display:none!important;}
.shell{padding:0!important;margin:0!important;width:100%!important;max-width:100%!important;}
.print-header{display:flex!important;}
.report-banner{padding:16px 18px!important;}
.banner-company{font-size:18px!important;}
.banner-score{font-size:38px!important;}
.toc-block{display:block!important;break-inside:avoid;margin-bottom:12px!important;}
.cert-section,.kpi-row,.summary-box,.cta-block,.report-banner{break-inside:avoid;page-break-inside:avoid;width:100%!important;}
.gap-row{break-inside:avoid;}
.bar-label{width:140px!important;}
.cert-body{padding:14px!important;}
.kpi-cell{padding:12px 14px!important;}
}
@media(max-width:640px){
.shell{padding:24px 14px 60px;}
.page-intro h1{font-size:26px;}
.ans-grid{grid-template-columns:repeat(2,1fr);}
.report-banner{flex-direction:column;}
.banner-score-label,.banner-score{text-align:left;}
.kpi-row{flex-direction:column;}
.kpi-cell{border-right:none;border-bottom:1px solid var(--faint);}
.kpi-cell:last-child{border-bottom:none;}
.cta-block{flex-direction:column;text-align:center;}
.bar-label{width:130px;font-size:11px;}
}

.guide-toggle{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;font-weight:700;color:var(--blue);background:#EEF4FB;border:1px solid #C8DCF0;border-radius:4px;padding:4px 10px;cursor:pointer;transition:all .12s;font-family:inherit;}
.guide-toggle:hover{background:#DBE9F8;}
.guide-box{margin-top:10px;padding:12px 14px;background:#F5F9FF;border:1px solid #C8DCF0;border-radius:6px;border-left:3px solid var(--blue);}
.guide-box-text{font-size:12px;color:#1a4a7a;line-height:1.75;}
.guide-action-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-top:10px;margin-bottom:4px;}
.guide-action{font-size:12px;color:var(--black);line-height:1.65;padding:9px 12px;background:var(--white);border-radius:4px;border-left:3px solid var(--amber);}
.lk-picker{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;}
.lk-picker-title{font-size:14px;font-weight:800;margin-bottom:4px;}
.lk-picker-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.lk-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.lk-opt{padding:12px 14px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;transition:all .12s;font-family:inherit;text-align:left;background:var(--white);}
.lk-opt:hover{border-color:var(--amber);}
.lk-opt.active{border-color:var(--amber);background:#FFFBF0;}
.lk-opt.disabled{opacity:.5;cursor:not-allowed;}
.lk-opt-name{font-size:13px;font-weight:800;display:block;margin-bottom:2px;}
.lk-opt-desc{font-size:11px;color:var(--muted);line-height:1.5;}
.lk-hänvisning{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;background:#F0F7EE;border:1.5px solid #A8D5A2;border-radius:var(--r);margin-top:8px;font-size:12px;color:#1B6B3F;line-height:1.65;}
.lk-opt-warn{border-color:#E8C4C4!important;background:#FEF5F5!important;}
.lk-opt-warn:hover{border-color:var(--red)!important;}
.lk-opt-warn.active{border-color:var(--red)!important;background:#FAEAEA!important;}
.lk-opt-warn .lk-opt-name{color:var(--red);}
.lk-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:6px;font-size:12px;font-weight:600;margin-bottom:14px;}
.lk-banner-1{background:#EEF4FB;color:#2A5A8C;border:1px solid #C8DCF0;}
.lk-banner-2{background:#F0F7EE;color:#1B6B3F;border:1px solid #A8D5A2;}
.lk-warn-box{background:#FEF9EC;border:1.5px solid #FFD580;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;font-size:13px;color:#7A4800;}
.lk-warn-box h4{font-size:14px;font-weight:800;margin-bottom:6px;}
.lk-warn-box p{line-height:1.65;}

</style>
</head>

const STANDARDS={
brandlarm:{
    id:"brandlarm",name:"Brandlarm",reg:"SBF 1008:3",
    desc:"Anläggarfirma brandlarm enligt SBF 1008:3",
    sections:[
      {id:"br_org",name:"Organisation & ekonomi",questions:[
        {id:"br_org_1",text:"Är företaget registrerat som juridisk person (t.ex. aktiebolag) inom EU/EES?",
         help:"SBF 1008:3 §4.2.1: anläggarfirman ska vara registrerad som juridisk person i Sverige — enskild firma, handelsbolag, aktiebolag m.fl. Registreringen kontrolleras av SBSC vid ansökan och vid periodisk uppföljning. En vilande registrering eller felaktig bolagsform kan diskvalificera.",action:"Kontrollera registreringsstatusen hos Bolagsverket. Säkerställ att bolaget är aktivt och att rätt verksamhetskod används.",actionPartial:"Kontrollera att registreringen är aktuell och att bolagsuppgifterna stämmer — t.ex. adress och firmatecknare."},
        {id:"br_org_2",text:"Är företaget fritt från betalningsanmärkningar, restförd moms och kvarstående skatteskulder?",
         help:"SBF 1008:3 §4.2.2: anläggarfirman ska ha ekonomisk bärighet lägst 'Kreditvärdig' (t.ex. UC eller Creditsafe) och vara fri från restförd moms och skatteskulder. SBSC kontrollerar detta vid ansökan. En skuld på skattekontot kan vara tillräcklig för avslag även om er kreditrating är god.",action:"Kontrollera kreditvärdigheten hos UC. Kontrollera skattekontot hos Skatteverket. Åtgärda eventuella restförda skulder.",actionPartial:"Gör en aktuell kreditupplysning och kontrollera skattekontot. Håll löpande koll via Skatteverkets e-tjänster."},
        {id:"br_org_3",text:"Har företaget en giltig ansvarsförsäkring som uppfyller kraven i AB eller ABT?",
         help:"SBF 1008:3 §4.2.3: ansvarsförsäkringen ska täcka skador som uppstår i samband med installatörsverksamheten och minst motsvara kraven i AB 04 eller ABT 06. Revisorerna begär skriftlig bekräftelse från försäkringsbolaget — att försäkringen 'finns' räcker inte om den inte täcker rätt verksamhet.",action:"Kontakta ert försäkringsbolag och begär skriftlig bekräftelse att ansvarsförsäkringen täcker brandlarmsinstallation och uppfyller AB 04/ABT 06.",actionPartial:"Kontrollera att befintlig försäkring specifikt täcker brandlarmsverksamhet och uppfyller AB/ABT-kraven. Be om ny bekräftelse om det är oklart."},
      ]},
      {id:"br_personal",name:"Personal & behörigheter",questions:[
        {id:"br_pers_1",text:"Finns en sakkunnig person med giltigt BIB-certifikat (SBF 1007:5) och minst 2 års allsidig erfarenhet inom brandlarm?",
         help:"SBF 1008:3 §4.3.1a: en Behörig Ingenjör Brandlarm (BIB) med giltigt SBSC-certifikat krävs. BIB ska ha minst 2 års dokumenterad branschrelevant erfarenhet och brandteknisk kunskap. Antal BIBs skalas med personalstyrkan (upp till 25 anst. = min 1 BIB). BIB ska ha firman som huvudarbetsgivare (minst 50% av arbetstiden).",action:"Identifiera lämplig person och stötta dem att genomgå BIB-certifiering via SBSC. Krav: 2 år erfarenhet och genomgången brandteknisk utbildning.",actionPartial:"Kontrollera att BIB-certifikatet är giltigt och inte snart löper ut. Kontrollera att BIB-skalningskravet är uppfyllt."},
        {id:"br_pers_2",text:"Har den sakkunniga personen dokumenterade befogenheter att styra brandlarmverksamheten?",
         help:"SBF 1008:3 §4.3.1a: BIBs ansvar och befogenheter ska vara dokumenterade. BIB ska ha reellt mandat att granska handlingar, underteckna anläggarintyg och stoppa ett projekt om det inte uppfyller kraven. En befattningsbeskrivning undertecknad av ledningen är det vanligaste sättet att dokumentera detta.",action:"Upprätta en befattningsbeskrivning för BIB med tydligt ansvarsområde och befogenheter — undertecknad av ledningen.",actionPartial:"Kontrollera att befogenhetsdokumentationen är aktuell och faktiskt speglar det mandat BIB har i praktiken."},
        {id:"br_pers_3",text:"Finns minst en projektör och en driftsättare med minst 2 års dokumenterad erfarenhet från brandlarmområdet?",
         help:"SBF 1008:3 §4.3.1c–d: utöver BIB krävs att firman har dokumenterad erfarenhet av projektering och installationsledning. En person med erfarenhet av projektering (ritningar, beräkningar) och en person med erfarenhet av installationsledning (planering, styrning av tekniker) ska finnas — det kan vara samma person som BIB.",action:"Identifiera vem som täcker projekterings- och installationsledningsrollerna. Dokumentera erfarenheten för respektive roll.",actionPartial:"Kontrollera att erfarenheten är tillräcklig och dokumenterad — en lista med genomförda projekt med beskrivna arbetsuppgifter räcker."},
        {id:"br_pers_4",text:"Är minst 3 personer tillsvidareanställda och täcker gemensamt alla funktioner: sakkunnig, projektör, driftsättare och servicetekniker?",
         help:"SBF 1008:3 §4.3.1: anläggarfirman ska ha minst 3 tillsvidareanställda (ej provanställda) och vara dessa personers huvudarbetsgivare. Alla fyra funktionerna ska vara täckta: BIB, projekteringsansvarig, installationsledare och montörer. Rollerna kan kombineras — en person kan ha fler roller om kompetensen finns.",action:"Kartlägg personalsituationen: räkna tillsvidareanställda (exkl. provanställda), verifiera att ni är huvudarbetsgivare och dokumentera att alla fyra funktionerna täcks.",actionPartial:"Dokumentera noggrant hur rollerna är fördelade per person — visa tydligt vem som täcker respektive funktion."},
      ]},
      {id:"br_materiel",name:"Materiel & dokumentation",questions:[
        {id:"br_mat_1",text:"Finns en förteckning över den materiel ni använder som visar att komponenterna uppfyller SBF 110?",
         help:"SBF 1008:3 §4.5.2: materiel ska uppfylla kraven i SBF 110 (norm för material till brandlarmanläggning). Ni ska ha en förteckning över de komponenter ni installerar med information om certifieringsstatus. Komponenter utan godkänd certifiering får inte användas utan dispens.",action:"Upprätta en förteckning över era komponenter med certifieringsinformation (produkttyp, tillverkare, certifieringsnummer).",actionPartial:"Uppdatera förteckningen om ni börjat använda nya produkter. Kontrollera att inga certifikat löpt ut."},
        {id:"br_mat_2",text:"Finns alla styrande dokument i SBF 1008:3 Bilaga 1 i senaste utgåva — inkl. revideringsblad?",
         help:"Bilaga 1 — inkl. SBF 110:8 (rev. maj 2024) och SBF 1007:5 (rev. feb 2025)",action:"Samla alla dokument i listan i senaste utgåva — skapa ett dokumentregister.",actionPartial:"Kontrollera att ni har senaste utgåvorna inklusive revideringsblad."},
        {id:"br_mat_3",text:"Finns dokumenterade rutiner för utfärdande av anläggarintyg — inklusive kontroll att SBF 110-krav och färdigställandekontroll är uppfyllda?",
         help:"SBF 1008:3 §4.6.1: anläggarintyget är det formella beviset på att anläggningen är utförd korrekt. Det ska utfärdas av BIB, innehålla specificerad information och överlämnas till kunden vid avprovning. En vanlig brist: intyget utfärdas men inte av BIB, eller överlämnas inte vid avprovning utan i efterhand.",action:"Ta fram en rutin och checklista för anläggarintygsprocessen — vem utfärdar, när och vad som krävs. Säkerställ att BIB undertecknar.",actionPartial:"Gå igenom er befintliga rutin mot kraven i §4.6.1 — säkerställ att BIB undertecknar och att överlämning sker vid avprovning."},
      ]},
      {id:"br_underhall",name:"Underhåll & serviceberedskap",questions:[
        {id:"br_und_1",text:"Kan ni påbörja felavhjälpning i en kundanläggning inom 2 arbetsdagar efter beställning?",
         help:"SBF 1008:3 §4.4.1: ni ska kunna påbörja servicearbete på plats och leverera reservdelar inom 2 helgfria dygn från felanmälan. Beredskapen ska hålla även under semesterperioder och vid hög belastning. Felanmälningsrutinen ska vara dokumenterad.",action:"Kartlägg serviceberedskapen — tekniker och reservdelar. Dokumentera felanmälningsrutinen med garanterad 2-dagarsresponstid.",actionPartial:"Kontrollera att beredskapen håller 2-dagarskravet i alla lägen — inkl. sommarsemester och sjukfrånvaro."},
        {id:"br_und_2",text:"Har ni ett reservdelsförråd — eget eller med leverantörsavtal — som håller responstiderna?",
         help:"SBF 1008:3 §4.4.2: ni ska ha tillgång till de reservdelar som krävs för att upprätthålla servicenivån. Typiska reservdelar: centralenheter, detektorer, knappar, strömförsörjningsenheter och kablar. Ett minimum-reservdelsförråd för de produkter ni installerar ska finnas.",action:"Gå igenom era vanligaste produkter och bygg ett minimumreservdelsförråd som täcker de mest kritiska komponenterna.",actionPartial:"Uppdatera förrådet om ni börjat installera nya produkter eller om befintliga reservdelar blivit svårtillgängliga."},
        {id:"br_und_3a",text:"Finns rutiner för att aktivt erbjuda kunden underhållsavtal senast vid garantitidens utgång?",
         help:"SBF 1008:3 §4.4.3: garantiservicen ska hanteras systematiskt. Ni ska notera garantitidens utgång vid installation, ha rutin för att informera kunden och erbjuda service- eller underhållsavtal. En vanlig brist är att garantiavslut och serviceerbjudanden inte hanteras strukturerat.",action:"Skapa en rutin: registrera garantitidens utgång per anläggning vid installation, sätt en påminnelse och skicka ett serviceerbjudande i god tid.",actionPartial:"Kontrollera att rutinen tillämpas konsekvent — och att påminnelser faktiskt skickas till kunder inom garantitiden."},
        {id:"br_und_3b",text:"Lämnas alltid en skriftlig servicerapport till kunden efter varje utfört underhålls- eller reparationsarbete?",
         help:"SBF 1008:3 §4.4.4: efter varje servicearbete ska kunden få en servicerapport som dokumenterar vad som gjordes, vilka delar som byttes och vem som utförde arbetet. Rapporten ska överlämnas till kunden — en kopia ska arkiveras med anläggningsdokumentationen.",action:"Ta fram en servicerapportmall och inför rutinen att alltid överlämna rapporten till kunden. Arkivera kopia i kundmappen.",actionPartial:"Kontrollera att servicerapporten används konsekvent vid alla servicearbeten — inkl. vid snabba utryckningar."},
      ]},
      {id:"br_kvalitet",name:"Kvalitetssystem & egenkontroll",lmsWarning:"brandlarm",questions:[
        {id:"br_kval_1",text:"Finns dokumenterade rutiner för de arbetsmoment SBF 1008:3 §4.7.1 kräver — projektering, anläggarintyg, överlämning, vidareutbildning m.m.?",
         help:"SBF 1008:3 §4.7.1: 13 obligatoriska rutiner krävs (a–m): anbudsgivning, projektering, inköp, installation, driftsättning, överlämning/kundutbildning, service, revisionsbesiktning, garantiservice, avvikelsehantering, internrevision, ledningens genomgång och dokumentstyrning. Alla 13 krävs — en saknad rutin är en brist vid revision.",action:"Gå igenom §4.7.1-listan punkt för punkt och kontrollera att rutiner finns för alla 13 arbetsmoment. Samla dem i en kvalitetshandbok.",actionPartial:"Kontrollera att befintliga rutiner är uppdaterade och faktiskt kända av personalen — inte bara dokumenterade för ledningens skull."},
        {id:"br_kval_2",text:"Finns ett system för dokumentstyrning — att rätt utgåva används och att ogiltiga versioner avlägsnas?",
         help:"SBF 1008:3 §4.7.2: alla interna dokument ska styras med versionsnummer och datum. Gamla versioner ska dras tillbaka så att personalen inte arbetar med inaktuella rutiner. En central plats (pärm eller digital mapp) för aktuella versioner rekommenderas.",action:"Inför ett versionssystem: märk varje dokument med version och datum. Definiera var aktuella versioner finns och hur gamla dras tillbaka.",actionPartial:"Gå igenom era dokument och kontrollera att inga gamla versioner är i omlopp. Uppdatera och samla aktuella versioner på en central plats."},
        {id:"br_kval_3",text:"Finns rutiner för att inköpt materiel och underleverantörer uppfyller era krav — inkl. bedömning av underleverantörer?",
         help:"SBF 1008:3 §4.7.3: leverantörer av material och underleverantörer ska bedömas och listas som godkända. Bedömningskriterierna ska vara dokumenterade. En underleverantör som anlitas utan att vara bedömd är en vanlig revisionsanmärkning.",action:"Ta fram en godkänd leverantörslista med dokumenterade bedömningskriterier. Dokumentera hur nya leverantörer bedöms och godkänns.",actionPartial:"Uppdatera leverantörslistan och kontrollera att bedömningskriterierna är relevanta — täcker de kvalitet, leveranssäkerhet och SBF 110-krav?"},
        {id:"br_kval_4",text:"Finns ett spårbarhetssystem — att kunna identifiera kundanläggningar och koppla anläggarintyg till handlingar?",
         help:"SBF 1008:3 §4.7.5: ett kundregister med tydlig koppling till anläggningsdokumentation ska finnas. Varje anläggning ska ha ett unikt ID och en komplett dokumentationsmapp med anläggarintyg, ritningar och kontrolljournaler. Revisorerna begär ofta att få se dokumentationen för specifika anläggningar.",action:"Skapa ett strukturerat kundregister med en mapp per anläggning (fysiskt eller digitalt) med unikt anläggnings-ID och komplett dokumentation.",actionPartial:"Gå igenom befintliga kundmappar och kontrollera att kopplingen mellan kundregister och anläggningsdokumentation är tydlig och komplett."},
        {id:"br_kval_5",text:"Arkiveras kopior av anläggarintyg, ritningar och väsentlig dokumentation i minst 10 år?",
         help:"SBF 1008:3 §4.7.6: arkivrutinen ska definiera vilka dokument som bevaras (anläggarintyg, ritningar, servicerapporter), hur länge (SBF kräver minst 10 år för anläggarintyg) och var (säker fysisk eller digital lagring). Backup ska finnas för digitalt material.",action:"Inför en arkivrutin: vilka dokument bevaras, hur länge (minst 10 år för anläggarintyg) och var. Säkerställ backup för digitalt material.",actionPartial:"Kontrollera att alla installationer från de senaste 10 åren finns arkiverade — och att backupen fungerar och testas."},
        {id:"br_kval_6",text:"Finns rutiner för avvikelsehantering och korrigerande åtgärder — inkl. uppföljning att åtgärderna fungerat?",
         help:"SBF 1008:3 §4.7.7: avvikelser — från kundreklamationer till interna fel och tillbud — ska hanteras systematiskt. Grundorsaken ska utredas och korrigerande åtgärder vidtas och följas upp. En vanlig brist är att avvikelser hanteras operativt men inte dokumenteras, eller att grundorsaken inte utreds.",action:"Inför ett avvikelseregister med kolumnerna: datum, beskrivning, grundorsak, korrigerande åtgärd, ansvarig och uppföljning.",actionPartial:"Kontrollera att avvikelsehanteringen täcker grundorsaksutredning — det räcker inte att åtgärda symptomet utan att förstå varför."},
        {id:"br_kval_7a",text:"Genomförs internrevision av kvalitetssystemet regelbundet — med dokumenterade fynd och korrigerande åtgärder?",
         help:"SBF 1008:3 §4.7.8: interna revisioner ska genomföras minst en gång per år och täcka alla rutiner och processer. Revisorn ska vara objektiv — inte revidera sin egna verksamhet. Revisionsresultat ska dokumenteras med protokoll och korrigerande åtgärder ska beslutas och följas upp.",action:"Planera en internrevision för det kommande året med definierat omfång, revisor och datum. Protokollför alltid med beslutade åtgärder.",actionPartial:"Kontrollera att revisionsprotokollen innehåller konkreta uppföljningsbeslut — och att åtgärderna faktiskt genomförts."},
        {id:"br_kval_7b",text:"Genomför ledningen en formell genomgång av kvalitetssystemet minst en gång per år — med dokumenterat protokoll?",
         help:"SBF 1008:3 §4.7.1: ledningens genomgång ska genomföras minst en gång per år. Agendan ska täcka: status på föregående åtgärder, avvikelserapporter, kundreklamationer, revisionsresultat, resursbehov och policy. Protokollet ska dokumentera beslutade åtgärder med ansvarig och tidplan.",action:"Schemalägg ledningens genomgång och fastställ en fast agenda som täcker alla §4.7.1-punkter. Protokollför alltid med beslut och tidplaner.",actionPartial:"Kontrollera att protokollet täcker alla obligatoriska punkter — och att beslutade åtgärder faktiskt följts upp sedan föregående genomgång."},
      ]},
    ]
  },

  inbrottslarm:{
  id:"inbrottslarm",name:"Inbrottslarm",reg:"SSF 1015:3",
  desc:"Anläggarfirma inbrottslarm larmklass 1–2 enligt SSF 1015:3",
  larmklassVal:true,
  sections:[
    {id:"inb_org",name:"Organisation & tillstånd",questions:[
      {id:"inb_org_1",text:"Har företaget polismyndighetens tillstånd enligt larmlagen (SFS 1983:1097) att yrkesmässigt bedriva installation av centralanslutna inbrottslarmanläggningar?",
       help:"SSF 1015:3 §4.1.1: tillståndet är ett absolut grundkrav och måste finnas innan ansökan lämnas in. Söks hos Polismyndigheten — krävs för all yrkesmässig installation av centralanslutna inbrottslarm.",
       action:"Ansök om tillstånd hos Polismyndigheten enligt larmlagen (SFS 1983:1097). Kräver bl.a. att ansvariga personer är ostraffade.",
       actionPartial:"Kontrollera att tillståndet är giltigt och avser rätt verksamhet och adress. Uppdatera vid lokalbyte — SBSC ska underrättas utan dröjsmål."},
      {id:"inb_org_2",text:"Är företaget en i Sverige registrerad juridisk person med ekonomisk bärighet minst 'Kreditvärdig' och fritt från restförd moms och skatteskulder?",
       help:"SSF 1015:3 §4.1.1 och tolkningsdokument 2017: anläggarfirman ska vara registrerad i Sverige och uppvisa ekonomisk bärighet motsvarande lägst 'Kreditvärdig' (t.ex. UC eller Creditsafe).",
       action:"Kontrollera er kreditvärdighet hos UC. Åtgärda eventuella skatteskulder. Registrera bolaget hos Bolagsverket om det inte är gjort.",
       actionPartial:"Gör en aktuell kreditupplysning. Kontrollera hos Skatteverket att inga restförda skulder finns."},
      {id:"inb_org_3",text:"Har företaget en giltig ansvarsförsäkring relevant för inbrottslarmsverksamheten?",
       help:"SSF 1015:3 §4.3.1: försäkringen ska täcka skador som uppstår i installations- och servicearbetet. Be försäkringsbolaget bekräfta att täckningen gäller inbrottslarmsverksamhet.",
       action:"Kontakta ert försäkringsbolag och teckna ansvarsförsäkring anpassad till inbrottslarmsverksamhet. Be om skriftligt intyg.",
       actionPartial:"Gå igenom att befintlig försäkring täcker inbrottslarmsarbete specifikt. Be om skriftlig bekräftelse."},
      {id:"inb_org_4a",text:"Finns en dokumenterad rutin för att kontrollera att all personal med tillgång till anläggningsdokumentation är ostraffad?",
       help:"SSF 1015:3 §4.4.1 och SSF 1016: rutinen ska encompass all personal som hanterar anläggningsdokumentation — inte bara den behörige ingenjören. Kontroll via belastningsregistret.",
       action:"Ta fram en skriftlig rutin: (1) vilka roller, (2) kontroll vid anställning och minst vartannat år, (3) ansvarig person.",
       actionPartial:"Gå igenom att rutinen täcker alla berörda roller — inte bara nyanställda eller den behörige ingenjören."},
      {id:"inb_org_4b",text:"Genomförs personalkontroll med belastningsregisterutdrag för all berörd personal minst vartannat år — med dokumentation av datum och vilka som kontrollerats?",
       help:"SSF 1015:3 §4.4.1: kontrollen ska genomföras minst vartannat år — inte bara vid nyanställning. Dokumentation av genomförda kontroller är ett krav revisorer specifikt efterfrågar.",
       action:"Schemalägg en kontrollcykel. Begär nya utdrag för de som passerat tvåårsgränsen.",
       actionPartial:"Kontrollera att intervallet vartannat år faktiskt hålls för all berörd personal."},
    ]},
    {id:"inb_personal",name:"Behörig ingenjör",questions:[
      {id:"inb_pers_1",text:"Finns minst en certifierad behörig ingenjör inbrottslarm (SSF 1016) med giltigt certifikat och anläggarfirman som sin huvudarbetsgivare?",
       help:"SSF 1015:3 §4.6.1: den behörige ingenjören ska ha giltigt SSF 1016-certifikat, vara ostraffad och ha firman som sin huvudarbetsgivare (minst 50%). Antal BIs skalas med personalstyrkan: upp till 25 anst. = min 1 BI.",
       action:"Identifiera en lämplig person och ansök om SSF 1016-certifiering via SBSC. Krav: el/teleteknisk gymnasieutbildning, 2 år praktisk erfarenhet, kunskaper i SSF 130 och SSF 1015.",
       actionPartial:"Kontrollera att certifikatet är giltigt och att skalningskravet (antal BIs/antal anställda) är uppfyllt."},
      {id:"inb_pers_2",text:"Har den behörige ingenjören el/teleteknisk gymnasieutbildning och minst 2 års praktisk erfarenhet av inbrottslarmsarbete de senaste 2 åren?",
       help:"SSF 1016 §4.1–4.2: praktisk erfarenhet = projektering, installation, service och underhåll som väsentligaste del av arbetet under senaste 2-årsperioden.",
       action:"Dokumentera utbildning och erfarenhet: samla utbildningsintyg och en beskrivning av arbetsuppgifterna de senaste 2 åren.",
       actionPartial:"Gå igenom om erfarenheten är tillräckligt dokumenterad för SSF 1016-kraven."},
      {id:"inb_pers_3",text:"Har den behörige ingenjören dokumenterade befogenheter att granska handlingar, underteckna anläggarintyg och ansvara för att projektering och installation sker enligt SSF 130?",
       help:"SSF 1015:3 §4.6.3: ansvar och befogenheter ska vara dokumenterade. Den behörige ingenjören ska ha reellt mandat att stoppa eller kräva komplettering av ett uppdrag.",
       action:"Upprätta ett undertecknat dokument från ledningen med den behörige ingenjörens ansvar och befogenheter.",
       actionPartial:"Kontrollera att dokumentationen är aktuell och speglar de befogenheter personen har i praktiken."},
      {id:"inb_pers_4",
       lkText:{lk1:"Finns minst 1 servicetekniker med nödvändig kompetens för inbrottslarmsinstallation och service?",lk2:"Finns minst 2 servicetekniker med nödvändig kompetens för inbrottslarmsinstallation och service?"},
       text:"Finns tillräckligt antal servicetekniker med nödvändig kompetens?",
       help:"SSF 1015:3 §5.4 (LK1) och §6.4 (LK2): larmklass 1 kräver minst 1 servicetekniker. Larmklass 2 kräver minst 2 servicetekniker. Dokumentera kompetensen per person.",
       action:"Kartlägg personalsituationen. Dokumentera serviceteknikernas kompetens och erfarenhet.",
       actionPartial:"Om ni siktar på larmklass 2 — kontrollera att ni har minst 2 servicetekniker. Dokumentera kompetensen."},
    ]},
    {id:"inb_kvalitet",name:"Kvalitetssystem",lmsWarning:"inbrottslarm",questions:[
      {id:"inb_kval_1",
       lkText:{lk1:"Har företaget ett implementerat kvalitetssystem — minst SSF 1044 SWE Q Nivå 1, alternativt ISO 9001 eller FR 2000?",lk2:"Har företaget ett implementerat kvalitetssystem — minst SSF 1044 SWE Q Nivå 2, alternativt ISO 9001 eller FR 2000?"},
       text:"Har företaget ett implementerat kvalitetssystem på rätt nivå för er larmklass?",
       help:"SSF 1015:3 §5.2 (LK1) och §6.2 (LK2): LK1 kräver SWE Q Nivå 1. LK2 kräver SWE Q Nivå 2. Implementerat = upprättat, dokumenterat, infört och underhållet.",
       action:"Välj rätt kvalitetssystemnivå för er larmklass. Starta med att dokumentera de rutiner SSF 1044 kräver. Utse en kvalitetsansvarig.",
       actionPartial:"Gå igenom att kvalitetssystemet faktiskt är implementerat — inte bara dokumenterat."},
      {id:"inb_kval_2",
       lkText:{lk1:"Genomförs ledningens genomgång av kvalitetssystemet regelbundet? (Rekommenderas för LK1, obligatoriskt för LK2.)",lk2:"Genomförs ledningens genomgång av kvalitetssystemet minst en gång per kalenderår? (Obligatoriskt för LK2.)"},
       text:"Genomförs ledningens genomgång av kvalitetssystemet?",
       help:"SSF 1015:3 §6.2.2: för LK2 är ledningens genomgång obligatorisk — dokumenterat minst en gång per kalenderår. Ska täcka systemets funktion och resultat. För LK1 rekommenderas men är inte obligatoriskt.",
       action:"Schemalägg ett årligt möte med ledningen. Protokollför med datum, deltagare, fynd och beslutade åtgärder.",
       actionPartial:"Kontrollera att protokollet täcker alla obligatoriska punkter och att åtgärder följts upp."},
    ]},
    {id:"inb_verksamhet",name:"Verksamhet & service",questions:[
      {id:"inb_verk_1",
       lkText:{lk1:"Kan ni redovisa minst 5 installerade inbrottslarmanläggningar med anläggarintyg (SSF 1058) överlämnade vid avprovning under senaste 12 månader?",lk2:"Kan ni redovisa minst 5 LK1-anläggningar och minst 2 LK2-anläggningar med anläggarintyg (SSF 1058) under senaste 12 månader?"},
       text:"Kan ni redovisa tillräckligt antal installerade anläggningar med anläggarintyg senaste 12 månader?",
       help:"SSF 1015:3 §4.5.1 och SSF 130 §8.2: anläggarintyget ska utfärdas på SSF 1058-mallen och överlämnas vid avprovning. LK1: minst 5 st. LK2: ytterligare minst 2 LK2-anläggningar.",
       action:"Gå igenom projekthistoriken senaste 12 månader och lista alla installationer med anläggarintyg på SSF 1058-mallen.",
       actionPartial:"Kontrollera att ni använder senaste SSF 1058-utgåvan och att intyg överlämnas vid avprovning."},
      {id:"inb_verk_5a",text:"Finns rutiner för att ge kunden utbildning vid varje överlämning — täckande minimiinnehållet i SSF 130 Bilaga F?",
       help:"SSF 130 §7 och Bilaga F: kundutbildning vid överlämning är krav. Minimiinnehåll: till- och frånkoppling, återställning, bortkoppling av adress, larmlagen och kontrolljournal.",
       action:"Ta fram en rutin och checklista för kundutbildning vid överlämning baserad på SSF 130 Bilaga F.",
       actionPartial:"Kontrollera att utbildningen genomförs vid varje överlämning och täcker alla punkter i Bilaga F."},
      {id:"inb_verk_5b",text:"Dokumenteras kundutbildningen med uppgift om vem som deltog och vem som genomförde den — arkiveras med anläggningsdokumentationen?",
       help:"SSF 130 §7 och Bilaga F: utbildningen ska dokumenteras. SSF 130 Bilaga F är blanketten som ska användas och arkiveras med anläggarintyget.",
       action:"Använd SSF 130 Bilaga F som utbildningsblankett. Låt kunden bekräfta med signatur och arkivera med anläggarintyget.",
       actionPartial:"Kontrollera att blanketten fylls i och arkiveras — inte bara att utbildningen sker muntligt."},
      {id:"inb_verk_2a",
       lkText:{lk1:"Kan företaget ta emot och bekräfta felanmälan dygnet runt — inom 24 timmar — och dokumenteras bekräftelserna?",lk2:"Kan företaget ta emot och bekräfta felanmälan dygnet runt — inom 12 timmar — och dokumenteras bekräftelserna?"},
       text:"Kan företaget ta emot och bekräfta felanmälan dygnet runt med korrekt responstid?",
       help:"SSF 1015:3 §5.5.1 (LK1) och §6.5.1 (LK2): felanmälan ska mottas och bekräftas dygnet runt, 7 dagar. LK1: inom 24 timmar. LK2: inom 12 timmar. Bekräftelsen ska dokumenteras.",
       action:"Säkerställ mottagningsfunktion dygnet runt. Inför system för att dokumentera felanmälan och bekräftelse med tidsstämpel.",
       actionPartial:"Kontrollera att bekräftelserna sker inom rätt tidsgräns och dokumenteras — inkl. nattetid och helger."},
      {id:"inb_verk_2b",
       lkText:{lk1:"Finns rutiner för regelbunden anläggningskontroll hos kund — minst vart tredje kalenderår?",lk2:"Finns rutiner för regelbunden anläggningskontroll hos kund — minst en gång per kalenderår med högst 15 månaders mellanrum?"},
       text:"Finns rutiner för regelbunden anläggningskontroll med rätt intervall för er larmklass?",
       help:"SSF 130 §8.11: LK1: minst vart 3:e kalenderår. LK2: minst en gång per kalenderår med högst 15 månaders mellanrum. Kontrollen dokumenteras i kontrolljournalen.",
       action:"Upprätta ett schema för anläggningskontroller per kund baserat på larmklass.",
       actionPartial:"Kontrollera att inga LK2-kunder missar den årliga kontrollen."},
      {id:"inb_verk_3",
       lkText:{lk1:"Kan service påbörjas på plats och reservdelar levereras inom 2 helgfria dygn från bekräftad felanmälan?",lk2:"Kan service påbörjas på plats och reservdelar levereras inom 1 helgfritt dygn (LK2-anläggningar) från bekräftad felanmälan?"},
       text:"Kan service påbörjas på plats inom korrekt responstid för er larmklass?",
       help:"SSF 1015:3 §5.5.2 (LK1) och §6.5.2–6.5.3 (LK2): LK1: 2 helgfria dygn. LK2: 1 helgfritt dygn för LK2-anläggningar, 2 dygn för LK1-anläggningar.",
       action:"Kartlägg serviceberedskap och reservdelssituation. Dokumentera hur ni säkerställer rätt personal och delar.",
       actionPartial:"Testa om beredskapen håller tidskravet i alla lägen — inkl. semestertider och hög belastning."},
      {id:"inb_verk_4",text:"Installerar ni materiel som uppfyller kraven i SSF 1014 (Norm för materiel till inbrottslarmanläggning)?",
       help:"SSF 1015:3 §5.7.1 och §6.7.1: all materiel ska uppfylla SSF 1014 — komponenter ska vara testade och klassificerade enligt t.ex. EN 50131-serien.",
       action:"Gå igenom ert sortiment och säkerställ att ni använder SSF 1014-godkänd materiel. Ta fram en produktlista med klassificeringsinformation.",
       actionPartial:"Uppdatera produktlistan om ni börjat använda nya produkter. Kontrollera att klassificeringen är giltig."},
    ]},
    {id:"inb_lokaler",name:"Lokaler & dokumentation",questions:[
      {id:"inb_lok_1",lkOnly:"lk2",
       text:"Har firmans lokaler mekaniskt inbrottsskydd (SSF 200 SK1), inbrottslarm LK2 (SSF 130) och larmöverföring LK3 (SSF 114) med två alternativa vägar? (Krav för LK2.)",
       help:"SSF 1015:3 §6.6: för LK2 krävs: (1) mekaniskt skydd SK1 enligt SSF 200, (2) inbrottslarm LK2, (3) larmöverföring LK3 med två alternativa vägar. Det tredje kravet missas ofta.",
       action:"Låt en behörig ingenjör göra en genomgång av era lokaler mot alla tre kraven. Dokumentera med anläggarintyg.",
       actionPartial:"Kontrollera specifikt larmöverföringen — LK3 med två alternativa vägar är det vanligast förbisedda kravet."},
      {id:"inb_lok_2",text:"Förvaras anläggningsdokumentation i godkänt säkerhetsskåp (SS 3492) med punktskydd — förankrat om det väger under 150 kg?",
       help:"SSF 1015:3 §4.9.1: anläggningsdokumentation ska förvaras i säkerhetsskåp klassificerat enligt SS 3492 med punktskydd. Skåp under 150 kg ska vara förankrat.",
       action:"Skaffa ett godkänt säkerhetsskåp som uppfyller SS 3492 med punktskydd. Förankra det om vikten understiger 150 kg.",
       actionPartial:"Kontrollera att befintligt skåp uppfyller SS 3492 med punktskydd — inte alla säkerhetsskåp gör det."},
      {id:"inb_lok_3a",text:"Finns rutiner för att registrera och kontrollera alla besökare i dokumentationsrummet — och eskorteras besökare alltid?",
       help:"SSF 1015:3 §4.8.1: besökare ska registreras med namn, syfte och tid. Besökare ska eskorteras och får aldrig lämnas ensamma med anläggningsdokumentationen.",
       action:"Inför besöksrutin: (1) Alla besökare registreras. (2) Besökare eskorteras alltid. (3) Besöksloggen arkiveras.",
       actionPartial:"Kontrollera att rutinen tillämpas konsekvent — även för städpersonal, hantverkare och externa IT-tekniker."},
      {id:"inb_lok_3b",text:"Är tillträdet till dokumentationsrummet tekniskt begränsat — t.ex. via kodlås, passerkort eller låst dörr med begränsad nyckeltillgång?",
       help:"SSF 1015:3 §4.8.1: utöver besöksrutiner ska tillträdet vara tekniskt begränsat. En policy räcker inte — det krävs en teknisk mekanism.",
       action:"Inför teknisk tillträdeskontroll: kodlås, passersystem eller låst dörr med begränsad nyckeltillgång.",
       actionPartial:"Kontrollera att den tekniska lösningen faktiskt begränsar tillträdet. Hur många har tillgång och ses listan regelbundet?"},
      {id:"inb_lok_4",text:"Finns rutiner för att förvara, skydda och rekonstruera kundregister, anläggningshandlingar och programvara till datorbaserade system?",
       help:"SSF 1015:3 §4.10.1: dokumenterade rutiner för hur kundregister och anläggningsdokumentation skyddas och kan rekonstrueras.",
       action:"Ta fram en rutin: var dokument förvaras, hur backup genomförs och hur rekonstruktion sker. Backup ska förvaras på annan plats.",
       actionPartial:"Gå igenom om backup-rutinen faktiskt testas regelbundet. Kontrollera att digitalt lagrad dokumentation uppfyller Bilaga A-kraven."},
    ]},
  ]
},
kamerabevakning:{
    id:"kamerabevakning",name:"Kamerabevakning",reg:"SSF 1061:3",
    desc:"Anläggarfirma kamerabevakningssystem CCTV enligt SSF 1061:3",
    sections:[
      {id:"kam_org",name:"Organisation & ekonomi",questions:[
        {id:"kam_org_1",text:"Är företaget registrerat i Sverige med ekonomisk bärighet minst 'Kreditvärdig' och fritt från skatteskulder?",
         help:"SSF 1061:3 §4.1.1: anläggarfirman ska vara registrerad som juridisk person i Sverige och uppvisa kreditvärdighet lägst 'Kreditvärdig' (UC/Creditsafe). Restförd moms eller skatteskuld diskvalificerar — SBSC kontrollerar vid ansökan.",action:"Kontrollera er kreditvärdighet hos UC eller Creditsafe. Åtgärda eventuella skulder hos Skatteverket.",actionPartial:"Gör en aktuell kreditupplysning och kontrollera att inga restförda skulder finns."},
        {id:"kam_org_2",text:"Har företaget en giltig ansvarsförsäkring som minst motsvarar kraven i AB 04 eller ABT 06?",
         help:"SSF 1061:3 §4.1.2: ansvarsförsäkringen ska täcka skador som uppstår vid installation och service. AB 04 och ABT 06 är standardavtalen för bygg- och installationsverksamhet. Be försäkringsbolaget bekräfta skriftligen.",action:"Kontakta ert försäkringsbolag och begär att ansvarsförsäkringen specificeras mot AB 04 eller ABT 06. Dokumentera skriftligen.",actionPartial:"Bekräfta att befintlig försäkring uppfyller AB 04/ABT 06-kraven skriftligt — revisorn kommer begära dokumentation."},
      ]},
      {id:"kam_verksamhet",name:"Verksamhet & dokumentation",questions:[
        {id:"kam_verk_1",text:"Kan företaget redovisa att det under senaste 12 månader projekterat och/eller installerat minst 2 kamerabevakningsanläggningar enligt SSF 1060?",
         help:"SSF 1061:3 §4.2.1: ni ska kunna uppvisa minst 2 projekterade och/eller installerade kamerabevakningsanläggningar inom senaste 12 månader. Anläggningarna ska vara utförda enligt SSF 1060 och dokumenterade med systemintyg. Revisorn granskar dessa som bevis på aktiv verksamhet.",action:"Gå igenom era uppdrag och identifiera installationer med utfärdade systemintyg. Samla dokumentationen tillgänglig för revision.",actionPartial:"Kontrollera att systemintyg är korrekt utfärdade och arkiverade per anläggning enligt SSF 1060."},
        {id:"kam_verk_2",text:"Har ni tillgång till alla referensdokument som SSF 1061:3 §2 kräver — inkl. SSF 1060, SSF 1062, GDPR och Kamerabevakningslagen?",
         help:"SSF 1061:3 §4.2.3: ni ska ha tillgång till de normer och regelverk som styr verksamheten — SSF 1060, SSF 1062, Kamerabevakningslagen och GDPR är centrala. Dessa ska vara i senaste utgåva. GDPR och lagstiftning förändras löpande — bevakning krävs.",action:"Samla alla referensdokument i senaste utgåva och skapa ett dokumentregister med versionsdatum.",actionPartial:"Kontrollera att ni har senaste utgåvorna. Kamerabevakningslagen och GDPR är levande lagstiftning — säkerställ löpande bevakning."},
        {id:"kam_verk_3",text:"Finns dokumenterade rutiner för att hjälpa kunden ta fram korrekt kravbild — säkerhetsanalys, behovsanalys och kravspecifikation?",
         help:"SSF 1061:3 §4.2.4: innan installation ska ni dokumenterat hjälpa kunden ta fram korrekt kravbild — säkerhetsanalys (vad ska skyddas?), behovsanalys (hur?) och kravspecifikation (tekniska krav). Dokumentation ska arkiveras per uppdrag.",action:"Ta fram en rutin för kundbehovsanalys med tre steg: säkerhetsanalys, behovsanalys och kravspecifikation. Skapa mallar för varje steg.",actionPartial:"Kontrollera att rutinen faktiskt tillämpas vid varje nytt kunduppdrag och att dokumentationen arkiveras."},
      ]},
      {id:"kam_kvalitet",name:"Kvalitetsledningssystem",lmsWarning:"kamerabevakning",questions:[
        {id:"kam_kval_1",text:"Har företaget ett dokumenterat och implementerat kvalitetsledningssystem — minst SSF 1044 SWE Q Nivå 2, alternativt ISO 9001 eller FR 2000?",
         help:"SSF 1061:3 §4.3.1–4.3.2: kamerabevakning kräver SSF 1044 SWE Q Nivå 2 (eller likvärdigt — ISO 9001 eller FR 2000). 'Implementerat' betyder att systemet är upprättat, dokumenterat, infört och underhållet — inte bara att dokument finns. Revisorerna undersöker om rutiner faktiskt efterlevs i praktiken.",action:"Gör vår SSF 1044-självdeklaration för att kartlägga gapen mot Nivå 2-kraven. Starta med att dokumentera de rutiner som saknas.",actionPartial:"Kontrollera att kvalitetssystemet är implementerat i kamerabevakningsverksamheten — revisorerna kontrollerar om rutinerna efterlevs i praktiken."},
        {id:"kam_kval_2",text:"Har den kvalitetsansvarige dokumenterad kompetens inom kvalitetsledningssystem — t.ex. internrevisionskurs?",
         help:"SSF 1061:3 §4.3.3: den kvalitetsansvarige ska ha dokumenterad kompetens för uppgiften. En internrevisionskurs (t.ex. ISO 9001-revision) är det vanligaste sättet att dokumentera kompetensen. Kompetensbeviset ska vara aktuellt.",action:"Identifiera vem som är kvalitetsansvarig och dokumentera kompetensen. Planera internrevisionskurs om den saknas.",actionPartial:"Kontrollera att kompetensbeviset är aktuellt, relevant och dokumenterat tillgängligt."},
        {id:"kam_kval_3",text:"Finns en dokumenterad och implementerad miljöpolicy?",
         help:"SSF 1061:3 §4.3.4: en dokumenterad miljöpolicy krävs. Policyn ska vara konkret och omsättas i praktiken — t.ex. källsortering, hantering av elektronikavfall, krav på leverantörer. Revisorerna kontrollerar att policyn inte bara är ett papper utan faktiskt påverkar hur ni arbetar.",action:"Ta fram en kort men konkret miljöpolicy med identifierade åtgärder och rutiner för hur efterlevnaden följs upp.",actionPartial:"Kontrollera att policyn faktiskt efterlevs i verksamheten och att efterlevnaden kan visas för en revisor."},
      ]},
      {id:"kam_personal",name:"Behörig ingenjör",questions:[
        {id:"kam_pers_1",text:"Finns minst en certifierad behörig ingenjör kamerabevakning (SSF 1062) med giltigt certifikat?",
         help:"SSF 1061:3 §4.4.1–4.4.2.1: minst en behörig ingenjör kamerabevakning med giltigt SSF 1062-certifikat krävs. Certifikatet utfärdas av SBSC och förnyas vart femte år. BI ska vara anställd med firman som huvudarbetsgivare. Antal BIs kan skalas med personalstyrkan — kontrollera skalningsreglerna.",action:"Kontrollera att minst en person har giltigt SSF 1062-certifikat och att ansvar och befogenheter är dokumenterade. Ansök via SBSC vid behov.",actionPartial:"Kontrollera att certifikatet är giltigt och inte inom 6 månader från förnyelse. Starta förnyelseprocess i tid."},
        {id:"kam_pers_2",text:"Har den behörige ingenjören dokumenterade befogenheter att granska/godkänna handlingar och underteckna systemintyget?",
         help:"SSF 1061:3 §4.4.2.2: den behörige ingenjören ska ha dokumenterade befogenheter — undertecknat av firman — att granska handlingar, godkänna projektering och underteckna systemintyg (SSF 1060). Befogenheterna ska vara reella: BI ska ha mandat att stoppa ett projekt om det inte uppfyller kraven.",action:"Upprätta ett befogenhetsdokument undertecknat av behörig firmaföreträdare som tydligt anger BIs mandat och ansvar.",actionPartial:"Kontrollera att befogenhetsdokumentationen är uppdaterad och speglar faktisk ansvarsfördelning."},
        {id:"kam_pers_3",text:"Finns en rutin och plan för hur kvalitetssäkringen hanteras om den behörige ingenjören plötsligt slutar eller sjukskrivs?",
         help:"SSF 1061:3 §4.4.3–4.4.5: certifieringen är knuten till att en kvalificerad BI finns. Sjukdom, dödsfall eller uppsägning av BI innebär att ni snabbt måste ha en plan. Möjligheter: inhyrd BI via avtal med annan firma, intern rekrytering eller tidsbegränsat dispens från SBSC. SBSC ska underrättas utan dröjsmål.",action:"Ta fram en kontinuitetsplan för BI-bortfall: dokumentera alternativ (extern BI-avtal, intern kandidat), och sätt rutin för att underrätta SBSC.",actionPartial:"Kontrollera att rutinen är känd av ledningen och kan aktiveras snabbt — inklusive vem som kontaktar SBSC."},
      ]},
      {id:"kam_ostraffade",name:"Ostraffad personal",questions:[
        {id:"kam_ostr_1",text:"Finns dokumenterad rutin för att kontrollera att all personal med tillgång till anläggningsdokumentation är ostraffad — tillämpas minst vartannat år?",
         help:"SSF 1061:3 §4.5: all personal med tillgång till anläggningsdokumentation ska vara ostraffad. Kontroll sker via belastningsregistret — krävs vid anställning och därefter minst vartannat år. 'Personal med tillgång' är bredare än bara BIs — tänk på städpersonal och administratörer med tillgång till arkiv.",action:"Ta fram en personalkontrollrutin med: vilka roller som omfattas, kontrollintervall, ansvarig och dokumentationsrutinen.",actionPartial:"Kontrollera att intervallet vartannat år verkligen hålls för all berörd personal — inte bara vid nyanställning."},
      ]},
      {id:"kam_service",name:"Service & felanmälan",questions:[
        {id:"kam_serv_1",text:"Kan företaget ta emot och bekräfta felanmälan inom 12 timmar på helgfri vardag — och dokumenteras bekräftelserna?",
         help:"SSF 1061:3 §4.7.1: felanmälan ska mottas och bekräftas inom 12 timmar på helgfria vardagar. 'Bekräftelse' innebär att kunden fått kvittens på att anmälan är mottagen — inte nödvändigtvis att felet åtgärdats. Bekräftelsen ska dokumenteras.",action:"Säkerställ rutin för att ta emot och bekräfta felanmälningar under helgfria vardagar med 12-timmarsgaranti. Dokumentera bekräftelserna systematiskt.",actionPartial:"Kontrollera att bekräftelserna faktiskt sker inom 12-timmarsgränsen och dokumenteras — inkl. vid hög belastning."},
        {id:"kam_serv_2",text:"Kan företaget påbörja service på plats inom ett helgfritt dygn från bekräftad felanmälan?",
         help:"SSF 1061:3 §4.7.2: service ska kunna påbörjas på plats inom ett helgfritt dygn från bekräftad felanmälan. Detta kräver tillräckliga personalresurser och dokumenterade reservdelsrutiner. Avvikande servicenivåer i kundavtal ska vara dokumenterade.",action:"Kartlägg serviceberedskapen — tillräckliga tekniker och reservdelar? Dokumentera hur ni garanterar ett dygns-responstid.",actionPartial:"Kontrollera att responstiden håller i praktiken — testa vid hög belastning. Dokumentera eventuella avvikande kundavtal."},
      ]},
      {id:"kam_lokaler",name:"Lokaler & dokumentation",questions:[
        {id:"kam_lok_1",text:"Har lokalerna mekaniskt inbrottsskydd (SSF 200 SK1), inbrottslarm LK2 (SSF 130) och larmöverföring LK3 (SSF 114) med två alternativa vägar?",
         help:"SSF 1061:3 §4.8.1–4.8.3: era lokaler ska ha tre skyddsåtgärder: (1) mekaniskt inbrottsskydd SK1 enligt SSF 200, (2) inbrottslarm LK2 enligt SSF 130, (3) larmöverföring LK3 med två alternativa vägar enligt SSF 114. Det tredje kravet — dubbla larmöverföringsvägar — är det som oftast saknas.",action:"Gå igenom lokalerna mot alla tre kraven systematiskt. Anlita behörig BI för inventering och dokumentera med anläggarintyg.",actionPartial:"Kontrollera specifikt larmöverföringen — LK3 med två alternativa vägar är det vanligast förbisedda kravet."},
        {id:"kam_lok_2",text:"Bedrivs enbart den egna kamerabevakningsverksamheten i certifieringens lokaler?",
         help:"SSF 1061:3 §4.8.4: certifieringens skyddsåtgärder gäller de lokaler där kamerabevakningsverksamheten bedrivs. Om andra verksamheter delar lokaler kan det skapa problem med tillträdesskydd och dokumentationsförvaring — kontrollera att avgränsningen är tydlig.",action:"Definiera tydligt vilka ytor som ingår i certifieringens omfattning och dokumentera avgränsningen.",actionPartial:"Kontrollera om annan verksamhet bedrivs i lokalerna och om det påverkar tillträdesskyddet."},
        {id:"kam_lok_3a",text:"Finns dokumenterade rutiner för att registrera och kontrollera alla besökare — eskorteras besökare alltid?",
         help:"SSF 1061:3 §4.9.1–4.9.2: alla besökare ska registreras och eskorteras. 'Besökare' inkluderar leverantörer, städpersonal och servicepersonal — inte bara externa gäster. Besöksloggen ska arkiveras. Revisorer kontrollerar om rutinen faktiskt tillämpas, inte bara om den finns dokumenterad.",action:"Inför besöksrutin: registrering i besökslogg, eskortering av alla besökare och arkivering av loggen.",actionPartial:"Kontrollera att rutinen tillämpas konsekvent — även för leverantörer och städpersonal. Fråga personalen om rutinen är känd."},
        {id:"kam_lok_3b",text:"Är tillträdet till lokalerna tekniskt begränsat via kodlås, passerkort eller låst dörr?",
         help:"SSF 1061:3 §4.9.2: tillträde till lokalerna ska vara tekniskt begränsat — kodlås, passerkort eller låst dörr med begränsad nyckelhantering. En vanlig olåst kontorsdörr uppfyller inte kravet. Listan över behöriga ska hållas aktuell.",action:"Installera teknisk tillträdeskontroll: kodlås, passersystem eller låst dörr med dokumenterad nyckelhantering.",actionPartial:"Kontrollera att lösningen faktiskt begränsar tillträdet och att listan över behöriga ses över regelbundet — vid nyanställning och avslut."},
        {id:"kam_dok_1",text:"Förvaras anläggningsdokumentation i låst skåp eller rum — digitalt material med brandvägg, lösenord och backup på extern enhet?",
         help:"SSF 1061:3 §4.10.1: anläggningsdokumentation ska skyddas — fysiskt material i låst skåp och digitalt material bakom brandvägg, lösenord och med backup på extern enhet. Molntjänster kan användas men kräver uppfyllande av Bilaga A-kraven i SSF 1061:3. Backup ska testas, inte bara göras.",action:"Säkerställ tre saker: fysiskt material i låst skåp, digitalt skyddat med brandvägg och lösenord, backup på extern enhet som testas.",actionPartial:"Kontrollera att backup faktiskt genomförs och testas med återställning. Om molntjänster används — kontrollera Bilaga A-kraven specifikt."},
        {id:"kam_dok_2",text:"Finns rutiner för att förvara, skydda och rekonstruera kundregister, anläggningshandlingar och programvara?",
         help:"SSF 1061:3 §4.10.2: rutinerna ska täcka tre saker: (1) var dokument förvaras, (2) hur de skyddas mot obehörig åtkomst, och (3) hur de kan rekonstrueras vid förlust. Det tredje — rekonstruktionsplanen — är det som oftast saknas. En backup utan testad återställning räknas inte som uppfyllt.",action:"Ta fram rutin som täcker förvaring, skydd och rekonstruktion. Genomför en återställningstest minst en gång per år och dokumentera resultatet.",actionPartial:"Kontrollera att rutinen täcker alla tre delarna — och att backup-rutinen faktiskt testats med en återställning."},
      ]},
      {id:"kam_gdpr",name:"Lagar & GDPR",questions:[
        {id:"kam_gdpr_1",text:"Är personalen väl insatt i Kamerabevakningslagen och GDPR — och finns lagarna tillgängliga på firman?",
         help:"SSF 1061:3 §4.11: personal som projekterar och installerar kamerabevakningssystem ska ha goda kunskaper om Kamerabevakningslagen och GDPR. Lagarna ska finnas tillgängliga. Revisorerna brukar ställa frågor direkt till tekniker om lagens innehåll — kunskapen ska vara praktisk, inte bara teoretisk.",action:"Genomför utbildning i Kamerabevakningslagen och GDPR för all berörd personal. Dokumentera utbildningen.",actionPartial:"Kontrollera att kunskapen faktiskt finns hos personalen — fråga teknikerna om lagens krav, inte bara om tillgång till lagtexten."},
        {id:"kam_gdpr_2",text:"Finns rutiner för att informera kunden om Kamerabevakningslagen och GDPR — och bistår ni med skyltar och nödvändiga dokument?",
         help:"SSF 1061:3 §4.11 och Kamerabevakningslagen: vid installation ska kunden informeras om sina rättsliga skyldigheter — tillståndsplikt, anmälningsskyldighet och skyltningskrav. Ni ska bistå med korrekt skyltning. Revisorerna kontrollerar att rutinen tillämpas konsekvent — inte bara att den dokumenterats.",action:"Ta fram kundrutin med: informationsblad om Kamerabevakningslagen, checklista för tillståndsplikt och kamerabevakningsskyltar som kan levereras med systemet.",actionPartial:"Kontrollera att rutinen tillämpas vid varje kundinstallation och att skyltning alltid medföljer systemintyget."},
        {id:"kam_gdpr_3",text:"Har ni tecknat personuppgiftsbiträdesavtal (DPA) med kunder där ni hanterar personuppgifter för deras räkning?",
         help:"GDPR Artikel 28: om ni som installatör/servicepersonal hanterar personuppgifter — t.ex. videoupptagningar eller åtkomst till kundernas kamerasystem — är ni personuppgiftsbiträde och ett DPA (personuppgiftsbiträdesavtal) krävs. Vanligast vid remote access och servicearbete med tillgång till livebild.",action:"Inventera kundrelationer och identifiera de fall där ni hanterar personuppgifter. Ta fram en DPA-mall och avtala med berörda kunder.",actionPartial:"Kontrollera om det finns aktiva kundrelationer med remote access eller serviceuppdrag utan DPA — prioritera dessa."},
      ]},
    ]
  },

ssf1044:{
    id:"ssf1044",name:"SSF 1044 SWE Q",reg:"SSF 1044 utgåva 1",
    desc:"Ledningssystem för kvalitet inom inbrottslarmbranschen — Grund, Nivå 1 och Nivå 2",
    sections:[
      {id:"s1044_grund",name:"SWE Q Grund — Felhantering",questions:[
        {id:"s44_g1",swqNiva:"grund",text:"Finns en dokumenterad rutin för rapportering av internt upptäckta fel — orsaken utreds, korrigerande åtgärder vidtas och följs upp.",
         help:"SSF 1044 §4.1.1: alla internt upptäckta fel ska rapporteras i ett system där grundorsaken utreds och korrigerande åtgärder vidtas och följs upp. 'Följs upp' är nyckeln — det räcker inte att skriva ner felet, åtgärden ska dokumenteras och verifieras. Revisorer kontrollerar att systemet används i praktiken.",action:"Ta fram en felrapporteringsrutin med ett enkelt register: datum, beskrivning, grundorsak, åtgärd, ansvarig, uppföljning.",actionPartial:"Kontrollera att rutinen faktiskt används — är de senaste felmeddelandena inlagda? Och har åtgärderna följts upp?"},
        {id:"s44_g2",swqNiva:"grund",text:"Korrigerande åtgärder (förebyggande, vidtagna) dokumenteras och arkiveras konsekvent.",
         help:"SSF 1044 §4.1.1: korrigerande åtgärder — både förebyggande (som vidtas innan ett fel uppstår) och vidtagna (som svar på ett inträffat fel) — ska dokumenteras och arkiveras konsekvent. 'Konsekvent' är krav — enstaka bra dokumentation räknas inte.",action:"Inför ett dokumentationsregister för åtgärder med kolumnerna: typ (förebyggande/korrigerande), datum, beskrivning, ansvarig och verifiering.",actionPartial:"Gå igenom dokumentationen och kontrollera att den är komplett och konsekvent — inte bara sporadisk."},
        {id:"s44_g3",swqNiva:"grund",text:"Det finns en dokumenterad rutin för hantering av kundreklamationer.",
         help:"SSF 1044 §4.1.2: rutinen för kundreklamationer ska täcka hela flödet: mottagning av klagomålet, bekräftelse till kunden, utredning, åtgärd och avslut. Kunden ska alltid få återkoppling. Vanlig brist: reklamationer hanteras men dokumenteras inte, eller avslutas utan att kunden informerats.",action:"Ta fram en reklamationsrutin med tydliga steg: mottagning, bekräftelse, utredning, åtgärd och kundsvar. Skapa en enkel blankett.",actionPartial:"Kontrollera att rutinen är känd av all personal som möter kunder — inte bara chefen. Fråga en tekniker hur de hanterar ett missnöjt samtal."},
        {id:"s44_g4",swqNiva:"grund",text:"Konstaterade kundklagomål resulterar alltid i korrigerande åtgärder som dokumenteras och följs upp.",
         help:"SSF 1044 §4.1.2: varje konstaterat kundklagomål ska leda till en korrigerande åtgärd — och åtgärden ska dokumenteras och följas upp. 'Konstaterat' innebär att klagomålet utretts och befunnits befogat. Revisorer kontrollerar att det finns en koppling mellan klagomål och dokumenterade åtgärder.",action:"Säkerställ att alla konstaterade kundklagomål utreds, åtgärdas och dokumenteras — med uppföljning av att åtgärden faktiskt haft effekt.",actionPartial:"Kontrollera att uppföljning faktiskt genomförs. Välj ut ett par äldre klagomål och verifiera att åtgärden slutförts och dokumenterats."},
      ]},
      {id:"s1044_n1a",name:"SWE Q Nivå 1 — Organisation",questions:[
        {id:"s44_n1",swqNiva:"n1",text:"Företagsledningen säkerställer aktivt att kundkrav uppfylls — t.ex. via utsedd kundkontakt.",
         help:"SSF 1044 §4.2.2: ledningen ska aktivt säkra att kundkrav uppfylls — t.ex. via en utsedd kundkontakt med ansvar för att fånga upp kundbehov och säkerställa att de hanteras. Det ska finnas dokumenterade rutiner för hur kundtillfredsställelse ökas, inte bara antaganden om att det sköts i vardagen.",action:"Utse en namngiven kundkontakt och dokumentera dennes ansvar. Upprätta rutin för hur kundtillfredsställelse ska öka.",actionPartial:"Kontrollera att processen för kundfokus är dokumenterad, känd av personalen och faktiskt omsätts i handling."},
        {id:"s44_n2",swqNiva:"n1",text:"En kvalitetspolicy finns som är känd av alla — visar att alla har ansvar för kvalitet och skyldighet att verka för ständiga förbättringar.",
         help:"SSF 1044 §4.2.3: kvalitetspolicyn ska visa att alla i företaget har ansvar för kvalitet och skyldighet att verka för ständiga förbättringar. Den ska vara känd av all personal — revisorer brukar ställa frågor direkt till medarbetare. En policy som bara hänger på väggen räknas inte som känd.",action:"Skriv en kort kvalitetspolicy och presentera den för all personal. Dokumentera att kommunikationen skett.",actionPartial:"Kontrollera att policyn faktiskt är känd av personalen — fråga en slumpmässig medarbetare vad policyn innebär."},
        {id:"s44_n3",swqNiva:"n1",text:"En dokumenterad organisationsplan med definierade ansvar och befogenheter finns och är väl känd av alla i företaget.",
         help:"SSF 1044 §4.2.4: en dokumenterad organisationsplan med definierade ansvar och befogenheter ska finnas och vara känd av alla. 'Känd' är krav — revisorer kontrollerar om personalen vet vad deras roll innebär och vem de rapporterar till. Planen ska uppdateras vid förändringar.",action:"Ta fram en organisationsplan med namn, funktion och ansvarsområden per person. Säkerställ att den är kommunicerad och känd.",actionPartial:"Uppdatera organisationsplanen vid personalförändringar och kommunicera uppdateringar till all personal."},
        {id:"s44_n4",swqNiva:"n1",text:"En kvalitetsansvarig är utsedd med befogenhet att säkra att ledningssystemet uppfyller ställda krav.",
         help:"SSF 1044 §4.2.5: en kvalitetsansvarig ska vara utsedd med faktiska befogenheter att säkra att ledningssystemet uppfyller kraven. 'Befogenhet' innebär mandat att stoppa en process eller kräva åtgärd — inte bara administrativt ansvar. Revisorer verifierar att befogenheten är reell.",action:"Utse en kvalitetsansvarig och dokumentera befogenheterna skriftligen — undertecknat av ledningen.",actionPartial:"Kontrollera att den kvalitetsansvariges roll och befogenheter är dokumenterade, kända i organisationen och reella — inte bara nominella."},
      ]},
      {id:"s1044_n1b",name:"SWE Q Nivå 1 — Processer",questions:[
        {id:"s44_n5",swqNiva:"n1",text:"Det finns en rutin för att fastställa produktanknutna krav — tillämpliga normer och SSF 1015-krav är förtecknade och genomgångna innan ordererkännande.",
         help:"SSF 1044 §4.2.6: innan ordererkännande ska tillämpliga normer och SSF 1015-krav identifieras och genomgås. En förteckning över relevanta standarder (SSF 130, SSF 1014 m.fl.) ska finnas. Kravgenomgången ska ske konsekvent — inte bara vid osäkra uppdrag.",action:"Upprätta en normförteckning och en rutin för kravgenomgång vid alla förfrågningar. Dokumentera genomgången per order.",actionPartial:"Kontrollera att förteckningen är aktuell och att kravgenomgången faktiskt sker konsekvent — inte bara vid komplicerade uppdrag."},
        {id:"s44_n6",swqNiva:"n1",text:"En rutin för anbudsgivning finns med definierat ansvar, offertformulär och rutiner för arkivering av anbud.",
         help:"SSF 1044 §4.2.7: rutinen för anbudsgivning ska definiera vem som har befogenhet att lämna anbud, hur offertformuläret ser ut och hur anbud arkiveras. Arkivet är viktigt — vid reklamationer behöver ni visa vad som ingick i ursprungserbjudandet.",action:"Ta fram en anbudsrutin med: vem som skriver anbud, offertmall och hur anbud arkiveras per kund.",actionPartial:"Kontrollera att rutinen följs konsekvent och att anbud faktiskt arkiveras med referens per kund/projekt."},
        {id:"s44_n7",swqNiva:"n1",text:"En rutin för projektering finns som täcker ordererkännande, inköp av komponenter, tidplanering och framtagning av nödvändiga arbetsdokument.",
         help:"SSF 1044 §4.2.8: projekteringsrutinen ska täcka: ordererkännande till kund, inköp av rätt komponenter (SSF 1014-godkänt), tidplanering och framtagning av arbetsdokument. Alla steg ska vara dokumenterade — luckor i flödet är en vanlig revisionsanmärkning.",action:"Dokumentera projekteringsprocessen med tydliga steg, ansvarig per steg och vad som ska vara klart innan installation påbörjas.",actionPartial:"Gå igenom om rutinen faktiskt täcker alla steg — kontrollera mot ett pågående projekt om alla moment dokumenteras."},
        {id:"s44_n8",swqNiva:"n1",text:"En installationsrutin finns med instruktioner för planering, installation, driftsättning och dokumentation.",
