:root{--amber:#FFA300;--black:#101820;--white:#fff;--page:#F8F9FA;--border:#E8E9EC;--muted:#6B6C74;--faint:#F2F3F5;--green:#1B6B3F;--red:#C03535;--blue:#2A5A8C;--shadow-sm:0 1px 3px rgba(0,0,0,.07);--r:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:"Visuelt Pro",system-ui,sans-serif;background:var(--page);color:var(--black);line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
button:disabled{opacity:.38;cursor:not-allowed;}
.site-header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.site-header::after{content:"";display:block;height:3px;background:var(--amber);}
.hdr-inner{max-width:960px;margin:0 auto;padding:0 32px;height:96px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{height:80px;width:auto;}
.hdr-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}
.shell{max-width:860px;margin:0 auto;padding:48px 24px 80px;}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);padding:28px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.page-intro{text-align:center;padding:0 0 40px;}
.chip{display:inline-block;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 14px;border-radius:2px;margin-bottom:20px;}
.page-intro h1{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.5px;margin-bottom:12px;}
.page-intro p{font-size:16px;color:var(--muted);max-width:480px;margin:0 auto;}
.field-label{font-size:13px;font-weight:700;color:var(--black);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.req-star{color:var(--red);font-size:16px;line-height:1;}
.text-input{width:100%;padding:13px 16px;font-size:15px;font-weight:600;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.text-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.field-error{font-size:12px;color:var(--red);font-weight:600;margin-top:6px;}
.privacy-note{display:flex;align-items:flex-start;gap:10px;background:#EEF4FB;border:1px solid #C8DCF0;border-radius:6px;padding:12px 14px;margin-top:14px;}
.privacy-note p{font-size:12px;color:var(--blue);font-weight:500;line-height:1.55;}
.cert-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.cert-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .12s,background .12s;}
.cert-row:hover{border-color:var(--amber);}
.cert-row.active{border-color:var(--amber);background:#FFFBF0;}

        text: "Krav för utveckling av varor/tjänster identifieras och dokumenteras — inkl. kundkrav, myndighetskrav och livscykelperspektiv. (Ej tillämpligt om ni ej utvecklar egna produkter/tjänster.)",
        help: "FR 2000 §3.1: kravet gäller företag som utvecklar egna varor eller tjänster. Installationsföretag som enbart monterar andras produkter kan betrakta detta som ej tillämpligt — men undantaget måste dokumenteras i ledningssystemet med motivering. Om ni exkluderar §3 ska SBSC informeras.",

        text: "Styrning av utvecklingsarbetet är beskrivet — genomgångar, utprovningar och ändringar dokumenteras. (Ej tillämpligt om ni ej utvecklar egna produkter/tjänster.)",
        help: "FR 2000 §3.2: ej tillämpligt om ni enbart installerar och servicar andras produkter utan produktutveckling. Om det är tillämpligt ska styrningen av utvecklingsarbetet beskrivas med genomgångar, utprovningar och dokumentation av ändringar. Dokumentera undantaget om ni exkluderar §3.2.",

        help: "FR 2000 §4.1: rutiner för inköp ska täcka alla typer av inköp — material, tjänster och utlagda processer (t.ex. underleverantörer). Rutinerna ska definiera krav på kvalitet, miljö och leveranssäkerhet. En underleverantör som ni kontrollerar dåligt kan vara er brist vid en revision.",

        text: "Leverantörers förmåga utvärderas minst en gång per år — rapporteras vid ledningens genomgång.",
        help: "FR 2000 §4.2: leverantörers förmåga ska utvärderas minst en gång per år och rapporteras vid ledningens genomgång. Utvärderingen kan vara enkel — leveransprecision, kvalitetsavvikelser och kommunikation — men ska vara dokumenterad. Leverantörer som underpresterar ska hanteras.",

        help: "FR 2000 §5: rutiner för produktion och leverans ska täcka produktionsstyrning (hur arbetet planeras och styrs), kontroll (hur ni verifierar att arbetet uppfyller krav), underhåll av utrustning och leverans till kund. För ett installationsföretag: projektplanering, installationskontroll och överlämning.",

  iso14001: {
    id: "iso14001",
    name: "ISO 14001",
    reg: "SS-EN ISO 14001:2015",
    desc: "Miljöledningssystem",
    sections: [{
      id: "i14_kontext",
      name: "Kontext & systemomfattning",
      questions: [{
        id: "i14_lms_screen",
        text: "Har ni ett dokumenterat ledningssystem — inte bara en policy, utan faktiska rutiner som beskriver hur ni arbetar i praktiken?",
        help: "Ett ledningssystem är inte ett dokument — det är ett sätt att styra verksamheten. I praktiken innebär det skriftliga rutiner som beskriver hur ni faktiskt arbetar (inte hur ni vill arbeta), tydligt definierat ansvar för vem som gör vad och vem som kontrollerar, och regelbunden uppföljning där ni kontrollerar att rutinerna följs och förbättrar när de inte gör det. En revisor kontrollerar inte om dokumentet finns — utan om systemet lever. Det vanligaste revisionsrfyndet är att rutiner finns på papper men inte tillämpas i praktiken. Ett dokument på 3 sidor är inte ett ledningssystem — ett certifierbart system kräver dokumenterade rutiner för varje del av verksamheten som normen ställer krav på.",
        action: "Börja med att kartlägga era befintliga rutiner mot standardens krav. Identifiera luckor och prioritera de delar som saknar dokumentation. En gap-analys mot normen är ett bra första steg.",
        actionPartial: "Kontrollera att era rutiner faktiskt tillämpas och att systemet underhålls löpande — ett system som inte uppdateras efter förändringar i verksamheten uppfyller inte standardens krav."
      }, 
        {
        id: "i14_k_1",
        text: "Har ni kartlagt externa och interna faktorer som påverkar er miljöprestanda och förmågan att uppnå avsedda resultat med miljöledningssystemet?",
        help: "ISO 14001:2015 §4.1: organisationen ska avgöra vilka externa och interna frågor som är relevanta för dess syfte och som påverkar förmågan att uppnå avsedda resultat med miljöledningssystemet — inklusive miljöförhållanden som påverkas av eller kan påverka organisationen.",
        action: "Dokumentera externa faktorer (lagar, marknad, lokala miljöförhållanden) och interna faktorer (processer, produkter, tjänster) i en kontextanalys.",
        actionPartial: "Kontrollera att kontextanalysen är miljöspecifik och täcker lokala/regionala miljöförhållanden — en generell verksamhetsanalys uppfyller inte §4.1."
      }, {
        id: "i14_k_2",
        text: "Har ni identifierat relevanta intressenter och deras krav — inkl. bindande krav från lagar, myndigheter och avtalsparter?",
        help: "ISO 14001:2015 §4.2: organisationen ska fastställa relevanta intressenter och deras krav, samt avgöra vilka krav som ska bli bindande för miljöledningssystemet. Bindande krav inkluderar lagkrav (lagar, tillstånd, myndighetsbeslut) och frivilliga åtaganden organisationen väljer att uppfylla.",
        action: "Upprätta en intressentlista med: intressent, krav och om kravet är bindande. Täck myndigheter, kunder, grannar och branschorganisationer.",
        actionPartial: "Kontrollera att listan är aktuell och att bindande krav är tydligt identifierade — ej bara listade."
      }, {
        id: "i14_k_3",
        text: "Är miljöledningssystemets omfattning definierad och dokumenterad — inkl. de aktiviteter, produkter och tjänster som ingår?",
        help: "ISO 14001:2015 §4.3: organisationen ska fastställa avgränsningar och tillämplighet för miljöledningssystemet. Omfattningen ska beakta externa/interna frågor (§4.1), bindande krav (§4.2) och organisatoriska gränser. Dokumenterad information om omfattningen krävs.",
        action: "Dokumentera systemomfattningen: vilka verksamhetsställen, aktiviteter, produkter och tjänster som ingår — och eventuella avgränsningar med motivering.",
        actionPartial: "Kontrollera att avgränsningen inte används för att utesluta aktiviteter med betydande miljöpåverkan."
      }]
    }, {
      id: "i14_ledarskap",
      name: "Ledarskap & miljöpolicy",
      questions: [{
        id: "i14_l_1",
        text: "Finns en miljöpolicy med åtaganden om skydd av miljön, uppfyllande av bindande krav och ständig förbättring — kommunicerad och externt tillgänglig?",
        help: "ISO 14001:2015 §5.2: miljöpolicyn ska innehålla: (a) lämplig för organisationens syfte, (b) ramverk för miljömål, (c) åtagande att skydda miljön inkl. förebygga förorening, (d) åtagande att uppfylla bindande krav, (e) åtagande om ständig förbättring av miljöprestanda. Policyn ska kommuniceras inom organisationen och finnas tillgänglig för intressenter.",
        action: "Upprätta en miljöpolicy som uppfyller alla fem kraven i §5.2. Kommunicera den internt och publicera externt (t.ex. hemsidan).",
        actionPartial: "Kontrollera att policyn innehåller alla fem åtagandena — åtagandet om ständig förbättring av miljöprestanda (inte bara systemet) missas ofta."
      }, {
        id: "i14_l_2",
        text: "Är roller och ansvar för miljöledningssystemet definierade — inkl. utsedd person med ansvar för rapportering till ledningen?",
        help: "ISO 14001:2015 §5.3: ledningen ska tilldela ansvar och befogenhet för att: (a) säkerställa att systemet uppfyller standardens krav, (b) rapportera till ledningen om systemets prestanda. Rollen kan delas av flera personer eller vara en dedikerad miljöansvarig.",
        action: "Definiera och kommunicera roller och ansvar för miljöledningssystemet. Utse en namngiven person med rapporteringsansvar till ledningen.",
        actionPartial: "Kontrollera att ansvaret för rapportering till ledningen är explicit definierat — inte bara generellt miljöansvar."
      }]
    }, {
      id: "i14_planering",
      name: "Miljöaspekter & bindande krav",
      questions: [{
        id: "i14_p_1",
        text: "Har ni identifierat era miljöaspekter och deras miljöpåverkan ur ett livscykelperspektiv — och fastställt vilka som är betydande?",
        help: "ISO 14001:2015 §6.1.2: miljöaspekter ska fastställas för aktiviteter, produkter och tjänster som organisationen kan styra eller påverka, under beaktande av livscykelperspektivet (från råvara till avfallshantering). Kriterier för vad som gör en aspekt 'betydande' ska fastställas och dokumenteras. Typiska aspekter för ett installationsföretag: kabelavfall, elförbrukning, transporter, kemikalier.",
        action: "Genomför en miljöaspektsinventering ur livscykelperspektiv. Dokumentera aspekter, tillhörande påverkan och de kriterier ni använt för att fastställa vilka som är betydande.",
        actionPartial: "Kontrollera att livscykelperspektivet täcker hela kedjan — inköp av material, transport, installation och avfallshantering."
      }, {
        id: "i14_p_2",
        text: "Är bindande krav identifierade och dokumenterade — och tas hänsyn till dem när systemet upprättas och underhålls?",
        help: "ISO 14001:2015 §6.1.3: organisationen ska fastställa och ha tillgång till bindande krav som rör miljöaspekterna, och ta hänsyn till dessa när systemet upprättas och underhålls. Bindande krav inkluderar lagkrav (Miljöbalken, avfallsförordningen, kemikalielagstiftning) och frivilliga åtaganden.",
        action: "Upprätta en förteckning över tillämpliga bindande krav med: krav, vad det innebär för er verksamhet och hur ni säkerställer efterlevnad.",
        actionPartial: "Kontrollera att förteckningen är aktuell och att varje krav är kopplat till en rutin eller ansvarig person."
      }, {
        id: "i14_p_3",
        text: "Finns dokumenterade miljömål kopplade till de betydande miljöaspekterna — mätbara och med plan för hur de ska uppnås?",
        help: "ISO 14001:2015 §6.2.1–6.2.2: miljömål ska upprättas för relevanta funktioner och nivåer, med hänsyn till de betydande miljöaspekterna och bindande krav. Mål ska vara mätbara (om praktiskt möjligt), övervakas, kommuniceras och uppdateras vid behov. Planen ska ange vad, resurser, ansvarig, tidplan och hur resultaten utvärderas.",
        action: "Sätt 2–4 mätbara miljömål kopplade till era betydande miljöaspekter. Definiera mätvärde, ansvarig, tidplan och utvärderingsmetod.",
        actionPartial: "Kontrollera att målen är kopplade till de identifierade betydande aspekterna — generella mål utan denna koppling uppfyller inte §6.2.1."
      }]
    }, {
      id: "i14_stod",
      name: "Kompetens & kommunikation",
      questions: [{
        id: "i14_s_1",
        text: "Har personalen som arbetar med miljöpåverkande aktiviteter dokumenterad kompetens — och finns bevis bevarade?",
        help: "ISO 14001:2015 §7.2: organisationen ska fastställa nödvändig kompetens för de som arbetar under ledningens kontroll och som kan påverka miljöprestandan. Kompetens ska säkerställas och bevis bevaras. Kompetens kan bygga på utbildning, upplärning eller erfarenhet.",
        action: "Identifiera vilka roller som kan påverka miljöprestanda. Dokumentera nödvändig kompetens per roll och bevara utbildningsbevis.",
        actionPartial: "Kontrollera att kompetensbevis finns för alla med miljöpåverkande arbetsuppgifter — inkl. tekniker på fältet."
      }, {
        id: "i14_s_2",
        text: "Är personalen medveten om miljöpolicyn, de betydande miljöaspekterna och konsekvenserna av att inte uppfylla systemets krav?",
        help: "ISO 14001:2015 §7.3: de som arbetar under organisationens kontroll ska känna till: (a) miljöpolicyn, (b) de betydande miljöaspekterna och tillhörande påverkan kopplad till deras arbete, (c) deras bidrag till systemets effektivitet, (d) konsekvenserna av att inte uppfylla systemets krav.",
        action: "Genomför miljömedvetenhetsutbildning för all berörd personal. Täck policyn, relevanta aspekter och vad som händer om kraven inte följs.",
        actionPartial: "Kontrollera att medvetenheten täcker de aspekter som är relevanta för varje persons specifika arbetsuppgifter — generell hållbarhetsinformation räcker inte."
      }, {
        id: "i14_s_3",
        text: "Finns rutiner för intern och extern kommunikation om miljöledningssystemet — inkl. kommunikation med myndigheter om bindande krav?",
        help: "ISO 14001:2015 §7.4: organisationen ska fastställa vad, när, till vem och hur kommunikation ska ske — internt och externt. Extern kommunikation om bindande krav (t.ex. till tillsynsmyndigheter) är ett specifikt krav. Organisationen ska också dokumentera och svara på relevant kommunikation från intressenter.",
        action: "Dokumentera kommunikationsrutiner: internt (vem informerar vem, om vad) och externt (vilka myndigheter, om vad, hur ofta).",
        actionPartial: "Kontrollera specifikt att det finns en rutin för kommunikation med tillsynsmyndigheter — detta missas ofta."
      }]
    }, {
      id: "i14_verksamhet",
      name: "Verksamhetsstyrning & nödläge",
      questions: [{
        id: "i14_v_1",
        text: "Finns dokumenterade rutiner för styrning av de processer som är kopplade till de betydande miljöaspekterna och bindande krav?",
        help: "ISO 14001:2015 §8.1: organisationen ska planera, styra och kontrollera de processer som är kopplade till de betydande miljöaspekterna och bindande krav. Styrningen ska innefatta dokumenterade kriterier och kontroll av att processerna utförs enligt kriterierna — inkl. miljörelevanta inköp och utkontraktering.",
        action: "Identifiera de processer som har störst miljöpåverkan och dokumentera hur de styrs — inkl. kriterier för acceptabel prestanda och hur avvikelser hanteras.",
        actionPartial: "Kontrollera att styrningen täcker utkontrakterade processer och leverantörer — miljöpåverkan i värdekedjan är ett vanligt revisionsämne."
      }, {
        id: "i14_v_2",
        text: "Finns beredskapsplan för nödlägen med miljöpåverkan — och testas den regelbundet?",
        help: "ISO 14001:2015 §8.2: organisationen ska förbereda sig för och agera vid potentiella nödlägen med miljöpåverkan — spill av kemikalier, brand, utsläpp. Planen ska testas med planerade intervall och revideras efter inträffade nödlägen eller tester.",
        action: "Upprätta en nödlägesplan med: identifierade nödlägen, åtgärder vid händelse, ansvariga och kommunikationsrutiner. Schemalägg testövningar.",
        actionPartial: "Kontrollera att planen faktiskt testas — en plan som aldrig prövats är en vanlig revisionsanmärkning."
      }]
    }, {
      id: "i14_uppfoljning",
      name: "Utvärdering & förbättring",
      questions: [{
        id: "i14_u_1",
        text: "Övervakas och mäts miljöprestandan regelbundet — inkl. utvärdering att bindande krav uppfylls?",
        help: "ISO 14001:2015 §9.1.1–9.1.2: organisationen ska övervaka, mäta, analysera och utvärdera sin miljöprestanda. Vad som mäts, metod och frekvens ska definieras. Efterlevnad av bindande krav ska utvärderas med planerade intervall och dokumenteras. Revisorer kontrollerar att efterlevnadsutvärderingen faktiskt genomförs — inte bara att en laglista finns.",
        action: "Definiera vad som mäts (t.ex. energiförbrukning, avfallsmängder) och hur ofta. Inför en rutin för lagefterlevnadskontroll med dokumenterade resultat.",
        actionPartial: "Kontrollera specifikt att efterlevnadsutvärderingen genomförs och dokumenteras — det räcker inte att ha en laglista."
      }, {
        id: "i14_u_2",
        text: "Genomförs interna revisioner med planerade intervall — med objektiv revisor och dokumenterade resultat?",
        help: "ISO 14001:2015 §9.2: interna revisioner ska genomföras för att bedöma om miljöledningssystemet uppfyller kraven och är effektivt implementerat. Revisorn ska vara objektiv och opartisk — inte revidera sin egna verksamhet. Avvikelser ska leda till korrigerande åtgärder.",
        action: "Upprätta ett revisionsprogram med: täckning av alla processer, datum, vem som reviderar och hur resultat rapporteras och bevaras.",
        actionPartial: "Kontrollera att revisorns oberoende är säkerställt och att avvikelser faktiskt åtgärdas."
      }, {
        id: "i14_u_3",
        text: "Genomför ledningen regelbundna genomgångar av miljöledningssystemet med §9.3:s obligatoriska underlag?",
        help: "ISO 14001:2015 §9.3: ledningens genomgång ska täcka: (a) status på föregående åtgärder, (b) förändringar i externa/interna frågor inkl. intressenters krav, bindande krav, betydande miljöaspekter och risker, (c) uppfyllande av miljömål, (d) information om miljöprestanda inkl. avvikelser, mätresultat, lagefterlevnad och revisionsresultat, (e) resurser, (f) intressentkommunikation inkl. klagomål, (g) förbättringsmöjligheter.",
        action: "Schemalägg ledningens genomgång med en fast agenda som täcker alla §9.3-punkter. Protokollför alltid med beslut om åtgärder och resurser.",
        actionPartial: "Kontrollera att protokollet täcker alla §9.3-punkter — status på bindande krav och miljöaspekter missas ofta."
      }, {
        id: "i14_u_4",
        text: "Finns ett system för avvikelse och korrigerande åtgärd — inkl. hantering av negativ miljöpåverkan och rotorsaksanalys?",
        help: "ISO 14001:2015 §10.2: när en avvikelse inträffar ska organisationen: reagera och korrigera, hantera konsekvenser inkl. att mildra negativ miljöpåverkan, utreda grundorsaken, vidta korrigerande åtgärder och granska deras verkan. Dokumentation ska bevaras. Avvikelser som ger negativ miljöpåverkan kräver omedelbar hantering av konsekvenserna.",
        action: "Inför ett avvikelsesystem som täcker: korrigering, konsekvenshantering inkl. miljöpåverkan, grundorsaksanalys, korrigerande åtgärd och verifiering.",
        actionPartial: "Kontrollera att rutinen explicit täcker hantering av negativ miljöpåverkan — inte bara den interna systemavvikelsen."
      }]
    }]
  },
  iso45001: {

    name: "ISO 45001",

        action: "Börja med att kartlägga era befintliga rutiner mot standardens krav. Identifiera luckor och prioritera de delar som saknar dokumentation. En gap-analys mot normen är ett bra första steg.",

        help: "ISO 9001:2015 §8.7: avvikande processresultat — produkter eller tjänster som inte uppfyller krav — ska identifieras, styras och hanteras. Hantering kan innebära: korrigering, segregering, returer, informera kunden, dispensansökan. Spårbarhet till beslutsfattare krävs. Hantering efter leverans inkluderas.",

  iso27001: {
    id: "iso27001",
    name: "ISO 27001",
    reg: "SS-ISO/IEC 27001:2022",
    desc: "Ledningssystem för informationssäkerhet",
    sections: [{
      id: "i27_kontext",
      name: "Kontext & systemomfattning",
      questions: [{
        id: "i27_lms_screen",
        text: "Har ni ett dokumenterat ledningssystem — inte bara en policy, utan faktiska rutiner som beskriver hur ni arbetar i praktiken?",
        help: "Ett ledningssystem är inte ett dokument — det är ett sätt att styra verksamheten. I praktiken innebär det skriftliga rutiner som beskriver hur ni faktiskt arbetar (inte hur ni vill arbeta), tydligt definierat ansvar för vem som gör vad och vem som kontrollerar, och regelbunden uppföljning där ni kontrollerar att rutinerna följs och förbättrar när de inte gör det. En revisor kontrollerar inte om dokumentet finns — utan om systemet lever. Det vanligaste revisionsrfyndet är att rutiner finns på papper men inte tillämpas i praktiken. Ett dokument på 3 sidor är inte ett ledningssystem — ett certifierbart system kräver dokumenterade rutiner för varje del av verksamheten som normen ställer krav på.",
        action: "Börja med att kartlägga era befintliga rutiner mot standardens krav. Identifiera luckor och prioritera de delar som saknar dokumentation. En gap-analys mot normen är ett bra första steg.",
        actionPartial: "Kontrollera att era rutiner faktiskt tillämpas och att systemet underhålls löpande — ett system som inte uppdateras efter förändringar i verksamheten uppfyller inte standardens krav."
      }, 
        {
        id: "i27_k_1",
        text: "Har ni kartlagt externa och interna faktorer som påverkar er informationssäkerhet och identifierat relevanta intressenters krav?",
        help: "ISO 27001:2022 §4.1–4.2: ni ska förstå er informationssäkerhetskontext — externa faktorer (t.ex. GDPR, cyberhot, kundkrav och tillämplig lagstiftning som NIS2) och interna faktorer (IT-miljö, personal, processer). Kontextanalysen ska vara IS-specifik — en generell verksamhetsanalys täcker inte kravet. Intressenters krav på informationssäkerhet ska specifikt identifieras.",
        action: "Dokumentera IS-kontext med externa faktorer (GDPR, NIS2, cyberhot) och interna faktorer (IT-miljö, personal). Identifiera intressenters IS-krav.",
        actionPartial: "Kontrollera att kontextanalysen är IS-specifik — det räcker inte med en generell verksamhetsanalys."
      }, {
        id: "i27_k_2",
        text: "Är ISMS:ets omfattning definierad — inkl. informationstillgångar, system, lokaler och externa beroendeförhållanden?",
        help: "ISO 27001:2022 §4.3: ISMS:ets omfattning ska klart definiera vilka informationstillgångar, system, lokaler och externa beroendeförhållanden som ingår. Gränssnitt mot molntjänster och underleverantörer är särskilt viktiga att inkludera — dessa är vanliga revisionsanmärkningar. Exkluderingar ska motiveras.",
        action: "Skriv en dokumenterad ISMS-omfattning med alla ingående system, lokaler och externa parter. Inkludera gränssnitt mot molntjänster.",
        actionPartial: "Kontrollera att avgränsningen täcker gränssnitt mot molntjänster och underleverantörer — dessa är vanliga brister vid revision."
      }]
    }, {
      id: "i27_ledarskap",
      name: "Ledarskap & policy",
      questions: [{
        id: "i27_l_1",
        text: "Finns en informationssäkerhetspolicy med syfte, mål-ramverk, kravåtagande och förbättringsåtagande — kommunicerad till personalen?",
        help: "ISO 27001:2022 §5.2: IS-policyn ska vara specifik för informationssäkerhet och uppfylla fyra krav: (1) lämplig för organisationens syfte, (2) inkludera IS-mål eller ram för att fastställa dem, (3) innehålla åtagande om efterlevnad av tillämpliga krav, (4) innehålla åtagande om kontinuerlig förbättring. En generell IT-policy uppfyller vanligtvis inte kravet.",
        action: "Skriv en IS-policy som uppfyller de fyra §5.2-kraven. Kommunicera den till all personal och gör den tillgänglig för intressenter.",
        actionPartial: "Kontrollera att policyn uppfyller alla fyra §5.2-krav och faktiskt är känd av personalen — fråga medarbetarna."
      }, {
        id: "i27_l_2",
        text: "Finns definierade roller och ansvar för informationssäkerhet — inkl. en utsedd person med ansvar för ISMS?",
        help: "ISO 27001:2022 §5.3: roller och ansvar för informationssäkerhet ska definieras och kommuniceras inom organisationen. En utsedd person med tydligt IS-ansvar och rapporteringsväg till ledningen är vanligaste lösningen — rollen kan vara befintlig (t.ex. IT-chef) eller dedikerad. Det reella mandatet är avgörande: ett nominellt ansvar utan befogenheter och resurser uppfyller inte kravet.",
        action: "Utse en namngiven IS-ansvarig med tydliga befogenheter och rapporteringsväg till ledningen. Dokumentera rollen.",
        actionPartial: "Kontrollera att IS-ansvarige har tillräckliga resurser och reellt mandat — inte bara ett nominellt ansvar."

        id: "i27_l_3",
        text: "Finns dokumenterade och mätbara informationssäkerhetsmål med plan — kopplat till riskbedömningsresultat?",
        help: "ISO 27001:2022 §6.2: IS-mål ska vara mätbara om det är praktiskt möjligt, kopplade till IS-policyn och riskbedömningsresultat. Mål ska inkludera: vad som ska uppnås, hur det mäts (om tillämpligt), vem som ansvarar, hur det genomförs och när det utvärderas. Typiska IS-mål: andel utbildad personal, tid för att stänga IS-incidenter, andel patchade system.",
        action: "Sätt 3–5 mätbara IS-mål kopplade till era identifierade risker. Definiera mätvärde, ansvarig, metod och uppföljningsdatum.",
        actionPartial: "Kontrollera att målen är mätbara och kopplade till specifika IS-risker — vaga mål som 'ökad säkerhet' uppfyller inte kravet."
      }]
    }, {
      id: "i27_risk",
      name: "Riskbedömning & riskbehandling",
      questions: [{
        id: "i27_r_1",
        text: "Finns en dokumenterad process för riskbedömning med riskacceptanskriterier, riskägare och bedömning av konfidentialitet/riktighet/tillgänglighet?",
        help: "ISO 27001:2022 §6.1.2: riskbedömningsprocessen ska definiera riskacceptanskriterier och metodiken för hur risker identifieras, analyseras och utvärderas. Riskerna ska beakta konfidentialitet, riktighet och tillgänglighet (CIA). Varje risk ska ha en utsedd riskägare. Riskbedömningsprocessen ska ge jämförbara och reproducerbara resultat.",

        id: "i27_r_2",
        text: "Finns en dokumenterad riskbehandlingsplan med valda behandlingsalternativ och riskägarnas formella godkännande?",
        help: "ISO 27001:2022 §6.1.3: riskbehandlingsplanen ska definiera valda behandlingsalternativ (acceptera, reducera, undvika, överföra) och koppla dem till Annex A-kontrollen som implementeras. Riskägarnas formella godkännande av behandlingsplanen och kvarstående risker är ett dokumenterat krav.",
        action: "Ta fram en riskbehandlingsplan med: risk, valt behandlingsalternativ, kopplad Annex A-kontroll, ansvarig och tidplan. Inhämta riskägarnas godkännande.",

      }, {
        id: "i27_r_3",
        text: "Finns ett Uttalande om tillämplighet (SoA) med Annex A-kontrollernas tillämplighet, motiveringar och implementeringsstatus?",
        help: "ISO 27001:2022 §6.1.3d: Uttalandet om tillämplighet (SoA) är ett av ISO 27001:s mest formella krav. Det ska för varje av Annex A:s 93 kontroller ange: om kontrollen är tillämplig, motivering (varje exkludering ska motiveras) och implementeringsstatus. SoA är ett levande dokument som ska hållas aktuellt. Notera: ISO 27002:2022 — en separat vägledningsstandard — förklarar hur Annex A:s kontroller implementeras i praktiken. Den är inte certifieringsbar men ett viktigt implementeringsstöd som många organisationer missar.",
        action: "Skapa ett SoA-dokument i tabellform med Annex A:s 93 kontroller. Ange: tillämplig/ej tillämplig, motivering och implementeringsstatus.",
        actionPartial: "Kontrollera att SoA speglar faktisk implementeringsstatus — inte bara planer — och är konsistent med riskbehandlingsplanen."

        text: "Genomförs riskbedömningar minst en gång per år — med dokumenterade resultat?",
        help: "ISO 27001:2022 §8.2: riskbedömningar ska genomföras med planerade intervall — standarden specificerar inget fast intervall, men en gång per år är etablerad branschpraxis och vanlig revisorsförväntning. Resultaten av riskbedömningen ska dokumenteras. Revisorer kontrollerar att en aktuell riskbedömning finns och att den följer er dokumenterade metodik från §6.1.2.",
        action: "Inför en fast årsrutin för riskbedömning. Dokumentera resultat, riskägares godkännande och beslutade åtgärder.",
        actionPartial: "Kontrollera att en aktuell riskbedömning finns och att den är genomförd enligt er metodik från §6.1.2."
      }, {
        id: "i27_r_4b",
        text: "Genomförs riskbedömningar även när betydande förändringar sker — ny IT-lösning, ny leverantör?",
        help: "ISO 27001:2022 §8.2: riskbedömningar ska också genomföras när betydande förändringar sker — ny IT-lösning, ny leverantör, ny lokal, ny tjänst. Ni ska definiera vad som räknas som 'betydande förändring' och säkra att en IS-riskcheck ingår i er förändringsprocess.",
        action: "Definiera vad som räknas som 'betydande förändring'. Lägg in en IS-riskcheck-punkt i er förändringsplaneringsrutin.",

        text: "Finns en förteckning över informationstillgångar med utsedda ägare och klassificering?",
        help: "ISO 27001:2022 Annex A 5.9 och 5.12: en förteckning över informationstillgångar med utsedda ägare och klassificering är grunden för ISMS:et. Klassificeringen definierar skyddsnivå. Typiska tillgångar: kundregister, anläggningsdokumentation, lösenordsdatabaser, IT-system, e-post. Förteckningen ska hållas aktuell.",

        action: "Inför en offboarding-checklista som säkrar att åtkomst tas bort vid avslut. Inför kvartalsgranskning av alla aktiva användarkonton.",

        text: "Finns rutiner för informationssäkerhet i leverantörsrelationer — IS-krav i avtal och löpande uppföljning?",
