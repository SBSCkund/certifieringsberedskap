<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kartlägg er beredskap inför SBSC-certifiering inom brandlarm, inbrottslarm, kamerabevakning, ledningssystem och ISO.">
<title>SBSC — Certifieringsberedskap</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--amber:#FFA300;--black:#101820;--white:#fff;--page:#F8F9FA;--border:#E8E9EC;--muted:#6B6C74;--faint:#F2F3F5;--green:#1B6B3F;--red:#C03535;--blue:#2A5A8C;--shadow-sm:0 1px 3px rgba(0,0,0,.07);--r:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:"Open Sans",system-ui,sans-serif;background:var(--page);color:var(--black);line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
button:disabled{opacity:.38;cursor:not-allowed;}
.site-header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.site-header::after{content:"";display:block;height:3px;background:var(--amber);}
.hdr-inner{max-width:960px;margin:0 auto;padding:0 32px;height:96px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{height:80px;width:auto;}
.hdr-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}
.shell{max-width:860px;margin:0 auto;padding:48px 24px 80px;}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);padding:28px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.page-intro{text-align:center;padding:0 0 40px;}
.chip{display:inline-block;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 14px;border-radius:2px;margin-bottom:20px;}
.page-intro h1{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.5px;margin-bottom:12px;}
.page-intro p{font-size:16px;color:var(--muted);max-width:480px;margin:0 auto;}
.field-label{font-size:13px;font-weight:700;color:var(--black);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.req-star{color:var(--red);font-size:16px;line-height:1;}
.text-input{width:100%;padding:13px 16px;font-size:15px;font-weight:600;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.text-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.field-error{font-size:12px;color:var(--red);font-weight:600;margin-top:6px;}
.privacy-note{display:flex;align-items:flex-start;gap:10px;background:#EEF4FB;border:1px solid #C8DCF0;border-radius:6px;padding:12px 14px;margin-top:14px;}
.privacy-note p{font-size:12px;color:var(--blue);font-weight:500;line-height:1.55;}
.cert-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.cert-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .12s,background .12s;}
.cert-row:hover{border-color:var(--amber);}
.cert-row.active{border-color:var(--amber);background:#FFFBF0;}
.cert-check{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .12s;}
.cert-row.active .cert-check{background:var(--amber);border-color:var(--amber);color:var(--black);}
.cert-name{font-weight:700;font-size:14px;margin-bottom:2px;}
.cert-badge{font-size:10px;font-weight:700;background:var(--faint);color:var(--muted);padding:2px 7px;border-radius:2px;margin-left:6px;}
.cert-row.active .cert-badge{background:var(--amber);color:var(--black);}
.cert-desc{font-size:12px;color:var(--muted);}
.cert-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:10px 0 4px;}
.disc-check-wrap{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--faint);border:1.5px solid var(--border);border-radius:6px;margin-top:14px;cursor:pointer;transition:border-color .12s,background .12s;}
.disc-check-wrap:hover{border-color:var(--amber);}
.disc-checkbox{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .12s;background:var(--white);}
.disc-checked{background:var(--amber)!important;border-color:var(--amber)!important;color:var(--black)!important;}
.disc-check-text{font-size:12px;color:var(--black);line-height:1.6;}
.disc-check-text strong{display:block;font-size:13px;font-weight:800;margin-bottom:4px;}
.validation-box{margin-top:14px;padding:14px 16px;background:#FEF3E2;border:1px solid #FFD580;border-radius:6px;}
.validation-title{font-size:13px;font-weight:800;margin-bottom:8px;}
.validation-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#7A4800;margin-bottom:4px;}
.v-num{width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-row{display:flex;gap:10px;margin-top:18px;}
.stat{flex:1;background:var(--faint);border-radius:6px;padding:12px 14px;text-align:center;}
.stat-n{font-size:18px;font-weight:800;}
.stat-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.btn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;}
.btn{padding:11px 24px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;font-family:inherit;transition:all .12s;border:2px solid transparent;}
.btn-primary{background:var(--amber);color:var(--black);border-color:var(--amber);}
.btn-primary:hover:not(:disabled){background:#E89300;border-color:#E89300;}
.btn-secondary{background:var(--white);color:var(--black);border-color:var(--black);}
.btn-ghost{font-size:13px;font-weight:600;color:var(--muted);}
.btn-ghost:hover:not(:disabled){color:var(--black);}
.progress-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;margin-bottom:18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.progress-label{font-weight:700;}
.progress-count{color:var(--muted);}
.progress-track{height:4px;background:var(--faint);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .3s ease;}
.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.section-tab{padding:5px 12px;background:var(--white);border:1.5px solid var(--border);border-radius:20px;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;transition:all .1s;}
.section-tab.active{background:var(--black);color:var(--white);border-color:var(--black);}
.section-tab.done{border-color:var(--green);color:var(--green);}
.tab-dot{width:5px;height:5px;border-radius:50%;background:var(--border);}
.section-tab.active .tab-dot{background:var(--amber);}
.section-tab.done .tab-dot{background:var(--green);}
.q-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:10px;}
.q-text{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:14px;}
.q-ref{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:12px;margin-top:-10px;}
.ans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ans-btn{padding:9px 4px;border:1.5px solid var(--border);border-radius:4px;font-size:11px;font-weight:700;text-align:center;background:var(--white);color:var(--muted);cursor:pointer;transition:all .1s;line-height:1.3;font-family:inherit;}
.ans-btn:hover{border-color:var(--black);color:var(--black);}
.ans-green{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important;}
.ans-amber{background:var(--amber)!important;color:var(--black)!important;border-color:var(--amber)!important;}
.ans-red{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important;}
.ans-blue{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important;}
.lms-warning{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;margin:12px 0 4px;background:#FEF9EC;border:1.5px solid #FFD580;border-radius:6px;font-size:12px;color:#7A4800;line-height:1.6;}
.lms-warning-icon{flex-shrink:0;font-size:16px;margin-top:1px;}
.lms-warning strong{display:block;font-size:12px;font-weight:800;color:#5A3200;margin-bottom:3px;}
.cert-switcher{display:flex;gap:0;margin-bottom:16px;background:var(--faint);border:1px solid var(--border);border-radius:6px;padding:3px;}
.cert-switch-btn{flex:1;padding:7px 12px;font-size:12px;font-weight:700;border-radius:4px;cursor:pointer;font-family:inherit;background:none;border:none;color:var(--muted);transition:all .15s;text-align:center;}
.cert-switch-btn.active{background:var(--white);color:var(--black);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.cert-switch-btn.done{color:var(--green);}
.report-banner{border-radius:var(--r);padding:26px 30px;margin-bottom:14px;background:var(--black);color:var(--white);border-left:5px solid var(--amber);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.banner-label{font-size:10px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.banner-company{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.banner-meta{font-size:12px;color:#8A8B91;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:6px;}
.banner-score-label{font-size:10px;color:#8A8B91;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;text-align:right;}
.banner-score{font-size:54px;font-weight:800;line-height:1;letter-spacing:-2px;}
.banner-score em{color:var(--amber);font-style:normal;}
.kpi-row{display:flex;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}
.kpi-cell{flex:1;padding:16px 20px;border-right:1px solid var(--faint);}
.kpi-cell:last-child{border-right:none;}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.kpi-value{font-size:15px;font-weight:700;line-height:1.3;}
.kpi-amber{color:var(--amber);}
.summary-box{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;border-left:4px solid var(--amber);}
.summary-box-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--amber);margin-bottom:8px;}
.summary-box-text{font-size:14px;line-height:1.75;color:var(--black);}
.cert-section{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:18px;overflow:hidden;}
.cert-head{padding:15px 22px;display:flex;align-items:center;justify-content:space-between;border-left:4px solid var(--amber);background:#FFFBF0;}
.cert-head h3{font-size:16px;font-weight:800;margin-bottom:2px;}
.cert-head-reg{font-size:11px;color:var(--muted);}
.cert-head-score{font-size:30px;font-weight:800;letter-spacing:-1px;}
.cert-body{padding:22px;}
.spider-wrap{display:flex;justify-content:center;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--faint);}
.bar-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--faint);}
.bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
.bar-label{width:185px;font-size:12px;font-weight:600;flex-shrink:0;}
.bar-track{flex:1;height:7px;background:var(--faint);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-pct{width:38px;text-align:right;font-size:12px;font-weight:700;}
.gap-section h4{font-size:13px;font-weight:800;margin-bottom:12px;}
.gap-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--faint);}
.gap-row:first-of-type{border-top:none;padding-top:0;}
.gap-badge{flex-shrink:0;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:2px;margin-top:2px;}
.badge-hi{background:#FAEAEA;color:var(--red);}
.badge-mi{background:#FFF3DC;color:#7A4800;}
.badge-uk{background:#EEF4FB;color:var(--blue);}
.gap-body{flex:1;}
.gap-title{font-weight:700;font-size:13px;margin-bottom:2px;}
.gap-meta{font-size:11px;color:var(--muted);margin-bottom:6px;}
.gap-action-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:3px;}
.gap-action{font-size:12px;color:var(--muted);line-height:1.6;padding:8px 12px;background:var(--faint);border-radius:4px;border-left:3px solid var(--amber);}
.gap-none{text-align:center;padding:12px;font-size:13px;font-weight:700;color:var(--green);}
.disclaimer{font-size:11px;color:var(--muted);line-height:1.7;margin-top:20px;padding:16px 18px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);border-left:3px solid var(--amber);}
.disclaimer strong{display:block;font-size:10px;color:var(--black);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:6px;}
.cta-block{margin-top:20px;padding:26px 30px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.cta-block h3{font-size:18px;font-weight:800;margin-bottom:4px;}
.cta-block p{font-size:13px;color:var(--muted);}
.cta-link{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:var(--black);padding:13px 26px;font-size:13px;font-weight:800;border-radius:4px;white-space:nowrap;border:2px solid var(--amber);font-family:inherit;transition:all .12s;text-decoration:none;}
.cta-link:hover{background:#E89300;border-color:#E89300;}
.toc-block{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;}
.toc-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px;}
.toc-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--faint);font-size:13px;}
.toc-item:last-child{border-bottom:none;}
.toc-item-name{font-weight:600;}
.toc-item-pct{font-weight:800;font-size:13px;min-width:42px;text-align:right;}
.toc-dots{flex:1;border-bottom:1.5px dotted var(--border);margin:0 10px;margin-bottom:2px;}
.gate-wrap{min-height:100vh;background:var(--page);display:flex;align-items:center;justify-content:center;padding:32px 16px;}
.gate-box{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px 36px;max-width:480px;width:100%;}
.gate-logo{height:52px;width:auto;margin-bottom:28px;}
.gate-title{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;}
.gate-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.gate-form{display:flex;flex-direction:column;gap:14px;}
.gate-field{display:flex;flex-direction:column;gap:6px;}
.gate-label{font-size:13px;font-weight:700;color:var(--black);}
.gate-input{padding:11px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.gate-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.gate-btn{background:var(--amber);color:var(--black);border:none;border-radius:4px;padding:13px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:4px;transition:background .12s;}
.gate-btn:hover{background:#E89300;}
.gate-btn:disabled{opacity:.5;cursor:not-allowed;}
.gate-privacy{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px;padding-top:14px;border-top:1px solid var(--faint);}
.gate-facts{display:flex;gap:8px;margin-bottom:24px;}
.gate-fact{flex:1;background:var(--faint);border-radius:6px;padding:10px 12px;text-align:center;}
.gate-fact-n{font-size:16px;font-weight:800;}
.gate-fact-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.gate-success{text-align:center;padding:32px 0;}
.gate-success-icon{width:56px;height:56px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;}
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,32,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;}
.modal-box{background:var(--white);border-radius:var(--r);padding:32px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.modal-box h3{font-size:18px;font-weight:800;margin-bottom:8px;}
.modal-box p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}
.print-header{display:none;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:3px solid var(--black);}
.print-header-logo{height:72px;width:auto;display:block;}
.print-header-right{text-align:right;}
.print-header-title{font-size:15px;font-weight:800;color:var(--black);display:block;margin-bottom:3px;}
.print-header-sub{font-size:11px;color:var(--muted);}
.skip-link{position:absolute;top:-100px;left:16px;background:var(--black);color:var(--white);padding:8px 16px;border-radius:4px;font-size:13px;font-weight:700;z-index:9999;transition:top .15s;}
.skip-link:focus{top:16px;}
@page{size:A4 portrait;margin:14mm 18mm;}
@media print{
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;box-sizing:border-box!important;}
.no-print{display:none!important;}
html{width:210mm!important;}
body{background:#fff!important;width:100%!important;margin:0!important;padding:0!important;font-size:11px!important;}
.site-header{display:none!important;}
.shell{padding:0!important;margin:0!important;width:100%!important;max-width:100%!important;}
.print-header{display:flex!important;}
.report-banner{padding:16px 18px!important;}
.banner-company{font-size:18px!important;}
.banner-score{font-size:38px!important;}
.toc-block{display:block!important;break-inside:avoid;margin-bottom:12px!important;}
.cert-section,.kpi-row,.summary-box,.cta-block,.report-banner{break-inside:avoid;page-break-inside:avoid;width:100%!important;}
.gap-row{break-inside:avoid;}
.bar-label{width:140px!important;}
.cert-body{padding:14px!important;}
.kpi-cell{padding:12px 14px!important;}
}
@media(max-width:640px){
.shell{padding:24px 14px 60px;}
.page-intro h1{font-size:26px;}
.ans-grid{grid-template-columns:repeat(2,1fr);}
.report-banner{flex-direction:column;}
.banner-score-label,.banner-score{text-align:left;}
.kpi-row{flex-direction:column;}
.kpi-cell{border-right:none;border-bottom:1px solid var(--faint);}
.kpi-cell:last-child{border-bottom:none;}
.cta-block{flex-direction:column;text-align:center;}
.bar-label{width:130px;font-size:11px;}
}
</style>
</head>
<body>
<div id="root"></div>

      ]},
    ]
  },

  ssf1044:{
    id:"ssf1044",name:"SSF 1044 SWE Q",reg:"SSF 1044 utgåva 1",
    desc:"Ledningssystem för kvalitet inom inbrottslarmbranschen — Grund, Nivå 1 och Nivå 2",
    sections:[
      {id:"s1044_grund",name:"SWE Q Grund — Felhantering",questions:[
        {id:"s44_g1",text:"Finns en dokumenterad rutin för rapportering av internt upptäckta fel — orsaken utreds, korrigerande åtgärder vidtas och följs upp.",
         help:"SSF 1044 §4.1.1",action:"Ta fram en felrapporteringsrutin och ett enkelt register för att dokumentera och följa upp fel.",actionPartial:"Kontrollera att rutinen faktiskt används och att åtgärder följs upp."},
        {id:"s44_g2",text:"Korrigerande åtgärder (förebyggande, vidtagna) dokumenteras och arkiveras konsekvent.",
         help:"SSF 1044 §4.1.1",action:"Inför ett enkelt dokumentationsregister för vidtagna åtgärder.",actionPartial:"Kontrollera att dokumentationen är konsekvent och komplett."},
        {id:"s44_g3",text:"Det finns en dokumenterad rutin för hantering av kundreklamationer.",
         help:"SSF 1044 §4.1.2",action:"Ta fram en rutin för kundreklamationer med tydliga steg från mottagning till avslut.",actionPartial:"Kontrollera att rutinen är känd av all personal som möter kunder."},
        {id:"s44_g4",text:"Konstaterade kundklagomål resulterar alltid i korrigerande åtgärder som dokumenteras och följs upp.",
         help:"SSF 1044 §4.1.2",action:"Säkerställ att kundklagomål alltid utreds och åtgärdas med dokumentation.",actionPartial:"Kontrollera att uppföljning av vidtagna åtgärder faktiskt sker."},
      ]},
      {id:"s1044_n1a",name:"SWE Q Nivå 1 — Organisation",questions:[
        {id:"s44_n1",text:"Företagsledningen säkerställer aktivt att kundkrav uppfylls — t.ex. via utsedd kundkontakt.",

        {id:"s44_n2",text:"En kvalitetspolicy finns som är känd av alla — visar att alla har ansvar för kvalitet och skyldighet att verka för ständiga förbättringar.",
         help:"SSF 1044 §4.2.3",action:"Skriv en kort kvalitetspolicy och kommunicera den till all personal.",actionPartial:"Kontrollera att policyn faktiskt är känd av personalen — inte bara publicerad."},
        {id:"s44_n3",text:"En dokumenterad organisationsplan med definierade ansvar och befogenheter finns och är väl känd av alla i företaget.",
         help:"SSF 1044 §4.2.4",action:"Ta fram en enkel organisationsplan med namn, funktion och ansvarsområden.",actionPartial:"Uppdatera organisationsplanen vid förändringar och kommunicera till all personal."},
        {id:"s44_n4",text:"En kvalitetsansvarig är utsedd med befogenhet att säkra att ledningssystemet uppfyller ställda krav.",
         help:"SSF 1044 §4.2.5",action:"Utse och dokumentera en kvalitetsansvarig med tydliga befogenheter.",actionPartial:"Kontrollera att den kvalitetsansvariges roll och befogenheter är dokumenterade och kända."},
      ]},
      {id:"s1044_n1b",name:"SWE Q Nivå 1 — Processer",questions:[
        {id:"s44_n5",text:"Det finns en rutin för att fastställa produktanknutna krav — tillämpliga normer och SSF 1015-krav är förtecknade och genomgångna innan ordererkännande.",
         help:"SSF 1044 §4.2.6",action:"Upprätta en förteckning över tillämpliga normer och standarder samt en rutin för kravgenomgång.",actionPartial:"Kontrollera att förteckningen är aktuell och att kravgenomgången sker konsekvent."},
        {id:"s44_n6",text:"En rutin för anbudsgivning finns med definierat ansvar, offertformulär och rutiner för arkivering av anbud.",
         help:"SSF 1044 §4.2.7",action:"Ta fram en anbudsrutin med tydliga steg, ansvarig och arkiveringskrav.",actionPartial:"Kontrollera att rutinen följs konsekvent och att anbud arkiveras."},
        {id:"s44_n7",text:"En rutin för projektering finns som täcker ordererkännande, inköp av komponenter, tidplanering och framtagning av nödvändiga arbetsdokument.",
         help:"SSF 1044 §4.2.8",action:"Dokumentera projekterings-/orderprocessen med tydliga steg och ansvarsfördelning.",actionPartial:"Kontrollera att rutinen täcker alla steg och faktiskt följs i praktiken."},
        {id:"s44_n8",text:"En installationsrutin finns med instruktioner för planering, installation, driftsättning och dokumentation.",
         help:"SSF 1044 §4.2.9",action:"Ta fram en installationsrutin med checklistor för varje fas.",actionPartial:"Kontrollera att rutinen är aktuell och känd av alla tekniker."},
        {id:"s44_n9",text:"Rutiner för överlämnande och kundutbildning finns — utbildningen dokumenteras med innehåll, deltagare och vem som genomfört den.",
         help:"SSF 1044 §4.2.10",action:"Ta fram en överlämnanderutin och dokumentationsformulär för kundutbildning.",actionPartial:"Kontrollera att utbildningen dokumenteras konsekvent vid varje överlämning."},
        {id:"s44_n10",text:"Vid varje överlämning lämnas minst: anläggarintyg, orienteringsritning, skötselinstruktion, larmåtgärdsanvisning och kontrolljournal.",
         help:"SSF 1044 §4.2.10",action:"Skapa en checklista för vad som ska lämnas vid varje överlämning.",actionPartial:"Kontrollera att checklistan används konsekvent."},
        {id:"s44_n11",text:"Rutiner finns för serviceavtal, revisionsbesiktningar, teknisk support och akutservice.",
         help:"SSF 1044 §4.2.11",action:"Dokumentera rutiner för alla serviceformer med definierat ansvar och omfattning.",actionPartial:"Kontrollera att rutinerna täcker alla serviceformer ni erbjuder."},
      ]},
      {id:"s1044_n2",name:"SWE Q Nivå 2 — Ledning",questions:[
        {id:"s44_m1",text:"Kvalitetsansvarig och en namngiven ställföreträdare är utsedda med befogenhet att säkra att ledningssystemet uppfyller ställda krav.",
         help:"SSF 1044 §4.3.1",action:"Utse och dokumentera kvalitetsansvarig och ställföreträdare med tydliga befogenheter.",actionPartial:"Kontrollera att båda rollerna är dokumenterade och kända i organisationen."},
        {id:"s44_m2",text:"En kvalitetsmanual finns som kortfattat beskriver ledningssystemet — underhålls och uppdateras löpande.",
         help:"SSF 1044 §4.3.2",action:"Upprätta en kvalitetsmanual som beskriver systemets struktur, processer och rutiner.",actionPartial:"Kontrollera att manualen är aktuell och faktiskt underhålls."},
        {id:"s44_m3",text:"Det finns dokumenterade bevis på ledningens åtagande: informerar om externa krav, policy och mål är upprättade, ledningens genomgång genomförs, resurser tillsäkras.",
         help:"SSF 1044 §4.3.3",action:"Dokumentera ledningens åtaganden och kommunicera dem till personalen.",actionPartial:"Kontrollera att alla fyra delarna i §4.3.3 är dokumenterat uppfyllda."},
        {id:"s44_m4",text:"Mätbara kvalitetsmål är upprättade, följs upp regelbundet och är förenliga med kvalitetspolicyn.",
         help:"SSF 1044 §4.3.4",action:"Fastställ 2–4 mätbara kvalitetsmål med ansvarig och uppföljningsfrekvens.",actionPartial:"Kontrollera att målen faktiskt mäts och utvärderas regelbundet."},
        {id:"s44_m5",text:"Ansvar och befogenheter är definierade för alla befattningar och kända av berörd personal.",
         help:"SSF 1044 §4.3.5",action:"Upprätta befattningsbeskrivningar för alla roller i organisationen.",actionPartial:"Kontrollera att beskrivningarna är aktuella och kända av berörda."},
        {id:"s44_m6",text:"Processer för intern kommunikation finns som säkerställer informationsflöde och möjliggör feedback från personalen.",
         help:"SSF 1044 §4.3.6",action:"Dokumentera hur intern kommunikation sker — t.ex. via möten, mejl eller intranät.",actionPartial:"Kontrollera att kommunikationsprocesserna faktiskt fungerar och inkluderar feedback."},
        {id:"s44_m7",text:"Det finns en rutin för ledningens genomgång med planerade intervaller — underlag inkluderar kundreklamationer och interna felrapporter, beslut dokumenteras.",
         help:"SSF 1044 §4.3.7",action:"Schemalägg ledningens genomgång och fastställ vilka underlag som alltid ska ingå.",actionPartial:"Kontrollera att protokollet täcker alla krav och att beslutade åtgärder faktiskt följs upp."},
      ]},
    ]
  },

  fr2000:{
    id:"fr2000",name:"FR 2000",reg:"FR 2000:2022",
    desc:"Integrerat ledningssystem för kvalitet, miljö och arbetsmiljö",
    sections:[
      {id:"sfr_led1",name:"Ledning — Strategi & system",questions:[
        {id:"fr1",text:"Affärsidén är dokumenterad, känd av alla medarbetare och hålls aktuell — granskas minst en gång per år.",
         help:"FR 2000 §1.1",action:"Dokumentera affärsidén kortfattat och kommunicera till all personal.",actionPartial:"Kontrollera att affärsidén är aktuell och faktiskt känd av medarbetarna."},
        {id:"fr2",text:"Policy finns för kvalitet, miljö och arbetsmiljö — innehåller åtaganden om kundnöjdhet, kompetensutveckling, minskad miljöpåverkan, säkra arbetsplatser och motverkande av diskriminering.",
         help:"FR 2000 §1.2",action:"Upprätta en policy som täcker alla tre områden med konkreta åtaganden.",actionPartial:"Kontrollera att policyn uppfyller alla delar i §1.2 och är externt tillgänglig."},
        {id:"fr3",text:"Policy är känd och tillämpad i verksamheten, granskas minst en gång per år och är externt tillgänglig.",
         help:"FR 2000 §1.2",action:"Kommunicera policyn till all personal och publicera den externt (t.ex. hemsida).",actionPartial:"Kontrollera att policyn faktiskt är känd av personalen och granskas årligen."},
        {id:"fr4",text:"Mätbara mål finns för vart och ett av områdena kvalitet, miljö och arbetsmiljö — med handlingsplaner med ansvarig och tidplan.",
         help:"FR 2000 §1.3",action:"Fastställ mätbara mål per område och upprätta handlingsplaner med SMARTA-kriterierna.",actionPartial:"Kontrollera att mål finns för alla tre områden och att handlingsplanerna är kompletta."},
        {id:"fr5",text:"Ledningssystemet är dokumenterat och verksamheten beskriven som processer med identifierad ordningsföljd och gränssnitt.",
         help:"FR 2000 §1.4",action:"Dokumentera verksamhetens processer och hur de hänger samman.",actionPartial:"Kontrollera att processbeskrivningarna är aktuella och kända av medarbetarna."},
        {id:"fr6",text:"Risker och möjligheter inventeras, analyseras och värderas — åtgärder beslutas och dokumenteras.",
         help:"FR 2000 §1.5",action:"Gör en strukturerad riskanalys för hela verksamheten och dokumentera åtgärder.",actionPartial:"Kontrollera att analysen täcker kvalitet, miljö och arbetsmiljö och är aktuell."},
        {id:"fr7",text:"Tillämpliga lagar och krav är dokumenterade i förteckning(ar) — uppdateras minst en gång per år med information om hur kraven hanteras.",
         help:"FR 2000 §1.6",action:"Upprätta en laglista med tillämpliga krav, hur ni berörs och hur ni hanterar dem.",actionPartial:"Kontrollera att laglistan är aktuell och att den visar hur kraven hanteras i verksamheten."},
        {id:"fr8",text:"Rutiner finns för årlig utvärdering av att lagkrav och andra krav efterlevs — resultatet dokumenteras.",
         help:"FR 2000 §1.6",action:"Inför en annual rutinkontroll av lagefterlevnad och dokumentera resultaten.",actionPartial:"Kontrollera att utvärderingen genomförs och att resultaten används vid ledningens genomgång."},
      ]},
      {id:"sfr_led2",name:"Ledning — Organisation & kompetens",questions:[
        {id:"fr9",text:"Ansvar, arbetsuppgifter och befogenheter för alla medarbetare är klargjorda och dokumenterade — inkl. ansvar för arbetsmiljö och brandskydd.",
         help:"FR 2000 §1.7",action:"Upprätta befattningsbeskrivningar med tydligt ansvar för alla roller.",actionPartial:"Kontrollera att dokumentationen är aktuell och att brandskydds- och arbetsmiljöansvar är tydliggjort."},
        {id:"fr10",text:"Årlig kompetensanalys genomförs och utbildningsplan upprättas för att säkerställa kompetensen.",
         help:"FR 2000 §1.8",action:"Genomför en kompetensanalys och upprätta en utbildningsplan för det kommande året.",actionPartial:"Kontrollera att analysen faktiskt genomförs och att utbildningsplanen är realistisk."},
        {id:"fr11",text:"Rutiner finns för utvärdering av genomförd kompetensutveckling — dokumenteras och utbildningsbevis bevaras.",
         help:"FR 2000 §1.8",action:"Inför en rutin för att utvärdera effekten av genomförd utbildning och bevara intyg.",actionPartial:"Kontrollera att utvärderingen faktiskt sker efter genomförda utbildningar."},
        {id:"fr12",text:"Informations-, kommunikations- och rapportvägar är tydliggjorda och dokumenterade — internt och externt.",
         help:"FR 2000 §1.9",action:"Dokumentera hur information flödar i organisationen — för order, avvikelser, miljö, nödläge m.m.",actionPartial:"Kontrollera att kommunikationsvägarna är kända av medarbetarna."},
      ]},
      {id:"sfr_led3",name:"Ledning — Miljö, Arbetsmiljö & Säkerhet",questions:[
        {id:"fr13",text:"Rutiner finns för systematiskt arbetsmiljöarbete — risker bedöms, betydande risker hanteras enligt åtgärdstrappan och handlingsplaner upprättas.",
         help:"FR 2000 §1.10",action:"Implementera systematiskt arbetsmiljöarbete med riskbedömning och åtgärdsplan.",actionPartial:"Kontrollera att riskbedömningen täcker alla arbetsmoment och att åtgärdstrappan tillämpas."},
        {id:"fr14",text:"Miljöaspekter är inventerade och dokumenterade ur ett livscykelperspektiv — betydande aspekter identifierade och miljöaspektsförteckning hålls aktuell.",
         help:"FR 2000 §1.11",action:"Gör en miljöutredning och identifiera era viktigaste miljöaspekter.",actionPartial:"Kontrollera att förteckningen är uppdaterad och att mål finns för betydande aspekter."},
        {id:"fr15",text:"Dokumenterade rutiner finns för brandskydd — täcker förebyggande åtgärder, ansvarsfördelning och nödlägesplanering.",
         help:"FR 2000 §1.12",action:"Upprätta en brandskyddsdokumentation som täcker alla delar i §1.12.",actionPartial:"Kontrollera att brandskyddsdokumentationen är aktuell och att ansvaret är tydliggjort."},
        {id:"fr16",text:"Dokumenterade rutiner finns för beredskap vid nödläge — inkl. kemikalieförteckning med säkerhetsdatablad samt rutiner för första hjälpen.",
         help:"FR 2000 §1.13",action:"Upprätta nödlägesprocedurer, kemikalieförteckning med SDS och rutiner för första hjälpen.",actionPartial:"Kontrollera att rutinerna är kända av personalen och att övningar genomförs."},
        {id:"fr17",text:"Dokumenterade rutiner finns för att skydda verksamheten och information mot förlust, skada och obehörig åtkomst.",
         help:"FR 2000 §1.14",action:"Upprätta säkerhetsrutiner för IT, back-up, skalskydd och behörighetshantering.",actionPartial:"Kontrollera att säkerhetsrutinerna täcker alla aspekter i §1.14."},
      ]},
      {id:"sfr_led4",name:"Ledning — Förbättring & uppföljning",questions:[
        {id:"fr18",text:"Dokumenterade rutiner finns för avvikelsehantering på alla nivåer — grundorsak utreds och korrigerande åtgärder vidtas.",
         help:"FR 2000 §1.15",action:"Inför ett avvikelseregister med process för utredning, åtgärd och uppföljning.",actionPartial:"Kontrollera att rutinen täcker alla typer av avvikelser och faktiskt används."},
        {id:"fr19",text:"Dokumenterade rutiner finns för internrevision — genomförs minst en gång per år och alla processer ingår i programmet.",
         help:"FR 2000 §1.16",action:"Upprätta ett revisionsprogram och planera första revisionen.",actionPartial:"Kontrollera att revisionen täcker alla processer och att resultat rapporteras till ledningen."},
        {id:"fr20",text:"Ledningens genomgång genomförs minst en gång per år och täcker: åtgärdsstatus, lagefterlevnad, mål, avvikelser, revisionsresultat, kundnöjdhet, policy och resurser.",
         help:"FR 2000 §1.17",action:"Schemalägg ledningens genomgång och sätt en fast agenda som täcker alla §1.17-punkter.",actionPartial:"Kontrollera att protokollet täcker alla obligatoriska punkter och att åtgärder följs upp."},
      ]},
      {id:"sfr_mark",name:"Marknadsföring & försäljning",questions:[
        {id:"fr21",text:"Marknadsaktiviteter beskrivs i en dokumenterad marknadsplan baserad på affärsidé och policy.",
         help:"FR 2000 §2.1",action:"Upprätta en enkel marknadsplan med planerade aktiviteter för det kommande året.",actionPartial:"Kontrollera att marknadsplanen är aktuell och förankrad i affärsidé och policy."},
        {id:"fr22",text:"Alla kundkrav och legala krav identifieras på inkommande förfrågningar och besvaras i rätt tid.",
         help:"FR 2000 §2.2",action:"Inför en rutin för kravidentifiering vid förfrågningar med checklistor.",actionPartial:"Kontrollera att rutinen tillämpas konsekvent och täcker legala krav."},
        {id:"fr23",text:"Rutiner finns för orderhantering — order tas emot, registreras, granskas och ordererkännande ges kunden.",
         help:"FR 2000 §2.3",action:"Dokumentera orderprocessen från förfrågan till ordererkännande.",actionPartial:"Kontrollera att ordererkännande alltid ges kunden — även vid muntliga order."},
        {id:"fr24",text:"Metoder finns för att inhämta och analysera information om kundtillfredsställelse — dokumenteras och bevaras.",
         help:"FR 2000 §2.4",action:"Inför en enkel metod för kundmätning — t.ex. enkät efter avslutat uppdrag.",actionPartial:"Kontrollera att kundmätningen faktiskt genomförs och att resultaten analyseras."},
      ]},
      {id:"sfr_utv",name:"Produktutveckling",questions:[
        {id:"fr25",text:"Krav för utveckling av varor/tjänster identifieras och dokumenteras — inkl. kundkrav, myndighetskrav och livscykelperspektiv. (Ej tillämpligt om ni ej utvecklar egna produkter/tjänster.)",
         help:"FR 2000 §3.1 — Gäller företag som utvecklar egna varor eller tjänster. Om ni enbart installerar och servicar andra tillverkares produkter kan detta krav vara ej tillämpligt — men undantaget ska dokumenteras.",action:"Identifiera och dokumentera krav för er produktutveckling.",actionPartial:"Kontrollera att kraven täcker alla relevanta aspekter inklusive livscykelperspektiv."},
        {id:"fr26",text:"Styrning av utvecklingsarbetet är beskrivet — genomgångar, utprovningar och ändringar dokumenteras. (Ej tillämpligt om ni ej utvecklar egna produkter/tjänster.)",
         help:"FR 2000 §3.2 — Ej tillämpligt om ni enbart installerar/servicar utan produktutveckling.",action:"Dokumentera er utvecklingsprocess med tydliga steg och beslutspunkter.",actionPartial:"Kontrollera att alla steg i §3.2 är täckta i er dokumentation."},
      ]},
      {id:"sfr_inkop",name:"Inköp",questions:[
        {id:"fr27",text:"Dokumenterade rutiner finns för styrning och kontroll av inköp av varor och tjänster.",
         help:"FR 2000 §4.1",action:"Upprätta inköpsrutiner med krav på kvalitet, miljö och leveranssäkerhet.",actionPartial:"Kontrollera att rutinerna täcker alla typer av inköp inkl. utlagda processer."},
        {id:"fr28",text:"Leverantörer bedöms och väljs baserat på dokumenterade kriterier — godkänd leverantörsförteckning upprättas och hålls aktuell.",
         help:"FR 2000 §4.2",action:"Upprätta en leverantörslista med dokumenterade urvalskriterier.",actionPartial:"Kontrollera att listan är aktuell och att bedömningskriterierna inkluderar miljö och kvalitet."},
        {id:"fr29",text:"Leverantörers förmåga utvärderas minst en gång per år — rapporteras vid ledningens genomgång.",
         help:"FR 2000 §4.2",action:"Inför en annual leverantörsutvärdering och koppla den till ledningens genomgång.",actionPartial:"Kontrollera att utvärderingen faktiskt genomförs och dokumenteras."},
        {id:"fr30",text:"Mottagningskontroll av inköpta varor och tjänster genomförs och dokumenteras.",
         help:"FR 2000 §4.3",action:"Definiera hur mottagningskontroll ska genomföras och dokumenteras.",actionPartial:"Kontrollera att mottagningskontrollen tillämpas konsekvent."},
      ]},
      {id:"sfr_prod",name:"Produktion, leverans & extern plats",questions:[
        {id:"fr31",text:"Dokumenterade rutiner finns för produktion och leverans — täcker produktionsstyrning, kontroll, underhåll av utrustning och leverans.",
         help:"FR 2000 §5",action:"Dokumentera produktions- och leveransprocessen med checklistor och kontrollpunkter.",actionPartial:"Kontrollera att rutinerna täcker alla delar i §5."},
        {id:"fr32",text:"Rutiner finns för planering och arbete på extern plats — täcker kompetens/behörigheter, säkerhet/miljö/brand, planering och slutkontroll.",
         help:"FR 2000 §6",action:"Upprätta rutiner för arbete på extern plats med tydliga krav för varje uppdragstyp.",actionPartial:"Kontrollera att slutkontroll dokumenteras och att dokumentation bevaras."},
      ]},
    ]
  },

  iso9001:{
    id:"iso9001",name:"ISO 9001",reg:"SS-EN ISO 9001:2015",
    desc:"Kvalitetsledningssystem för anläggarfirmor inom brand och säkerhet",
    sections:[
      {id:"iso_kontext",name:"Organisationens kontext",questions:[
        {id:"iso_k_1",text:"Har ni kartlagt externa och interna faktorer som påverkar er förmåga att leverera med rätt kvalitet?",
         help:"ISO 9001:2015 §4.1",action:"Dokumentera de viktigaste externa och interna faktorerna. Uppdatera minst en gång per år.",actionPartial:"Gå igenom om er nuvarande analys är aktuell och täcker båda dimensionerna."},
        {id:"iso_k_2",text:"Har ni identifierat vilka intressenter som ställer krav på er verksamhet och vad dessa krav innebär?",
         help:"ISO 9001:2015 §4.2",action:"Ta fram en intressentlista med krav kopplade till era rutiner.",actionPartial:"Gå igenom om listan är komplett och aktuell."},
        {id:"iso_k_3",text:"Är kvalitetsledningssystemets omfattning definierad och dokumenterad?",
         help:"ISO 9001:2015 §4.3",action:"Skriv en kort beskrivning av systemets omfattning — vad ingår och vad ingår inte.",actionPartial:"Kontrollera att avgränsningen stämmer med er faktiska verksamhet."},
      ]},
      {id:"iso_ledarskap",name:"Ledarskap, policy & mål",questions:[
        {id:"iso_l_1",text:"Finns en kvalitetspolicy med förbättringsåtagande som är kommunicerad och känd av personalen?",
         help:"ISO 9001:2015 §5.2",action:"Skriv en enkel kvalitetspolicy och kommunicera den med dokumenterad bekräftelse.",actionPartial:"Kontrollera att policyn uppfyller §5.2:s fyra krav och faktiskt är känd av personalen."},
        {id:"iso_l_2",text:"Är ansvar och befogenheter för kvalitetsrelaterade roller tydligt fördelade, dokumenterade och kommunicerade?",
         help:"ISO 9001:2015 §5.3",action:"Ta fram ansvarsmatris eller befattningsbeskrivningar som täcker §5.3:s fyra punkter.",actionPartial:"Gå igenom om befintlig ansvarsfördelning täcker alla §5.3-krav."},
        {id:"iso_l_3",text:"Finns dokumenterade, mätbara kvalitetsmål med plan för hur de ska uppnås?",
         help:"ISO 9001:2015 §6.2",action:"Sätt 3–5 konkreta och mätbara mål med ansvarig och uppföljningsdatum.",actionPartial:"Gå igenom befintliga mål mot §6.2:s krav."},
      ]},
      {id:"iso_planering",name:"Riskbaserat tänkande",questions:[
        {id:"iso_p_1",text:"Har ni identifierat risker och möjligheter och planerat åtgärder för att hantera dem?",
         help:"ISO 9001:2015 §6.1",action:"Gör en enkel riskanalys i tabellform med åtgärder per risk.",actionPartial:"Kontrollera att analysen är kopplad till konkreta åtgärder och uppdateras vid förändringar."},
        {id:"iso_p_2",text:"Finns rutiner för att planera förändringar av kvalitetsledningssystemet på ett kontrollerat sätt?",
         help:"ISO 9001:2015 §6.3",action:"Ta fram en enkel rutin för förändringsplanering.",actionPartial:"Kontrollera att systemförändringar faktiskt planeras och inte sker ad hoc."},
      ]},
      {id:"iso_stod",name:"Kompetens & dokumentation",questions:[
        {id:"iso_s_1",text:"Har ni bestämt nödvändig kompetens per roll, säkerställt att personalen har den och bevarat bevis?",
         help:"ISO 9001:2015 §7.2",action:"Skapa en kompetensmatris med dokumenterad kompetens per person och åtgärdsplan för luckor.",actionPartial:"Uppdatera matrisen med delar som saknas och lägg till förnyelsedatum för tidsbegränsade certifikat."},
        {id:"iso_s_2",text:"Finns rutiner för att skapa, uppdatera och styra dokumenterad information — inkl. versionshantering och skydd?",
         help:"ISO 9001:2015 §7.5",action:"Inför ett enkelt dokumentstyrningssystem med versionsmärkning och central plats för aktuella versioner.",actionPartial:"Gå igenom om versionshanteringen fungerar i praktiken."},
        {id:"iso_s_3",text:"Finns rutiner för att bevara och överföra kritisk verksamhetskunskap vid personalomsättning?",
         help:"ISO 9001:2015 §7.1.6",action:"Identifiera kritisk kunskap och dokumentera den i rutiner, systemdokumentation och kundmappar.",actionPartial:"Gå igenom vilken kritisk kunskap som fortfarande är odokumenterad."},
      ]},
      {id:"iso_verksamhet",name:"Verksamhet & leveranskvalitet",questions:[
        {id:"iso_v_1",text:"Fångar ni upp, granskar och dokumenterar kundkrav innan ett uppdrag accepteras — inkl. tillämpliga regelverk?",
         help:"ISO 9001:2015 §8.2.2–8.2.3",action:"Inför en rutin för uppdragsgranskning som dokumenterar kravgenomgången.",actionPartial:"Kontrollera att rutinen används konsekvent och täcker alla §8.2.3-punkter."},
        {id:"iso_v_2a",text:"Finns rutiner för att verifiera att arbetet uppfyller kraven — t.ex. via slutkontrollchecklista — innan överlämning?",
         help:"ISO 9001:2015 §8.6",action:"Ta fram en slutkontrollchecklista anpassad till era tjänster.",actionPartial:"Kontrollera att checklistan används konsekvent vid alla uppdragstyper."},
        {id:"iso_v_2b",text:"Dokumenteras godkännandeprocessen med spårbarhet till vem som godkänt leveransen och när?",
         help:"ISO 9001:2015 §8.6",action:"Definiera vem som godkänner leverans och dokumentera det med namn och datum.",actionPartial:"Kontrollera att godkännandet faktiskt dokumenteras med spårbarhet per uppdrag."},
        {id:"iso_v_3",text:"Finns rutiner för att säkerställa att externt tillhandahållna produkter och tjänster uppfyller era krav?",
         help:"ISO 9001:2015 §8.4",action:"Upprätta lista på godkända leverantörer med dokumenterade urvalskriterier och uppföljningsrutin.",actionPartial:"Gå igenom befintlig leverantörslista — finns dokumenterade urvalskriterier? Sker löpande uppföljning?"},
        {id:"iso_v_4",text:"Finns rutiner för att identifiera, styra och dokumentera avvikande processresultat?",
         help:"ISO 9001:2015 §8.7",action:"Inför ett avvikelsesystem med spårbarhet till beslutsfattare och hantering av avvikelser efter leverans.",actionPartial:"Kontrollera att rutinerna täcker §8.7:s krav — spårbarhet till beslutsfattare."},
      ]},
      {id:"iso_uppfoljning",name:"Utvärdering & förbättring",questions:[
        {id:"iso_u_1a",text:"Mäts kundtillfredsställelse systematiskt — med en definierad metod?",
         help:"ISO 9001:2015 §9.1.2",action:"Inför en enkel kundmätningsrutin med enkät efter avslutat uppdrag.",actionPartial:"Kontrollera att mätmetoden faktiskt används konsekvent."},
        {id:"iso_u_1b",text:"Används kundmätningens resultat som underlag vid ledningens genomgång och för konkreta förbättringsåtgärder?",
         help:"ISO 9001:2015 §9.1.2 och §9.3.2",action:"Säkerställ att kundnöjdhetsresultat ingår som fast punkt vid ledningens genomgång.",actionPartial:"Kontrollera att resultaten faktiskt leder till konkreta förbättringsåtgärder."},
        {id:"iso_u_2",text:"Analyseras verksamhetsdata regelbundet för att utvärdera processprestanda, måluppfyllelse och riskåtgärder?",
         help:"ISO 9001:2015 §9.1.3",action:"Inför en kvartalsvis dataanalys av reklamationer, kundnöjdhet, måluppfyllelse och leverantörsprestanda.",actionPartial:"Kontrollera att analysen täcker alla §9.1.3-punkter."},
        {id:"iso_u_3",text:"Genomförs interna revisioner med planerade intervall — med dokumenterat revisionsprogram och uppföljning?",
         help:"ISO 9001:2015 §9.2",action:"Upprätta ett revisionsprogram med minst en internrevision per år.",actionPartial:"Kontrollera att programmet täcker alla processer och att korrigerande åtgärder verkligen genomförs."},
        {id:"iso_u_4",text:"Genomför ledningen regelbundna genomgångar med §9.3:s underlag och dokumenterar beslut om resurser och förbättringar?",
         help:"ISO 9001:2015 §9.3",action:"Schemalägg ledningens genomgång och förbered underlag som täcker alla §9.3.2-punkter.",actionPartial:"Gå igenom senaste protokollet mot §9.3.2-listan."},
        {id:"iso_u_5",text:"Finns ett system för avvikelse och korrigerande åtgärd med rotorsaksanalys och verifikation att åtgärderna fungerat?",
         help:"ISO 9001:2015 §10.2",action:"Inför ett avvikelsesystem med kolumnerna: avvikelse, rotorsak, åtgärd, ansvarig, uppföljning, verifikation.",actionPartial:"Kontrollera att rotorsaksanalys faktiskt genomförs och att åtgärdernas verkan verifieras."},
      ]},
    ]
  },

  iso27001:{
    id:"iso27001",name:"ISO 27001",reg:"SS-ISO/IEC 27001:2022",
    desc:"Ledningssystem för informationssäkerhet",
    sections:[
      {id:"i27_kontext",name:"Kontext & systemomfattning",questions:[
        {id:"i27_k_1",text:"Har ni kartlagt externa och interna faktorer som påverkar er informationssäkerhet och identifierat relevanta intressenters krav?",

// ── Hjälpfunktioner ──
const secPct=(sec,ans)=>{
  let s=0,t=0;
  sec.questions.forEach(q=>{
    const a=ans[q.id];if(!a||a==="vet_ej")return;
    const d=ANSWERS.find(x=>x.key===a);if(d&&d.score!==null){s+=d.score;t++;}
  });
  return{pct:t>0?Math.round(s/t*100):null,done:sec.questions.filter(q=>ans[q.id]).length,total:sec.questions.length};
};
const stdPct=(std,ans)=>{
  let s=0,t=0,done=0,total=0;
  std.sections.forEach(sec=>sec.questions.forEach(q=>{
    total++;const a=ans[q.id];if(a)done++;
    if(a&&a!=="vet_ej"){const d=ANSWERS.find(x=>x.key===a);if(d&&d.score!==null){s+=d.score;t++;}}
  }));
  return{pct:t?Math.round(s/t*100):null,done,total};
};
const barColor=p=>p===null?"#E8E9EC":p>=80?"#1B6B3F":p>=50?"#FFA300":"#C03535";
const timeUntil=p=>{
  if(p===null)return"Otillräckligt underlag";
  if(p>=85)return"0–3 månader";if(p>=65)return"3–6 månader";
  if(p>=40)return"6–12 månader";return"12+ månader";
};
const readiness=p=>{
  if(p===null)return"Otillräckligt underlag";
  if(p>=85)return"Mycket god beredskap";if(p>=65)return"God beredskap — luckor finns";
  if(p>=40)return"Delvis förberedd";return"Grundarbete återstår";
};
const today=()=>new Date().toLocaleDateString("sv-SE",{day:"numeric",month:"long",year:"numeric"});

function generateSummary(active,answers,company,overall){
  const name=company||"Er organisation";
  const hiCount=std=>std.sections.reduce((n,sec)=>n+sec.questions.filter(q=>answers[q.id]==="ej").length,0);
  const miCount=std=>std.sections.reduce((n,sec)=>n+sec.questions.filter(q=>answers[q.id]==="delvis").length,0);
  const totalHi=active.reduce((n,s)=>n+hiCount(s),0);
  const totalMi=active.reduce((n,s)=>n+miCount(s),0);
  const multi=active.length>1;
  let intro="";
  if(overall>=85)intro=`${name} befinner sig i ett mycket gott läge inför ${multi?"certifieringarna":"certifieringen"} med ${overall}% samlad beredskap.`;
  else if(overall>=65)intro=`${name} har byggt upp en god grund med ${overall}% samlad beredskap. Arbetet är till stor del påbörjat, men ett antal viktiga pusselbitar behöver falla på plats.`;
  else if(overall>=40)intro=`${name} är på väg i rätt riktning med ${overall}% samlad beredskap, men det kvarstår ett mer strukturerat arbete inom flera områden.`;
  else if(overall!==null)intro=`Självskattningen visar att ${name} befinner sig i ett tidigt skede av sin certifieringsresa med ${overall}% samlad beredskap.`;
  else intro=`Självskattningen för ${name} ger en övergripande bild av er beredskap inför ${multi?"certifieringarna":"certifieringen"}.`;
  let gaps="";
  if(totalHi>0)gaps=`Kartläggningen identifierar ${totalHi} krav som ännu inte påbörjats och ${totalMi} som delvis är på plats. Prioritera de opåbörjade kraven för att komma vidare mot revision.`;
  else if(totalMi>0)gaps=`Det finns inga krav som helt saknas, men ${totalMi} krav behöver slutföras.`;
  let closing=overall>=80?"Nästa naturliga steg är att stämma av detaljerna och boka ett inledande samtal med SBSC.":overall>=60?`Med fokuserat åtgärdsarbete bör certifiering vara möjlig inom ${timeUntil(overall).toLowerCase()}. Kontakta SBSC tidigt för att stämma av er plan.`:`Rekommendationen är att börja med de högt prioriterade kraven systematiskt. Räkna med ${timeUntil(overall).toLowerCase()} innan revision är aktuellt.`;
  return[intro,gaps,closing].filter(Boolean).join(" ");
}

function Spider({sections,answers,size=220}){
  const [tooltip,setTooltip]=React.useState(null);
  const cx=size/2,cy=size/2,R=size*0.30,n=sections.length;
  if(n<3)return null;
  const ang=i=>(i*2*Math.PI/n)-Math.PI/2;
  const pt=(i,r)=>({x:cx+r*Math.cos(ang(i)),y:cy+r*Math.sin(ang(i))});
  const vals=sections.map((s,i)=>{const{pct}=secPct(s,answers);return{name:s.name,v:pct!=null?pct/100:0,i,pct};});
  const dpts=vals.map(({v,i})=>{const p=pt(i,v*R);return`${p.x},${p.y}`;}).join(" ");
  const lR=R*1.36;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{overflow:"visible",cursor:"default"}}>
      {[.25,.5,.75,1].map((lv,j)=>{
        const ps=sections.map((_,i)=>{const p=pt(i,lv*R);return`${p.x},${p.y}`;}).join(" ");
        return<polygon key={j} points={ps} fill="none" stroke="#E8E9EC" strokeWidth={j===3?1.5:1}/>;
      })}
      {vals.map(({i})=>{const e=pt(i,R);return<line key={i} x1={cx} y1={cy} x2={e.x} y2={e.y} stroke="#E8E9EC" strokeWidth="1"/>;})}
      <polygon points={dpts} fill="#FFA300" fillOpacity=".16" stroke="#FFA300" strokeWidth="2" strokeLinejoin="round"/>
      {vals.map(({v,i,name,pct})=>{
        const p=pt(i,v*R);
        return(
          <g key={i} onMouseEnter={()=>setTooltip({x:p.x,y:p.y,name,pct})} onMouseLeave={()=>setTooltip(null)} style={{cursor:"pointer"}}>
            <circle cx={p.x} cy={p.y} r="12" fill="transparent"/>
            <circle cx={p.x} cy={p.y} r="4.5" fill="#FFA300" stroke="#fff" strokeWidth="2"/>
          </g>
        );
      })}
      {vals.map(({name,i})=>{
        const lp=pt(i,lR),cv=Math.cos(ang(i));
        const anchor=cv>.15?"start":cv<-.15?"end":"middle";
        return<text key={i} x={lp.x} y={lp.y} textAnchor={anchor} dominantBaseline="middle" fontSize="9.5" fontWeight="700" fill="#4A4B52" fontFamily="Open Sans,sans-serif">{name.length>22?name.slice(0,20)+"…":name}</text>;
      })}
      {[25,50,75].map((v,i)=>{const lp=pt(0,v/100*R);return<text key={i} x={lp.x+3} y={lp.y-2} fontSize="7" fill="#C0C0C0" fontFamily="Open Sans,sans-serif">{v}%</text>;})}
      {tooltip&&(
        <g>
          <rect x={tooltip.x-58} y={tooltip.y-38} width="116" height="32" rx="4" fill="#101820" opacity=".93"/>
          <text x={tooltip.x} y={tooltip.y-26} textAnchor="middle" fontSize="10" fontWeight="700" fill="white" fontFamily="Open Sans,sans-serif">{tooltip.name.length>18?tooltip.name.slice(0,16)+"…":tooltip.name}</text>
          <text x={tooltip.x} y={tooltip.y-13} textAnchor="middle" fontSize="11" fontWeight="800" fill="#FFA300" fontFamily="Open Sans,sans-serif">{tooltip.pct!==null?`${tooltip.pct}%`:"Vet ej"}</text>
        </g>
      )}
    </svg>
  );
}

function TocBlock({active,answers}){
  if(active.length<2)return null;
  return(
    <div className="toc-block">
      <div className="toc-title">Innehåll — certifieringar i denna rapport</div>
      {active.map(std=>{
        const sc=stdPct(std,answers);
        const clr=sc.pct===null?"var(--muted)":sc.pct>=80?"var(--green)":sc.pct>=50?"var(--amber)":"var(--red)";
        return(
          <div className="toc-item" key={std.id}>
            <span className="toc-item-name">{std.name}<span style={{fontSize:11,color:"var(--muted)",fontWeight:400,marginLeft:6}}>{std.reg}</span></span>
            <span className="toc-dots"/>
            <span className="toc-item-pct" style={{color:clr}}>{sc.pct!==null?`${sc.pct}%`:"—"}</span>
          </div>
        );
      })}
    </div>
  );
}

function CertSection({std,answers}){
  const sc=stdPct(std,answers);
  const gaps=[];
  std.sections.forEach(sec=>sec.questions.forEach(q=>{
    const a=answers[q.id];
    if(a==="ej")gaps.push({pri:"hi",lbl:"Prioritera",cls:"badge-hi",sec:sec.name,q:q.text,albl:"Så här börjar ni",act:q.action||null});
    else if(a==="delvis")gaps.push({pri:"mi",lbl:"Slutför",cls:"badge-mi",sec:sec.name,q:q.text,albl:"Så här kompletterar ni",act:q.actionPartial||q.action||null});
    else if(a==="vet_ej")gaps.push({pri:"uk",lbl:"Kontrollera",cls:"badge-uk",sec:sec.name,q:q.text,act:null});
  }));
  gaps.sort((a,b)=>({hi:0,mi:1,uk:2}[a.pri]-{hi:0,mi:1,uk:2}[b.pri]));
  return(
    <div className="cert-section">
      <div className="cert-head">
        <div><h3>{std.name}</h3><div className="cert-head-reg">{std.reg}</div></div>
        <div className="cert-head-score">{sc.pct!=null?`${sc.pct}%`:"—"}</div>
      </div>
      <div className="cert-body">
        <div className="spider-wrap"><Spider sections={std.sections} answers={answers}/></div>
        <div className="bar-section">
          {std.sections.map(s=>{const{pct}=secPct(s,answers);return(
            <div className="bar-row" key={s.id}>
              <div className="bar-label">{s.name}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${pct||0}%`,background:barColor(pct)}}/></div>
              <div className="bar-pct">{pct!=null?`${pct}%`:"—"}</div>
            </div>);})}
        </div>
        <div className="gap-section">
          {gaps.length>0?(
            <>
              <h4>Prioriterade åtgärder — {std.name}</h4>
              {gaps.map((g,i)=>(
                <div className="gap-row" key={i}>
                  <span className={`gap-badge ${g.cls}`}>{g.lbl}</span>
                  <div className="gap-body">
                    <div className="gap-title">{g.q}</div>
                    <div className="gap-meta">{std.name} · {g.sec}</div>
                    {g.act&&(
                      <>
                        <div className="gap-action-label">{g.albl}</div>
                        <div className="gap-action">{g.act}</div>
                      </>
                    )}
                  </div>
                </div>
              ))}
            </>
          ):(
            <div className="gap-none">✓ Inga identifierade gap för {std.name}</div>
          )}
        </div>
      </div>
    </div>
  );
}

            </div>
            <form style={{display:"flex",flexDirection:"column",gap:14}} onSubmit={handleSubmit}>
              <div className="gate-field"><label className="gate-label">Ditt namn *</label><input className="gate-input" type="text" required placeholder="För- och efternamn" value={name} onChange={e=>setName(e.target.value)}/></div>
              <div className="gate-field"><label className="gate-label">Företagets namn *</label><input className="gate-input" type="text" required placeholder="T.ex. Andersson Larm & Säkerhet AB" value={company} onChange={e=>setCompany(e.target.value)}/></div>
              <div className="gate-field"><label className="gate-label">E-postadress *</label><input className="gate-input" type="email" required placeholder="namn@foretag.se" value={email} onChange={e=>setEmail(e.target.value)}/></div>
              <div className="gate-field">
                <label className="gate-label">Vilken certifiering är ni intresserade av?</label>
                <select className="gate-input" value={interest} onChange={e=>setInterest(e.target.value)}>
                  <option value="">Välj certifiering (valfritt)</option>
                  <option>Brandlarm (SBF 1008:3)</option>
                  <option>Inbrottslarm (SSF 1015:3)</option>
                  <option>Kamerabevakning (SSF 1061:3)</option>
                  <option>SSF 1044 SWE Q</option>
                  <option>FR 2000</option>
                  <option>ISO 9001</option>
                  <option>ISO 27001</option>
                  <option>Flera certifieringar</option>
                  <option>Vet ej ännu</option>
                </select>
              </div>
              <button className="gate-btn" type="submit" disabled={loading}>{loading?"Skickar…":"Starta självutvärderingen →"}</button>
              <p className="gate-privacy">SBSC behandlar dina uppgifter enligt GDPR. Självskattningens svar lagras aldrig.</p>
            </form>
          </>
        ):(
          <div className="gate-success">
            <div className="gate-success-icon">✓</div>
            <h2>Tack, {name.split(" ")[0]}!</h2>
            <p>Vi har mottagit dina uppgifter. Nu kan du starta självutvärderingen.</p>
            <button className="gate-btn" style={{display:"inline-block",width:"auto",padding:"13px 32px"}} onClick={()=>onSuccess(company)}>Starta självutvärderingen →</button>
          </div>
        )}
      </div>
    </div>
  );
}

function QCard({q,i,answers,answer,lmsWarning,picked}){
  const [open,setOpen]=React.useState(false);
  const answered=answers[q.id];
  return(
    <div className="q-card">
      <div className="q-text">{i+1}. {q.text}</div>
      {q.help&&<div className="q-ref">{q.help}</div>}
      <div className="ans-grid">
        {ANSWERS.map(a=>(
          <button key={a.key} className={`ans-btn${answers[q.id]===a.key?" "+a.cls:""}`} onClick={()=>answer(q.id,a.key)}>{a.label}</button>
        ))}
      </div>
      {lmsWarning&&answered==="ej"&&(
        <div className="lms-warning">
          <span className="lms-warning-icon">⚠️</span>
          <div>
            <strong>Vanligaste bromsen — ledningssystemet</strong>
            {LMS_WARNING[lmsWarning]}
          </div>
        </div>
      )}
    </div>
  );
}

function QPage({active,curStd,curSec,stdIdx,secIdx,answers,answer,prog,doneQ,totalQ,goNext,goPrev,isFirst,isLast,secDone,jump,picked}){
  return(
    <>
      {active.length>1&&(
        <div className="cert-switcher no-print">
          {active.map((std,i)=>{
            const allDone=std.sections.every(sec=>sec.questions.every(q=>answers[q.id]));
            const isAct=i===stdIdx;
            return(
              <button key={std.id} className={`cert-switch-btn${isAct?" active":""}${allDone?" done":""}`} onClick={()=>jump(i,0)}>
                {allDone&&!isAct?"✓ ":""}{std.name}
              </button>
            );
          })}
        </div>
      )}
      <div className="progress-bar no-print">
        <div className="progress-top">
          <span className="progress-label">{curStd.name} · {curSec.name}</span>
          <span className="progress-count">{doneQ}/{totalQ} svar · {prog}%</span>
        </div>
        <div className="progress-track" role="progressbar" aria-valuenow={prog} aria-valuemin={0} aria-valuemax={100}><div className="progress-fill" style={{width:`${prog}%`}}/></div>
      </div>
      <div className="section-tabs no-print">
        {curStd.sections.map((sec,i)=>{
          const{done,total}=secPct(sec,answers);
          const isAct=i===secIdx,isDone=done===total;
          return(
            <button key={sec.id} className={`section-tab${isAct?" active":""}${isDone&&!isAct?" done":""}`} onClick={()=>jump(stdIdx,i)}>
              <span className="tab-dot"/>{sec.name}
            </button>
          );
        })}
      </div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",color:"var(--muted)",marginBottom:4}}>{curStd.name} · {curStd.reg}</div>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>{curSec.name}</h2>
        <p style={{fontSize:13,color:"var(--muted)"}}>Välj "Vet ej" om frågan behöver kontrolleras internt.</p>
      </div>
      {curSec.questions.map((q,i)=>(
        <QCard key={q.id} q={q} i={i} answers={answers} answer={answer} lmsWarning={curSec.lmsWarning} picked={picked}/>
      ))}
      <div className="btn-row no-print">
        <button className="btn-ghost" onClick={goPrev} disabled={isFirst}>← Föregående</button>
        <button className="btn btn-primary" onClick={goNext} disabled={!secDone}>{isLast?"Visa rapport →":"Nästa →"}</button>
      </div>
      {!secDone&&<div style={{textAlign:"right",fontSize:11,color:"var(--muted)",marginTop:8}}>Besvara alla frågor för att gå vidare.</div>}
    </>
  );
}

function ReportPage({active,answers,company,agreed,restart,back}){
  let s=0,t=0;
  active.forEach(std=>std.sections.forEach(sec=>sec.questions.forEach(q=>{
    const a=answers[q.id];if(a&&a!=="vet_ej"){const d=ANSWERS.find(x=>x.key===a);if(d&&d.score!==null){s+=d.score;t++;}}
  })));
  const overall=t?Math.round(s/t*100):null;
  const hiG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="ej").length,0),0);
  const miG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="delvis").length,0),0);
  const vetEjG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="vet_ej").length,0),0);
  const ds=today();
  const summary=generateSummary(active,answers,company,overall);
  return(
    <>
      <div className="print-header">
        <img src={LOGO} alt="SBSC" className="print-header-logo"/>
        <div className="print-header-right">
          <span className="print-header-title">Certifieringsberedskapsanalys</span>
          <span className="print-header-sub">{ds} · SBSC ackrediterat av SWEDAC (nr 1631)</span>
        </div>
      </div>
      <TocBlock active={active} answers={answers}/>
      <div className="report-banner">
        <div>
          <div className="banner-label">Certifieringsberedskapsanalys · SBSC</div>
          <div className="banner-company">{company||"Ert företag"}</div>
          <div className="banner-meta">
            <span>{ds}</span>
            <span>{active.map(s=>s.name).join(" · ")}</span>
          </div>
        </div>
        <div>
          <div className="banner-score-label">Samlad beredskap</div>
          <div className="banner-score">{overall!=null?<>{overall}<em>%</em></>:"—"}</div>
        </div>
      </div>
      <div className="kpi-row">
        <div className="kpi-cell"><div className="kpi-label">Bedömning</div><div className="kpi-value">{readiness(overall)}</div></div>
        <div className="kpi-cell"><div className="kpi-label">Tid innan redo för revision</div><div className="kpi-value kpi-amber">{timeUntil(overall)}</div></div>
        <div className="kpi-cell"><div className="kpi-label">Identifierade åtgärder</div><div className="kpi-value">{hiG} att prioritera · {miG} att slutföra</div></div>
      </div>
      {vetEjG>=5&&(
        <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"12px 16px",marginBottom:14,background:"#FEF9EC",border:"1.5px solid #FFD580",borderRadius:6,fontSize:13}}>
          <span>⚠</span>
          <div><strong style={{display:"block",marginBottom:3,color:"#7A4800"}}>{vetEjG} frågor besvarades med "Vet ej"</strong><span style={{color:"#8A5500"}}>Dessa behöver kontrolleras internt — resultatet kan vara missvisande.</span></div>
        </div>
      )}
      <div className="summary-box">
        <div className="summary-box-label">Var befinner ni er på certifieringsresan?</div>
        <div className="summary-box-text">{summary}</div>
      </div>
      {active.map(std=><CertSection key={std.id} std={std} answers={answers}/>)}
      <div className="disclaimer">
        <strong>Viktig information om denna rapport</strong>
        Denna rapport är en självskattning och ger en indikativ bild av er beredskap. Verktyget är ett förenklat stöd och garanterar inte att samtliga krav berörs. Resultaten speglar hur ni tolkar och besvarar frågorna och kan avvika från en faktisk revision. En hög beredskapsgrad innebär inte att certifiering kan utfärdas utan föregående revision. SBSC är ackrediterat av SWEDAC (ackrediteringsnummer 1631).
      </div>
      <div className="cta-block">
        <div>
          <h3>Redo att ta nästa steg?</h3>
          <p>Kontakta oss så berättar vi mer om certifieringsprocessen.</p>
        </div>
        <a className="cta-link" href={`mailto:kund@sbsc.se?subject=${encodeURIComponent("Certifieringsberedskap — "+company)}&body=${encodeURIComponent("Hej SBSC,\n\nVi har genomfört er självskattning.\n\nFöretag: "+company+"\nCertifieringar: "+active.map(s=>s.name).join(", ")+"\nSamlad beredskap: "+(overall!==null?overall+"%":"—")+"\n\nVi är intresserade av att höra mer.\n\nMed vänliga hälsningar,")}`}>
          Ta kontakt med SBSC →
        </a>
      </div>
      <div className="btn-row no-print" style={{marginTop:20}}>
        <button className="btn-ghost" onClick={back}>← Tillbaka</button>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-secondary" onClick={()=>window.print()}>🖨 Skriv ut / PDF</button>
          <button className="btn btn-secondary" onClick={restart}>Börja om</button>
        </div>
      </div>
    </>
  );
}

function StartPage({picked,toggle,company,setCompany,compErr,setCompErr,agreed,setAgreed,attempted,goStart}){
  const missingName=!company.trim();
  const missingCert=!picked.length;
  const missingAgreed=!agreed;
  const hasError=attempted&&(missingName||missingCert||missingAgreed);

  return(
    <>
      <div className="page-intro">
        <div className="chip">Kostnadsfri självutvärdering</div>
        <h1>Är er firma redo för SBSC-certifiering?</h1>
        <p>Kartlägg er beredskap, se gap och få ett tydligt svar på hur lång tid det tar innan ni är redo.</p>
      </div>
      <div className="card">
        <div className="field-label">Företagets namn<span className="req-star">*</span></div>
        <input className={`text-input${attempted&&missingName?" invalid":""}`} type="text" placeholder="T.ex. Andersson Larm & Säkerhet AB" value={company}
          onChange={e=>{setCompany(e.target.value);if(e.target.value.trim())setCompErr(false);}}
          onKeyDown={e=>{if(e.key==="Enter")goStart();}}/>
        {attempted&&missingName&&<div className="field-error">Ange företagets namn för att fortsätta.</div>}
        <div className="privacy-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <p>Ingen data sparas. Alla svar stannar i din webbläsare och raderas när du stänger sidan.</p>
        </div>
      </div>
      <div className="card">
        <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>Välj certifiering</div>
        <p style={{fontSize:13,color:"var(--muted)",marginBottom:16}}>Välj en eller flera certifieringar ni vill utvärdera. Ledningssystemet (SSF 1044 / FR 2000 / ISO 9001) krävs för inbrottslarm och kamerabevakning.</p>
        {CERT_GROUPS.map(group=>(
          <div key={group.label}>
            <div className="cert-group-label">{group.label}</div>
            {group.note&&(
              <div style={{fontSize:12,color:"var(--blue)",background:"#EEF4FB",border:"1px solid #C8DCF0",borderRadius:6,padding:"8px 12px",marginBottom:10,lineHeight:1.6}}>
                💡 {group.note}
              </div>
            )}
            <div className="cert-list">
              {group.ids.map(id=>{
                const s=STANDARDS[id];
                return(
                  <div key={id} className={`cert-row${picked.includes(id)?" active":""}`} onClick={()=>toggle(id)} role="checkbox" aria-checked={picked.includes(id)} tabIndex={0} onKeyDown={e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(id);}}}>
                    <div className="cert-check">{picked.includes(id)?"✓":""}</div>
                    <div>
                      <div className="cert-name">{s.name}<span className="cert-badge">{s.reg}</span></div>
                      <div className="cert-desc">{s.desc}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
        <div className="disc-check-wrap" onClick={()=>setAgreed(a=>!a)}>
          <div className={`disc-checkbox${agreed?" disc-checked":""}`}>{agreed?"✓":""}</div>
          <div className="disc-check-text">
            <strong>Jag förstår hur rapporten ska användas</strong>
            Verktyget är ett förenklat stöd — inte ett certifieringsbesked. En hög beredskapsgrad innebär inte att certifiering utfärdas utan föregående revision. SBSC är ackrediterat av SWEDAC (nr 1631).
          </div>
        </div>
        {hasError&&(
          <div className="validation-box" style={{marginTop:14}}>
            <div className="validation-title">Följande måste fyllas i:</div>
            {missingName&&<div className="validation-item"><span className="v-num">1</span>Ange företagets namn</div>}
            {missingCert&&<div className="validation-item"><span className="v-num">{missingName?2:1}</span>Välj minst en certifiering</div>}
            {missingAgreed&&<div className="validation-item"><span className="v-num">{[missingName,missingCert].filter(Boolean).length+1}</span>Bekräfta att du förstår hur rapporten ska användas</div>}
          </div>
        )}
        <div className="stat-row">
          <div className="stat">
            <div className="stat-n">{picked.length>0?picked.reduce((n,id)=>n+STANDARDS[id].sections.reduce((m,s)=>m+s.questions.length,0),0):"—"}</div>
            <div className="stat-l">frågor valda</div>
          </div>
          <div className="stat"><div className="stat-n">0%</div><div className="stat-l">data lagras</div></div>
          <div className="stat"><div className="stat-n">PDF</div><div className="stat-l">utskriftsvänlig</div></div>
        </div>
        <div className="btn-row">
          <span style={{fontSize:12,color:"var(--muted)"}}>Ger en indikation — inte ett certifieringsbesked.</span>
          <button className="btn btn-primary" onClick={goStart}>Starta utvärdering →</button>
        </div>
      </div>
    </>
  );
}

function App(){
  const [gateCleared,setGateCleared]=useState(false);
  const [view,setView]=useState("start");
  const [picked,setPicked]=useState([]);
  const [answers,setAnswers]=useState({});
  const [stdIdx,setStdIdx]=useState(0);
  const [secIdx,setSecIdx]=useState(0);
  const [company,setCompany]=useState("");
  const [compErr,setCompErr]=useState(false);
  const [attempted,setAttempted]=useState(false);
  const [agreed,setAgreed]=useState(false);
  const [showRestart,setShowRestart]=useState(false);

  const active=picked.map(id=>STANDARDS[id]);
  const curStd=active[stdIdx];
  const curSec=curStd?curStd.sections[secIdx]:null;
  const toggle=id=>setPicked(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const answer=(qid,val)=>setAnswers(p=>({...p,[qid]:val}));
  const totalQ=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.length,0),0);
  const doneQ=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]).length,0),0);
  const prog=totalQ?Math.round(doneQ/totalQ*100):0;
  const isFirst=stdIdx===0&&secIdx===0;
  const isLast=curStd&&stdIdx===active.length-1&&secIdx===curStd.sections.length-1;
  const secDone=curSec?curSec.questions.every(q=>answers[q.id]):false;

  const goNext=()=>{
    if(secIdx<curStd.sections.length-1)setSecIdx(secIdx+1);
    else if(stdIdx<active.length-1){setStdIdx(stdIdx+1);setSecIdx(0);}
    else setView("results");
    window.scrollTo(0,0);
  };
  const goPrev=()=>{
    if(secIdx>0)setSecIdx(secIdx-1);
    else if(stdIdx>0){setStdIdx(stdIdx-1);setSecIdx(active[stdIdx-1].sections.length-1);}
    window.scrollTo(0,0);
  };
  const goStart=()=>{
    setAttempted(true);
    if(!company.trim()||!picked.length||!agreed)return;
    setStdIdx(0);setSecIdx(0);setView("questions");window.scrollTo(0,0);
  };
  const confirmRestart=()=>{
    setAnswers({});setPicked([]);setStdIdx(0);setSecIdx(0);
    setCompany("");setAgreed(false);setAttempted(false);
    setShowRestart(false);setView("start");window.scrollTo(0,0);
  };

  if(!gateCleared)return<GatePage onSuccess={(co)=>{setCompany(co);setGateCleared(true);window.scrollTo(0,0);}}/>;

  return(
    <>
      <a href="#main-content" className="skip-link">Hoppa till innehåll</a>
      <header className="site-header no-print">
        <div className="hdr-inner">
          <img src={LOGO} alt="SBSC" className="hdr-logo"/>
          <span className="hdr-label">Certifieringsberedskap</span>
        </div>
      </header>
      <main className="shell" id="main-content">
        {view==="start"&&<StartPage picked={picked} toggle={toggle} company={company} setCompany={setCompany} compErr={compErr} setCompErr={setCompErr} agreed={agreed} setAgreed={setAgreed} attempted={attempted} goStart={goStart}/>}
        {view==="questions"&&curStd&&curSec&&(
          <QPage active={active} curStd={curStd} curSec={curSec} stdIdx={stdIdx} secIdx={secIdx} answers={answers} answer={answer} prog={prog} doneQ={doneQ} totalQ={totalQ} goNext={goNext} goPrev={goPrev} isFirst={isFirst} isLast={isLast} secDone={secDone} picked={picked}
            jump={(si,qi)=>{setStdIdx(si);setSecIdx(qi);window.scrollTo(0,0);}}/>
        )}
        {view==="results"&&<ReportPage active={active} answers={answers} company={company} agreed={agreed} restart={()=>setShowRestart(true)} back={()=>{setView("questions");window.scrollTo(0,0);}}/>}
        {showRestart&&(
          <div className="modal-overlay" onClick={()=>setShowRestart(false)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <h3>Börja om från början?</h3>
              <p>Alla svar och val raderas permanent.</p>
              <div className="modal-btns">
                <button className="btn btn-secondary" onClick={()=>setShowRestart(false)}>Avbryt</button>
                <button className="btn btn-primary" onClick={confirmRestart}>Ja, börja om</button>
              </div>
            </div>
          </div>
        )}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
