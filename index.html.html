<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kartlägg er beredskap inför SBSC-certifiering inom brandlarm, inbrottslarm, kamerabevakning och ISO-standarder.">
<meta property="og:title" content="SBSC Certifieringsberedskap">
<meta property="og:description" content="Självutvärdering för anläggarfirmor — kostnadsfri och anonym.">
<title>SBSC — Certifieringsberedskap</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --amber:#FFA300;--black:#101820;--white:#fff;--page:#F8F9FA;
  --border:#E8E9EC;--muted:#6B6C74;--faint:#F2F3F5;
  --green:#1B6B3F;--red:#C03535;--blue:#2A5A8C;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:"Open Sans",system-ui,sans-serif;background:var(--page);color:var(--black);line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
button:disabled{opacity:.38;cursor:not-allowed;}
img{display:block;}

.site-header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.site-header::after{content:"";display:block;height:3px;background:var(--amber);}
.hdr-inner{max-width:960px;margin:0 auto;padding:0 32px;height:96px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{height:80px;width:auto;}
.hdr-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}

.shell{max-width:860px;margin:0 auto;padding:48px 24px 80px;}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);padding:28px;margin-bottom:14px;box-shadow:var(--shadow-sm);}

.page-intro{text-align:center;padding:0 0 40px;}
.chip{display:inline-block;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 14px;border-radius:2px;margin-bottom:20px;}
.page-intro h1{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.5px;margin-bottom:12px;}
.page-intro p{font-size:16px;color:var(--muted);max-width:480px;margin:0 auto;}

.field-label{font-size:13px;font-weight:700;color:var(--black);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.req-star{color:var(--red);font-size:16px;line-height:1;}
.text-input{width:100%;padding:13px 16px;font-size:15px;font-weight:600;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.text-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.text-input.invalid{border-color:var(--red);}
.field-error{font-size:12px;color:var(--red);font-weight:600;margin-top:6px;}
.privacy-note{display:flex;align-items:flex-start;gap:10px;background:#EEF4FB;border:1px solid #C8DCF0;border-radius:6px;padding:12px 14px;margin-top:14px;}
.privacy-note svg{flex-shrink:0;color:var(--blue);margin-top:1px;}
.privacy-note p{font-size:12px;color:var(--blue);font-weight:500;line-height:1.55;}

.cert-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.cert-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .12s,background .12s;}
.cert-row:hover{border-color:var(--amber);}
.cert-row.active{border-color:var(--amber);background:#FFFBF0;}
.cert-check{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .12s;}
.cert-row.active .cert-check{background:var(--amber);border-color:var(--amber);color:var(--black);}
.cert-name{font-weight:700;font-size:14px;margin-bottom:2px;}
.cert-badge{font-size:10px;font-weight:700;background:var(--faint);color:var(--muted);padding:2px 7px;border-radius:2px;margin-left:6px;}
.cert-desc{font-size:12px;color:var(--muted);}

.disc-check-wrap{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--faint);border:1.5px solid var(--border);border-radius:6px;margin-top:14px;cursor:pointer;transition:border-color .12s,background .12s;}
.disc-check-wrap:hover{border-color:var(--amber);}
.disc-checkbox{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .12s;background:var(--white);}
.disc-checked{background:var(--amber)!important;border-color:var(--amber)!important;color:var(--black)!important;}
.disc-check-text{font-size:12px;color:var(--black);line-height:1.6;}
.disc-check-text strong{display:block;font-size:13px;font-weight:800;margin-bottom:4px;}

.validation-box{margin-top:14px;padding:14px 16px;background:#FEF3E2;border:1px solid #FFD580;border-radius:6px;}
.validation-title{font-size:13px;font-weight:800;margin-bottom:8px;}
.validation-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#7A4800;margin-bottom:4px;}
.validation-item:last-child{margin-bottom:0;}
.v-num{width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.stat-row{display:flex;gap:10px;margin-top:18px;}
.stat{flex:1;background:var(--faint);border-radius:6px;padding:12px 14px;text-align:center;}
.stat-n{font-size:18px;font-weight:800;}
.stat-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

.btn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;}
.btn{padding:11px 24px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;font-family:inherit;transition:all .12s;border:2px solid transparent;}
.btn-primary{background:var(--amber);color:var(--black);border-color:var(--amber);}
.btn-primary:hover:not(:disabled){background:#E89300;border-color:#E89300;}
.btn-secondary{background:var(--white);color:var(--black);border-color:var(--black);}
.btn-secondary:hover:not(:disabled){background:var(--faint);}
.btn-ghost{font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;}
.btn-ghost:hover:not(:disabled){color:var(--black);}

.progress-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;margin-bottom:18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.progress-label{font-weight:700;}
.progress-count{color:var(--muted);}
.progress-track{height:4px;background:var(--faint);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .3s ease;}
.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.section-tab{padding:5px 12px;background:var(--white);border:1.5px solid var(--border);border-radius:20px;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;transition:all .1s;}
.section-tab.active{background:var(--black);color:var(--white);border-color:var(--black);}
.section-tab.done{border-color:var(--green);color:var(--green);}
.tab-dot{width:5px;height:5px;border-radius:50%;background:var(--border);}
.section-tab.active .tab-dot{background:var(--amber);}
.section-tab.done .tab-dot{background:var(--green);}
.q-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:10px;}
.q-text{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:6px;}
.q-help{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.q-help-toggle{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--muted);
  cursor:pointer;margin-bottom:10px;
  background:none;border:none;padding:0;font-family:inherit;
  transition:color .12s;
}
.q-help-toggle:hover{color:var(--black);}
.q-help-toggle svg{transition:transform .2s;}
.q-help-toggle.open svg{transform:rotate(180deg);}
.q-help-expanded{
  font-size:12px;color:var(--muted);line-height:1.6;
  margin-bottom:14px;padding:10px 12px;
  background:var(--faint);border-radius:4px;
  border-left:2px solid var(--border);
}
.ans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ans-btn{padding:9px 4px;border:1.5px solid var(--border);border-radius:4px;font-size:11px;font-weight:700;text-align:center;background:var(--white);color:var(--muted);cursor:pointer;transition:all .1s;line-height:1.3;font-family:inherit;}
.ans-btn:hover{border-color:var(--black);color:var(--black);}
.ans-green{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important;}
.ans-amber{background:var(--amber)!important;color:var(--black)!important;border-color:var(--amber)!important;}
.ans-red{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important;}
.ans-blue{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important;}
.q-hint{font-size:11px;color:var(--muted);text-align:right;margin-top:8px;}
.cert-switcher{
  display:flex;gap:0;margin-bottom:16px;
  background:var(--faint);border:1px solid var(--border);
  border-radius:6px;padding:3px;
}
.cert-switch-btn{
  flex:1;padding:7px 12px;font-size:12px;font-weight:700;
  border-radius:4px;cursor:pointer;font-family:inherit;
  background:none;border:none;color:var(--muted);
  transition:all .15s;text-align:center;
}
.cert-switch-btn.active{
  background:var(--white);color:var(--black);
  box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.cert-switch-btn.done{color:var(--green);}
.cert-switch-btn.active.done{color:var(--green);}


.report-banner{border-radius:var(--r);padding:26px 30px;margin-bottom:14px;background:var(--black);color:var(--white);border-left:5px solid var(--amber);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.banner-label{font-size:10px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.banner-company{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.banner-meta{font-size:12px;color:#8A8B91;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:6px;}
.report-confirm{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#8A8B91;margin-top:10px;}
.report-confirm-dot{width:14px;height:14px;border-radius:50%;background:var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--black);margin-top:1px;}
.banner-score-label{font-size:10px;color:#8A8B91;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;text-align:right;}
.banner-score{font-size:54px;font-weight:800;line-height:1;letter-spacing:-2px;}
.banner-score em{color:var(--amber);font-style:normal;}
.banner-date{font-size:11px;color:#8A8B91;margin-top:4px;text-align:right;}

.kpi-row{display:flex;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}
.kpi-cell{flex:1;padding:16px 20px;border-right:1px solid var(--faint);}
.kpi-cell:last-child{border-right:none;}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.kpi-value{font-size:15px;font-weight:700;line-height:1.3;}
.kpi-amber{color:var(--amber);}

.summary-box{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;border-left:4px solid var(--amber);}
.summary-box-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--amber);margin-bottom:8px;}
.summary-box-text{font-size:14px;line-height:1.75;color:var(--black);}

.cert-section{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:18px;overflow:hidden;}
.cert-head{padding:15px 22px;display:flex;align-items:center;justify-content:space-between;border-left:4px solid var(--amber);background:#FFFBF0;}
.cert-head h3{font-size:16px;font-weight:800;margin-bottom:2px;}
.cert-head-reg{font-size:11px;color:var(--muted);}
.cert-head-score{font-size:30px;font-weight:800;letter-spacing:-1px;}
.cert-body{padding:22px;}
.spider-wrap{display:flex;justify-content:center;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--faint);}
.bar-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--faint);}
.bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
.bar-label{width:185px;font-size:12px;font-weight:600;flex-shrink:0;}
.bar-track{flex:1;height:7px;background:var(--faint);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-pct{width:38px;text-align:right;font-size:12px;font-weight:700;}
.gap-section h4{font-size:13px;font-weight:800;margin-bottom:12px;}
.gap-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--faint);}
.gap-row:first-of-type{border-top:none;padding-top:0;}
.gap-badge{flex-shrink:0;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:2px;margin-top:2px;}
.badge-hi{background:#FAEAEA;color:var(--red);}
.badge-mi{background:#FFF3DC;color:#7A4800;}
.badge-uk{background:#EEF4FB;color:var(--blue);}
.gap-body{flex:1;}
.gap-title{font-weight:700;font-size:13px;margin-bottom:2px;}
.gap-meta{font-size:11px;color:var(--muted);margin-bottom:6px;}
.gap-action-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:3px;}
.gap-action{font-size:12px;color:var(--muted);line-height:1.6;padding:8px 12px;background:var(--faint);border-radius:4px;border-left:3px solid var(--amber);}
.gap-none{text-align:center;padding:12px;font-size:13px;font-weight:700;color:var(--green);}

.disclaimer{font-size:11px;color:var(--muted);line-height:1.7;margin-top:20px;padding:16px 18px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);border-left:3px solid var(--amber);}
.disclaimer strong{display:block;font-size:10px;color:var(--black);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:6px;}

.cta-block{margin-top:20px;padding:26px 30px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(16,24,32,.55);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:24px;
}
.modal-box{
  background:var(--white);border-radius:var(--r);
  padding:32px;max-width:420px;width:100%;
  box-shadow:0 8px 40px rgba(0,0,0,.18);
}
.modal-icon{
  width:48px;height:48px;border-radius:50%;
  background:#FEF3E2;display:flex;align-items:center;
  justify-content:center;margin-bottom:16px;
}
.modal-box h3{font-size:18px;font-weight:800;margin-bottom:8px;}
.modal-box p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}
.cta-block h3{font-size:18px;font-weight:800;margin-bottom:4px;}
.cta-block p{font-size:13px;color:var(--muted);}
.cta-link{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:var(--black);padding:13px 26px;font-size:13px;font-weight:800;border-radius:4px;white-space:nowrap;border:2px solid var(--amber);font-family:inherit;transition:all .12s;}
.cta-link:hover{background:#E89300;border-color:#E89300;}


.toc-block{display:none;
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 24px;margin-bottom:14px;
}
.toc-title{font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--muted);margin-bottom:12px;}
.toc-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 0;border-bottom:1px solid var(--faint);font-size:13px;
}
.toc-item:last-child{border-bottom:none;}
.toc-item-name{font-weight:600;}
.toc-item-pct{
  font-weight:800;font-size:13px;
  min-width:42px;text-align:right;
}
.toc-dots{
  flex:1;border-bottom:1.5px dotted var(--border);
  margin:0 10px;margin-bottom:2px;
}

.print-header{
  display:none;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
  padding-bottom:14px;
  border-bottom:3px solid var(--black);
}
.print-header-logo{height:72px;width:auto;display:block;}
.print-header-right{text-align:right;}
.print-header-title{font-size:15px;font-weight:800;color:var(--black);display:block;margin-bottom:3px;}
.print-header-sub{font-size:11px;color:var(--muted);}



/* ── FORMSPREE GATE ── */
.gate-wrap{
  min-height:100vh;background:var(--page);
  display:flex;align-items:center;justify-content:center;
  padding:32px 16px;
}
.gate-box{
  background:var(--white);border-radius:var(--r);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:40px 36px;max-width:480px;width:100%;
}
.gate-logo{height:52px;width:auto;margin-bottom:28px;}
.gate-title{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;}
.gate-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.gate-form{display:flex;flex-direction:column;gap:14px;}
.gate-field{display:flex;flex-direction:column;gap:6px;}
.gate-label{font-size:13px;font-weight:700;color:var(--black);}
.gate-input{
  padding:11px 14px;font-size:14px;font-family:inherit;
  border:1.5px solid var(--border);border-radius:6px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.gate-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.gate-btn{
  background:var(--amber);color:var(--black);
  border:none;border-radius:4px;padding:13px;
  font-size:14px;font-weight:800;font-family:inherit;
  cursor:pointer;margin-top:4px;transition:background .12s;
}
.gate-btn:hover{background:#E89300;}
.gate-privacy{
  font-size:11px;color:var(--muted);line-height:1.6;
  margin-top:10px;padding-top:14px;
  border-top:1px solid var(--faint);
}
.gate-facts{
  display:flex;gap:8px;margin-bottom:24px;
}
.gate-fact{
  flex:1;background:var(--faint);border-radius:6px;
  padding:10px 12px;text-align:center;
}
.gate-fact-n{font-size:16px;font-weight:800;}
.gate-fact-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.gate-success{
  text-align:center;padding:32px 0;
}
.gate-success-icon{
  width:56px;height:56px;border-radius:50%;
  background:var(--amber);display:flex;align-items:center;
  justify-content:center;margin:0 auto 16px;font-size:24px;
}
.gate-success h2{font-size:20px;font-weight:800;margin-bottom:8px;}
.gate-success p{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.6;}

/* ── TILLGÄNGLIGHET & TANGENTBORD ── */
.ans-btn:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-color:var(--amber);}
.btn:focus-visible,.btn-secondary:focus-visible,.btn-ghost:focus-visible,
.section-tab:focus-visible,.cert-switch-btn:focus-visible,
.cert-row:focus-visible,.disc-check-wrap:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;}
.q-help-toggle:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px;}
.skip-link{position:absolute;top:-100px;left:16px;background:var(--black);color:var(--white);padding:8px 16px;border-radius:4px;font-size:13px;font-weight:700;z-index:9999;transition:top .15s;}
.skip-link:focus{top:16px;}

@page{size:A4 portrait;margin:14mm 18mm;}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;box-sizing:border-box!important;}
  .no-print{display:none!important;}
  html{width:210mm!important;}
  body{background:#fff!important;width:100%!important;margin:0!important;padding:0!important;font-size:11px!important;}
  .site-header{display:none!important;}
  .shell{padding:0!important;margin:0!important;width:100%!important;max-width:100%!important;}
  
.toc-block{display:none;
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 24px;margin-bottom:14px;
}
.toc-title{font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--muted);margin-bottom:12px;}
.toc-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 0;border-bottom:1px solid var(--faint);font-size:13px;
}
.toc-item:last-child{border-bottom:none;}
.toc-item-name{font-weight:600;}
.toc-item-pct{
  font-weight:800;font-size:13px;
  min-width:42px;text-align:right;
}
.toc-dots{
  flex:1;border-bottom:1.5px dotted var(--border);
  margin:0 10px;margin-bottom:2px;
}

.print-header{display:flex!important;}
  .report-banner{padding:16px 18px!important;border-left-width:4px!important;}
  .banner-company{font-size:18px!important;}
  .banner-score{font-size:38px!important;}
  .toc-block{display:block!important;break-inside:avoid;margin-bottom:12px!important;}
  .cert-section,.kpi-row,.summary-box,.cta-block,.report-banner{break-inside:avoid;page-break-inside:avoid;width:100%!important;}
  .gap-row{break-inside:avoid;page-break-inside:avoid;}
  .summary-box-text,.gap-action,.disclaimer{word-wrap:break-word!important;overflow-wrap:break-word!important;hyphens:auto!important;}
  .bar-label{width:140px!important;}
  .cert-body{padding:14px!important;}
  .kpi-cell{padding:12px 14px!important;}
}
@media(max-width:640px){
  .shell{padding:24px 14px 60px;}
  .page-intro h1{font-size:26px;}
  .ans-grid{grid-template-columns:repeat(2,1fr);}
  .report-banner{flex-direction:column;}
  .banner-score-label,.banner-date{text-align:left;}
  .kpi-row{flex-direction:column;}
  .kpi-cell{border-right:none;border-bottom:1px solid var(--faint);}
  .kpi-cell:last-child{border-bottom:none;}
  .cta-block{flex-direction:column;text-align:center;}
  .bar-label{width:130px;font-size:11px;}
}
</style>

      {id:"br_org",name:"Organisation & ekonomi",questions:[
        {id:"br_org_1",text:"Är företaget registrerat som juridisk person (t.ex. aktiebolag) inom EU/EES?",
         help:"SBF 1008:3 §4.2.1: anläggarfirman måste vara en juridisk person med organisationsnummer registrerat hos Bolagsverket eller motsvarande myndighet inom EU/EES.",
         action:"Registrera verksamheten som juridisk person hos Bolagsverket. Kontakta en redovisningskonsult om ni är osäkra på lämplig företagsform.",
         actionPartial:"Kontrollera att registreringen är aktuell och att bolaget är i god ståndning hos Bolagsverket."},
        {id:"br_org_2",text:"Är företaget fritt från betalningsanmärkningar, restförd moms och kvarstående skatteskulder?",
         help:"SBF 1008:3 §4.2.2: SBSC kontrollerar detta hos Kronofogden och Skatteverket. Betalningsanmärkningar i väsentlig omfattning kan hindra certifiering.",
         action:"Kontrollera er status hos Kronofogden och Skatteverket. Åtgärda eventuella skulder och anmärkningar innan ansökan lämnas in.",
         actionPartial:"Håll en löpande koll via Skatteverkets e-tjänster och säkerställ att inga nya skulder tillkommit."},
        {id:"br_org_3",text:"Har företaget en giltig ansvarsförsäkring som uppfyller kraven i AB eller ABT?",
         help:"SBF 1008:3 §4.2.3: försäkringen ska täcka skador ni orsakar i ert uppdragsarbete och minst motsvara AB (Allmänna bestämmelser för byggnads-, anläggnings- och installationsentreprenader). Ni behöver ett skriftligt intyg vid certifieringen.",
         action:"Kontakta ert försäkringsbolag och begär en ansvarsförsäkring anpassad till installatörsverksamhet. Be om ett intyg som specificerar att försäkringen täcker AB- eller ABT-krav.",
         actionPartial:"Kontrollera att befintlig försäkring är giltig och att täckningen uppfyller AB/ABT-kraven. Be försäkringsbolaget bekräfta detta skriftligt."},
      ]},
      {id:"br_personal",name:"Personal & behörigheter",questions:[
        {id:"br_pers_1",text:"Finns en sakkunnig person med giltigt certifikat som behörig ingenjör brandlarm (BIB, SBF 1007:5) och minst 2 års allsidig erfarenhet inom brandlarm?",
         help:"SBF 1008:3 §4.3.1a: den sakkunniga personen är kärnan i certifieringen. Personen måste ha ett giltigt BIB-certifikat och minst 2 års dokumenterad erfarenhet inom projektering, installation eller besiktning. Personen ansvarar för att verksamheten bedrivs enligt SBF 110 och undertecknar anläggarintyg.",
         action:"Identifiera en lämplig person och stötta dem att genomgå BIB-certifieringen. Kraven enligt SBF 1007:5: gymnasieutbildning (eller 5 år dokumenterad yrkeserfarenhet), grundläggande brandskyddsutbildning (minst 24 timmar), entreprenadjuridik (minst 1 dag, inom senaste 5 åren), och minst 2 års praktisk erfarenhet. Certifiering sker via SBSC eller annat ackrediterat organ.",
         actionPartial:"Kontrollera att BIB-certifikatet är giltigt (omprövas vart 5:e år) och att personen har minst 2 års dokumenterad allsidig erfarenhet. Kontrollera att grundläggande brandskyddsutbildning uppfyller nuvarande krav (minst 24 timmar effektiv utbildningstid, revideringsblad feb 2025)."},
        {id:"br_pers_2",text:"Har den sakkunniga personen dokumenterade befogenheter att styra brandlarmverksamheten — t.ex. att kräva kompletterande handlingar eller stoppa en installation som inte håller måttet?",
         help:"SBF 1008:3 §4.3.1a: den sakkunniga ska av anläggarfirman erhålla erforderliga befogenheter. Det ska tydligt framgå att personen har mandat att fatta nödvändiga beslut — inte bara i teorin.",
         action:"Upprätta en befattningsbeskrivning eller ett beslutsdokument från ledningen som anger den sakkunniges roll och befogenheter. En sida räcker — det viktiga är att det är undertecknat av ledningen.",
         actionPartial:"Kontrollera att dokumentationen är aktuell och stämmer med hur befogenheterna ser ut i praktiken. Uppdatera vid organisationsförändringar."},
        {id:"br_pers_3",text:"Finns minst en projektör och minst en driftsättare med minst 2 års dokumenterad erfarenhet från brandlarmområdet?",
         help:"SBF 1008:3 §4.3.1c–d: projektören projekterar och granskar brandlarmanläggningar (inkl. externa konsulters handlingar). Driftsättaren utför färdigställandekontroll och driftsättning. Båda kräver minst 2 år dokumenterad erfarenhet. En person kan ha båda rollerna.",
         action:"Identifiera vem i organisationen som tar respektive roll och dokumentera erfarenheten per person — t.ex. via ett CV med referensuppdrag.",
         actionPartial:"Kontrollera att erfarenheten är tillräcklig och dokumenterad. Uppdatera vid personalförändringar."},
        {id:"br_pers_4",text:"Är minst 3 personer tillsvidareanställda och täcker gemensamt alla funktioner: sakkunnig, projektör, driftsättare och servicetekniker?",
         help:"SBF 1008:3 §4.3.1: anläggarfirman ska vara huvudarbetsgivare för kompetent tillsvidareanställd personal. En person kan ha flera roller, men minst 3 fysiska personer ska sköta funktionerna.",
         action:"Kartlägg personalsituationen: minst 3 tillsvidareanställda, ni ska vara huvudarbetsgivare, och alla fyra funktionerna ska täckas. Dokumentera tydligt vem som har vilken roll.",
         actionPartial:"Om ni är nära gränsen — dokumentera noggrant hur rollerna är fördelade. Vid oförutsägbar förlust av sakkunnig person gäller en övergångsregel på max 12 månader, men SBSC ska underrättas omedelbart."},
      ]},
      {id:"br_materiel",name:"Materiel & dokumentation",questions:[
        {id:"br_mat_1",text:"Finns en förteckning över den materiel ni använder, med information om att komponenterna uppfyller kraven i SBF 110?",
         help:"SBF 1008:3 §4.5.2: förteckningen ska visa att era standardkomponenter (centralapparater, detektorer, larmdon, kablage m.m.) är godkända för brandlarmanläggningar enligt SBF 110 — t.ex. via typgodkännande eller certifikat enligt SBF 1400-serien. Ska kunna visas upp för anläggningsägare och besiktningsmän.",
         action:"Lista de komponenter ni normalt använder med tillhörande certifieringsinformation (t.ex. typgodkännandenummer eller hänvisning till SBF 1400-serieintyg). En strukturerad produktlista räcker som utgångspunkt.",
         actionPartial:"Uppdatera förteckningen om ni börjat använda nya produkter. Kontrollera att samtliga listade produkters certifiering fortfarande är giltig."},
        {id:"br_mat_2",text:"Finns alla styrande dokument i SBF 1008:3 Bilaga 1 tillgängliga i senaste utgåva, inklusive revideringsblad?",
         help:"Bilaga 1 listar dokument som måste finnas tillgängliga: bl.a. SBF 110:8 (inkl. revideringsblad maj 2024), SBF 1007:5 (inkl. revideringsblad februari 2025), SBF 126, SBF 141, SBF 1013, SBF 1021, SBF 502, Boverkets byggregler och ELSÄK-FS 2022:1. Ska vara tillgängliga för de som arbetar med brandlarm.",
         action:"Skaffa och samla alla dokument i listan i senaste utgåva. De flesta finns på sbf.se. Skapa en digital mapp eller ett dokumentregister tillgängligt för berörda personer.",
         actionPartial:"Gå igenom samlingen och kontrollera att ni har senaste utgåvorna inklusive revideringsblad. SBF 110:8 fick revideringsblad maj 2024 och SBF 1007:5 fick revideringsblad februari 2025 — kontrollera att dessa ingår."},
        {id:"br_mat_3",text:"Finns dokumenterade rutiner för utfärdande av anläggarintyg — inklusive kontroll att anläggningen uppfyller SBF 110 och att färdigställandekontroll är genomförd innan intyget undertecknas?",
         help:"SBF 1008:3 §4.6.1: anläggarintyg får bara utfärdas om anläggningen är utförd enligt SBF 110, dokumentationen granskats och godkänts av sakkunnig eller delegerad person, och färdigställandekontroll genomförts. En steg-för-steg-checklista är det vanligaste sättet att uppfylla kravet.",
         action:"Ta fram en rutin och checklista för anläggarintygsprocessen. Stegen: projekteringsgranskning → installationskontroll → färdigställandekontroll → dokumentationsgranskning → underskrift. Rutinen ska göra det omöjligt att hoppa över ett steg.",
         actionPartial:"Gå igenom er befintliga rutin mot kraven i §4.6.1. Kontrollera att den täcker alla obligatoriska steg och att den faktiskt följs i praktiken."},
      ]},
      {id:"br_underhall",name:"Underhåll & serviceberedskap",questions:[
        {id:"br_und_1",text:"Kan ni påbörja felavhjälpning i en kundanläggning inom 2 arbetsdagar efter beställning?",
         help:"SBF 1008:3 §4.4.1: åtgärdande av fel ska kunna påbörjas inom 2 arbetsdagar (vardagar, ej lördagar och helgdagsaftnar) och slutföras utan dröjsmål. Ni behöver organiserade resurser och rutiner för inkommande felanmälningar.",
         action:"Kartlägg er serviceberedskap och inför en rutin för felanmälningar med garanterad responstid. Dokumentera vem som tar emot felanmälningar, hur de prioriteras och vem som åker ut.",
         actionPartial:"Kontrollera att beredskapen håller 2-dagarskravet i alla lägen — inklusive semester, sjukdom och hög belastning. Dokumentera hur ni hanterar sådana situationer."},
        {id:"br_und_2",text:"Har ni ett reservdelsförråd tillräckligt för att hålla responstiderna — antingen eget förråd eller avtal med leverantör som garanterar leveranstid?",
         help:"SBF 1008:3 §4.4.2: reservdelsförrådet ska vara av sådan omfattning att 2-dagarskravet kan hållas. Förrådet kan finnas hos er eller hos en leverantör, men i så fall krävs ett avtal som garanterar leveranstider.",
         action:"Gå igenom vilka reservdelar ni behöver för era vanligaste kundanläggningar och ta fram ett minimumförråd. Om ni förlitar er på leverantörslager — upprätta ett avtal med garanterade leveranstider.",
         actionPartial:"Uppdatera förrådet om era produkter har förändrats. Dokumentera eventuella leverantörsavtal som ersätter eget förråd."},
        {id:"br_und_3a",text:"Finns rutiner för att aktivt erbjuda kunden underhållsavtal senast vid garantitidens utgång?",
         help:"SBF 1008:3 §4.4.3: ni ska erbjuda kunden underhållsavtal innan garantitiden löper ut. Det kräver att ni håller koll på garantitidens utgångsdatum per anläggning och har en rutin för att skicka erbjudandet i god tid.",
         action:"Skapa en rutin: (1) Notera garantitidens utgångsdatum vid varje installation i ert kundregister. (2) Sätt en påminnelse 2–3 månader innan garantin löper ut. (3) Skicka ett skriftligt erbjudande om underhållsavtal till kunden.",
         actionPartial:"Kontrollera att rutinen tillämpas konsekvent. Se till att inga kunder vars garanti löpt ut saknar ett erbjudet underhållsavtal."},
        {id:"br_und_3b",text:"Lämnas alltid en skriftlig servicerapport till kunden efter varje utfört underhålls- eller reparationsarbete?",
         help:"SBF 1008:3 §4.4.4: efter varje service- eller reparationsarbete ska en skriftlig rapport överlämnas till kunden. Rapporten ska tydligt skilja sig från revisionsbesiktningsdokument och dokumentera vad som utförts.",
         action:"Ta fram en servicerapportmall som täcker: datum, utfört arbete, använda reservdelar, ansvarig tekniker och eventuella observationer. Se till att rapporten alltid överlämnas till kunden och att en kopia sparas i er kundmapp.",
         actionPartial:"Kontrollera att servicerapporten används konsekvent vid alla typer av servicearbeten — inte bara vid planerat underhåll. Säkerställ att mallen är tydligt skild från revisionsbesiktningsdokument."},
      ]},
      {id:"br_kvalitet",name:"Kvalitetssystem & egenkontroll",questions:[
        {id:"br_kval_1",text:"Finns dokumenterade rutiner för de arbetsmoment SBF 1008:3 §4.7.1 kräver — t.ex. projektering, kontraktsgenomgång, driftsättning, anläggarintyg, överlämning till kund och vidareutbildning?",
         help:"§4.7.1 listar 13 rutiner (punkterna a–m) som ska finnas, bl.a. för projektering, kontroll av installationsförutsättningar, färdigställandekontroll, anläggarintyg, överlämning, vidareutbildning, underhåll, onödiga larm och avvikelsejournal. Rutinerna ska vara skriftliga och kända av personalen.",
         action:"Gå igenom listan i §4.7.1 punkt för punkt och identifiera vilka rutiner som saknas. Skriv enkla kortfattade rutiner — en A4-sida per moment är ofta tillräckligt. Samla dem i ett kvalitetshandbok.",
         actionPartial:"Kontrollera att befintliga rutiner är uppdaterade och faktiskt kända av personalen. Det är vanligt att rutiner finns på papper men inte används i praktiken — det är just det SBSC:s revisorer kontrollerar."},
        {id:"br_kval_2",text:"Har ni ett system för dokumentstyrning — att rätt utgåva av era egna dokument används och att ogiltiga versioner avlägsnas?",
         help:"SBF 1008:3 §4.7.2: ni ska ha ett system som säkerställer att rätt version av era interna dokument (mallar, checklistor, rutiner) används och att gamla versioner inte finns tillgängliga.",
         action:"Inför ett enkelt versionssystem: märk varje internt dokument med versionsnummer och datum. Skapa en central plats där personalen hämtar dokument och se till att gamla versioner tas bort eller märks som ogiltiga.",
         actionPartial:"Gå igenom era aktuella dokument och kontrollera att inga gamla versioner är tillgängliga. Säkerställ att uppdateringar kommuniceras till all berörd personal."},
        {id:"br_kval_3",text:"Finns rutiner för att säkerställa att inköpt materiel och underleverantörer uppfyller era krav, inklusive bedömning av underleverantörer innan de anlitas?",
         help:"SBF 1008:3 §4.7.3: inköpsrutiner ska säkerställa att materiel uppfyller specificerade krav (t.ex. SBF 110-godkännande) och ni ska ha rutiner för att bedöma underleverantörer.",
         action:"Ta fram en lista på godkända leverantörer och produkter. Inför en enkel rutin för att bedöma nya underleverantörer — t.ex. ett formulär med frågor om kompetens, certifieringar, referenser och försäkring.",
         actionPartial:"Uppdatera leverantörslistan och kontrollera att bedömningskriterierna är relevanta. Se till att rutinen faktiskt används när nya leverantörer tillkommer."},
        {id:"br_kval_4",text:"Har ni ett spårbarhetssystem — att kunna identifiera kundernas anläggningar och koppla anläggarintyg till tillhörande handlingar utan risk för sammanblandning?",
         help:"SBF 1008:3 §4.7.5: ni ska kunna identifiera varje kundanläggning och dess ingående komponenter, och kopplingen mellan anläggarintyg och tillhörande handlingar ska vara gjord så att sammanblandning inte sker.",
         action:"Skapa ett kundregister med en mapp per anläggning där alla handlingar samlas med ett unikt anläggnings-ID. Märk anläggarintyget med referens till tillhörande handlingar.",
         actionPartial:"Gå igenom befintliga kundmappar och kontrollera att kopplingen är tydlig. Se till att inga handlingar kan förväxlas mellan olika anläggningar."},
        {id:"br_kval_5",text:"Arkiveras kopior av anläggarintyg, ritningar och annan väsentlig dokumentation i minst 10 år?",
         help:"SBF 1008:3 §4.7.6: dokumentationen för aktiva installationer ska arkiveras i minst 10 år och kunna rekonstrueras vid behov. Ni ska också ha rutiner för att skydda och säkerhetskopiera arkivet.",
         action:"Inför en arkivrutin: definiera vilka dokument som sparas, hur länge och var. Säkerställ att digitala arkiv har backup — t.ex. via molnlagring eller extern lagring.",
         actionPartial:"Kontrollera att alla installationer från de senaste 10 åren finns arkiverade och att arkivet är komplett och åtkomligt. Säkerställ att ni har en fungerande backup-rutin."},
        {id:"br_kval_6",text:"Finns rutiner för avvikelsehantering och korrigerande åtgärder, inklusive uppföljning att åtgärderna faktiskt har fungerat?",
         help:"SBF 1008:3 §4.7.7: vid avvikelser ska ni utreda orsaken, genomföra korrigerande åtgärder, dokumentera ändringar i rutiner och följa upp effekten. Allvarliga fel ska rapporteras till certifieringsorganet.",
         action:"Inför ett enkelt avvikelseregister — t.ex. ett Excelark med: datum, beskrivning, orsak, åtgärd, ansvarig, uppföljningsdatum, status. Definiera vad som räknas som allvarligt fel som ska rapporteras till SBSC.",
         actionPartial:"Kontrollera att avvikelsehanteringen täcker alla tre stegen: orsaksutredning, åtgärd och uppföljning. Se till att registret används konsekvent."},
        {id:"br_kval_7a",text:"Genomförs internrevision av kvalitetssystemet regelbundet — med dokumenterade fynd och beslutade korrigerande åtgärder?",
         help:"SBF 1008:3 §4.7.8: internrevision ska genomföras regelbundet för att kontrollera att rutiner följs och att kvalitetssystemet fungerar som avsett. Revisionen bör genomföras av någon som inte är direkt ansvarig för det granskade området. Fynd och åtgärder ska dokumenteras.",
         action:"Planera en internrevision minst en gång per år. Gå igenom att era rutiner faktiskt följs — projektrutin, anläggarintygsprocessen, dokumentstyrning, avvikelsehantering. Dokumentera fynd och besluta korrigerande åtgärder med ansvarig och datum.",
         actionPartial:"Kontrollera att revisionen genomförs och att protokollen innehåller konkreta uppföljningsbeslut — inte bara en lista med observationer. Säkerställ att åtgärderna faktiskt genomförs och stängs."},
        {id:"br_kval_7b",text:"Genomför ledningen en formell genomgång av kvalitetssystemet minst en gång per år — med dokumenterat protokoll och uppföljningsbeslut?",
         help:"SBF 1008:3 §4.7.1: ledningens genomgång ska ske minst en gång per år och täcka: kundklagomål, anläggarintygens kvalitet, avvikelser och korrigerande åtgärder, kompetensstatus, regelverksändringar och resursbehov. Genomgången ska dokumenteras med protokoll.",
         action:"Schemalägg ledningens genomgång med en fast agenda som täcker alla §4.7.1-punkter: avvikelser och reklamationer, anläggarintygskvalitet, kundklagomål, kompetensstatus, regelverksändringar och resursbehov. Protokollför alltid med uppföljningsbeslut och ansvariga.",
         actionPartial:"Kontrollera att protokollet täcker alla obligatoriska punkter och att beslutade åtgärder följs upp till nästa genomgång. En genomgång utan protokoll räknas inte som uppfyllt krav."},
      ]},
    ]
  },
  inbrottslarm:{
    id:"inbrottslarm",name:"Inbrottslarm",reg:"SSF 1015:3",
    desc:"Anläggarfirma inbrottslarm larmklass 1–2 enligt SSF 1015:3",
    sections:[
      {id:"inb_org",name:"Organisation, ekonomi & tillstånd",questions:[
        {id:"inb_org_1",
         text:"Har företaget polismyndighetens tillstånd enligt larmlagen (SFS 1983:1097) att yrkesmässigt bedriva verksamhet med installation av centralanslutna inbrottslarmanläggningar?",
         help:"SSF 1015:3 §4.1.1: tillståndet är ett absolut grundkrav och måste finnas innan ansökan om certifiering lämnas in. Tillståndet söks hos Polismyndigheten och krävs för all yrkesmässig installation av centralanslutna inbrottslarm.",
         action:"Ansök om tillstånd hos Polismyndigheten enligt larmlagen. Processen kräver bl.a. att ansvariga personer är ostraffade och att verksamheten uppfyller lagens krav. Kontakta er lokala polismyndighet för ansökningsblanketter och krav.",
         actionPartial:"Kontrollera att tillståndet är giltigt och avser rätt verksamhet och adress. Uppdatera vid byte av lokal — SBSC ska underrättas utan dröjsmål vid lokalbyte."},
        {id:"inb_org_2",
         text:"Är företaget en i Sverige registrerad juridisk person med ekonomisk bärighet klassad som minst 'Kreditvärdig' och fritt från restförd moms och kvarstående skatteskulder?",
         help:"SSF 1015:3 §4.1.1 och tolkningsdokument 2017: anläggarfirman ska vara registrerad i Sverige och uppvisa ekonomisk bärighet motsvarande lägst 'Kreditvärdig' i kreditupplysningsföretagens värderingssystem (t.ex. UC eller Creditsafe). Inga restförda skatteskulder eller moms får finnas.",
         action:"Kontrollera er kreditvärdighet hos UC eller annan kreditupplysning. Åtgärda eventuella skatteskulder och restförda avgifter. Registrera bolaget hos Bolagsverket om det inte redan är gjort.",
         actionPartial:"Gör en aktuell kreditupplysning för att bekräfta att ni är klassade som Kreditvärdig. Kontrollera hos Skatteverket att inga restförda skulder finns."},
        {id:"inb_org_3",
         text:"Har företaget en giltig ansvarsförsäkring relevant för inbrottslarmsverksamheten, med en täckning som kan tillgodose en eventuell ersättningsskyldighet?",
         help:"SSF 1015:3 §4.3.1 och tolkningsdokument 2017: försäkringen ska täcka skador som uppstår i ert installations- och servicearbete. Enligt tolkningsdokumentet ska försäkringsomfattningen bedömts kunna täcka eventuell ersättningsskyldighet — inte specifikt AB/ABT som för brandlarm utan snarare verksamhetsanpassad.",
         action:"Kontakta ert försäkringsbolag och teckna en ansvarsförsäkring anpassad till inbrottslarmsverksamhet. Be om ett intyg som bekräftar täckning.",
         actionPartial:"Gå igenom att befintlig försäkring verkligen täcker inbrottslarmsarbete specifikt — inte bara allmän ansvarsförsäkring. Be försäkringsbolaget bekräfta skriftligt."},
        {id:"inb_org_4a",
         text:"Finns en dokumenterad rutin för att kontrollera att all personal med tillgång till anläggningsdokumentation är ostraffad — och täcker rutinen samtliga berörda, inte bara den behörige ingenjören?",
         help:"SSF 1015:3 §4.4.1 och SSF 1016: ostraffad definieras som att inte ha påförts annan påföljd än penningbot. Rutinen ska omfatta all personal som hanterar anläggningsdokumentation — inte bara den behörige ingenjören. Kontrollen sker via utdrag ur Polismyndighetens belastningsregister.",
         action:"Ta fram en skriftlig rutin för personalkontroll som: (1) definierar vilka roller som omfattas, (2) specificerar att kontroll ska ske vid anställning och minst vartannat år, (3) anger vem som ansvarar för att initiera kontrollen. Utdrag begärs via Polismyndigheten.",
         actionPartial:"Gå igenom att rutinen faktiskt täcker alla berörda roller — inte bara nyanställda eller den behörige ingenjören. Är rutinen dokumenterad och känd av ansvarig person?"},
        {id:"inb_org_4b",
         text:"Genomförs personalkontroll med utdrag ur belastningsregistret för all berörd personal minst vartannat år — och dokumenteras kontrollerna med datum och vilka som kontrollerats?",
         help:"SSF 1015:3 §4.4.1: kontrollen ska genomföras minst vartannat år och gäller löpande under anställningens gång — inte bara vid nyanställning. Dokumentation av genomförda kontroller är ett krav som revisorer specifikt efterfrågar.",
         action:"Schemalägg en kontrollcykel för befintlig personal: gå igenom listan över berörda och kontrollera när senaste utdrag togs för var och en. Begär nya utdrag för de som passerat tvåårsgränsen. Dokumentera datum och resultat.",
         actionPartial:"Kontrollera att kontrollintervallet vartannat år faktiskt hålls — inte bara vid nyanställning. Finns det personal där senaste kontroll är äldre än 2 år?"},
      ]},
      {id:"inb_personal",name:"Personal & behörig ingenjör",questions:[
        {id:"inb_pers_1",
         text:"Finns minst en certifierad behörig ingenjör inbrottslarm (SSF 1016) med giltigt certifikat som är ostraffad och bedriver sitt huvudsakliga arbete inom ramen för anläggarfirmans verksamhet?",
         help:"SSF 1015:3 §4.6.1 och §4.6.3.1 med tolkningsdokument: den behörige ingenjören är kärnan i certifieringen. Personen ska ha ett giltigt SSF 1016-certifikat, vara ostraffad (kontrollerat med belastningsregisterutdrag), och ha anläggarfirman som sin huvudarbetsgivare (minst 50% anställning). Antal BIs skalas med personalstyrkan: upp till 25 anst. = min 1, 26–50 = min 2, över 50 = min 3.",
         action:"Identifiera en lämplig person och ansök om SSF 1016-certifiering. Krav: el/teleteknisk gymnasieutbildning (eller motsv.), 2 år praktisk erfarenhet av projektering/installation/service (kontroll och besiktning räknas enligt tolkning), kunskaper i SSF 130, SSF 1015 och larmlagen. Certifiering via SBSC.",
         actionPartial:"Kontrollera att BIB-certifikatet är giltigt och att personen uppfyller alla krav i SSF 1016. Kontrollera att skalningskravet (antal BIs/antal anställda) är uppfyllt. Verifiera att ostraffadkontrollen är genomförd."},
        {id:"inb_pers_2",
         text:"Har den behörige ingenjören el/teleteknisk gymnasieutbildning (eller minst 2 år dokumenterad yrkeserfarenhet som ersättning) och minst 2 års praktisk erfarenhet av inbrottslarmsarbete de senaste 2 åren?",
         help:"SSF 1016 §4.1–4.2: grundutbildning = el/teleteknisk linje, tvårigt gymnasium, eller motsvarande. Praktisk erfarenhet = projektering, installation, service och underhåll som väsentligaste del av arbetet under senaste 2-årsperioden. Enligt tolkningsdokument räknas även kontroll- och besiktningsverksamhet inom inbrottslarmområdet.",
         action:"Dokumentera den behörige ingenjörens utbildning och erfarenhet: samla utbildningsintyg, anställningsbevis och en beskrivning av arbetsuppgifterna de senaste 2 åren. Skicka in som underlag vid ansökan om SSF 1016-certifikat.",
         actionPartial:"Gå igenom om erfarenheten är tillräckligt dokumenterad och bredd. Om erfarenheten är snäv (t.ex. bara service, inte projektering) — se om kontroll/besiktning kan tillgodoräknas enligt tolkningsdokumentet."},
        {id:"inb_pers_3",
         text:"Har den behörige ingenjören dokumenterade befogenheter att granska och godkänna alla handlingar för anläggningar, underteckna anläggarintyg, samt ansvara för att projektering och installation sker enligt SSF 130?",
         help:"SSF 1015:3 §4.6.3 med tolkningsdokument: ansvar och befogenheter ska vara dokumenterade — t.ex. i en kompetensförteckning, befattningsbeskrivning eller liknande. Den behörige ingenjören ska ha reellt mandat att stoppa eller kräva komplettering av ett uppdrag.",
         action:"Upprätta ett undertecknat dokument från ledningen som specificerar den behörige ingenjörens ansvar och befogenheter. Inkludera: granskning av handlingar, godkännande av installation, rätt att underteckna anläggarintyg, och ansvar för SSF 130-efterlevnad.",
         actionPartial:"Kontrollera att befintlig dokumentation är aktuell och verkligen speglar de befogenheter personen har i praktiken. Uppdatera vid organisationsförändringar."},
        {id:"inb_pers_4",
         text:"Finns minst en servicetekniker och, vid larmklass 2, minst 2 servicetekniker med nödvändig kompetens?",
         help:"SSF 1015:3 §4.6.1, §5.4 och §6.4: larmklass 1 kräver minst 1 servicetekniker (kan vara samma person som den behörige ingenjören). Larmklass 2 kräver minst 2 servicetekniker. Serviceteknikern installerar och utför service på inbrottslarmanläggningar.",
         action:"Kartlägg er personalsituation: finns tillräckligt antal kompetenta servicetekniker för den larmklass ni söker? Dokumentera deras kompetens och erfarenhet.",
         actionPartial:"Om ni siktar på larmklass 2 — kontrollera att ni har minst 2 servicetekniker. Dokumentera kompetensen tydligt."},
      ]},
      {id:"inb_kvalitet",name:"Kvalitetssystem",questions:[
        {id:"inb_kval_1",
         text:"Har företaget ett implementerat kvalitetssystem för inbrottslarmsverksamheten — minst SSF 1044 SweQ Nivå 1 (larmklass 1) eller Nivå 2 (larmklass 2), alternativt tillämpliga delar av ISO 9001?",
         help:"SSF 1015:3 §5.2 och §6.2: larmklass 1 kräver kvalitetssystem enligt SSF 1044 SweQ Nivå 1 (alternativt delar av ISO 9001 eller FR 2000). Larmklass 2 kräver SweQ Nivå 2. Implementerat innebär: upprättat, dokumenterat, infört och underhållet. Kvalitetsansvarig ska ha kompetens inom kvalitetsledning (t.ex. genomgången internrevisionskurs).",
         action:"Ta reda på vilken larmklass ni siktar på och välj rätt kvalitetssystemnivå. För larmklass 1: implementera SweQ Nivå 1 (eller relevanta ISO 9001-delar). Starta med att dokumentera de rutiner som SSF 1044 kräver. Utse en kvalitetsansvarig och säkerställ att den personen har utbildning inom kvalitetsledning.",
         actionPartial:"Gå igenom att kvalitetssystemet verkligen är implementerat — inte bara dokumenterat. Kontrollera att den kvalitetsansvariges kompetens är styrkt (t.ex. internrevisionskurs). Se till att systemet är anpassat specifikt för inbrottslarmsverksamheten."},
        {id:"inb_kval_2",
         text:"Genomförs ledningens genomgång av kvalitetssystemet minst en gång per kalenderår? (Obligatoriskt från larmklass 2.)",
         help:"SSF 1015:3 §6.2.2: för larmklass 2 och uppåt är ledningens genomgång ett explicit krav, dokumenterat minst en gång per kalenderår. Genomgången ska täcka systemets funktion och resultat. För larmklass 1 är det inte ett explicit krav men rekommenderas starkt.",
         action:"Schemalägg ett årligt möte med ledningen där ni går igenom kvalitetssystemets funktion och resultat. Dokumentera mötet med ett protokoll som innehåller datum, deltagare, fynd och beslutade åtgärder.",
         actionPartial:"Kontrollera att protokollet från senaste genomgången är komplett och att beslutade åtgärder har följts upp. Säkerställ att nästa genomgång är schemalagd."},
      ]},
      {id:"inb_verksamhet",name:"Verksamhet, service & materiel",questions:[
        {id:"inb_verk_1",
         text:"Kan företaget redovisa installerade inbrottslarmanläggningar med anläggarintyg (SSF 1058) överlämnade direkt till kund vid avprovning under senaste 12 månader — minst 5 st larmklass 1 (och ytterligare minst 2 st larmklass 2 om ni söker larmklass 2)?",
         help:"SSF 1015:3 §4.5.1 och SSF 130 §8.2: anläggarintyget ska utfärdas på SSF 1058-mallen (senaste utgåva) och överlämnas till anläggningsinnehavaren direkt i anslutning till att anläggningen är avprovad och dokumenterad. LK1: minst 5 anläggningar med utfärdade intyg senaste 12 månader. LK2: ytterligare minst 2 st LK2-anläggningar (totalt 5+2).",
         action:"Gå igenom projekthistoriken senaste 12 månader och lista alla installerade anläggningar med anläggarintyg utfärdade på SSF 1058-mallen. Säkerställ att anläggarintyg utfärdas konsekvent vid varje avprovning.",
         actionPartial:"Kontrollera att ni använder senaste utgåvan av SSF 1058 och att intygen överlämnas vid avprovning — inte i efterhand. Säkerställ att alla intyg finns arkiverade."},
        {id:"inb_verk_5a",
         text:"Finns rutiner för att ge kunden utbildning om anläggningens uppbyggnad, funktion, drift och underhåll vid varje överlämnande — och täcker utbildningen minimiinnehållet i SSF 130 Bilaga F?",
         help:"SSF 130 §7 och Bilaga F: anläggarfirman ska ge utbildning till kunden vid överlämnande av varje anläggning. Minimiinnehåll: till- och frånkoppling, återställning efter larm, bortkoppling av adress, larmlagen och kontrolljournal. Det räcker inte att hänvisa till manualen — en aktiv utbildning ska genomföras.",
         action:"Ta fram en rutin och checklista för kundutbildning vid överlämnande baserad på SSF 130 Bilaga F. Definiera vem som ansvarar för utbildningen och vad som alltid ska gås igenom.",
         actionPartial:"Kontrollera att utbildningen genomförs konsekvent vid varje överlämnande. Täcker utbildningen alla punkter i SSF 130 Bilaga F? Har alla tekniker samma bild av vad som ska ingå?"},
        {id:"inb_verk_5b",
         text:"Dokumenteras kundutbildningen med uppgift om vem som deltog och vem som genomförde den — och arkiveras dokumentationen tillsammans med anläggningsdokumentationen?",
         help:"SSF 130 §7 och Bilaga F: utbildningen ska dokumenteras med uppgift om innehåll, vem som fått utbildningen och vem som givit den. SSF 130 Bilaga F är den blankett som ska användas och arkiveras med anläggningsdokumentationen. Dokumentationen är ett separat krav från anläggarintyget.",
         action:"Använd SSF 130 Bilaga F som utbildningsblankett. Fyll i den vid varje överlämning, låt kunden bekräfta med signatur och arkivera blanketten tillsammans med anläggarintyget i kundmappen.",
         actionPartial:"Kontrollera att blanketten faktiskt fylls i och arkiveras — inte bara att utbildningen sker muntligt utan dokumentation. Finns äldre anläggningar som saknar utbildningsdokumentation?"},
        {id:"inb_verk_2a",
         text:"Kan företaget ta emot och bekräfta felanmälan alla dagar dygnet runt — inom 24 timmar för larmklass 1 och inom 12 timmar för larmklass 2 — och dokumenteras bekräftelserna?",
         help:"SSF 1015:3 §5.5.1/§6.5.1: felanmälan ska kunna tas emot och bekräftas dygnet runt, 7 dagar i veckan. LK1: bekräftelse inom 24 timmar. LK2: bekräftelse inom 12 timmar. Bekräftelsen ska dokumenteras — en muntlig bekräftelse utan spårbarhet uppfyller inte kravet.",
         action:"Säkerställ att ni har en bemannad eller automatiserad mottagningsfunktion dygnet runt. Inför ett system för att dokumentera felanmälan och bekräftelse med tidsstämpel — t.ex. ärendehanteringssystem eller loggad SMS/mejl-bekräftelse.",
         actionPartial:"Kontrollera att bekräftelserna faktiskt sker inom rätt tidsgräns och dokumenteras. Hur hanteras felanmälningar som kommer in nattetid eller helger — finns det en tydlig rutin?"},
        {id:"inb_verk_2b",
         text:"Finns rutiner för att planera och genomföra regelbunden anläggningskontroll hos kund — vart tredje kalenderår för LK1 och minst en gång per kalenderår för LK2?",
         help:"SSF 130 §8.11: anläggningskontroll ska utföras av anläggarfirman som utfärdat anläggarintyget. LK1: minst vart 3:e kalenderår. LK2/3/4: minst en gång per kalenderår med högst 15 månaders mellanrum. Kontrollen dokumenteras i kontrolljournalen. Anläggningskontrollen är ett proaktivt åtagande som ska planeras — inte ett reaktivt servicebesök.",
         action:"Upprätta ett schema för anläggningskontroller per kund baserat på larmklass. Gå igenom kundlistan och sätt datum för kommande kontroller. Dokumentera genomförda kontroller i kontrolljournalen per anläggning.",
         actionPartial:"Kontrollera att inga kunder med LK2-anläggningar missar den årliga kontrollen. Finns ett system som signalerar när en kontroll är aktuell, eller sker det reaktivt baserat på kundkontakt?"},
        {id:"inb_verk_3",
         text:"Kan service påbörjas på plats och reservdelar levereras inom 2 helgfria dygn från bekräftad felanmälan (larmklass 1), eller inom 1 helgfritt dygn för larmklass 2-anläggningar?",
         help:"SSF 1015:3 §5.5.2 och §6.5.2–6.5.3: servicetiden räknas från att felanmälan bekräftats. Larmklass 1: 2 helgfria dygn. Larmklass 2: 1 helgfritt dygn för LK2-anläggningar, 2 dygn för LK1-anläggningar. Reservdelar ska finnas tillgängliga för att hålla tiderna.",
         action:"Kartlägg er serviceberedskap och reservdelssituation. Dokumentera hur ni säkerställer att rätt personal och delar finns tillgängliga inom krävd tid. Inför en rutin för serviceeskalering om ordinarie tekniker inte är tillgänglig.",
         actionPartial:"Testa om er nuvarande beredskap faktiskt håller tidskravet i alla lägen — inklusive vid semestertider och hög belastning. Dokumentera hur undantag hanteras."},
        {id:"inb_verk_4",
         text:"Installerar ni materiel som uppfyller kraven i SSF 1014 (Norm för materiel till inbrottslarmanläggning)?",
         help:"SSF 1015:3 §5.7.1 och §6.7.1: all materiel som används i inbrottslarmanläggningar enligt SSF 130 ska uppfylla SSF 1014. Det innebär i praktiken att komponenter ska vara testade och klassificerade enligt tillämpliga standarder (t.ex. EN 50131-serien). Anläggarfirman ska kunna visa upp dokumentation på att den använda materielen uppfyller kraven.",
         action:"Gå igenom er standardsortiment och säkerställ att ni använder SSF 1014-godkänd materiel. Ta fram en produktlista med produktinformation som visar att komponenterna uppfyller kraven. SSF publicerar förteckningar över godkänd materiel.",
         actionPartial:"Uppdatera produktlistan om ni börjat använda nya produkter. Kontrollera att samtliga komponenters klassificering fortfarande är giltig och att produkterna finns i SSFs förteckningar."},
      ]},
      {id:"inb_lokaler",name:"Lokaler & dokumentationshantering",questions:[
        {id:"inb_lok_1",
         text:"Har firmans lokaler mekaniskt inbrottsskydd i skyddsklass 1 (SSF 200) och inbrottslarm i larmklass 2 (SSF 130) — och är lokalen avsedd enbart för egen verksamhet?",
         help:"SSF 1015:3 §5.6 och §6.6: lokalerna där inbrottslarmsverksamheten bedrivs ska ha mekaniskt skydd (dörrenhet SK1) och inbrottslarm i minst larmklass 2. Larmklass 2 kräver dessutom att larmöverföringen är i larmklass 3 (SSF 114), och att all personal som arbetar med inbrottslarm har sin arbetsplats i lokalen. Lokalen får inte delas med annan verksamhet.",
         action:"Låt en behörig ingenjör göra en genomgång av era lokaler mot kraven i SSF 200 (mekaniskt skydd SK1) och SSF 130 (larmklass 2). Ta fram en plan för vilka åtgärder som behövs och genomför dem innan ansökan.",
         actionPartial:"Gå igenom att larmöverföringen uppfyller rätt klass och att lokalen lever upp till kraven. Kontrollera att inga obehöriga (utomstående företag, besökare utan registrering) rör sig fritt i lokalen."},
        {id:"inb_lok_2",
         text:"Förvaras anläggningsdokumentation (anläggarintyg, orienteringsritningar, skötselinstruktioner m.m.) i godkänt säkerhetsskåp enligt SS 3492 med punktskydd, och är skåpet förankrat om vikten understiger 150 kg?",
         help:"SSF 1015:3 §4.9.1: minimikraven för anläggningsdokumentation är anläggarintyg, orienteringsritning, skötselinstruktion, anvisningar vid utlöst larm och kontrolljournal. All sådan dokumentation ska förvaras i säkerhetsskåp klassificerat enligt SS 3492 med punktskydd. Skåp under 150 kg ska vara förankrat enligt tillverkarens anvisningar.",
         action:"Skaffa ett godkänt säkerhetsskåp som uppfyller SS 3492 med punktskydd. Förankra det om vikten understiger 150 kg. Samla all relevant anläggningsdokumentation i skåpet.",
         actionPartial:"Kontrollera att befintligt skåp verkligen uppfyller SS 3492 med punktskydd — inte alla säkerhetsskåp gör det. Kontrollera att förankring finns om skåpet väger under 150 kg."},
        {id:"inb_lok_3a",
         text:"Finns rutiner för att registrera och kontrollera alla besökande i det rum där anläggningsdokumentation förvaras — och lämnas besökare aldrig ensamma i rummet?",
         help:"SSF 1015:3 §4.8.1: tillträdet till dokumentationsrummet ska kontrolleras. Alla besökare ska registreras med namn, syfte och tid. Besökare ska eskorteras och får aldrig lämnas ensamma med anläggningsdokumentationen — handlingarna kan användas för att planera inbrott mot kundernas fastigheter.",
         action:"Inför en besöksrutin för dokumentationsrummet: (1) Alla besökare registreras med namn, datum, syfte och tid. (2) Besökare eskorteras alltid och lämnas aldrig ensamma. (3) Besöksloggen arkiveras.",
         actionPartial:"Kontrollera att besöksrutinen tillämpas konsekvent — även för städpersonal, hantverkare och externa IT-tekniker. Förs besöksloggen faktiskt vid varje besök?"},
        {id:"inb_lok_3b",
         text:"Är tillträdet till dokumentationsrummet tekniskt begränsat — t.ex. via kodlås, passerkort eller låst dörr med begränsad nyckeltillgång?",
         help:"SSF 1015:3 §4.8.1: utöver rutiner för besökskontroll ska tillträdet vara tekniskt begränsat. En policy om att bara behöriga ska ha tillträde uppfyller inte kravet — det krävs en teknisk mekanism som faktiskt begränsar åtkomsten. Obehöriga ska inte fysiskt kunna ta sig in utan eskortering.",
         action:"Inför teknisk tillträdeskontroll: t.ex. ett kodlås, passersystem eller låst dörr där nycklar/koder bara innehas av behörig personal. Dokumentera vilka som har tillträde och gå igenom listan regelbundet.",
         actionPartial:"Kontrollera att den tekniska lösningen faktiskt begränsar tillträdet i praktiken. Hur många har tillgång till nyckeln eller koden? Ses listan över behöriga över regelbundet — t.ex. vid personalförändringar?"},
        {id:"inb_lok_4",
         text:"Finns rutiner för att förvara, skydda och rekonstruera kundregister, anläggningshandlingar och programvara till datorbaserade system?",
         help:"SSF 1015:3 §4.10.1: ni ska ha dokumenterade rutiner för hur kundregister och anläggningsdokumentation skyddas och kan rekonstrueras vid behov — t.ex. vid brand, inbrott eller it-haveri. Detta inkluderar digitalt lagrad dokumentation och programvara till larmsystem.",
         action:"Ta fram en rutin för dokumenthantering och backup: (1) Definiera vilka dokument och data som ska skyddas. (2) Inför regelbunden backup av digitala system. (3) Beskriv hur rekonstruktion sker vid förlust. Se till att digital backup förvaras på annan plats än originalet.",
         actionPartial:"Gå igenom om backup-rutinen faktiskt testas regelbundet och om rekonstruktionsproceduren är känd av berörda. Kontrollera att digitalt lagrad anläggningsdokumentation uppfyller kraven i Bilaga A om servern finns på annan plats (outsourcad)."},
      ]},
    ]
  },

  kamerabevakning:{
    id:"kamerabevakning",
    name:"Kamerabevakning",
    reg:"SSF 1061:3",
    desc:"Anläggarfirma kamerabevakningssystem CCTV enligt SSF 1061:3",
    sections:[

      {id:"kam_org",name:"Organisation & ekonomi",questions:[
        {id:"kam_org_1",
         text:"Är företaget en i Sverige registrerad juridisk person med ekonomisk bärighet klassad som minst 'Kreditvärdig' och fritt från restförd moms och kvarstående skatteskulder?",
         help:"SSF 1061:3 §4.1.1: anläggarfirman ska vara registrerad i Sverige och uppvisa ekonomisk bärighet motsvarande lägst 'Kreditvärdig' i kreditupplysningsföretagens värderingssystem (t.ex. UC eller Creditsafe). Inga restförda skatteskulder eller moms får finnas.",
         action:"Kontrollera er kreditvärdighet hos UC eller annan kreditupplysning. Åtgärda eventuella skatteskulder och restförda avgifter. Registrera bolaget hos Bolagsverket om det inte redan är gjort.",
         actionPartial:"Gör en aktuell kreditupplysning för att bekräfta att ni är klassade som Kreditvärdig. Kontrollera hos Skatteverket att inga restförda skulder finns."},
        {id:"kam_org_2",
         text:"Har företaget en giltig ansvarsförsäkring som minst motsvarar kraven i AB 04 eller ABT 06?",
         help:"SSF 1061:3 §4.1.2: anläggarfirman ska ha en giltig ansvarsförsäkring som minst motsvarar kraven i AB 04 (Allmänna bestämmelser för byggnads-, anläggnings- och installationsentreprenader) eller ABT 06 (Allmänna bestämmelser för totalentreprenader). Be försäkringsbolaget bekräfta att täckningen uppfyller dessa krav.",
         action:"Kontakta ert försäkringsbolag och teckna eller uppdatera er ansvarsförsäkring så att den täcker installationsarbete enligt AB 04/ABT 06. Be om ett skriftligt intyg som bekräftar täckningen.",
         actionPartial:"Gå igenom att befintlig försäkring verkligen täcker kamerabevakningsinstallationer och uppfyller AB 04/ABT 06-kraven. Be försäkringsbolaget bekräfta detta skriftligt."},
      ]},

      {id:"kam_verksamhet",name:"Verksamhet & dokumentation",questions:[
        {id:"kam_verk_1",
         text:"Kan företaget redovisa att det under de senaste 12 månaderna projekterat och/eller installerat minst 2 kamerabevakningsanläggningar enligt SSF 1060?",
         help:"SSF 1061:3 §4.2.1: anläggarfirman ska under den senaste 12-månadersperioden ha projekterat och/eller installerat minst 2 kamerabevakningsanläggningar enligt SSF 1060. Verksamheten verifieras med systemintyg. Kravet säkerställer att firman har aktiv och aktuell erfarenhet.",
         action:"Gå igenom era uppdrag från de senaste 12 månaderna och identifiera de kamerabevakningsinstallationer ni utfört. Säkerställ att systemintyg utfärdats för dessa och att de kan uppvisas vid revision.",
         actionPartial:"Kontrollera att era systemintyg är korrekt utfärdade enligt SSF 1060. Om ni ännu inte nått 2 installationer — planera för att nå kravet innan ansökan lämnas in."},
        {id:"kam_verk_2",
         text:"Har ni tillgång till alla referensdokument som SSF 1061:3 §2 kräver — inklusive SSF 1060, SSF 1062, SSF 1044, GDPR och Kamerabevakningslagen?",
         help:"SSF 1061:3 §4.2.3: anläggarfirman ska ha tillgång till de dokument som anges i normens avsnitt 2. Det inkluderar SSF 1060, SSF 1062, SSF 1044, SSF 114, SSF 130, SSF 200, AB 04, ABT 06, Kamerabevakningslagen och GDPR. Dokumenten ska vara tillgängliga för den personal som arbetar med kamerabevakningsanläggningar.",
         action:"Samla alla referensdokument i senaste utgåva — fysiskt eller digitalt — och gör dem tillgängliga för berörd personal. Skapa ett dokumentregister som visar vilka versioner ni har.",
         actionPartial:"Gå igenom dokumentsamlingen och kontrollera att ni har senaste utgåvorna. Kamerabevakningslagen och GDPR är löpande lagstiftning — säkerställ att ni alltid har aktuell version."},
        {id:"kam_verk_3",
         text:"Finns dokumenterade rutiner för att hjälpa kunden ta fram en korrekt kravbild — inklusive säkerhetsanalys, behovsanalys och kravspecifikation enligt SSF 1060?",
         help:"SSF 1061:3 §4.2.4: anläggarfirman ska ha dokumenterade rutiner för att kunna vara kunden behjälplig med att framställa en korrekt kravbild. Det ska utföras en säkerhetsanalys, behovsanalys och kravspecifikation enligt SSF 1060. Detta är ett aktivt åtagande — inte bara att installera vad kunden beställer.",
         action:"Ta fram en rutin för kundbehovsanalys som täcker: (1) säkerhetsanalys av objektet, (2) behovsanalys baserad på kundens skyddsbehov, (3) kravspecifikation enligt SSF 1060. Dokumentera att processen genomförs vid varje nytt uppdrag.",
         actionPartial:"Kontrollera att rutinen faktiskt tillämpas vid varje nytt kunduppdrag — inte bara för större installationer. Kan ni visa att en säkerhets- och behovsanalys genomförts för era senaste projekt?"},
      ]},

      {id:"kam_kvalitet",name:"Kvalitetsledningssystem",questions:[
        {id:"kam_kval_1",
         text:"Har företaget ett dokumenterat och implementerat kvalitetsledningssystem som minst uppfyller kraven i SSF 1044 SweQ Nivå 2 — alternativt SS-EN ISO 9001 eller FR 2000?",
         help:"SSF 1061:3 §4.3.1–4.3.2: anläggarfirman ska ha ett dokumenterat och implementerat kvalitetsledningssystem integrerat i företagets ledningssystem. Nivåkravet är SSF 1044 SweQ Nivå 2 (högre än för inbrottslarm), alternativt ISO 9001 eller FR 2000. Implementerad innebär upprättad, dokumenterad, införd och underhållen.",
         action:"Utvärdera om ert befintliga kvalitetssystem uppfyller SSF 1044 SweQ Nivå 2 eller ISO 9001. Om inte — identifiera gapen och ta fram en plan för att uppfylla kraven. SSF 1044 kan laddas ned från stoldskyddsforeningen.se.",
         actionPartial:"Kontrollera att kvalitetssystemet faktiskt är implementerat i kamerabevakningsverksamheten — inte bara dokumenterat. Revisorerna kommer att kontrollera om rutinerna efterlevs i praktiken."},
        {id:"kam_kval_2",
         text:"Har den kvalitetsansvarige på anläggarfirman erforderlig kompetens inom kvalitetsledningssystem — t.ex. genomgången internrevisionskurs eller motsvarande?",
         help:"SSF 1061:3 §4.3.3: kvalitetsansvarig på anläggarfirman ska ha erforderlig kompetens inom kvalitetsledningssystem. Det kan visas genom genomgången internrevisionskurs, annan kurs för kvalitet, eller på annat sätt visa att nödvändig kompetens finns. Kompetensen ska kunna dokumenteras.",
         action:"Identifiera vem som är kvalitetsansvarig och dokumentera dennes kompetens. Om kompetensen saknas — planera för en internrevisionskurs eller liknande utbildning. Spara utbildningsintyg.",
         actionPartial:"Kontrollera att kompetensbeviset är aktuellt och relevant. Är det en kurs eller ett intyg som kan uppvisas för en revisor?"},
        {id:"kam_kval_3",
         text:"Finns en utarbetad, dokumenterad och implementerad miljöpolicy för verksamheten?",
         help:"SSF 1061:3 §4.3.4: anläggarfirman ska ha en miljöpolicy som finns och efterlevs. Kravet är unikt för SSF 1061 och saknar direkt motsvarighet i SSF 1015:3. Policyn behöver inte vara omfattande men ska vara dokumenterad och faktiskt tillämpas i verksamheten.",
         action:"Ta fram en kort men tydlig miljöpolicy: definiera er inställning till miljöpåverkan, vilka konkreta åtgärder ni vidtar (t.ex. hantering av kablar/elektronikskrot, resepolicy, återvinning) och hur ni följer upp efterlevnaden.",
         actionPartial:"Kontrollera att policyn faktiskt efterlevs i verksamheten — inte bara finns på papper. Kan personalen redogöra för vad policyn innebär i deras dagliga arbete?"},
      ]},

      {id:"kam_personal",name:"Personal & behörig ingenjör",questions:[
        {id:"kam_pers_1",
         text:"Finns minst en certifierad behörig ingenjör kamerabevakning (SSF 1062) med giltigt certifikat som bedriver sitt huvudsakliga arbete inom ramen för anläggarfirmans verksamhet?",
         help:"SSF 1061:3 §4.4.1–4.4.2.1: anläggarfirman ska ha minst en person — ägare eller anställd — som är certifierad enligt SSF 1062 Behörig ingenjör kamerabevakning. Den behörige ingenjören ska bedriva sitt huvudsakliga arbete inom ramen för anläggarfirmans verksamhet. Ansvar och befogenheter ska vara dokumenterade.",
         action:"Kontrollera att minst en person har giltigt SSF 1062-certifikat och att detta är korrekt dokumenterat i er organisation. Säkerställ att ansvar och befogenheter för den behörige ingenjören finns skriftligen dokumenterade.",
         actionPartial:"Kontrollera att certifikatet är giltigt och inte snart löper ut. Är ansvar och befogenheter dokumenterade och kända i organisationen?"},
        {id:"kam_pers_2",
         text:"Har den behörige ingenjören dokumenterade befogenheter att granska och godkänna alla handlingar för anläggningar samt skriva under systemintyget?",
         help:"SSF 1061:3 §4.4.2.2: den behörige ingenjören ansvarar för att kvalitetssäkra verksamheten genom att granska och godkänna alla handlingar och skriva under systemintyget. Detta innebär att den behörige ingenjören ansvarar för att verksamheten bedrivs enligt SSF 1060. Befogenheterna ska vara dokumenterade.",
         action:"Upprätta ett befogenhetsdokument eller en befattningsbeskrivning som tydligt anger att den behörige ingenjören har befogenhet att granska, godkänna och underteckna systemintyg. Se till att dokumentet är undertecknat av behörig företrädare.",
         actionPartial:"Kontrollera att befogenhetsdokumentationen är tydlig och aktuell. Finns det situationer där systemintyg undertecknas av någon annan? Det är en avvikelse."},
        {id:"kam_pers_3",
         text:"Finns en rutin och plan för hur kvalitetssäkring ska hanteras vid oförutsägbar händelse — t.ex. om den behörige ingenjören plötsligt slutar eller sjukskrivs?",
         help:"SSF 1061:3 §4.4.3–4.4.5: vid oförutsägbar händelse (t.ex. sjukdom) får anläggarfirman under högst 12 månader använda en tillfällig behörig ingenjör. En rutin och tidplan ska finnas dokumenterad. Vid en sådan händelse ska SBSC underrättas utan onödigt dröjsmål.",
         action:"Ta fram en kontinuitetsplan för situationen att behörig ingenjör plötsligt inte kan utöva sin roll: (1) Identifiera alternativa behöriga ingenjörer ni kan anlita. (2) Upprätta en mall för avtal och tidplan. (3) Dokumentera att SBSC ska underrättas utan dröjsmål.",
         actionPartial:"Kontrollera att rutinen är känd av ledningen och faktiskt kan aktiveras snabbt om behovet uppstår. Finns kontaktuppgifter till alternativa behöriga ingenjörer dokumenterade?"},
      ]},

      {id:"kam_ostraffade",name:"Ostraffad personal",questions:[
        {id:"kam_ostr_1",
         text:"Finns en dokumenterad rutin för att kontrollera att all personal med tillgång till anläggningsdokumentation är ostraffad — och tillämpas kontrollen minst vartannat år?",
         help:"SSF 1061:3 §4.5: anläggarfirman ska ha en rutin för att bedöma om personal med tillgång till anläggningsdokumentation är ostraffad. Ostraffad definieras som att inte ha påförts annan påföljd än penningbot. Rutinen ska tillämpas minst vartannat år.",
         action:"Ta fram en rutin för personalkontroll: (1) Definiera vilka roller som har tillgång till anläggningsdokumentation. (2) Begär utdrag ur belastningsregistret vid anställning och minst vartannat år. (3) Dokumentera genomförda kontroller med datum. Utdrag begärs via Polismyndigheten.",
         actionPartial:"Kontrollera att kontrollintervallet vartannat år faktiskt hålls för all berörd personal — inte bara vid nyanställning. Finns det personal där senaste kontroll är äldre än 2 år?"},
      ]},

      {id:"kam_service",name:"Service & felanmälan",questions:[
        {id:"kam_serv_1",
         text:"Kan företaget ta emot och bekräfta felanmälan inom 12 timmar på helgfri vardag — och dokumenteras bekräftelserna?",
         help:"SSF 1061:3 §4.7.1: anläggarfirman ska motta och bekräfta felanmälan inom 12 timmar på helgfri vardag. Notera att kravet gäller helgfria vardagar — till skillnad från inbrottslarm som kräver beredskap dygnet runt. Bekräftelsen ska dokumenteras.",
         action:"Säkerställ att ni har en rutin för att ta emot felanmälningar under helgfria vardagar och bekräfta dessa inom 12 timmar. Dokumentera bekräftelsen med tidsstämpel — t.ex. via ärendehanteringssystem eller loggad mejl/SMS.",
         actionPartial:"Kontrollera att bekräftelserna faktiskt sker inom 12-timmarsgränsen och dokumenteras. Finns en tydlig rutin för vem som tar emot felanmälningar och hur bekräftelsen skickas?"},
        {id:"kam_serv_2",
         text:"Kan företaget påbörja service på plats inom ett helgfritt dygn från att felanmälan bekräftats?",
         help:"SSF 1061:3 §4.7.2: anläggarfirman ska kunna påbörja service på plats inom ett helgfritt dygn från bekräftad felanmälan. Om andra tider avtalats med kunden ska detta dokumenteras på systemintyget (§4.7.3).",
         action:"Säkerställ att ni har tillräckliga resurser och rutiner för att hålla en dygns-responstid på helgfria vardagar. Om ni avtalat om andra tider med specifika kunder — kontrollera att detta finns dokumenterat på respektive systemintyg.",
         actionPartial:"Kontrollera att responstiden faktiskt hålls i praktiken — inte bara i teorin. Finns det kunder med avvikande avtalade tider som inte är dokumenterade på systemintyget?"},
      ]},

      {id:"kam_lokaler",name:"Lokaler & dokumentationsskydd",questions:[
        {id:"kam_lok_1",
         text:"Har anläggarfirmans lokaler mekaniskt inbrottsskydd i lägst skyddsklass 1 (SSF 200), inbrottslarm i lägst larmklass 2 (SSF 130) och larmöverföring i larmklass 3 (SSF 114) med två alternativa vägar?",
         help:"SSF 1061:3 §4.8.1–4.8.3: lokalerna där kamerabevakningsverksamhet bedrivs ska ha: (1) mekaniskt inbrottsskydd skyddsklass 1 enligt SSF 200, (2) inbrottslarm larmklass 2 enligt SSF 130, (3) larmöverföring larmklass 3 enligt SSF 114 med två alternativa vägar. Kravet på larmklass 3-överföring är strängare än för inbrottslarm-anläggarfirmor.",
         action:"Gå igenom era lokaler mot alla tre kraven. Kontrollera att inbrottslarmet är i larmklass 2 och att larmöverföringen är i larmklass 3 med två alternativa kommunikationsvägar. Dokumentera med anläggarintyg.",
         actionPartial:"Kontrollera specifikt larmöverföringen — larmklass 3 med två alternativa vägar är ett krav som ofta missas. Kontakta er larminstallation för att verifiera att larmöverföringen uppfyller SSF 114 larmklass 3."},
        {id:"kam_lok_2",
         text:"Bedrivs enbart den egna kamerabevakningsverksamheten i de lokaler som omfattas av certifieringen?",
         help:"SSF 1061:3 §4.8.4: i de lokaler som omfattas av kamerabevakningsverksamheten får endast den egna verksamheten bedrivas. Delade lokaler med annan verksamhet — t.ex. uthyrda kontor eller butiksyta — uppfyller inte kravet för de ytor som är gemensamma.",
         action:"Gå igenom att era lokaler enbart används för den egna verksamheten i de delar som certifieringen omfattar. Om lokaler delas med annan verksamhet — definiera tydligt vilka ytor som ingår i certifieringens omfattning.",
         actionPartial:"Kontrollera om det förekommer annan verksamhet i lokalerna — t.ex. andrahandsuthyrning eller gemensamma ytor. Klargör vilka delar som ingår i certifieringens scope."},
        {id:"kam_lok_3a",
         text:"Finns dokumenterade och implementerade rutiner för att registrera och kontrollera alla besökare i anläggarfirmans lokaler — och eskorteras besökare alltid?",
         help:"SSF 1061:3 §4.9.1–4.9.2: personer som inte är anställda eller ägare ska betraktas som besökare. Anläggarfirman ska ha implementerade och dokumenterade rutiner för kontroll av besökande i alla lokaler utom eventuell butikslokal. Med övervakning avses besöksregistrering och tillträdeskontroll.",
         action:"Inför en besöksrutin som täcker alla lokaler (utom eventuell butikslokal): (1) Alla besökare registreras med namn, datum, syfte och tid. (2) Besökare eskorteras och lämnas aldrig ensamma. (3) Rutinen ska vara dokumenterad och känd av all personal.",
         actionPartial:"Kontrollera att rutinen faktiskt tillämpas konsekvent — även för leverantörer, städpersonal och hantverkare. Förs besöksregistreringen vid varje besök?"},
        {id:"kam_lok_3b",
