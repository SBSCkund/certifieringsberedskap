function App(){
  const [gateCleared,setGateCleared]=useState(false);
  const [view,setView]=useState("start");
  const [picked,setPicked]=useState([]);
  const [answers,setAnswers]=useState({});
  const [stdIdx,setStdIdx]=useState(0);
  const [secIdx,setSecIdx]=useState(0);
  const [company,setCompany]=useState("");
  const [compErr,setCompErr]=useState(false);
  const [attempted,setAttempted]=useState(false);
  const [agreed,setAgreed]=useState(false);
  const [showRestart,setShowRestart]=useState(false);

  const active=picked.map(id=>STANDARDS[id]);
  const curStd=active[stdIdx];
  const curSec=curStd?curStd.sections[secIdx]:null;
  const toggle=id=>setPicked(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const answer=(qid,val)=>setAnswers(p=>({...p,[qid]:val}));
  const totalQ=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.length,0),0);
  const doneQ=active.reduce((n,s)=>n+s.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]).length,0),0);
  const prog=totalQ?Math.round(doneQ/totalQ*100):0;
  const isFirst=stdIdx===0&&secIdx===0;
  const isLast=curStd&&stdIdx===active.length-1&&secIdx===curStd.sections.length-1;
  const secDone=curSec?curSec.questions.every(q=>answers[q.id]):false;

  const goNext=()=>{
    if(secIdx<curStd.sections.length-1)setSecIdx(secIdx+1);
    else if(stdIdx<active.length-1){setStdIdx(stdIdx+1);setSecIdx(0);}
    else setView("results");
    window.scrollTo(0,0);
  };
  const goPrev=()=>{
    if(secIdx>0)setSecIdx(secIdx-1);
    else if(stdIdx>0){setStdIdx(stdIdx-1);setSecIdx(active[stdIdx-1].sections.length-1);}
    window.scrollTo(0,0);
  };
  const goStart=()=>{
    setAttempted(true);
    if(!company.trim()||!picked.length||!agreed)return;
    setCompErr(false);setStdIdx(0);setSecIdx(0);setView("questions");window.scrollTo(0,0);
  };
  const restart=()=>{setShowRestart(true);};
  const confirmRestart=()=>{
    setAnswers({});setPicked([]);setStdIdx(0);setSecIdx(0);
    setCompany("");setAgreed(false);setAttempted(false);
    setShowRestart(false);setView("start");window.scrollTo(0,0);
  };

  if(!gateCleared){
    return <GatePage LOGO={LOGO} onSuccess={(co)=>{setCompany(co);setGateCleared(true);window.scrollTo(0,0);}}/>;
  }

  return(
    <React.Fragment>
      <a href="#main-content" className="skip-link">Hoppa till innehåll</a>
      <header className="site-header no-print">
        <div className="hdr-inner">
          <img src={LOGO} alt="SBSC" className="hdr-logo"/>
          <span className="hdr-label">Certifieringsberedskap</span>
        </div>
      </header>
      <main className="shell" id="main-content">
        {view==="start"&&(
          <StartPage
            picked={picked} toggle={toggle}
            company={company} setCompany={setCompany}
            compErr={compErr} setCompErr={setCompErr}
            agreed={agreed} setAgreed={setAgreed}
            attempted={attempted} goStart={goStart}
          />
        )}
        {view==="questions"&&curStd&&curSec&&(
          <QPage
            active={active} curStd={curStd} curSec={curSec}
            stdIdx={stdIdx} secIdx={secIdx}
            answers={answers} answer={answer}
            prog={prog} doneQ={doneQ} totalQ={totalQ}
            goNext={goNext} goPrev={goPrev}
            isFirst={isFirst} isLast={isLast} secDone={secDone}
            jump={(si,qi)=>{setStdIdx(si);setSecIdx(qi);window.scrollTo(0,0);}}
          />
        )}
        {view==="results"&&(
          <ReportPage
            active={active} answers={answers}
            company={company} agreed={agreed}
            restart={restart} back={()=>{setView("questions");window.scrollTo(0,0);}}
          />
        )}
        {showRestart&&(
          <div className="modal-overlay" onClick={()=>setShowRestart(false)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E89300" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              </div>
              <h3>Börja om från början?</h3>
              <p>Alla svar och val raderas permanent. Detta kan inte ångras.</p>
              <div className="modal-btns">
                <button className="btn btn-secondary" onClick={()=>setShowRestart(false)}>Avbryt</button>
                <button className="btn btn-primary" onClick={confirmRestart}>Ja, börja om</button>
              </div>
            </div>
          </div>
        )}
      </main>
    </React.Fragment>
  );
}

function StartPage({picked,toggle,company,setCompany,compErr,setCompErr,agreed,setAgreed,attempted,goStart}){
  const missingName=!company.trim();
  const missingCert=!picked.length;
  const missingAgreed=!agreed;
  const hasError=attempted&&(missingName||missingCert||missingAgreed);

  return(
    <React.Fragment>
      <div className="page-intro">
        <div className="chip">Kostnadsfri självutvärdering</div>
        <h1>Är er firma redo för SBSC-certifiering?</h1>
        <p>Kartlägg er beredskap, se gap och få ett tydligt svar på hur lång tid det tar innan ni är redo för revision.</p>
      </div>

      <div className="card">
        <div className="field-label">Företagets namn<span className="req-star">*</span></div>
        <input
          className={`text-input${attempted&&missingName?" invalid":""}`}
          type="text"
          placeholder="T.ex. Andersson Larm & Säkerhet AB"
          value={company}
          onChange={e=>{setCompany(e.target.value);if(e.target.value.trim())setCompErr(false);}}
          onKeyDown={e=>{if(e.key==="Enter")goStart();}}
        />
        {attempted&&missingName&&<div className="field-error">Ange företagets namn för att fortsätta.</div>}
        <div className="privacy-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <p>Ingen data sparas. Alla svar stannar i din webbläsare och raderas när du stänger sidan. Verktyget kan användas helt anonymt.</p>
        </div>
      </div>

      <div className="card">
        <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>Välj certifiering</div>
        <div style={{fontSize:13,color:"var(--muted)",marginBottom:18}}>Välj en eller flera certifieringar ni vill utvärdera.</div>
        <div className="cert-list">
          {Object.values(STANDARDS).map(s=>(
            <div key={s.id} className={`cert-row${picked.includes(s.id)?" active":""}`} onClick={()=>toggle(s.id)} onKeyDown={e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(s.id);}}} role="checkbox" aria-checked={picked.includes(s.id)} tabIndex={0}>
              <div className="cert-check">{picked.includes(s.id)?"✓":""}</div>
              <div>
                <div className="cert-name">{s.name}<span className="cert-badge">{s.reg}</span></div>
                <div className="cert-desc">{s.desc}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="disc-check-wrap" onClick={()=>setAgreed(a=>!a)}>
          <div className={`disc-checkbox${agreed?" disc-checked":""}`}>{agreed?"✓":""}</div>
          <div className="disc-check-text">
            <strong>Jag förstår hur rapporten ska användas</strong>
            <ul style={{listStyle:"none",padding:0,margin:0,display:"flex",flexDirection:"column",gap:5}}>
              <li style={{display:"flex",gap:7,alignItems:"flex-start"}}><span style={{color:"var(--amber)",fontWeight:800,flexShrink:0}}>—</span>Verktyget är ett förenklat stöd och garanterar inte att samtliga krav i tillämpliga regelverk berörs.</li>
              <li style={{display:"flex",gap:7,alignItems:"flex-start"}}><span style={{color:"var(--amber)",fontWeight:800,flexShrink:0}}>—</span>Resultaten speglar er egen tolkning och kan avvika från en faktisk revision.</li>
              <li style={{display:"flex",gap:7,alignItems:"flex-start"}}><span style={{color:"var(--amber)",fontWeight:800,flexShrink:0}}>—</span>En hög beredskapsgrad innebär inte att certifiering kan utfärdas utan föregående revision.</li>
              <li style={{display:"flex",gap:7,alignItems:"flex-start"}}><span style={{color:"var(--amber)",fontWeight:800,flexShrink:0}}>—</span>Läs tillämpliga regelverk noggrant och sök vägledning från SBSC vid behov.</li>
            </ul>
            <div style={{marginTop:8,fontSize:11,color:"var(--muted)"}}>SBSC är ackrediterat av SWEDAC (nr 1631).</div>
          </div>
        </div>

        {hasError&&(
          <div className="validation-box">
            <div className="validation-title">Följande måste fyllas i för att starta:</div>
            {missingName&&<div className="validation-item"><span className="v-num">1</span>Ange företagets namn i fältet ovan</div>}
            {missingCert&&<div className="validation-item"><span className="v-num">{missingName?"2":"1"}</span>Välj minst en certifiering i listan ovan</div>}
            {missingAgreed&&<div className="validation-item"><span className="v-num">{[missingName,missingCert].filter(Boolean).length+1}</span>Bekräfta att du förstår hur rapporten ska användas (kryssrutan ovan)</div>}
          </div>
        )}

        <div className="stat-row">
          <div className="stat">
            <div className="stat-n">~{picked.length>0?picked.length*10:10} min</div>
            <div className="stat-l">{picked.length>1?`${picked.length} certifieringar · ${picked.reduce((n,id)=>n+STANDARDS[id].sections.reduce((m,s)=>m+s.questions.length,0),0)} frågor`:"beräknad tid"}</div>
          </div>
          <div className="stat"><div className="stat-n">0%</div><div className="stat-l">data lagras</div></div>
          <div className="stat"><div className="stat-n">PDF</div><div className="stat-l">utskriftsvänlig</div></div>
        </div>
        <div className="btn-row">
          <span style={{fontSize:12,color:"var(--muted)"}}>Ger en indikation — inte ett certifieringsbesked.</span>
          <button className="btn btn-primary" onClick={goStart}>Starta utvärdering →</button>
        </div>
      </div>
    </React.Fragment>
  );
}

function QCard({q,i,answers,answer}){
  const [open,setOpen]=React.useState(false);
  return(
    <div className="q-card">
      <div className="q-text">{i+1}. {q.text}</div>
      {q.help&&(
        <React.Fragment>
          <button className={`q-help-toggle${open?" open":""}`} onClick={()=>setOpen(o=>!o)}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            {open?"Dölj vägledning":"Visa vägledning"}
          </button>
          {open&&<div className="q-help-expanded">{q.help}</div>}
        </React.Fragment>
      )}
      <div className="ans-grid">
        {ANSWERS.map(a=>(
          <button key={a.key} className={`ans-btn${answers[q.id]===a.key?" "+a.cls:""}`} onClick={()=>answer(q.id,a.key)} aria-pressed={answers[q.id]===a.key} aria-label={a.label}>{a.label}</button>
        ))}
      </div>
    </div>
  );
}

function QPage({active,curStd,curSec,stdIdx,secIdx,answers,answer,prog,doneQ,totalQ,goNext,goPrev,isFirst,isLast,secDone,jump}){
  return(
    <React.Fragment>
      {active.length>1&&(
        <div className="cert-switcher no-print">
          {active.map((std,i)=>{
            const allDone=std.sections.every(sec=>sec.questions.every(q=>answers[q.id]));
            const isAct=i===stdIdx;
            return(
              <button
                key={std.id}
                className={`cert-switch-btn${isAct?" active":""}${allDone?" done":""}`}
                onClick={()=>jump(i,0)}
              >
                {allDone&&!isAct?"✓ ":""}{std.name}
              </button>
            );
          })}
        </div>
      )}
      <div className="progress-bar no-print">
        <div className="progress-top">
          <span className="progress-label">{curStd.name} · {curSec.name}</span>
          <span className="progress-count">{doneQ}/{totalQ} svar · {prog}%</span>
        </div>
        <div className="progress-track" role="progressbar" aria-valuenow={prog} aria-valuemin={0} aria-valuemax={100} aria-label={`Framsteg: ${prog}%`}><div className="progress-fill" style={{width:`${prog}%`}}/></div>
      </div>
      <div className="section-tabs no-print">
        {curStd.sections.map((sec,i)=>{
          const{done,total}=secPct(sec,answers);
          const isAct=i===secIdx,isDone=done===total;
          return(
            <button key={sec.id} className={`section-tab${isAct?" active":""}${isDone&&!isAct?" done":""}`} onClick={()=>jump(stdIdx,i)}>
              <span className="tab-dot"/>{sec.name}
            </button>
          );
        })}
      </div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",color:"var(--muted)",marginBottom:4}}>{curStd.name} · {curStd.reg}</div>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>{curSec.name}</h2>
        <p style={{fontSize:13,color:"var(--muted)"}}>Välj "Vet ej" om frågan behöver kontrolleras internt.</p>
      </div>
      {curSec.questions.map((q,i)=>(
        <QCard key={q.id} q={q} i={i} answers={answers} answer={answer}/>
      ))}
      <div className="btn-row no-print">
        <button className="btn-ghost" onClick={goPrev} disabled={isFirst}>← Föregående</button>
        <button className="btn btn-primary" onClick={goNext} disabled={!secDone}>{isLast?"Visa rapport →":"Nästa →"}</button>
      </div>
      {!secDone&&<div className="q-hint no-print">Besvara alla frågor för att gå vidare.</div>}
    </React.Fragment>
  );
}

function ReportPage({active,answers,company,agreed,restart,back}){
  let s=0,t=0;
  active.forEach(std=>std.sections.forEach(sec=>sec.questions.forEach(q=>{
    const a=answers[q.id];if(a&&a!=="vet_ej"){const d=ANSWERS.find(x=>x.key===a);if(d){s+=d.score;t++;}}
  })));
  const overall=t?Math.round(s/t*100):null;
  const hiG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="ej").length,0),0);
  const miG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="delvis").length,0),0);
  const vetEjG=active.reduce((n,std)=>n+std.sections.reduce((m,sec)=>m+sec.questions.filter(q=>answers[q.id]==="vet_ej").length,0),0);
  const ds=today();
  const portal="https://kundportal.sbsc.se/login";
  const summary=generateSummary(active,answers,company,overall);

  return(
    <React.Fragment>
      <div className="print-header">
        <img src={LOGO} alt="SBSC" className="print-header-logo"/>
        <div className="print-header-right">
          <span className="print-header-title">Certifieringsberedskapsanalys</span>
          <span className="print-header-sub">{ds} · SBSC ackrediterat av SWEDAC (nr 1631)</span>
        </div>
      </div>

      <TocBlock active={active} answers={answers}/>
      <div className="report-banner">
        <div>
          <div className="banner-label">Certifieringsberedskapsanalys · SBSC</div>
          <div className="banner-company">{company||"Ert företag"}</div>
          <div className="banner-meta">
            <span style={{display:"flex",alignItems:"center",gap:5}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              {ds}
            </span>
            <span>{active.map(s=>s.name).join(" · ")}</span>
          </div>
          {agreed&&(
            <div className="report-confirm">
              <div className="report-confirm-dot">✓</div>
              <span>Genomförd med insikt om att rapporten är ett förenklat stöd som inte garanterar heltäckande kravbedömning och inte utgör ett certifieringsbesked. Bekräftat av {company} den {ds}.</span>
            </div>
          )}
        </div>
        <div>
          <div className="banner-score-label">Samlad beredskap</div>
          <div className="banner-score">{overall!=null?<React.Fragment>{overall}<em>%</em></React.Fragment>:"—"}</div>
          <div className="banner-date">{ds}</div>
        </div>
      </div>

      <div className="kpi-row">
        <div className="kpi-cell"><div className="kpi-label">Bedömning</div><div className="kpi-value">{readiness(overall)}</div></div>
        <div className="kpi-cell"><div className="kpi-label">Tid innan redo för revision</div><div className="kpi-value kpi-amber">{timeUntil(overall)}</div></div>
        <div className="kpi-cell"><div className="kpi-label">Identifierade åtgärder</div><div className="kpi-value">{hiG} att prioritera · {miG} att slutföra</div></div>
      </div>

      {vetEjG>=5&&(
        <div style={{
          display:"flex",alignItems:"flex-start",gap:10,
          padding:"12px 16px",marginBottom:14,
          background:"#FEF9EC",border:"1.5px solid #FFD580",
          borderRadius:6,fontSize:13
        }}>
          <svg style={{flexShrink:0,marginTop:1,color:"#8A5500"}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div>
            <strong style={{display:"block",marginBottom:3,color:"#7A4800"}}>OBS: {vetEjG} frågor besvarades med "Vet ej"</strong>
            <span style={{color:"#8A5500"}}>Resultatet kan vara missvisande. Dessa krav behöver kontrolleras internt innan ni får en fullständig bild av er beredskap.</span>
          </div>
        </div>
      )}
      <div className="summary-box">
        <div className="summary-box-label">Var befinner ni er på certifieringsresan?</div>
        <div className="summary-box-text">{summary}</div>
      </div>

      {active.map(std=><CertSection key={std.id} std={std} answers={answers}/>)}

      <div className="disclaimer">
        <strong>Viktig information om denna rapport</strong>
        Denna rapport är en självskattning baserad på era egna svar och ger en indikativ — inte heltäckande — bild av er beredskap inför certifiering. Verktyget är ett förenklat stöd och garanterar inte att samtliga krav i tillämpliga regelverk och standarder berörs eller bedöms korrekt. Resultaten speglar hur ni själva tolkar och besvarar frågorna, vilket kan avvika väsentligt från hur SBSC:s revisorer bedömer er verksamhet vid en faktisk revision baserad på dokumentgranskning och platsbesök. Tillämpliga regelverk uppdateras löpande — SBSC ansvarar inte för att verktyget vid varje tidpunkt återspeglar gällande versioner. En hög beredskapsgrad i denna självskattning innebär inte att certifiering kan utfärdas utan föregående revision, eller att revisionens utfall med säkerhet blir positivt. Vi rekommenderar att ni noggrant läser de regelverk och standarder som ligger till grund för er valda certifiering och vid behov söker vägledning från SBSC innan ansökan lämnas in. SBSC är ackrediterat av SWEDAC (ackrediteringsnummer 1631).
      </div>

      <div className="cta-block">
        <div>
          <h3>Redo att ta nästa steg?</h3>
          <p>Kontakta oss så berättar vi mer om certifieringsprocessen och vad som passar er verksamhet.</p>
        </div>
        <a className="cta-link" href={`mailto:kund@sbsc.se?subject=${encodeURIComponent("Certifieringsberedskap — "+company)}&body=${encodeURIComponent("Hej SBSC,\n\nVi har genomfört er självskattning för certifieringsberedskap.\n\nFöretag: "+company+"\nCertifieringar: "+active.map(s=>s.name).join(", ")+"\nSamlad beredskap: "+(overall!==null?overall+"%":"—")+"\nBedömning: "+readiness(overall)+"\nÅtgärder: "+hiG+" att prioritera · "+miG+" att slutföra\n\nVi är intresserade av att höra mer och bli kontaktade av SBSC.\n\nMed vänliga hälsningar,")}`}>
          Ta kontakt med SBSC
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>

      <div className="btn-row no-print" style={{marginTop:20}}>
        <button className="btn-ghost" onClick={back}>← Tillbaka</button>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-secondary" onClick={()=>window.print()}>🖨 Skriv ut / PDF</button>
          <button className="btn btn-secondary" onClick={restart}>Börja om</button>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
