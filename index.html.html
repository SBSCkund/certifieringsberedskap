         text:"Är tillträdet till anläggarfirmans lokaler tekniskt begränsat via t.ex. kodlås, passerkort eller låst dörr med begränsad nyckeltillgång?",
         help:"SSF 1061:3 §4.9.2: tillträdeskontroll är en del av kravet på övervakning av besökande. En dokumenterad rutin utan teknisk begränsning av tillträdet uppfyller inte kravet fullt ut — det krävs en teknisk mekanism som faktiskt begränsar vem som kan ta sig in.",
         action:"Inför teknisk tillträdeskontroll i lokalerna: kodlås, passersystem eller låst dörr med begränsad nyckeltillgång. Dokumentera vilka som har tillträde och se över listan vid personalförändringar.",
         actionPartial:"Kontrollera att den tekniska lösningen faktiskt begränsar tillträdet i praktiken. Hur många har tillgång till koder/nycklar och ses listan över regelbundet?"},
        {id:"kam_dok_1",
         text:"Förvaras anläggningsdokumentation för kamerabevakningsanläggningar i låst skåp eller låst rum — oavsett om det är fysiskt eller digitalt material?",
         help:"SSF 1061:3 §4.10.1: anläggarfirman ska förvara anläggningsdokumentation i låst skåp eller låst rum, oavsett media. Digitalt material ska skyddas av brandvägg och lösenord samt säkerhetskopieras på extern enhet (§4.10.3). Om servern finns hos tredje part gäller särskilda krav enligt Bilaga A.",
         action:"Gå igenom hur er anläggningsdokumentation förvaras: (1) Fysiskt material: låst skåp eller rum. (2) Digitalt material: brandvägg, lösenord och backup på extern enhet. (3) Om outsourcad server: kontrollera att Bilaga A-kraven är uppfyllda och intygade av leverantören.",
         actionPartial:"Kontrollera att backup faktiskt genomförs och testas regelbundet. Om ni använder molntjänster — är leverantören informerad om och uppfyller Bilaga A-kraven?"},
        {id:"kam_dok_2",
         text:"Finns rutiner för att förvara, skydda och rekonstruera kundregister, anläggningshandlingar och programvara till datorbaserade system?",
         help:"SSF 1061:3 §4.10.2: rutiner ska finnas för att förvara, skydda och rekonstruera kundregister, anläggningshandlingar och programvara. Med rekonstruktion avses att information kan återskapas vid förlust — t.ex. om en dator eller server havererar. Tillgänglighet för behörig personal regleras i §4.10.4.",
         action:"Ta fram en rutin som täcker: (1) Var kundregister och anläggningshandlingar förvaras. (2) Hur de skyddas mot obehörig åtkomst. (3) Hur de kan rekonstrueras vid förlust — backup-frekvens, lagringsplats och ansvarig. Testa återställning minst en gång per år.",
         actionPartial:"Kontrollera att rutinen täcker alla tre delarna — förvaring, skydd och rekonstruktion. Har backup-rutinen faktiskt testats med en återställning, eller antas den bara fungera?"},
      ]},

      {id:"kam_gdpr",name:"Lagar, GDPR & upplysningsplikt",questions:[
        {id:"kam_gdpr_1",
         text:"Är anläggarfirmans personal väl insatt i de väsentliga delarna av Kamerabevakningslagen och GDPR — och finns lagarna tillgängliga på anläggarfirman?",
         help:"SSF 1061:3 §4.11: personalen ska vara väl insatt i väsentliga delar av Dataskyddsförordningen (GDPR) och Kamerabevakningslagen. Lagarna ska finnas tillgängliga på anläggarfirman. Kamerabevakningslagen (2018:1200) reglerar bl.a. tillståndsplikt, registreringstid och upplysningsskyldighet.",
         action:"Säkerställ att berörd personal fått utbildning i Kamerabevakningslagen och GDPR — specifikt de delar som påverkar kundinstallationer: tillståndsplikt, registreringstid, skyltningskrav och kundens ansvar som personuppgiftsansvarig. Spara lagarna digitalt tillgängliga för all personal.",
         actionPartial:"Kontrollera att kunskapen faktiskt finns hos personalen — inte bara att lagtexterna är tillgängliga. Kan teknikerna förklara vad Kamerabevakningslagen innebär för en typisk kundinstallation?"},
        {id:"kam_gdpr_2",
         text:"Finns rutiner för att informera kunden om vad Kamerabevakningslagen och GDPR innebär — och bistår ni kunden med nödvändiga dokument, ansökningshandlingar och skyltar?",
         help:"SSF 1061:3 §4.11: anläggarfirman ska informera kunden om vad lagarna innebär och hur de påverkar användandet av anläggningen. Firman ska även bistå med de dokument och ansökningshandlingar som krävs samt tillhandahålla de skyltar som krävs för att upplysa om att området är kamerabevakat. Detta är ett aktivt krav — inte bara att hänvisa till IMY:s hemsida.",
         action:"Ta fram en kundrutin för GDPR/Kamerabevakningslagen: (1) Informationsblad till kunden om deras skyldigheter som personuppgiftsansvarig. (2) Checklistor för tillståndsplikt och anmälningsplikt. (3) Mall för kamerabevakningsskylt. (4) DPA-avtal om ni hanterar personuppgifter för kundens räkning.",
         actionPartial:"Kontrollera att rutinen faktiskt tillämpas vid varje kundinstallation — inte bara för kunder som frågar. Har ni mallar och skyltar tillgängliga, eller sköter ni detta ad hoc?"},
        {id:"kam_gdpr_3",
         text:"Har ni tecknat personuppgiftsbiträdesavtal (DPA) med de kunder där ni hanterar personuppgifter för deras räkning — t.ex. vid fjärrövervakning, lagring av videomaterial eller teknisk support med åtkomst till systemet?",
         help:"GDPR Artikel 28: om anläggarfirman hanterar personuppgifter på uppdrag av kunden — t.ex. vid fjärrövervakning, support med åtkomst till inspelat material eller lagring av videomaterial i molntjänst — krävs ett personuppgiftsbiträdesavtal (DPA). Det är kundens ansvar att säkerställa att DPA finns, men er erfarenhet och era rutiner skapar ett mervärde och minskar kundens risk.",
         action:"Inventera era kundrelationer och identifiera i vilka fall ni hanterar personuppgifter för kundens räkning. Ta fram en DPA-mall för dessa situationer och se till att avtal finns tecknade med berörda kunder. Rådgör med juridisk kompetens om ni är osäkra.",
         actionPartial:"Kontrollera om det finns kundrelationer där ni de facto hanterar personuppgifter utan att DPA finns. Vanligast: fjärrsupportavtal med åtkomst till videomaterial och molnlagringstjänster."},
      ]},

    ]
  },
    iso9001:{
    id:"iso9001",name:"ISO 9001",reg:"SS-EN ISO 9001:2015",
    desc:"Kvalitetsledningssystem för anläggarfirmor inom brand och säkerhet",
    sections:[
      {id:"iso_kontext",name:"Organisationens kontext",questions:[
        {id:"iso_k_1",
         text:"Har ni kartlagt de externa och interna faktorer som påverkar er förmåga att leverera med rätt kvalitet och uppnå era mål?",
         help:"ISO 9001:2015 §4.1: organisationen ska avgöra relevanta externa faktorer (t.ex. branschregler, försäkringskrav, konkurrens, teknikutveckling) och interna faktorer (t.ex. kompetens, kultur, ekonomi). Informationen ska övervakas och granskas. Det behöver inte vara ett avancerat dokument — en genomtänkt och uppdaterad lista räcker.",
         action:"Håll ett kort internt möte och dokumentera de viktigaste externa och interna faktorerna. T.ex. externa: SSF/SBF-regelverksförändringar, försäkringsbolagens krav, konkurrens om behöriga ingenjörer. Interna: kompetensgap, ekonomisk uthållighet, nyckelberoendet av enskilda medarbetare. Uppdatera listan minst en gång per år.",
         actionPartial:"Gå igenom om er nuvarande analys är aktuell och täcker både externa och interna faktorer. Är den integrerad i er planering, eller ligger den bara som ett dokument ingen läser?"},
        {id:"iso_k_2",
         text:"Har ni identifierat vilka intressenter (kunder, beställare, försäkringsbolag, myndigheter m.fl.) som ställer krav på er verksamhet, och vad dessa krav konkret innebär?",
         help:"ISO 9001:2015 §4.2: organisationen ska bestämma vilka intressenter som är relevanta för kvalitetsledningssystemet och vilka av deras krav som är relevanta. För en brand- och säkerhetsinstallatör kan det t.ex. vara: kundkrav på dokumentation och anläggarintyg, försäkringsbolagens krav på SSF-certifiering, myndighetskrav via larmlagen.",
         action:"Ta fram en enkel intressentlista: vem ställer krav på er, och vad kräver de? Koppla listan till era rutiner — t.ex. att kundkravet på skriftlig dokumentation möts av er anläggarintygsrutin.",
         actionPartial:"Gå igenom om listan är komplett och aktuell. Märker ni att ni missar krav från någon intressent i era dagliga rutiner — uppdatera listan och se vilka rutiner som behöver justeras."},
        {id:"iso_k_3",
         text:"Är kvalitetsledningssystemets omfattning definierad och dokumenterad — dvs. vilka tjänster, uppdragstyper och verksamhetsdelar som ingår?",
         help:"ISO 9001:2015 §4.3: organisationen ska bestämma och dokumentera systemets avgränsning. T.ex. 'Systemet omfattar projektering, installation, driftsättning och underhåll av inbrottslarmanläggningar larmklass 1–2 och brandlarmanläggningar.' Om något krav i standarden bedöms som icke-tillämpligt ska detta motiveras.",
         action:"Skriv en kort beskrivning av systemets omfattning — vad ingår, vad ingår inte, och varför. Dokumentera detta som en del av systemet, t.ex. i kvalitetshandboken eller liknande.",
         actionPartial:"Kontrollera att befintlig avgränsning fortfarande stämmer med er faktiska verksamhet. Har ni utökat eller inskränkt er verksamhet utan att uppdatera beskrivningen?"},
      ]},
      {id:"iso_ledarskap",name:"Ledarskap, policy & mål",questions:[
        {id:"iso_l_1",
         text:"Har högsta ledningen upprättat en kvalitetspolicy som är anpassad till verksamheten, innehåller ett förbättringsåtagande och är kommunicerad och känd av personalen?",
         help:"ISO 9001:2015 §5.2: policyn ska vara anpassad till organisationens syfte och förutsättningar, ge ett ramverk för kvalitetsmål, och innefatta åtaganden att uppfylla tillämpliga krav och ständigt förbättra systemet. Den ska finnas tillgänglig som dokumenterad information och kommuniceras, förstås och tillämpas inom organisationen.",
         action:"Skriv en enkel kvalitetspolicy på en sida. Den ska innehålla: vad ni erbjuder, vilket kvalitetsåtagande ni gör gentemot kunder, koppling till tillämpliga regler (SSF/SBF-normer, larmlagen), och ett åtagande om ständig förbättring. Låt ledningen skriva under. Gå igenom den med all personal och dokumentera kommunikationen.",
         actionPartial:"Kontrollera att policyn uppfyller §5.2:s fyra krav: rätt syfte, ramverk för mål, uppfyllnadsåtagande och förbättringsåtagande. Kontrollera att den faktiskt är känd av personalen — inte bara publicerad."},
        {id:"iso_l_2",
         text:"Är ansvar och befogenheter för kvalitetsrelaterade roller tydligt fördelade, dokumenterade och kommunicerade inom organisationen?",
         help:"ISO 9001:2015 §5.3: högsta ledningen ska tilldela ansvar och befogenhet för att (a) säkerställa att systemet uppfyller standardens krav, (b) säkerställa att processerna ger avsedda resultat, (c) rapportera om systemets funktion och förbättringsmöjligheter, och (d) säkerställa kundfokus.",
         action:"Ta fram en enkel ansvarsmatris eller befattningsbeskrivningar som täcker §5.3:s fyra punkter. Klargör specifikt vem som ansvarar för: systemets efterlevnad, processresultat, rapportering till ledningen och kundernas krav.",
         actionPartial:"Gå igenom om befintlig ansvarsfördelning täcker alla §5.3-krav. Är rapporteringsvägen till ledningen tydlig? Vet berörda personer om sina roller — eller är ansvaret bara dokumenterat utan att ha kommunicerats?"},
        {id:"iso_l_3",
         text:"Finns dokumenterade, mätbara kvalitetsmål för relevanta funktioner och processer, och finns en plan för hur de ska uppnås?",
         help:"ISO 9001:2015 §6.2: kvalitetsmålen ska vara förenliga med policyn, mätbara, ta hänsyn till krav, vara relevanta för kundtillfredsställelse, övervakas, kommuniceras och uppdateras. För varje mål ska det framgå: vad som ska göras, vilka resurser som krävs, vem som ansvarar, när det ska vara klart och hur resultaten utvärderas.",
         action:"Sätt 3–5 konkreta och mätbara mål. T.ex. 'Max 3% reklamationer per kvartal', 'All ny personal genomgår behörighetsutbildning inom 6 månader', 'Anläggarintyg överlämnas senast vid avprovning i 100% av uppdragen'. Dokumentera målen med ansvarig och uppföljningsdatum.",
         actionPartial:"Gå igenom befintliga mål mot §6.2:s krav. Är de mätbara? Finns en plan med ansvarig, tidpunkt och utvärderingsmetod? Uppdateras de regelbundet och kommuniceras de till berörda?"},
      ]},
      {id:"iso_planering",name:"Riskbaserat tänkande & planering",questions:[
        {id:"iso_p_1",
         text:"Har ni identifierat risker och möjligheter som kan påverka kvalitetsledningssystemets förmåga att ge avsedda resultat, och planerat åtgärder för att hantera dem?",
         help:"ISO 9001:2015 §6.1: organisationen ska identifiera risker och möjligheter och planera åtgärder för att hantera dem. Åtgärderna ska integreras i processerna och deras verkan utvärderas. Standarden kräver inte ett formellt riskhanteringssystem — en enkel riskanalys räcker. T.ex. risk: nyckelkompetens som slutar, möjlighet: utökat serviceavtal med befintliga kunder.",
         action:"Gör en riskanalys i tabellform: identifiera de 5–10 viktigaste riskerna och möjligheterna, bedöm sannolikhet och konsekvens för varje, och definiera en åtgärd per risk. Integrera analysen i er planering och uppdatera den vid väsentliga förändringar.",
         actionPartial:"Kontrollera att befintlig riskanalys faktiskt är kopplad till konkreta åtgärder — inte bara en lista. Utvärderas åtgärdernas verkan? Uppdateras analysen vid personalförändringar, nya regelverk eller verksamhetsförändringar?"},
        {id:"iso_p_2",
         text:"Finns rutiner för att planera förändringar av kvalitetsledningssystemet på ett kontrollerat sätt — dvs. att ändringarnas syfte, konsekvenser och resursbehov beaktas?",
         help:"ISO 9001:2015 §6.3: när systemet behöver förändras ska detta göras planerat, med hänsyn till: syftet med ändringen, att systemets funktion bibehålls, resursers tillgänglighet, och befintlig/förändrad ansvarsfördelning. T.ex. om ni utökar till ny larmklass, inför nya rutiner eller byter systemstöd.",
         action:"Ta fram en enkel rutin för förändringsplanering: innan en förändring av systemet genomförs ska syfte, konsekvenser, resursbehov och ansvar dokumenteras och godkännas av ledningen.",
         actionPartial:"Kontrollera att ni faktiskt planerar systemförändringar — eller om de sker ad hoc. Finns det exempel på förändringar som gjorts utan att konsekvenserna för systemet beaktats?"},
      ]},
      {id:"iso_stod",name:"Kompetens, resurser & dokumentation",questions:[
        {id:"iso_s_1",
         text:"Har ni bestämt vilken kompetens som är nödvändig för varje roll, säkerställt att personalen är kompetent, och dokumenterat bevis på kompetensen?",
         help:"ISO 9001:2015 §7.2: organisationen ska avgöra nödvändig kompetens, säkerställa att personalen har den (baserat på utbildning, upplärning eller erfarenhet), vidta åtgärder om kompetens saknas, och bevara dokumenterad information som belägg. T.ex. kompetensmatriser, utbildningsintyg, BIB/BII-certifikat, vidareutbildningsplan.",
         action:"Skapa en kompetensmatris: roller/tjänster på ena axeln, anställda på den andra. Fyll i dokumenterad kompetens (certifikat, utbildningsintyg, erfarenhetsbeskrivning) per person. Markera luckor och upprätta en åtgärdsplan med tidplan.",
         actionPartial:"Uppdatera matrisen med delar som saknas. Lägg till förnyelsedatum för tidsbegränsade certifikat (t.ex. BIB vart 5:e år). Kontrollera att åtgärdsplanen för kompetensgap faktiskt genomförs."},
        {id:"iso_s_2",
         text:"Finns rutiner för att skapa, uppdatera och styra dokumenterad information — inklusive versionshantering, distribution och skydd mot oavsiktlig ändring?",
         help:"ISO 9001:2015 §7.5: all dokumenterad information som krävs av systemet ska styras. Det innebär: rätt identifiering (version, datum), lämplig form, granskning och godkännande, tillgänglighet vid behov, skydd mot förvanskning, versionshantering, och arkivering/gallring. Gäller både interna dokument och externa dokument man är beroende av (t.ex. SSF/SBF-normer).",
         action:"Inför ett enkelt dokumentstyrningssystem: (1) Numrera och versionsmärk alla styrande dokument. (2) Definiera en central plats där aktuella versioner hämtas. (3) Ta bort eller märk upp ogiltiga versioner. (4) Definiera vem som godkänner nya/ändrade dokument.",
         actionPartial:"Gå igenom om versionshanteringen faktiskt fungerar i praktiken — finns ogiltiga versioner tillgängliga? Kontrollera att externa dokument (SSF/SBF-normer med revideringsblad) är uppdaterade."},
        {id:"iso_s_3",
         text:"Finns rutiner för att bevara och överföra kritisk verksamhetskunskap — t.ex. om nyckelkompetens slutar eller ny personal tillkommer?",
         help:"ISO 9001:2015 §7.1.6: organisationen ska bestämma den kunskap som är nödvändig för processerna och säkerställa att den underhålls och är tillgänglig. Vid förändrade behov ska man beakta befintlig kunskap och bestämma hur ytterligare kunskap inhämtas. T.ex. rutiner, installationserfarenhet, kundhistorik och systeminställningar som bara finns i en persons huvud.",
         action:"Identifiera kritisk kunskap som riskerar att gå förlorad vid personalomsättning. Dokumentera den: t.ex. via arbetsrutiner, systemdokumentation, kundmappar och mentorskap. Säkerställ att ingen funktion är helt beroende av en enskild person.",
         actionPartial:"Gå igenom vilken kritisk kunskap som fortfarande är odokumenterad eller beroende av en enskild person. Prioritera dokumentation av de mest riskfyllda luckorna."},
      ]},
      {id:"iso_verksamhet",name:"Verksamhet & leveranskvalitet",questions:[
        {id:"iso_v_1",
         text:"Fångar ni upp, granskar och dokumenterar kundkrav innan ett uppdrag accepteras — inklusive tillämpliga regelverk och krav som kunden inte uttryckligen angett men som är nödvändiga?",
         help:"ISO 9001:2015 §8.2.2–8.2.3: innan ett uppdrag accepteras ska kraven på produkter/tjänster granskas. Det inkluderar: kundspecificerade krav, tillämpliga författningskrav (t.ex. larmlagen, SSF/SBF-normer), krav organisationen bedömer nödvändiga, och krav i kontrakt som avviker från tidigare angivna. Kunden ska bekräfta krav som inte är dokumenterade.",
         action:"Inför en rutin för uppdragsgranskning: innan ni accepterar ett uppdrag, gå igenom vilka krav som gäller (kund, regelverk, er standard). Dokumentera kravgenomgången — t.ex. via offert, orderbekräftelse eller ett mötes- och kravformulär.",
         actionPartial:"Kontrollera att rutinen används konsekvent och täcker alla §8.2.3-punkter — inte bara kundspecificerade krav utan även tillämpliga regelverk. Finns det uppdragstyper som genomförs utan dokumenterad kravgenomgång?"},
        {id:"iso_v_2a",
          text:"Finns rutiner för att verifiera att arbetet uppfyller kraven — t.ex. via en slutkontrollchecklista — innan det överlämnas till kunden?",
          help:"ISO 9001:2015 §8.6: organisationen ska genomföra planerade aktiviteter för att verifiera att krav uppfyllts innan frisläppning. Det innebär att det ska finnas en definierad slutkontroll-rutin med acceptanskriterier — t.ex. en checklista som fylls i vid varje uppdrag.",
          action:"Ta fram en slutkontrollchecklista anpassad till era tjänster: t.ex. för brandlarmsinstallation — funktionsprov, larmöverföringskontroll, dokumentation komplett, anläggarintyg upprättat. Definiera vad som ska kontrolleras och säkerställ att rutinen används vid varje uppdrag.",
          actionPartial:"Kontrollera att checklistan faktiskt används konsekvent — inte bara vid vissa uppdragstyper. Saknas slutkontrollrutin för några tjänster ni erbjuder?"
        },
        {id:"iso_v_2b",
          text:"Dokumenteras godkännandeprocessen med spårbarhet till vem som godkänt leveransen och när?",
          help:"ISO 9001:2015 §8.6: dokumenterad information ska bevaras med bevis på överensstämmelse och spårbarhet till den som godkänt frisläppningen. Det räcker inte att ha en rutin — godkännandet måste kunna visas i efterhand.",
          action:"Definiera vem som har rätt att godkänna leverans och säkerställ att godkännandet alltid dokumenteras med namn och datum — t.ex. i ett protokoll, checklista eller digital signatur. Spara dokumentationen per uppdrag i kundmappen.",
          actionPartial:"Kontrollera att godkännandet faktiskt dokumenteras med spårbarhet per uppdrag. Finns en namngiven person med mandat att godkänna — eller godkänns leveranser utan att det registreras?"
        },
        
        {id:"iso_v_3",
         text:"Finns rutiner för att säkerställa att externt tillhandahållna produkter och tjänster (leverantörer, underentreprenörer) uppfyller era krav — inklusive dokumenterade kriterier för urval och uppföljning?",
         help:"ISO 9001:2015 §8.4: organisationen ska definiera kriterier för utvärdering, val och uppföljning av externa leverantörer, baserat på deras förmåga att leverera enligt krav. Dokumenterad information om utvärdering och nödvändiga åtgärder ska bevaras. Gäller för materialleverantörer (SSF 1014-godkänd materiel), underentreprenörer och konsulter.",
         action:"Upprätta en lista över godkända leverantörer med dokumenterade urvalskriterier (certifieringar, teknisk kompetens, referenser, leveranstider). Inför en rutin för löpande uppföljning av leverantörsprestanda och för att bedöma nya leverantörer.",
         actionPartial:"Gå igenom befintlig leverantörslista — finns dokumenterade urvalskriterier? Sker löpande uppföljning? Uppdatera listan och kontrollera att underentreprenörer faktiskt uppfyller era krav."},
        {id:"iso_v_4",
         text:"Finns rutiner för att identifiera, styra och dokumentera avvikande processresultat — dvs. utfall som inte uppfyller ställda krav — för att förhindra oavsiktlig leverans?",
         help:"ISO 9001:2015 §8.7: organisationen ska säkerställa att avvikande processresultat identifieras och hanteras. Åtgärder kan innefatta: korrigering, utsortering/retur, kundinfo, dispens. Dokumenterad information ska bevaras med beskrivning av avvikelsen, åtgärder och ansvarig beslutsfattare. Gäller även avvikelser som upptäcks efter leverans.",
         action:"Inför ett avvikelsesystem för produkt-/tjänsteavvikelser (skilt från reklamationshanteringen): t.ex. ett formulär eller en logg där det framgår vad som avvek, hur det hanterades, vem som fattade beslut och om kunden informerades. Definiera vem som har mandat att godkänna dispens för leverans trots avvikelse.",
         actionPartial:"Kontrollera att befintliga rutiner täcker §8.7:s krav — spårbarhet till beslutsfattare och hantering av avvikelser som uppkommer efter leverans. Uppdatera dokumentationsrutinen om dessa delar saknas."},
      ]},
      {id:"iso_uppfoljning",name:"Utvärdering, revision & förbättring",questions:[
        {id:"iso_u_1a",
          text:"Mäts kundtillfredsställelse på ett systematiskt sätt — med en definierad metod som används konsekvent?",
          help:"ISO 9001:2015 §9.1.2: organisationen ska övervaka kunders uppfattning om i vilken utsträckning deras behov uppfyllts, och fastställa metoder för att inhämta, övervaka och granska informationen. Metoden behöver inte vara avancerad — en enkel enkät räcker om den används konsekvent.",
          action:"Inför en rutin för kunduppföljning: t.ex. en kort enkät (3–5 frågor) via mejl efter avslutat uppdrag. Dokumentera svaren och definiera hur ofta och av vem mätningen genomförs.",
          actionPartial:"Kontrollera att mätmetoden faktiskt används konsekvent — inte bara vid enstaka tillfällen. Finns ett system för att samla in och dokumentera svaren?"
        },
        {id:"iso_u_1b",
          text:"Används resultaten från kundmätningen som underlag vid ledningens genomgång och som grund för konkreta förbättringsåtgärder?",
          help:"ISO 9001:2015 §9.1.2 och §9.3.2: resultaten från kundmätningen ska ingå som obligatoriskt underlag vid ledningens genomgång. Det räcker inte att samla in data — resultaten ska analyseras och leda till beslut.",
          action:"Säkerställ att kundnöjdhetsresultat finns med som en fast punkt på dagordningen vid ledningens genomgång. Analysera trender och besluta konkreta åtgärder som dokumenteras och följs upp.",
          actionPartial:"Kontrollera att resultaten faktiskt presenteras vid ledningens genomgång — inte bara arkiveras. Leder mätresultaten till konkreta förbättringsåtgärder?"
        },
        
        {id:"iso_u_2",
         text:"Analyseras data och information från verksamheten regelbundet för att utvärdera processprestanda, måluppfyllelse och verkan av riskåtgärder?",
         help:"ISO 9001:2015 §9.1.3: resultaten av analys ska användas för att utvärdera: produkters/tjänsters överensstämmelse med krav, kundtillfredsställelse, systemets prestanda, om planerade åtgärder genomförts verkningsfullt, verkan av riskhanteringsåtgärder, externa leverantörers prestanda, och förbättringsbehov.",
         action:"Inför en rutin för regelbunden dataanalys — t.ex. kvartalsvis: gå igenom reklamationsstatistik, kundnöjdhetsresultat, måluppfyllelse och leverantörsprestanda. Sammanfatta slutsatserna och presentera dem vid ledningens genomgång.",
         actionPartial:"Kontrollera att analysen täcker alla §9.1.3-punkter och att resultaten faktiskt används för beslut — inte bara samlas in och arkiveras."},
        {id:"iso_u_3",
         text:"Genomförs interna revisioner med planerade intervall, med dokumenterat revisionsprogram, objektivt genomförande och uppföljning av fynd?",
         help:"ISO 9001:2015 §9.2: organisationen ska planera, upprätta, genomföra och underhålla ett revisionsprogram. Varje revision ska ha definierade kriterier och omfattning. Revisorer ska väljas för att säkerställa objektivitet (dvs. revisorn granskar inte sin egen verksamhet). Revisionsresultat ska rapporteras till ledningen och korrigerande åtgärder vidtas utan onödigt dröjsmål.",
         action:"Upprätta ett revisionsprogram: planera minst en internrevision per år. Definiera vilka processer och krav som granskas, utse revisor (annan än den ansvarige för området), dokumentera fynd och beslutade åtgärder. Rapportera resultaten till ledningen.",
         actionPartial:"Kontrollera att revisionsprogrammet täcker alla systemets processer över tid, att objektivitet säkerställs, och att korrigerande åtgärder verkligen genomförs och stängs. Finns revisionsprotokoll?"},
        {id:"iso_u_4",
         text:"Genomför högsta ledningen regelbundna genomgångar av systemet med de underlag som §9.3 kräver, och dokumenteras resultaten med beslut om resurser, förbättringar och systemändringar?",
         help:"ISO 9001:2015 §9.3: ledningens genomgång ska innefatta: status för åtgärder från tidigare genomgång, externa/interna förändringar, kvalitetsprestanda (kundtillfredsställelse, måluppfyllelse, processprestanda, avvikelser, revisionsresultat, leverantörsprestanda), resursers tillräcklighet, riskåtgärders verkan, och förbättringsmöjligheter. Resultaten ska dokumenteras med beslut om förbättring, systemändringar och resursbehov.",
         action:"Schemalägg ledningens genomgång minst en gång per år. Förbered ett standardiserat underlag som täcker alla §9.3.2-punkter. Dokumentera besluten i ett protokoll med ansvariga och datum för uppföljning.",
         actionPartial:"Gå igenom senaste protokollet mot §9.3.2:s underlagslista — täcks alla punkter? Kontrollera att beslutade åtgärder följs upp vid nästa genomgång och att protokollet bevaras som dokumenterad information."},
        {id:"iso_u_5",
         text:"Finns ett system för avvikelse och korrigerande åtgärd (inkl. klagomål) med rotorsaksanalys, dokumenterade åtgärder och verifikation av att åtgärderna fungerat?",
         help:"ISO 9001:2015 §10.2: vid avvikelse ska organisationen: reagera och hantera avvikelsen, utvärdera behovet av korrigerande åtgärd (rotorsaksanalys), vidta åtgärder, granska åtgärdernas verkan, och vid behov uppdatera risker/möjligheter och systemet. Dokumenterad information ska bevaras med avvikelsens art, åtgärder och resultat.",
         action:"Inför ett system för korrigerande åtgärder (skilt från det operativa avvikelsesystemet i §8.7): ett register med kolumnerna — datum, avvikelse/klagomål, rotorsak, beslutad åtgärd, ansvarig, uppföljningsdatum, verifikation av verkan. Definiera en rutin för hur klagomål utlöser rotorsaksanalys.",
         actionPartial:"Kontrollera att rotorsaksanalys faktiskt genomförs — inte bara att avvikelsen åtgärdas symptomatiskt. Verifieras att åtgärderna fungerat? Uppdateras riskanalysen när mönster i avvikelser identifieras?"},
      ]},
    ]
  },
  iso27001:{
    id:"iso27001",name:"ISO 27001",reg:"SS-ISO/IEC 27001:2022",
    desc:"Ledningssystem för informationssäkerhet",
    sections:[
      {id:"i27_kontext",name:"Kontext & systemomfattning",questions:[
        {id:"i27_k_1",
         text:"Har ni kartlagt externa och interna faktorer som påverkar er informationssäkerhet, samt identifierat vilka intressenter som har relevanta krav på hur ni hanterar information?",
         help:"ISO 27001:2022 §4.1–4.2: organisationen ska avgöra externa och interna frågor relevanta för ISMS:ets syfte (t.ex. GDPR, NIS2, kundavtal, IT-infrastruktur) och fastställa vilka intressenter som är relevanta och vilka av deras krav som ska hanteras i systemet. T.ex. kunder som kräver konfidentiell hantering av larmkoder, myndigheter via GDPR och larmlagen.",
         action:"Dokumentera er IS-kontext: lista externa faktorer (lagar, kundkrav, branschkrav, hot) och interna faktorer (IT-system, personal, processer). Gör en intressentlista med deras IS-krav — t.ex. kunder (larmkoder/anläggningsdata), SBSC (revisioner), myndigheter (GDPR). Uppdatera minst en gång per år.",
         actionPartial:"Kontrollera att kontextanalysen täcker informationssäkerhet specifikt — inte bara verksamhetsfaktorer generellt. Är GDPR, NIS2 och kunders avtalskrav på informationshantering med?"},
        {id:"i27_k_2",
         text:"Är ISMS:ets omfattning definierad och dokumenterad — dvs. vilka informationstillgångar, system, lokaler, processer och externa parters beroendeförhållanden som ingår?",
         help:"ISO 27001:2022 §4.3: omfattningen ska fastställa ISMS:ets gränser och tillämplighet, med hänsyn till externa/interna frågor (§4.1), intressenters krav (§4.2) och gränssnitt/beroendeförhållanden mot externa parter. Viktigt: ni måste explicit hantera beroenden mot externa system (molntjänster, underleverantörer med åtkomst till er information).",
         action:"Skriv en dokumenterad ISMS-omfattning: vilka system ingår (t.ex. ärendesystem, e-post, kundregister, larmkonfigurationsdata), vilka lokaler, vilka processer och vilka externa parters beroendeförhållanden. Ange vad som är utanför systemet.",
         actionPartial:"Gå igenom om er avgränsning täcker gränssnitt mot externa parter — molntjänster, underleverantörer, kunder med fjärråtkomst. Uppdatera vid ny IT-anskaffning eller verksamhetsförändringar."},
      ]},
      {id:"i27_ledarskap",name:"Ledarskap, policy & mål",questions:[
        {id:"i27_l_1",
         text:"Har högsta ledningen upprättat en informationssäkerhetspolicy som täcker standardens fyra krav — syfte, ramverk för mål, åtagande om krav och åtagande om ständig förbättring — och är den kommunicerad?",
         help:"ISO 27001:2022 §5.2: informationssäkerhetspolicyn ska: (a) lämpa sig för organisationens syfte, (b) omfatta IS-mål eller ge ett ramverk för att sätta dem, (c) innehålla åtagande att uppfylla tillämpliga IS-krav, (d) innefatta åtagande om ständig förbättring. Policyn ska finnas som dokumenterad information, kommuniceras inom organisationen och vara tillgänglig för intressenter.",
         action:"Skriv en informationssäkerhetspolicy som täcker alla fyra §5.2-krav — specifik för informationssäkerhet, inte en generell kvalitetspolicy. Adressera hur ni skyddar kunddata, larmkonfigurationer, personuppgifter och affärsinformation. Låt ledningen godkänna och kommunicera den till all personal.",
         actionPartial:"Kontrollera att policyn uppfyller alla fyra §5.2-krav. Är den känd av personalen — inte bara publicerad? Ses den över vid väsentliga förändringar?"},
        {id:"i27_l_2",
         text:"Finns definierade roller och ansvar för informationssäkerhet, inklusive en utsedd person med ansvar för att ISMS:et uppfyller standardens krav och rapporterar prestanda till ledningen?",
         help:"ISO 27001:2022 §5.3: högsta ledningen ska tilldela ansvar och befogenheter för (a) att säkerställa att ISMS:et uppfyller standardens krav och (b) rapportering av ISMS:ets prestanda till högsta ledningen. Behöver inte vara en heltidsroll — men ansvaret ska vara tydligt tilldelat och dokumenterat.",
         action:"Utse en IS-ansvarig (CISO, säkerhetsansvarig eller annan lämplig roll) med mandat att driva ISMS:et och rapportera till ledningen. Dokumentera rollen med ansvar och befogenheter. För en liten organisation kan detta kombineras med annan ledningsroll.",
         actionPartial:"Kontrollera att den IS-ansvarige faktiskt har mandat och resurser — inte bara en titel. Finns en tydlig rapporteringsväg till ledningen? Är rollen kommunicerad inom organisationen?"},
        {id:"i27_l_3",
         text:"Finns dokumenterade och mätbara informationssäkerhetsmål för relevanta funktioner och nivåer, med plan för vad som ska göras, vem som ansvarar och när det ska vara klart?",
         help:"ISO 27001:2022 §6.2: IS-målen ska vara förenliga med policyn, mätbara (om praktiskt möjligt), ta hänsyn till IS-krav och riskbedömningsresultat, övervakas, kommuniceras och uppdateras. Planen ska specificera: vad som ska göras, resurser, ansvarig, tidpunkt och utvärderingsmetod.",
         action:"Sätt 3–5 mätbara IS-mål. T.ex. 'Alla anställda genomgår IS-utbildning en gång per år', 'Alla säkerhetsincidenter rapporteras inom 24h', 'Backup testas kvartalsvis'. Dokumentera med ansvarig, tidplan och utvärderingsmetod.",
         actionPartial:"Kontrollera att målen är kopplade till IS-specifika risker och krav. Uppdateras de baserat på riskbedömningsresultat? Kommuniceras de till berörda?"},
      ]},
      {id:"i27_risk",name:"Riskbedömning & riskbehandling",questions:[
        {id:"i27_r_1",
         text:"Finns en formellt definierad och dokumenterad process för bedömning av informationssäkerhetsrisker — med fastställda riskacceptanskriterier, identifiering av riskägare, konsekvensbedömning och sannolikhetsbedömning?",
         help:"ISO 27001:2022 §6.1.2: processen ska: fastställa riskkriterier inkl. acceptansnivå, säkerställa konsekventa och jämförbara resultat, identifiera risker (konfidentialitet/riktighet/tillgänglighet), identifiera riskägare, analysera risker (konsekvens × sannolikhet = risknivå) och utvärdera/prioritera risker mot acceptansnivån. Dokumenterad information om processen ska bevaras.",
         action:"Ta fram en riskbedömningsmetodik: (1) Definiera skalor för konsekvens och sannolikhet (t.ex. 1–3). (2) Definiera er acceptansnivå. (3) Identifiera informationstillgångar och hot mot dem. (4) Bedöm varje risk. (5) Identifiera riskägare. Dokumentera processen och resultaten.",
         actionPartial:"Kontrollera att riskbedömningen täcker alla tre IS-dimensioner (konfidentialitet, riktighet, tillgänglighet) och att resultaten är konsekventa och jämförbara. Finns riskägare utsedda för varje identifierad risk?"},
        {id:"i27_r_2",
         text:"Finns en dokumenterad riskbehandlingsplan med valda behandlingsalternativ, nödvändiga säkerhetsåtgärder och riskägarnas formella godkännande av planen och kvarstående risker?",
         help:"ISO 27001:2022 §6.1.3: för varje risk ska ni välja behandlingsalternativ (acceptera, undvika, reducera, dela), bestämma nödvändiga säkerhetsåtgärder och jämföra dessa mot Annex A-kontrollerna för att verifiera att inga nödvändiga åtgärder utelämnats. Riskägarnas godkännande av planen och kvarstående risker ska dokumenteras.",
         action:"Ta fram en riskbehandlingsplan: lista identifierade risker, valt behandlingsalternativ per risk, vilka åtgärder (kopplade till Annex A-kontroller), implementeringsstatus och riskägare. Inhämta riskägarnas formella godkännande.",
         actionPartial:"Kontrollera att behandlingsplanen är kopplad till riskbedömningen — inte en generell säkerhetsplan. Är kvarstående risker formellt godkända av riskägarna?"},
        {id:"i27_r_3",
         text:"Finns ett Uttalande om tillämplighet (Statement of Applicability, SoA) som specificerar vilka Annex A-kontroller som är tillämpliga, motivering för inkludering, implementeringsstatus och motivering för eventuell exkludering?",
         help:"ISO 27001:2022 §6.1.3d: SoA är ett av ISO 27001:s mest specifika krav utan direkt motsvarighet i ISO 9001. Det ska innehålla: nödvändiga kontroller, motivering för inkludering, huruvida de är implementerade, och motivering för att exkludera Annex A-kontroller. SoA fungerar som länken mellan er riskbedömning och era faktiska säkerhetsåtgärder.",
         action:"Ta fram ett SoA-dokument: använd Annex A:s 93 kontroller som utgångspunkt. För varje kontroll — ange om den är tillämplig (och varför), om den är implementerad, och om den exkluderas (med motivering). Koppla tillämpliga kontroller till er riskbehandlingsplan.",
         actionPartial:"Kontrollera att SoA speglar faktisk implementeringsstatus — inte bara vad ni planerar. Är exkluderingsmotiveringar dokumenterade? Är SoA kopplat till er riskbehandlingsplan och senaste riskbedömning?"},
        {id:"i27_r_4a",
         text:"Genomförs riskbedömningar vid planerade intervall — minst en gång per år — och dokumenteras resultaten?",
         help:"ISO 27001:2022 §8.2: riskbedömning ska utföras vid planerade intervall. Minst en gång per år är den vanligaste praxisnivån och vad revisorer förväntar sig. Resultaten ska bevaras som dokumenterad information med datum, deltagare och beslutade åtgärder.",
         action:"Inför en fast årsrutin för riskbedömning — t.ex. varje höst inför budgetåret. Genomgången ska täcka hela ISMS:ets scope. Dokumentera resultaten med datum, deltagare, identifierade risker och beslutade åtgärder.",
         actionPartial:"Kontrollera att senaste riskbedömning är genomförd och dokumenterad. Är resultaten tillgängliga och uppdaterade? Är de kopplade till er riskbehandlingsplan och SoA?"},
        {id:"i27_r_4b",
         text:"Genomförs riskbedömningar också när betydande förändringar sker — t.ex. vid ny IT-lösning, ny leverantör eller förändrad verksamhet?",
         help:"ISO 27001:2022 §8.2: utöver planerade intervall ska riskbedömning genomföras när betydande ändringar föreslås eller sker. Det kräver en definierad tröskel för vad som är 'betydande' och en rutin för att trigga en bedömning. Utan denna rutin kan nya risker förbli oupptäckta mellan de planerade bedömningarna.",
         action:"Definiera vad som räknas som 'betydande förändring' som ska trigga en riskbedömning — t.ex. ny molntjänst, byte av IT-leverantör, ny befattning med åtkomst till känslig information, ny lagstiftning. Dokumentera beslutet och lägg in triggern i er förändringsrutin.",
         actionPartial:"Kontrollera att er förändringsrutin faktiskt innehåller en IS-riskcheck. Har ni genomfört ändringsinitierade riskbedömningar den senaste perioden och dokumenterat dem?"},
      ]},
      {id:"i27_atgarder",name:"Säkerhetsåtgärder — Annex A",questions:[
        {id:"i27_a_1",
         text:"Finns en förteckning över organisationens informationstillgångar med utsedda ägare, och är informationen klassad utifrån konfidentialitet, riktighet och tillgänglighet?",
         help:"ISO 27001:2022 Annex A, kontroll 5.9 och 5.12: en tillgångsförteckning ska upprättas och underhållas, inklusive ägare per tillgång. Information ska klassas baserat på organisationens IS-behov. För en installatörsfirma kan tillgångar vara: kundregister, larmkonfigurationsdata, anläggningsritningar, systemlösenord, e-postsystem, personaluppgifter.",
         action:"Upprätta en informationstillgångsförteckning: lista era informationstillgångar (data, system, dokumentation), tilldela en ägare per tillgång och klassificera varje tillgång (t.ex. Konfidentiell / Intern / Offentlig). Uppdatera vid nya system eller tjänster.",
         actionPartial:"Gå igenom om förteckningen är komplett och aktuell — är alla kritiska tillgångar med? Finns ägare utsedda? Stämmer klassificeringen med hur informationen faktiskt hanteras?"},
        {id:"i27_a_2a",
         text:"Finns dokumenterade regler för vem som har tillgång till vilka system och informationstillgångar — baserat på principen om lägsta möjliga behörighet — och finns en lösenordspolicy?",
         help:"ISO 27001:2022 Annex A 5.15 och 5.17: regler för åtkomstkontroll ska upprättas baserat på verksamhets- och IS-krav. Principen om lägsta möjliga behörighet (need-to-know) innebär att varje person bara har tillgång till det de behöver för sin roll. Lösenordspolicyn styr hur autentiseringsinformation skapas och hanteras.",
         action:"Upprätta en åtkomstkontrollpolicy med: (1) en rollbaserad behörighetsstruktur — vem har tillgång till vad, (2) en lösenordspolicy med minimikrav på längd, komplexitet och förbud mot delning, (3) begränsning av administratörsrättigheter till dem som verkligen behöver dem.",
         actionPartial:"Kontrollera att åtkomstkontrollpolicyn är dokumenterad och känd av personalen. Är lösenordspolicyn faktiskt implementerad i era system — t.ex. via tekniska krav på lösenordslängd?"},
        {id:"i27_a_2b",
         text:"Granskas åtkomsträttigheter regelbundet — och finns en rutin för att omedelbart ta bort åtkomst när anställningar avslutas eller roller förändras?",
         help:"ISO 27001:2022 Annex A 5.18: åtkomsträttigheter ska tillhandahållas, ses över, ändras och tas bort löpande. Revisorer kontrollerar specifikt att f.d. anställda och externa konsulter inte längre har aktiv åtkomst. Kvarglömda konton är en av de vanligaste och mest underskattade säkerhetsriskerna.",
         action:"Inför en offboarding-checklista som täcker: (1) omedelbar inaktivering av all systemåtkomst, (2) återlämning av enheter och åtkomstkort, (3) ändring av delade lösenord som personen kände till. Schemalägg dessutom en kvartalsgranskning av aktiva användarkonton.",
         actionPartial:"Gör en genomgång av aktiva användarkonton — finns f.d. anställda eller konsulter kvar i systemen? Kontrollera att offboarding-rutinen faktiskt tillämpas konsekvent och inte bara finns på papper."},

        {id:"i27_a_3",
         text:"Finns rutiner för att säkerställa informationssäkerheten i leverantörsrelationer — inklusive IS-krav i avtal och löpande uppföljning av leverantörers IS-praxis?",
         help:"ISO 27001:2022 Annex A, kontroller 5.19 och 5.20: processer ska fastställas för att hantera IS-risker i leverantörsrelationer. Relevanta IS-krav ska fastställas och avtalas med varje leverantör som hanterar er information — molntjänstleverantörer, IT-drift, underleverantörer med åtkomst till kunddata.",
         action:"Gå igenom era leverantörsavtal och identifiera vilka leverantörer som hanterar er information. Lägg till IS-krav i nya avtal (konfidentialitet, incidentrapportering, rätt att revidera). Inför löpande uppföljning av leverantörers IS-praxis.",
         actionPartial:"Kontrollera att befintliga avtal med informationshanterande leverantörer innehåller IS-krav. Sker löpande uppföljning? Är molntjänstleverantörer (e-post, fillagring, CRM) täckta?"},
        {id:"i27_a_4",
         text:"Finns ett incidenthanteringssystem med definierade processer och roller för att identifiera, rapportera, bedöma, hantera och lära av informationssäkerhetsincidenter — inkl. GDPR:s krav på anmälan till IMY inom 72 timmar?",
         help:"ISO 27001:2022 Annex A, kontroller 5.24, 5.25, 5.26 och 5.27: organisationen ska planera incidenthantering, bedöma och klassificera händelser, hantera incidenter enligt dokumenterade rutiner och använda lärdomar för att förbättra säkerheten. GDPR kräver dessutom anmälan till Integritetsskyddsmyndigheten (IMY) inom 72 timmar vid personuppgiftsincidenter.",
         action:"Ta fram en IS-incidenthanteringsrutin: (1) Definiera vad som räknas som IS-incident (obehörig åtkomst, dataintrång, borttappad enhet med kunddata). (2) Fastställ hur incidenter rapporteras internt. (3) Definiera eskaleringsvägar. (4) Inkludera GDPR-anmälningsrutin (IMY inom 72h). (5) Inför rutin för att dokumentera och lära av incidenter.",
         actionPartial:"Kontrollera att personalen vet hur de rapporterar IS-incidenter. Finns en eskaleringsväg till IS-ansvarig? Täcker rutinen GDPR-kravet på IMY-anmälan? Dokumenteras incidenter och används de för förbättring?"},
        {id:"i27_a_5",
         text:"Finns tekniska skyddsåtgärder implementerade på era system och enheter — inklusive skydd mot skadlig kod, regelbunden säkerhetskopiering med återställningstest och hantering av tekniska sårbarheter?",
         help:"ISO 27001:2022 Annex A, kontroller 8.7, 8.8 och 8.13: skydd mot skadlig kod ska vara implementerat. Information om tekniska sårbarheter ska inhämtas och åtgärdas (patchhantering). Säkerhetskopior av information, programvara och system ska tas och testas regelbundet. Dessa kontroller är vanligast att missa i detalj hos mindre organisationer.",
         action:"Gå igenom ert tekniska grundskydd: (1) Antivirusskydd på alla enheter — aktivt och uppdaterat. (2) Backupp-rutin med dokumenterad frekvens, lagringsplats och regelbundna återställningstester. (3) Patchhanteringsrutin — hur och när uppdateras operativsystem och programvara? Dokumentera alla tre.",
         actionPartial:"Kontrollera att backupen faktiskt testas med återställning — inte bara körs. Är patchhanteringen regelbunden? Är antivirusskyddet aktivt på alla enheter inklusive bärbara datorer och mobiler i arbetet?"},
      ]},
      {id:"i27_stod",name:"Stöd, kompetens & dokumentstyrning",questions:[
        {id:"i27_s_1a",
          text:"Har de personer som arbetar med informationssäkerhet dokumenterad kompetens — utbildning, certifiering eller erfarenhet — och bevaras bevis på kompetensen?",
          help:"ISO 27001:2022 §7.2: organisationen ska avgöra nödvändig IS-kompetens, säkerställa att personalen har den och bevara dokumenterade bevis. Det gäller framförallt IS-ansvarig, systemadministratörer och de som genomför riskbedömningar.",
          action:"Identifiera vilka roller som påverkar IS-prestandan. För varje roll — dokumentera nödvändig kompetens och verifiera att befintlig personal uppfyller den via utbildningsintyg, certifikat eller erfarenhetsbeskrivning. Sätt en plan för kompetensgap.",
          actionPartial:"Kontrollera att kompetensbevis finns dokumenterade och bevarade — inte bara att personerna anses kunniga. Är kompetenskraven per IS-roll definierade?"
        },
        {id:"i27_s_1b",
          text:"Genomgår all personal grundläggande IS-utbildning vid anställning och regelbundna uppdateringar om policyer, aktuella hot och säker hantering av information?",
          help:"ISO 27001:2022 §7.3 och Annex A 6.3: alla som arbetar för organisationen ska vara medvetna om IS-policyn, sitt bidrag och konsekvenserna av att inte följa kraven. Annex A 6.3 kräver utbildning och medvetenhetshöjning med regelbundna uppdateringar anpassade till arbetsuppgifterna.",
          action:"Inför ett IS-utbildningsprogram: (1) Grundutbildning vid anställning om IS-policy, lösenordshantering och incidentrapportering. (2) Årlig uppdatering om aktuella hot. (3) Dokumentera vem som gått vilken utbildning och när.",
          actionPartial:"Kontrollera att utbildningen genomförs och dokumenteras. Är ny personal täckt vid onboarding? Är uppdateringarna relevanta för er verksamhet?"
        },
        
        {id:"i27_s_2",
         text:"Finns rutiner för att skapa, uppdatera och styra ISMS-dokumentationen — inklusive versionshantering, behörighetsbegränsning och skydd av känsliga dokument som riskbedömning och SoA?",
         help:"ISO 27001:2022 §7.5: ISMS:ets dokumenterade information ska styras för att säkerställa tillgänglighet och skydd mot förlust av konfidentialitet, olämplig användning och förlust av riktighet. Notera: IS-dokumentation ska i sig skyddas informationssäkerhetsmässigt — t.ex. ska riskbedömningen och SoA inte vara fritt tillgängliga för alla.",
         action:"Inför dokumentstyrning för ISMS-dokumentation: versionshantera alla styrande dokument, begränsa åtkomst till känsliga dokument (riskbedömning, SoA) till behöriga, skydda dokumenten mot obehörig ändring, och definiera rutiner för gallring och arkivering.",
         actionPartial:"Gå igenom om ISMS-dokumentationen faktiskt är skyddad — lagras riskbedömning och SoA med rätt behörighetskontroll? Finns versionshantering för kritiska dokument?"},
        {id:"i27_a_ropa",
         text:"Har ni upprättat och underhåller ni ett register över era personuppgiftsbehandlingar (ROPA) enligt GDPR Artikel 30 — dvs. en dokumenterad förteckning över vilka personuppgifter ni behandlar, för vilket ändamål, hur länge och vilka som har åtkomst?",
         help:"ISO 27001:2022 Annex A kontroll 5.34 kräver att organisationen identifierar och uppfyller kraven för skydd av personuppgifter. ROPA är ett av GDPR:s mest konkreta dokumentationskrav och något revisorer specifikt efterfrågar som bevis på efterlevnad. För en installatörsfirma innehåller registret typiskt: kundregister, personaluppgifter, leverantörskontakter och eventuell kameraövervakning.",
         action:"Upprätta ett ROPA-dokument: gå igenom alla era behandlingar av personuppgifter och dokumentera för varje: (1) vad för uppgifter ni behandlar, (2) ändamål, (3) rättslig grund, (4) hur länge ni sparar dem, (5) vilka som har åtkomst, (6) om uppgifterna delas med tredje part. Integritetsskyddsmyndigheten (IMY) har mallar och vägledning på imy.se.",
         actionPartial:"Gå igenom befintligt ROPA och kontrollera att alla behandlingar finns med — glöm inte lönehantering, kameraövervakning, kundregister och molntjänster som behandlar personuppgifter. Uppdatera när ni inför nya system eller processer."},
        {id:"i27_a_dpa",
         text:"Har ni tecknat personuppgiftsbiträdesavtal (DPA) med alla leverantörer och molntjänster som behandlar personuppgifter för er räkning — t.ex. IT-leverantörer, lönesystem, CRM-system och molnlagringstjänster?",
         help:"ISO 27001:2022 Annex A kontroll 5.34 och GDPR Artikel 28 kräver ett skriftligt personuppgiftsbiträdesavtal med varje leverantör som behandlar personuppgifter på era uppdrag. Det är ett avtalsrättsligt krav — inte bara god praxis. Utan DPA riskerar ni böter och är personligt ansvariga som personuppgiftsansvarig. Vanliga leverantörer som kräver DPA: Microsoft 365, Google Workspace, lönesystem, CRM, backup-tjänster.",
         action:"Inventera alla era leverantörer och identifiera vilka som behandlar personuppgifter. Kontakta respektive leverantör och begär ett DPA — de flesta stora leverantörer (Microsoft, Google m.fl.) har standardavtal tillgängliga direkt i sina portaler. Dokumentera vilka DPA:n ni har och när de senast granskades.",
         actionPartial:"Gå igenom er leverantörslista och identifiera vilka DPA:n som saknas. Prioritera leverantörer som hanterar störst mängd eller känsligaste personuppgifter. Kontrollera att befintliga DPA:n är aktuella och täcker era nuvarande tjänster."},
      ]},
      {id:"i27_uppfoljning",name:"Utvärdering & förbättring",questions:[
        {id:"i27_u_1",
         text:"Finns ett definierat system för att övervaka och mäta ISMS:ets prestanda — med specificerat vad som mäts, vilka metoder, när mätning sker och vem som analyserar resultaten?",
         help:"ISO 27001:2022 §9.1: organisationen ska fastställa: vad som ska övervakas och mätas (inkl. IS-processer och Annex A-kontroller), metoder för tillförlitliga resultat, tidpunkt för mätning, vem som mäter, när resultaten analyseras och vem som analyserar. Dokumenterade bevis på resultaten ska bevaras.",
         action:"Definiera ett mätramverk: t.ex. antal IS-incidenter per kvartal, andel personal med IS-utbildning, patchningstid för kritiska sårbarheter, backup-testresultat, statusuppföljning av riskbehandlingsplanen. Dokumentera metod, frekvens och ansvarig per mätpunkt.",

         text:"Genomförs interna revisioner av ISMS:et med planerade intervall — med dokumenterat revisionsprogram, definierade kriterier per revision och säkerställd objektivitet?",

        {id:"i27_u_3",
         text:"Genomför högsta ledningen regelbundna genomgångar av ISMS:et med de underlag §9.3.2 kräver — inklusive riskbedömningsstatus och -behandlingsplanens status, som är specifika krav i ISO 27001?",
         help:"ISO 27001:2022 §9.3.2: ledningens genomgång ska täcka: åtgärdsstatus från tidigare genomgång, externa/interna förändringar, intressentförändringar, IS-prestanda (avvikelser, mätresultat, revisionsresultat, måluppfyllelse), intressentåterkoppling, riskbedömningsresultat och status för riskbehandlingsplanen, förbättringsmöjligheter. Riskbedömningsstatus är ett krav specifikt för ISO 27001 — saknas i ISO 9001.",
         action:"Schemalägg ledningens IS-genomgång minst en gång per år. Förbered ett underlag som täcker alla §9.3.2-punkter — särskilt riskbedömningsresultaten och riskbehandlingsplanens implementeringsstatus. Dokumentera besluten med ansvariga och uppföljningsdatum.",
         actionPartial:"Gå igenom senaste protokollet mot §9.3.2-listan — är riskbedömningsstatus och intressentförändringar med? Har beslutade åtgärder följts upp?"},
        {id:"i27_u_4a",
          text:"Finns ett system för avvikelse och korrigerande åtgärd med rotorsaksanalys — och dokumenteras avvikelsernas art, åtgärder och verkan?",
          help:"ISO 27001:2022 §10.2: vid avvikelse ska organisationen reagera, utföra rotorsaksanalys, vidta åtgärder och granska åtgärdernas verkan. Dokumenterade bevis ska bevaras på avvikelsernas art, vidtagna åtgärder och resultat.",
          action:"Inför ett IS-avvikelsesystem: ett register med avvikelsens beskrivning, rotorsak, beslutad åtgärd, ansvarig, uppföljningsdatum och verifikation av att åtgärden fungerat. Använd det för alla IS-avvikelser — inte bara allvarliga incidenter.",

        },
        {id:"i27_u_4b",
          text:"Uppdateras ISMS:et och riskbedömningen när avvikelsemönster identifieras — dvs. när återkommande avvikelser pekar på en systemisk brist?",
          help:"ISO 27001:2022 §10.2e: organisationen ska göra ändringar i ISMS:et om det är nödvändigt. Om ett mönster uppstår ska det trigga en uppdatering av riskbedömningen och eventuellt nya åtgärder. Avvikelsesystemet ska vara kopplat till riskbedömningen.",
          action:"Definiera en rutin för när avvikelsemönster ska trigga uppdatering av riskbedömningen. Säkerställ att IS-ansvarig regelbundet analyserar avvikelseregistret för att identifiera mönster.",
          actionPartial:"Kontrollera att det finns en koppling mellan avvikelsesystemet och riskbedömningen. Leder återkommande incidenter till ny riskbedömning, eller hanteras varje avvikelse isolerat?"
        },
        
      ]},
    ]
  },

const {useState}=React;

const ANSWERS=[
  {key:"pa_plats",label:"Uppfyllt",   score:1.0,cls:"ans-green"},
  {key:"delvis",  label:"Delvis",     score:0.5,cls:"ans-amber"},
  {key:"ej",      label:"Ej påbörjat",score:0.0,cls:"ans-red"},
  {key:"vet_ej",  label:"Vet ej",     score:null,cls:"ans-blue"},
];

const secPct=(sec,ans)=>{
  let s=0,t=0;
  sec.questions.forEach(q=>{
    const a=ans[q.id];if(!a||a==="vet_ej")return;
    const d=ANSWERS.find(x=>x.key===a);if(d){s+=d.score;t++;}
  });
  return{pct:t>0?Math.round(s/t*100):null,done:sec.questions.filter(q=>ans[q.id]).length,total:sec.questions.length};
};
const stdPct=(std,ans)=>{
  let s=0,t=0,done=0,total=0;
  std.sections.forEach(sec=>sec.questions.forEach(q=>{
    total++;const a=ans[q.id];if(a)done++;
    if(a&&a!=="vet_ej"){const d=ANSWERS.find(x=>x.key===a);if(d){s+=d.score;t++;}}
  }));
  return{pct:t?Math.round(s/t*100):null,done,total};
};
const barColor=p=>p===null?"#E8E9EC":p>=80?"#1B6B3F":p>=50?"#FFA300":"#C03535";
const timeUntil=p=>{
  if(p===null)return"Otillräckligt underlag";
  if(p>=85)return"0–3 månader";if(p>=65)return"3–6 månader";
  if(p>=40)return"6–12 månader";return"12+ månader";
};
const readiness=p=>{
  if(p===null)return"Otillräckligt underlag";
  if(p>=85)return"Mycket god beredskap";if(p>=65)return"God beredskap — luckor finns";
  if(p>=40)return"Delvis förberedd";return"Grundarbete återstår";
};
const today=()=>new Date().toLocaleDateString("sv-SE",{day:"numeric",month:"long",year:"numeric"});

function generateSummary(active,answers,company,overall){
  const name=company||"Er organisation";
  const hiCount=std=>std.sections.reduce((n,sec)=>n+sec.questions.filter(q=>answers[q.id]==="ej").length,0);
  const miCount=std=>std.sections.reduce((n,sec)=>n+sec.questions.filter(q=>answers[q.id]==="delvis").length,0);
  const ukCount=std=>std.sections.reduce((n,sec)=>n+sec.questions.filter(q=>answers[q.id]==="vet_ej").length,0);
  const bestSec=std=>{let b=null,bp=-1;std.sections.forEach(sec=>{const{pct}=secPct(sec,answers);if(pct!==null&&pct>bp){bp=pct;b=sec;}});return b?{name:b.name,pct:bp}:null;};
  const worstSec=std=>{let w=null,wp=101;std.sections.forEach(sec=>{const{pct}=secPct(sec,answers);if(pct!==null&&pct<wp){wp=pct;w=sec;}});return w?{name:w.name,pct:wp}:null;};
  const totalHi=active.reduce((n,s)=>n+hiCount(s),0);
  const totalMi=active.reduce((n,s)=>n+miCount(s),0);
  const totalUk=active.reduce((n,s)=>n+ukCount(s),0);
  const multi=active.length>1;

  let intro="";
  if(overall>=85) intro=`${name} befinner sig i ett mycket gott läge inför certifiering — självskattningen visar en samlad beredskap på ${overall}% och att de grundläggande förutsättningarna i stort är på plats.`;
  else if(overall>=65) intro=`${name} har byggt upp en god grund för ${multi?"certifieringarna":"certifieringen"} och visar en samlad beredskap på ${overall}%. Arbetet är till stor del påbörjat, men ett antal viktiga pusselbitar behöver falla på plats innan revision är aktuellt.`;
  else if(overall>=40) intro=`${name} är på väg i rätt riktning med en samlad beredskap på ${overall}%, men självskattningen visar att det kvarstår ett mer strukturerat arbete inom flera områden innan ${multi?"certifieringarna":"certifieringen"} är inom räckhåll.`;
  else if(overall!==null) intro=`Självskattningen visar att ${name} befinner sig i ett tidigt skede av sin certifieringsresa — den samlade beredskapen landar på ${overall}%. Det är värdefullt att ha kartlagt läget nu, eftersom det ger en tydlig bild av vad som behöver byggas upp.`;
  else intro=`Självskattningen för ${name} ger en övergripande bild av er beredskap inför ${multi?"certifieringarna":"certifieringen"}.`;

  let strength="";
  const strong=[];
  active.forEach(std=>{const b=bestSec(std);if(b&&b.pct>=70)strong.push({cert:std.name,sec:b.name,pct:b.pct});});
  if(strong.length>0&&overall>=40){
    if(strong.length===1){const s=strong[0];strength=`Inom ${s.cert} sticker ${s.sec.toLowerCase()} ut positivt med ${s.pct}% — ett bra fundament att bygga vidare på.`;}
    else{strength=`Starka områden som redan är väl etablerade: ${strong.map(s=>`${s.sec.toLowerCase()} (${s.cert})`).join(", ")} — goda fundament att bygga vidare på.`;}
  }

  let gaps="";
  if(totalHi===0&&totalMi===0&&overall>=80) gaps="Självskattningen identifierar inga kritiska gap — eventuella återstående finjusteringar bör kunna åtgärdas relativt snabbt.";
  else if(totalHi>0){
    const crit=active.map(std=>({name:std.name,hi:hiCount(std),worst:worstSec(std)})).filter(x=>x.hi>0).sort((a,b)=>b.hi-a.hi);
    if(crit.length===1){const cc=crit[0];const wn=cc.worst&&cc.worst.pct<50?` — framförallt inom ${cc.worst.name.toLowerCase()}`:"";gaps=`Det mest kritiska att ta tag i är ${cc.hi} {cc.hi===1?"krav":"krav"} inom ${cc.name} där arbetet ännu inte påbörjats${wn}. Dessa bör prioriteras för att undvika förseningar på vägen mot revision.`;}
    else{gaps=`Det finns opåbörjade krav inom ${crit.map(x=>`${x.name} (${x.hi} st)`).join(" och ")} som behöver prioriteras — dessa bör prioriteras för att komma vidare mot revision.`;}
    if(totalMi>3) gaps+=` Därtill finns ${totalMi} krav som delvis är på plats men behöver fullföljas.`;
  } else if(totalMi>0) gaps=`Det finns inga krav som helt saknas, men ${totalMi} krav är påbörjade men behöver slutföras innan en revisor kan godkänna dem.`;

  let closing="";
  if(overall>=80) closing=`Nästa naturliga steg är att stämma av de sista detaljerna och boka ett inledande samtal med SBSC för att diskutera ansökan.`;
  else if(overall>=60) closing=`Med ett fokuserat åtgärdsarbete under ${timeUntil(overall).toLowerCase()} bör ${name} ha goda förutsättningar att vara redo för revision. Vi rekommenderar att ni kontaktar SBSC tidigt för att stämma av er plan.`;
  else if(overall>=35) closing=`Rekommendationen är att börja med de högt prioriterade åtgärderna och bygga upp rutiner och dokumentation systematiskt. Räkna med ${timeUntil(overall).toLowerCase()} innan revision är aktuellt.`;
  else closing=`Börja med de mest grundläggande kraven — organisation, ekonomi och nyckelrutiner — och bygg därifrån. Varje steg framåt är ett steg närmre certifieringen.`;
  if(totalUk>3) closing+=` Notera att ${totalUk} frågor besvarades med "Vet ej" — dessa behöver följas upp internt för att ge en fullständig bild.`;

  return[intro,strength,gaps,closing].filter(Boolean).join(" ");
}

function Spider({sections,answers,size=220}){
  const [tooltip,setTooltip]=React.useState(null);
  const cx=size/2,cy=size/2,R=size*0.30,n=sections.length;
  if(n<3)return null;
  const ang=i=>(i*2*Math.PI/n)-Math.PI/2;
  const pt=(i,r)=>({x:cx+r*Math.cos(ang(i)),y:cy+r*Math.sin(ang(i))});
  const vals=sections.map((s,i)=>{const{pct}=secPct(s,answers);return{name:s.name,v:pct!=null?pct/100:0,i,pct};});
  const dpts=vals.map(({v,i})=>{const p=pt(i,v*R);return`${p.x},${p.y}`;}).join(" ");
  const lR=R*1.36;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{overflow:"visible",cursor:"default"}}>
      {[.25,.5,.75,1].map((lv,j)=>{
        const ps=sections.map((_,i)=>{const p=pt(i,lv*R);return`${p.x},${p.y}`;}).join(" ");
        return<polygon key={j} points={ps} fill="none" stroke="#E8E9EC" strokeWidth={j===3?1.5:1}/>;
      })}
      {vals.map(({i})=>{const e=pt(i,R);return<line key={i} x1={cx} y1={cy} x2={e.x} y2={e.y} stroke="#E8E9EC" strokeWidth="1"/>;} )}
      <polygon points={dpts} fill="#FFA300" fillOpacity=".16" stroke="#FFA300" strokeWidth="2" strokeLinejoin="round"/>
      {vals.map(({v,i,name,pct})=>{
        const p=pt(i,v*R);
        return(
          <g key={i} onMouseEnter={()=>setTooltip({x:p.x,y:p.y,name,pct})} onMouseLeave={()=>setTooltip(null)} style={{cursor:"pointer"}}>
            <circle cx={p.x} cy={p.y} r="12" fill="transparent"/>
            <circle cx={p.x} cy={p.y} r="4.5" fill="#FFA300" stroke="#fff" strokeWidth="2"/>
          </g>
        );
      })}
      {vals.map(({name,i})=>{
        const lp=pt(i,lR),cv=Math.cos(ang(i));
        const anchor=cv>.15?"start":cv<-.15?"end":"middle";
        return<text key={i} x={lp.x} y={lp.y} textAnchor={anchor} dominantBaseline="middle" fontSize="9.5" fontWeight="700" fill="#4A4B52" fontFamily="Open Sans,sans-serif">{name.length>22?name.slice(0,20)+"...":name}</text>;
      })}
      {[25,50,75].map((v,i)=>{const lp=pt(0,v/100*R);return<text key={i} x={lp.x+3} y={lp.y-2} fontSize="7" fill="#C0C0C0" fontFamily="Open Sans,sans-serif">{v}%</text>;})}
      {tooltip&&(
        <g>
          <rect x={tooltip.x-58} y={tooltip.y-38} width="116" height="32" rx="4" fill="#101820" opacity=".93"/>
          <text x={tooltip.x} y={tooltip.y-26} textAnchor="middle" fontSize="10" fontWeight="700" fill="white" fontFamily="Open Sans,sans-serif">
            {tooltip.name.length>18?tooltip.name.slice(0,16)+"...":tooltip.name}
          </text>
          <text x={tooltip.x} y={tooltip.y-13} textAnchor="middle" fontSize="11" fontWeight="800" fill="#FFA300" fontFamily="Open Sans,sans-serif">
            {tooltip.pct!==null?`${tooltip.pct}%`:"Vet ej"}
          </text>
        </g>
      )}
    </svg>
  );
}


function TocBlock({active,answers}){
  if(active.length<2)return null;
  return(
    <div className="toc-block">
      <div className="toc-title">Innehåll — certifieringar i denna rapport</div>
      {active.map(std=>{
        const sc=stdPct(std,answers);
        const clr=sc.pct===null?"var(--muted)":sc.pct>=80?"var(--green)":sc.pct>=50?"var(--amber)":"var(--red)";
        return(
          <div className="toc-item" key={std.id}>
            <span className="toc-item-name">{std.name}<span style={{fontSize:11,color:"var(--muted)",fontWeight:400,marginLeft:6}}>{std.reg}</span></span>
            <span className="toc-dots"/>
            <span className="toc-item-pct" style={{color:clr}}>{sc.pct!==null?`${sc.pct}%`:"—"}</span>
          </div>
        );
      })}
    </div>
  );
}

function CertSection({std,answers}){
  const sc=stdPct(std,answers);
  const gaps=[];
  std.sections.forEach(sec=>sec.questions.forEach(q=>{
    const a=answers[q.id];
    if(a==="ej")gaps.push({pri:"hi",lbl:"Prioritera",cls:"badge-hi",sec:sec.name,q:q.text,albl:"Så här börjar ni",act:q.action||null});
    else if(a==="delvis")gaps.push({pri:"mi",lbl:"Slutför",cls:"badge-mi",sec:sec.name,q:q.text,albl:"Så här kompletterar ni",act:q.actionPartial||q.action||null});
    else if(a==="vet_ej")gaps.push({pri:"uk",lbl:"Kontrollera",cls:"badge-uk",sec:sec.name,q:q.text,act:null});
  }));
  gaps.sort((a,b)=>({hi:0,mi:1,uk:2}[a.pri]-{hi:0,mi:1,uk:2}[b.pri]));
  return(
    <div className="cert-section">
      <div className="cert-head">
        <div><h3>{std.name}</h3><div className="cert-head-reg">{std.reg}</div></div>
        <div className="cert-head-score">{sc.pct!=null?`${sc.pct}%`:"—"}</div>
      </div>
      <div className="cert-body">
        <div className="spider-wrap"><Spider sections={std.sections} answers={answers}/></div>
        <div className="bar-section">
          {std.sections.map(s=>{const{pct}=secPct(s,answers);return(
            <div className="bar-row" key={s.id}>
              <div className="bar-label">{s.name}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${pct||0}%`,background:barColor(pct)}}/></div>
              <div className="bar-pct">{pct!=null?`${pct}%`:"—"}</div>
            </div>);})}
        </div>
        <div className="gap-section">
          {gaps.length>0?(
            <React.Fragment>
              <h4>Prioriterade åtgärder — {std.name}</h4>
              {gaps.map((g,i)=>(
                <div className="gap-row" key={i}>
                  <span className={`gap-badge ${g.cls}`}>{g.lbl}</span>
                  <div className="gap-body">
                    <div className="gap-title">{g.q}</div>
                    <div className="gap-meta">{std.name} · {g.sec}</div>
                    {g.act&&(
                      <React.Fragment>
                        <div className="gap-action-label">{g.albl}</div>
                        <div className="gap-action">{g.act}</div>
                      </React.Fragment>
                    )}
                  </div>
                </div>
              ))}
            </React.Fragment>
          ):(
            <div className="gap-none">✓ Inga identifierade gap för {std.name}</div>
          )}
        </div>
      </div>
    </div>
  );
}
